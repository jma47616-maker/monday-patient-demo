<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 930" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Blood loss: the pulse rises early, the blood pressure falls late</title><desc>A chart with no numbers. As blood is lost the pulse line climbs from the start; the blood pressure line stays flat and then falls steeply, at about 1.5 litres lost.</desc>
<rect width="720" height="930" fill="#fdf8ee"/>
<rect x="46" y="36" width="640" height="420" rx="16" fill="#241c15"/><rect x="40" y="30" width="640" height="420" rx="16" fill="#faf0da" stroke="#241c15" stroke-width="3"/><path d="M70 385 C200 370 400 300 650 215" fill="none" stroke="#c8531b" stroke-width="8" stroke-linecap="round"/><path d="M70 150 H480 C540 150 600 220 650 360" fill="none" stroke="#241c15" stroke-width="8" stroke-linecap="round"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="70.0" y="82.0">Blood pressure:</tspan><tspan x="70.0" y="115.6">holds, then falls late</tspan></text><text font-size="28" font-weight="800" fill="#a53f12" text-anchor="start" ><tspan x="70.0" y="300.0">Pulse: up early</tspan></text><circle cx="480" cy="150" r="13" fill="#e0a521" stroke="#241c15" stroke-width="4"/><circle cx="480" cy="150" r="13" fill="none" stroke="#e0a521" stroke-width="4"><animate attributeName="r" values="13;30" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0" dur="2s" repeatCount="indefinite"/></circle><path d="M480 136 V112" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="end" ><tspan x="662.0" y="68.0">about 1.5</tspan><tspan x="662.0" y="101.6">litres lost</tspan></text><rect x="63.0" y="478" width="74" height="92" rx="10" fill="#fdf8ee" stroke="#241c15" stroke-width="4"/><rect x="67.0" y="482.0" width="66" height="84.0" rx="6" fill="#b3261e"/><rect x="86.0" y="468" width="28" height="12" rx="3" fill="#241c15"/><rect x="193.0" y="478" width="74" height="92" rx="10" fill="#fdf8ee" stroke="#241c15" stroke-width="4"/><rect x="197.0" y="497.1" width="66" height="68.9" rx="6" fill="#b3261e"/><rect x="216.0" y="468" width="28" height="12" rx="3" fill="#241c15"/><rect x="323.0" y="478" width="74" height="92" rx="10" fill="#fdf8ee" stroke="#241c15" stroke-width="4"/><rect x="327.0" y="512.2" width="66" height="53.8" rx="6" fill="#b3261e"/><rect x="346.0" y="468" width="28" height="12" rx="3" fill="#241c15"/><rect x="453.0" y="478" width="74" height="92" rx="10" fill="#fdf8ee" stroke="#241c15" stroke-width="4"/><rect x="457.0" y="527.4" width="66" height="38.6" rx="6" fill="#b3261e"/><rect x="476.0" y="468" width="28" height="12" rx="3" fill="#241c15"/><rect x="583.0" y="478" width="74" height="92" rx="10" fill="#fdf8ee" stroke="#241c15" stroke-width="4"/><rect x="587.0" y="540.8" width="66" height="25.2" rx="6" fill="#b3261e"/><rect x="606.0" y="468" width="28" height="12" rx="3" fill="#241c15"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="44.0" y="618.0">Blood lost</tspan></text><path d="M200.0 608.0 L656.0 608.0" stroke="#241c15" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M674.0 608.0 L656.0 621.5 L656.0 594.5 Z" fill="#241c15" stroke="#241c15" stroke-width="2" stroke-linejoin="round"/><rect x="45" y="665" width="310" height="104" rx="14" fill="#241c15"/><rect x="40" y="660" width="310" height="104" rx="14" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><path d="M86 690 C58 694 56 736 64 740 C76 742 86 730 86 716 Z" fill="#eeb3a3" stroke="#241c15" stroke-width="3.5" stroke-linejoin="round"/><path d="M98 690 C126 694 128 736 120 740 C108 742 98 730 98 716 Z" fill="#eeb3a3" stroke="#241c15" stroke-width="3.5" stroke-linejoin="round"/><path d="M92 676 V700 M92 700 L84 708 M92 700 L100 708" fill="none" stroke="#241c15" stroke-width="4" stroke-linecap="round"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="start" ><tspan x="142.0" y="704.0">Fast</tspan><tspan x="142.0" y="737.0">breathing</tspan></text><rect x="375" y="665" width="310" height="104" rx="14" fill="#241c15"/><rect x="370" y="660" width="310" height="104" rx="14" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><path d="M402 744 V710 q0 -8 7 -8 t7 8 V688 q0 -8 7 -8 t7 8 V684 q0 -8 7 -8 t7 8 V692 q0 -8 7 -8 t7 8 V744 Z" fill="#c9dcea" stroke="#241c15" stroke-width="3.5" stroke-linejoin="round"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="start" ><tspan x="476.0" y="704.0">Cool</tspan><tspan x="476.0" y="737.0">hands</tspan></text><rect x="46" y="806" width="640" height="106" rx="14" fill="#241c15"/><rect x="40" y="800" width="640" height="106" rx="14" fill="#fbe4d3" stroke="#241c15" stroke-width="3"/><text font-size="29" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="62.0" y="842.0">Adrenaline surge:</tspan><tspan x="62.0" y="877.4">faster heart, tighter vessels</tspan></text>
