<svg xmlns="http://www.w3.org/2000/svg" id="fitd09" viewBox="0 0 720 916" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Three patients on three steps, and a syringe of 3% saline</title><desc>Three steps rising left to right. On the first, a figure standing and well: mild or none. On the second, a figure sitting and holding the head: moderately severe: nausea, confusion, headache. On the third, a figure lying with eyes closed: severe: seizure, coma, persistent vomiting. An orange syringe marked 3% points at the top step with a solid line: 3% saline now. It points at the middle step with a dashed line: UK guidance: a senior decision.</desc>
<rect width="720" height="916" fill="#fdf8ee"/>
<path d="M30 890 V740 H250 V600 H470 V460 H690 V890 Z" fill="#241c15" transform="translate(6 6)"/><path d="M30 890 V740 H250 V600 H470 V460 H690 V890 Z" fill="#faf0da" stroke="#241c15" stroke-width="4.5" stroke-linejoin="round"/><path d="M250 740 V890 M470 600 V890" stroke="#d9c9a6" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/><g id="fitd09-step-1"><g transform="translate(140.0 737.0) scale(1.05)" ><path d="M-9 -52 V-4 M9 -52 V-4" fill="none" stroke="#241c15" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><path d="M-9 -52 V-4 M9 -52 V-4" fill="none" stroke="#463a2c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M-18 -92 L-24 -58 M18 -92 L24 -58" fill="none" stroke="#241c15" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M-18 -92 L-24 -58 M18 -92 L24 -58" fill="none" stroke="#e8b796" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="-19" y="-102" width="38" height="56" rx="10" fill="#b9c6dc" stroke="#241c15" stroke-width="4"/><circle cx="0" cy="-120" r="18" fill="#e8b796" stroke="#241c15" stroke-width="4"/><path d="M-17 -126 C-14 -142 14 -142 17 -126" fill="#d8d2c6" stroke="#241c15" stroke-width="3.5" stroke-linejoin="round"/><circle cx="-6" cy="-118" r="2.2" fill="#241c15"/><circle cx="6" cy="-118" r="2.2" fill="#241c15"/><path d="M-5 -110 q5 4 10 0" fill="none" stroke="#241c15" stroke-width="2.5" stroke-linecap="round"/></g><text font-size="27" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="44.0" y="786.0">Mild or none</tspan></text></g><g id="fitd09-step-2"><g transform="translate(352.0 597.0) scale(1.15)" ><path d="M-22 -12 L20 -42 L30 -4" fill="none" stroke="#241c15" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><path d="M-22 -12 L20 -42 L30 -4" fill="none" stroke="#463a2c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M-36 -8 C-38 -40 -30 -66 -16 -74 L6 -64 C2 -40 -4 -20 -8 -4 Z" fill="#b9c6dc" stroke="#241c15" stroke-width="4" stroke-linejoin="round"/><circle cx="2" cy="-88" r="18" fill="#e8b796" stroke="#241c15" stroke-width="4"/><path d="M-15 -94 C-12 -110 16 -110 19 -94" fill="#d8d2c6" stroke="#241c15" stroke-width="3.5" stroke-linejoin="round"/><path d="M-6 -86 h6 M6 -86 h6" stroke="#241c15" stroke-width="2.5" stroke-linecap="round"/><path d="M-2 -77 q5 -4 10 0" fill="none" stroke="#241c15" stroke-width="2.5" stroke-linecap="round"/><path d="M-8 -64 L24 -60 L16 -92" fill="none" stroke="#241c15" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -64 L24 -60 L16 -92" fill="none" stroke="#e8b796" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g><text font-size="27" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="264.0" y="646.0">Moderately</tspan><tspan x="264.0" y="678.9">severe:</tspan></text><text font-size="27" font-weight="500" fill="#463a2c" text-anchor="start" ><tspan x="264.0" y="711.9">nausea,</tspan><tspan x="264.0" y="744.8">confusion,</tspan><tspan x="264.0" y="777.8">headache</tspan></text></g><g id="fitd09-step-3"><g transform="translate(588.0 457.0) scale(1.12)" ><path d="M10 -14 H84" fill="none" stroke="#241c15" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 -14 H84" fill="none" stroke="#463a2c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><rect x="-52" y="-28" width="66" height="26" rx="10" fill="#b9c6dc" stroke="#241c15" stroke-width="4"/><path d="M-36 -8 H0" fill="none" stroke="#241c15" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M-36 -8 H0" fill="none" stroke="#e8b796" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-70" cy="-18" r="17" fill="#e8b796" stroke="#241c15" stroke-width="4"/><path d="M-84 -8 C-92 -20 -84 -36 -70 -35" fill="#d8d2c6" stroke="#241c15" stroke-width="3.5" stroke-linejoin="round"/><path d="M-68 -24 q4 3 0 6 M-60 -20 q-3 0 -3 -3" fill="none" stroke="#241c15" stroke-width="2.5" stroke-linecap="round"/></g><text font-size="27" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="484.0" y="506.0">Severe:</tspan></text><text font-size="27" font-weight="500" fill="#463a2c" text-anchor="start" ><tspan x="484.0" y="538.9">seizure, coma,</tspan><tspan x="484.0" y="571.9">persistent</tspan><tspan x="484.0" y="604.8">vomiting</tspan></text></g><g id="fitd09-syringe"><path d="M52 92 H34 M34 66 V118" stroke="#241c15" stroke-width="7" stroke-linecap="round"/><rect x="52" y="62" width="190" height="60" rx="8" fill="#c8531b" stroke="#241c15" stroke-width="4.5"/><rect x="52" y="62" width="34" height="60" rx="8" fill="#a53f12" stroke="#241c15" stroke-width="4.5"/><text font-size="34" font-weight="800" fill="#fdf8ee" text-anchor="middle" ><tspan x="164.0" y="104.0">3%</tspan></text><rect x="242" y="80" width="18" height="24" fill="#fdf8ee" stroke="#241c15" stroke-width="4"/><path d="M260 92 H292" stroke="#241c15" stroke-width="4" stroke-linecap="round"/></g><g id="fitd09-now"><path d="M298 96 L556 398" stroke="#c8531b" stroke-width="9" stroke-linecap="round"/><path d="M566.0 410.0 L534.3 402.9 L563.9 377.6 Z" fill="#c8531b" stroke="#c8531b" stroke-width="2" stroke-linejoin="round"/><text font-size="31" font-weight="800" fill="#a53f12" text-anchor="end" ><tspan x="690.0" y="196.0">3% saline now</tspan></text></g><g id="fitd09-senior"><path d="M294 102 L340 452" stroke="#c8531b" stroke-width="7" stroke-linecap="round" stroke-dasharray="4 16"/><path d="M342.0 470.0 L322.8 450.3 L355.5 446.0 Z" fill="#c8531b" stroke="#c8531b" stroke-width="2" stroke-linejoin="round"/><text font-size="29" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="34.0" y="204.0">UK guidance:</tspan></text><text font-size="29" font-weight="500" fill="#463a2c" text-anchor="start" ><tspan x="34.0" y="239.4">a senior decision</tspan></text></g>
</svg>
