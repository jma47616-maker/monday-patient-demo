<svg xmlns="http://www.w3.org/2000/svg" id="panc-calcium-d18-bucket" viewBox="0 0 720 1310" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>A bucket of magnesium with a thin tap and three holes</title><desc>A bucket with a little magnesium in the bottom. 1, a tap above giving only a trickle: too little in, a poor diet. 2, a hole on one side: lost in the urine, heavy drinking increases the magnesium passed in urine. 3, a hole on the other side: lost from the gut, diarrhoea. 4, a hole in the bottom: lost through drugs, PPIs and loop diuretics. Only about 0.3% of the body’s magnesium is in the blood; half is in bone, a quarter in muscle. Low magnesium usually comes with low potassium: it makes the kidney waste potassium. Dean’s potassium: 3.4.</desc>
<rect width="720" height="1310" fill="#fdf8ee"/>
