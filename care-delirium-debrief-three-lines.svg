<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 650" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Delirium, dementia and depression over time</title><desc>Three time lines on one axis. Delirium: a sudden drop over hours to days that wobbles. Dementia: a slow steady fall over months to years. Depression: a dip over weeks to months that returns to the start.</desc>
<rect width="720" height="650" fill="#fdf8ee"/>
<path d="M56 24 V582" fill="none" stroke="#d9c9a6" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><path d="M56.0 582.0 L672.0 582.0" stroke="#241c15" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M692.0 582.0 L672.0 597.0 L672.0 567.0 Z" fill="#241c15" stroke="#241c15" stroke-width="2" stroke-linejoin="round"/><text font-size="28" font-weight="800" fill="#a53f12" text-anchor="start" ><tspan x="74.0" y="58.0">Delirium: hours to days</tspan></text><path d="M70 86 H300 C322 86 322 172 342 172 C362 172 366 132 388 132 C410 132 414 182 436 182 C458 182 462 132 484 132 C506 132 510 172 532 172 C554 172 558 132 580 132 C602 132 606 182 628 182 C646 182 652 132 670 132" fill="none" stroke="#c8531b" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" /><path d="M56 202 H690" fill="none" stroke="#d9c9a6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 12"/><text font-size="28" font-weight="800" fill="#463a2c" text-anchor="start" ><tspan x="74.0" y="244.0">Dementia: months to years</tspan></text><path d="M70 272 C260 278 480 318 670 368" fill="none" stroke="#463a2c" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" /><path d="M56 388 H690" fill="none" stroke="#d9c9a6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 12"/><text font-size="28" font-weight="800" fill="#4f6590" text-anchor="start" ><tspan x="74.0" y="430.0">Depression: weeks to months</tspan></text><path d="M70 458 H200 C300 458 300 554 400 554 C500 554 500 458 600 458 H670" fill="none" stroke="#7f93b8" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" />
</svg>
