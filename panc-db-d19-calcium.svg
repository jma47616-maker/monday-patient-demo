<svg xmlns="http://www.w3.org/2000/svg" id="panc-db-d19-calcium" viewBox="0 0 720 684" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Calcium soaps beside the gland, and a dimmed parathyroid</title><desc>Two panels, one above the other. Top: a fat droplet breaks down, and the pieces bind blue calcium dots into chalky clumps: fat broken down around the gland binds calcium (calcium soaps). Bottom: the thyroid seen from behind with the four small parathyroid glands on it, greyed and shaded, labelled low magnesium: low magnesium blunts the hormone that should restore the calcium (parathyroid hormone, PTH).</desc>
<rect width="720" height="684" fill="#fdf8ee"/>
