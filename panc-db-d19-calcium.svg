t-weight="700" fill="#463a2c" text-anchor="middle" ><tspan x="130.0" y="290.0">Blue: calcium</tspan></text></g><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="374.0" y="110.0">Fat broken down</tspan><tspan x="374.0" y="142.2">around the gland</tspan><tspan x="374.0" y="174.4">binds calcium</tspan></text><text font-size="28" font-weight="700" fill="#a53f12" text-anchor="start" ><tspan x="374.0" y="212.6">(calcium soaps)</tspan></text><g id="panc-db-d19-parathyroid"><g transform="translate(-346.0 330.0)" ><rect x="376" y="30" width="326" height="300" rx="14" fill="#241c15"/><rect x="370" y="24" width="326" height="300" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3" /><g transform="translate(533.0 150.0) scale(0.8)" ><g fill="#e8a58c" stroke="#241c15" stroke-width="4" stroke-linejoin="round"><path d="M30,-20 C30,-80 55,-120 80,-118 C112,-116 125,-60 122,0 C120,60 100,105 70,108 C45,110 30,80 30,40 Z"/><g transform="scale(-1 1)"><path d="M30,-20 C30,-80 55,-120 80,-118 C112,-116 125,-60 122,0 C120,60 100,105 70,108 C45,110 30,80 30,40 Z"/></g><rect x="-40" y="0" width="80" height="58" rx="14"/></g><g fill="#e8a58c"><path d="M30,-20 C30,-80 55,-120 80,-118 C112,-116 125,-60 122,0 C120,60 100,105 70,108 C45,110 30,80 30,40 Z" transform="scale(.97)"/><path d="M30,-20 C30,-80 55,-120 80,-118 C112,-116 125,-60 122,0 C120,60 100,105 70,108 C45,110 30,80 30,40 Z" transform="scale(-.97 .97)"/><rect x="-36" y="4" width="72" height="50" rx="12"/></g><ellipse cx="-82" cy="-60" rx="17" ry="13" fill="#9a8f80" stroke="#241c15" stroke-width="3"/><ellipse cx="82" cy="-60" rx="17" ry="13" fill="#9a8f80" stroke="#241c15" stroke-width="3"/><ellipse cx="-78" cy="56" rx="17" ry="13" fill="#9a8f80" stroke="#241c15" stroke-width="3"/><ellipse cx="78" cy="56" rx="17" ry="13" fill="#9a8f80" stroke="#241c15" stroke-width="3"/></g><rect x="394" y="48" width="278" height="210" rx="10" fill="#241c15" opacity=".2"/><rect x="392.1" y="266.2" width="281.8" height="47.6" rx="23.8" fill="#241c15" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="800" fill="#fdf8ee" text-anchor="middle" ><tspan x="533.0" y="299.8">Low magnesium</tspan></text></g></g><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="374.0" y="410.0">Low magnesium</tspan><tspan x="374.0" y="442.2">blunts the hormone</tspan><tspan x="374.0" y="474.4">that should restore it</tspan></text><text font-size="28" font-weight="700" fill="#a53f12" text-anchor="start" ><tspan x="374.0" y="512.6">(parathyroid hormone,</tspan><tspan x="374.0" y="544.8">PTH)</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="374.0" y="591.0">Grey: the four</tspan><tspan x="374.0" y="623.2">parathyroids, dimmed</tspan></text>
