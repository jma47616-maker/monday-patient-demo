<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Dementia and delirium over time</title><desc>Two lines on one time axis. Dementia slopes gently down across months to years. Delirium runs level, then drops steeply over hours to days and wobbles: it comes and goes.</desc>
<rect width="720" height="540" fill="#fdf8ee"/>
<path d="M60 40 V470" fill="none" stroke="#d9c9a6" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><path d="M60.0 470.0 L670.0 470.0" stroke="#241c15" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M690.0 470.0 L670.0 485.0 L670.0 455.0 Z" fill="#241c15" stroke="#241c15" stroke-width="2" stroke-linejoin="round"/><path d="M70 190 C260 205 480 240 670 290" fill="none" stroke="#463a2c" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" /><text font-size="28" font-weight="700" fill="#463a2c" text-anchor="start" ><tspan x="74.0" y="262.0">Dementia:</tspan><tspan x="74.0" y="296.2">months to years</tspan></text><path d="M70 96 H372 C398 96 396 340 420 348 C444 356 448 300 470 300 C494 300 496 400 520 400 C544 400 546 318 570 318 C594 318 596 388 620 388 C642 388 646 336 668 334" fill="none" stroke="#fdf8ee" stroke-width="17" stroke-linejoin="round" stroke-linecap="round" /><path d="M70 96 H372 C398 96 396 340 420 348 C444 356 448 300 470 300 C494 300 496 400 520 400 C544 400 546 318 570 318 C594 318 596 388 620 388 C642 388 646 336 668 334" fill="none" stroke="#c8531b" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" /><text font-size="28" font-weight="800" fill="#a53f12" text-anchor="start" ><tspan x="74.0" y="70.0">Delirium: hours to days</tspan></text><path d="M424 428 v10 h244 v-10" fill="none" stroke="#c8531b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text font-size="28" font-weight="400" fill="#241c15" text-anchor="start" ><tspan x="546.0" y="404.0"></tspan></text><text font-size="28" font-weight="700" fill="#a53f12" text-anchor="end" ><tspan x="690.0" y="196.0">comes and goes</tspan></text><path d="M560 210 Q548 250 536 296" fill="none" stroke="#c8531b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 9"/>
</svg>
