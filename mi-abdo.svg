<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320" role="img" aria-label="Abdominal examination: a smooth mass descends from under the left costal margin towards the umbilicus, moving with respiration">
  <defs>
    <linearGradient id="skin3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3cdb4"/>
      <stop offset=".5" stop-color="#f0deca"/>
      <stop offset="1" stop-color="#dcc5ab"/>
    </linearGradient>
    <pattern id="dots3" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#b8552e" opacity=".14"/>
    </pattern>
  </defs>

  <rect width="440" height="320" fill="#faf6f0"/>
  <rect width="440" height="320" fill="url(#dots3)"/>

  <!-- torso -->
  <path d="M118 6 C118 40 108 66 96 88 C86 108 82 140 86 178 C90 218 102 258 112 300 L118 320 L322 320 L328 300 C338 258 350 218 354 178 C358 140 354 108 344 88 C332 66 322 40 322 6 Z"
        fill="url(#skin3)" stroke="#2b241d" stroke-width="4"/>

  <!-- costal margins -->
  <path d="M150 34 C170 66 196 82 220 84 C244 82 270 66 290 34" fill="none" stroke="#2b241d" stroke-width="3" opacity=".55"/>

  <!-- the mass: descends from under the LEFT costal margin (viewer's right) toward the umbilicus -->
  <g>
    <path d="M300 62 C312 96 306 130 286 152 C268 172 244 180 232 172 C244 150 250 120 252 92 C254 74 262 60 300 62 Z"
          fill="#c9a48c" stroke="#2b241d" stroke-width="3.5" opacity=".92">
      <!-- moves down with inspiration, as a spleen does -->
      <animateTransform attributeName="transform" type="translate" values="0 0; -6 14; 0 0" dur="3.6s" repeatCount="indefinite"/>
    </path>
    <!-- the notch on its medial border -->
    <path d="M252 92 l-11 9 l11 8" fill="none" stroke="#2b241d" stroke-width="3" stroke-linecap="round" opacity=".8">
      <animateTransform attributeName="transform" type="translate" values="0 0; -6 14; 0 0" dur="3.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- palpating hand advancing from the right iliac fossa toward it -->
  <g stroke="#2b241d" stroke-width="3" fill="none" opacity=".5" stroke-linecap="round" stroke-dasharray="3 7">
    <path d="M150 268 L226 186"/>
  </g>

  <!-- dashed outline showing how far it reaches -->
  <path d="M232 172 C222 182 210 188 200 190" fill="none" stroke="#b8552e" stroke-width="3" stroke-dasharray="4 6" stroke-linecap="round" opacity=".85"/>

  <!-- umbilicus -->
  <ellipse cx="220" cy="196" rx="7" ry="9" fill="none" stroke="#2b241d" stroke-width="3" opacity=".6"/>

  <!-- pulsing marker on the leading edge -->
  <circle cx="234" cy="170" r="9" fill="none" stroke="#b8552e" stroke-width="3">
    <animate attributeName="r" values="7;18" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".85;0" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="234" cy="170" r="4.5" fill="#b8552e"/>
</svg>
