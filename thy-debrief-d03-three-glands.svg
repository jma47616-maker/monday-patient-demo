<svg xmlns="http://www.w3.org/2000/svg" id="thd03" viewBox="0 0 720 806" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Three thyroid glands as an uptake scan would show them</title><desc>Graves' disease: the whole gland evenly dark, uptake all over. Toxic nodules: a pale gland with two dark hot spots. Thyroiditis: an empty outline, little or no uptake.</desc>
<rect width="720" height="806" fill="#fdf8ee"/>
<g id="thd03-graves"><rect x="36" y="26" width="660" height="240" rx="16" fill="#241c15"/><rect x="30" y="20" width="660" height="240" rx="16" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><rect x="48" y="38" width="256" height="204" rx="8" fill="#f3e5c8" stroke="#241c15" stroke-width="3.5"/><path d="M55 52 h14 M62 45 v14" stroke="#a08c6e" stroke-width="2.5"/><path d="M283 52 h14 M290 45 v14" stroke="#a08c6e" stroke-width="2.5"/><path d="M55 228 h14 M62 221 v14" stroke="#a08c6e" stroke-width="2.5"/><path d="M283 228 h14 M290 221 v14" stroke="#a08c6e" stroke-width="2.5"/><g transform="translate(176.0 144.0) scale(0.74)" ><g fill="#33281d" stroke="#241c15" stroke-width="8" stroke-linejoin="round"><path d="M30,-20 C30,-80 55,-120 80,-118 C112,-116 125,-60 122,0 C120,60 100,105 70,108 C45,110 30,80 30,40 Z"/><g transform="scale(-1 1)"><path d="M30,-20 C30,-80 55,-120 80,-118 C112,-116 125,-60 122,0 C120,60 100,105 70,108 C45,110 30,80 30,40 Z"/></g><rect x="-40" y="0" width="80" height="58" rx="14"/></g><g fill="#33281d"><path d="M30,-20 C30,-80 55,-120 80,-118 C112,-116 125,-60 122,0 C120,60 100,105 70,108 C45,110 30,80 30,40 Z"/><g transform="scale(-1 1)"><path d="M30,-20 C30,-80 55,-120 80,-118 C112,-116 125,-60 122,0 C120,60 100,105 70,108 C45,110 30,80 30,40 Z"/></g><rect x="-40" y="0" width="80" height="58" rx="14"/></g></g><text font-size="31" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="326.0" y="126.0">Graves' disease:</tspan></text><text font-size="30" font-weight="500" fill="#463a2c" text-anchor="start" ><tspan x="326.0" y="172.0">uptake all over</tspan></text></g><g id="thd03-nodules"><rect x="36" y="288" width="660" height="240" rx="16" fill="#241c15"/><rect x="30" y="282" width="660" height="240" rx="16" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><rect x="48" y="300" width="256" height="204" rx="8" fill="#f3e5c8" stroke="#241c15" stroke-width="3.5"/><path d="M55 314 h14 M62 307 v14" stroke="#a08c6e" stroke-width="2.5"/><path d="M283 314 h14 M290 307 v14" stroke="#a08c6e" stroke-width="2.5"/><path d="M55 490 h14 M62 483 v14" stroke="#a08c6e" stroke-width="2.5"/><path d="M283 490 h14 M290 483 v14" stroke="#a08c6e" stroke-width="2.5"/><g transform="translate(176.0 406.0) scale(0.74)" ><g fill="#eadcbb" stroke="#241c15" stroke-width="8" stroke-linejoin="round"><path d="M30,-20 C30,-80 55,-120 80,-118 C112,-116 125,-60 122,0 C120,60 100,105 70,108 C45,110 30,80 30,40 Z"/><g transform="scale(-1 1)"><path d="M30,-20 C30,-80 55,-120 80,-118 C112,-116 125,-60 122,0 C120,60 100,105 70,108 C45,110 30,80 30,40 Z"/></g><rect x="-40" y="0" width="80" height="58" rx="14"/></g><g fill="#eadcbb"><path d="M30,-20 C30,-80 55,-120 80,-118 C112,-116 125,-60 122,0 C120,60 100,105 70,108 C45,110 30,80 30,40 Z"/><g transform="scale(-1 1)"><path d="M30,-20 C30,-80 55,-120 80,-118 C112,-116 125,-60 122,0 C120,60 100,105 70,108 C45,110 30,80 30,40 Z"/></g><rect x="-40" y="0" width="80" height="58" rx="14"/></g><ellipse cx="78" cy="-44" rx="27" ry="31" fill="#33281d"/><ellipse cx="-76" cy="40" rx="25" ry="29" fill="#33281d"/></g><text font-size="31" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="326.0" y="388.0">Toxic nodules:</tspan></text><text font-size="30" font-weight="500" fill="#463a2c" text-anchor="start" ><tspan x="326.0" y="434.0">hot spots</tspan></text></g><g id="thd03-thyroiditis"><rect x="36" y="550" width="660" height="240" rx="16" fill="#241c15"/><rect x="30" y="544" width="660" height="240" rx="16" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><rect x="48" y="562" width="256" height="204" rx="8" fill="#f3e5c8" stroke="#241c15" stroke-width="3.5"/><path d="M55 576 h14 M62 569 v14" stroke="#a08c6e" stroke-width="2.5"/><path d="M283 576 h14 M290 569 v14" stroke="#a08c6e" stroke-width="2.5"/><path d="M55 752 h14 M62 745 v14" stroke="#a08c6e" stroke-width="2.5"/><path d="M283 752 h14 M290 745 v14" stroke="#a08c6e" stroke-width="2.5"/><g transform="translate(176.0 668.0) scale(0.74)" ><g fill="#f3e5c8" stroke="#a08c6e" stroke-width="9" stroke-dasharray="7 9" stroke-linejoin="round" stroke-linecap="round"><path d="M30,-20 C30,-80 55,-120 80,-118 C112,-116 125,-60 122,0 C120,60 100,105 70,108 C45,110 30,80 30,40 Z"/><g transform="scale(-1 1)"><path d="M30,-20 C30,-80 55,-120 80,-118 C112,-116 125,-60 122,0 C120,60 100,105 70,108 C45,110 30,80 30,40 Z"/></g><rect x="-40" y="0" width="80" height="58" rx="14"/></g><g fill="#f3e5c8"><path d="M30,-20 C30,-80 55,-120 80,-118 C112,-116 125,-60 122,0 C120,60 100,105 70,108 C45,110 30,80 30,40 Z"/><g transform="scale(-1 1)"><path d="M30,-20 C30,-80 55,-120 80,-118 C112,-116 125,-60 122,0 C120,60 100,105 70,108 C45,110 30,80 30,40 Z"/></g><rect x="-40" y="0" width="80" height="58" rx="14"/></g></g><text font-size="31" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="326.0" y="650.0">Thyroiditis:</tspan></text><text font-size="30" font-weight="500" fill="#463a2c" text-anchor="start" ><tspan x="326.0" y="696.0">little or none</tspan></text></g>
</svg>
