<svg xmlns="http://www.w3.org/2000/svg" id="fitd15" viewBox="0 0 720 1232" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Three doors, one for each box; the third opens onto a ladder of three rungs</title><desc>Above the doors: first, stop what is contributing. Door one, with a drip bag: dry: saline. Door two, with a measuring jug struck through its top half: overloaded: fluid restriction. Door three, with the same jug: SIADH. It stands open onto a ladder of three rungs: fluid restriction; urea, or a loop diuretic with salt tablets; tolvaptan: a specialist's decision. Beside the ladder, two crossed-out bottles: demeclocycline, lithium.</desc>
