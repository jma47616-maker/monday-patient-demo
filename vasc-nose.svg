<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Looking into his nostrils with a pen torch: bloody crusting, a friable septum. -->
  <rect width="400" height="300" fill="#f3e5c8"/>
  <!-- lower face -->
  <path d="M60 20 Q200 -10 340 20 L360 300 L40 300 Z" fill="#e8c2a2" stroke="#241c15" stroke-width="3.5"/>
  <path d="M280 20 Q330 140 340 300 L360 300 L340 20 Z" fill="#d9ab86" opacity=".5"/>
  <!-- torchlight -->
  <ellipse cx="200" cy="150" rx="150" ry="120" fill="#fff3c4" opacity=".35"/>
  <!-- nose, tilted back -->
  <path d="M150 40 Q140 120 130 160 Q140 200 200 205 Q260 200 270 160 Q260 120 250 40 Z" fill="#e8c2a2" stroke="#241c15" stroke-width="3.5"/>
  <path d="M250 40 Q262 120 270 160 Q262 190 230 200 Q252 180 246 140 Q240 100 232 42 Z" fill="#d9ab86" opacity=".55"/>
  <!-- columella -->
  <path d="M200 205 L200 150" stroke="#241c15" stroke-width="3"/>
  <!-- nostrils -->
  <path d="M150 165 Q165 135 195 148 Q198 180 170 190 Q150 185 150 165 Z" fill="#5a1f1c" stroke="#241c15" stroke-width="3"/>
  <path d="M250 165 Q235 135 205 148 Q202 180 230 190 Q250 185 250 165 Z" fill="#5a1f1c" stroke="#241c15" stroke-width="3"/>
  <!-- mucosa inside, friable and red -->
  <path d="M160 168 Q170 148 190 155 Q192 172 172 182 Z" fill="#a8302a" opacity=".85"/>
  <path d="M240 168 Q230 148 210 155 Q208 172 228 182 Z" fill="#a8302a" opacity=".85"/>
  <!-- the crusts: dark, bloody, thick -->
  <path d="M158 178 q8 -8 18 0 q4 8 -4 12 q-12 4 -16 -4 Z" fill="#3a1410" stroke="#241c15" stroke-width="1.5"/>
  <path d="M170 156 q6 -4 10 2 q2 6 -6 7 q-6 -1 -4 -9 Z" fill="#4a1a12"/>
  <path d="M224 176 q8 -6 16 2 q2 8 -6 10 q-12 0 -10 -12 Z" fill="#3a1410" stroke="#241c15" stroke-width="1.5"/>
  <path d="M210 158 q6 -3 9 3 q0 6 -6 6 q-6 -2 -3 -9 Z" fill="#4a1a12"/>
  <!-- septum: eroded, granular -->
  <path d="M196 158 q4 16 0 30" fill="none" stroke="#c94a3a" stroke-width="6" stroke-linecap="round"/>
  <path d="M204 158 q-4 16 0 30" fill="none" stroke="#c94a3a" stroke-width="6" stroke-linecap="round"/>
  <g fill="#e07a68" opacity=".9"><circle cx="198" cy="166" r="1.4"/><circle cx="202" cy="176" r="1.6"/><circle cx="199" cy="184" r="1.3"/></g>
  <!-- a fresh trickle -->
  <path d="M166 190 q-2 10 0 20" stroke="#b8202a" stroke-width="3" stroke-linecap="round">
    <animate attributeName="d" values="M166 190 q-2 10 0 20;M166 190 q-2 14 0 26;M166 190 q-2 10 0 20" dur="4s" repeatCount="indefinite"/>
  </path>
  <!-- upper lip and philtrum -->
  <path d="M120 240 Q200 226 280 240" fill="none" stroke="#241c15" stroke-width="3"/>
  <path d="M192 208 L190 236 M208 208 L210 236" stroke="#d9ab86" stroke-width="2"/>
  <!-- the pen torch, bottom right -->
  <g transform="translate(300 230) rotate(-35)">
    <rect x="0" y="-9" width="110" height="18" rx="6" fill="#3a3646" stroke="#241c15" stroke-width="3"/>
    <rect x="-10" y="-12" width="14" height="24" rx="3" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/>
    <path d="M-10 -12 L-50 -40 L-50 40 L-10 12 Z" fill="#fff3c4" opacity=".7"/>
  </g>
</svg>
