<svg xmlns="http://www.w3.org/2000/svg" id="thd04" viewBox="0 0 720 762" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>TSH and free T3 through an illness and its recovery</title><desc>Two lines across three phases: well, ill, recovering. TSH dips below the normal range during the illness, rises above it in recovery, then settles. Free T3 dips during the illness and returns. No numbers.</desc>
