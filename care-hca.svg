<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <title>The healthcare assistant</title>
  <!-- The healthcare assistant: a man in his forties, pale tunic, cropped dark hair going grey, tired, kind. -->
  <rect width="120" height="120" fill="#f3e5c8"/>
  <circle cx="60" cy="60" r="56" fill="#faf0da" stroke="#241c15" stroke-width="3"/>
  <!-- pale grey-green tunic, broad shoulders -->
  <path d="M20 120 C22 100 38 94 60 94 C82 94 98 100 100 120 Z" fill="#cdd9c4" stroke="#241c15" stroke-width="3"/>
  <path d="M50 95 L60 108 L70 95" fill="#faf0da" stroke="#241c15" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M60 108 V120" stroke="#241c15" stroke-width="2"/>
  <rect x="72" y="104" width="14" height="9" rx="2" fill="#fdf8ee" stroke="#241c15" stroke-width="2"/>
  <!-- neck, thick -->
  <path d="M49 80 h22 v15 c0 7 -22 7 -22 0 Z" fill="#b98562" stroke="#241c15" stroke-width="3"/>
  <!-- ears -->
  <ellipse cx="33" cy="58" rx="5" ry="8" fill="#c99672" stroke="#241c15" stroke-width="3"/>
  <ellipse cx="87" cy="58" rx="5" ry="8" fill="#c99672" stroke="#241c15" stroke-width="3"/>
  <!-- head: square jaw -->
  <path d="M34 52 Q34 26 60 26 Q86 26 86 52 L85 70 Q82 86 68 90 L52 90 Q38 86 35 70 Z" fill="#c99672" stroke="#241c15" stroke-width="3" stroke-linejoin="round"/>
  <path d="M70 30 Q84 36 84 54 L83 70 Q80 84 68 88 Q78 66 70 30 Z" fill="#a87550" opacity=".5"/>
  <!-- cropped hair, grey at the temples -->
  <path d="M34 50 Q32 22 60 22 Q88 22 86 50 Q82 36 74 33 Q60 30 46 33 Q38 36 34 50 Z" fill="#33291f" stroke="#241c15" stroke-width="3" stroke-linejoin="round"/>
  <path d="M36 44 Q37 36 42 33 M84 44 Q83 36 78 33" fill="none" stroke="#9c958a" stroke-width="3" stroke-linecap="round"/>
  <!-- brows: raised in the middle, kind -->
  <path d="M42 49 q7 -5 13 -3 M65 46 q6 -2 13 3" fill="none" stroke="#241c15" stroke-width="3" stroke-linecap="round"/>
  <!-- eyes, tired -->
  <ellipse cx="49" cy="56" rx="4.6" ry="3.4" fill="#fff" stroke="#241c15" stroke-width="2"/>
  <ellipse cx="71" cy="56" rx="4.6" ry="3.4" fill="#fff" stroke="#241c15" stroke-width="2"/>
  <circle cx="49" cy="56.6" r="2.1" fill="#241c15"/>
  <circle cx="71" cy="56.6" r="2.1" fill="#241c15"/>
  <path d="M44 54 q5 -3 10 0 M66 54 q5 -3 10 0" fill="none" stroke="#241c15" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M44 62 q5 3 10 0 M66 62 q5 3 10 0" fill="none" stroke="#8d5f40" stroke-width="1.8" stroke-linecap="round"/>
  <!-- nose, broad -->
  <path d="M60 56 q-6 11 0 14 q5 1 6 -3" fill="none" stroke="#241c15" stroke-width="2.4" stroke-linecap="round"/>
  <!-- afternoon shadow -->
  <path d="M40 72 Q44 88 60 89 Q76 88 80 72 Q74 82 60 82 Q46 82 40 72 Z" fill="#33291f" opacity=".22"/>
  <!-- mouth: a small closed smile -->
  <path d="M51 78 q9 5 18 0" fill="none" stroke="#241c15" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M49 77 l2 1 M71 77 l-2 1" stroke="#241c15" stroke-width="1.6" stroke-linecap="round"/>
</svg>
