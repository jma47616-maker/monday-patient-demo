<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1076" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Eight places to look for the cause of a delirium</title><desc>A body outline with eight numbered labels. 1 Medicines, at a hand holding a tablet. 2 Infection, at the chest. 3 Fluid and salts, at a drip stand. 4 Oxygen and circulation, at the heart and lungs. 5 Pain, bladder and bowel, at the lower abdomen. 6 Sugar, thyroid and liver, at the neck and upper abdomen. 7 The brain itself, at the head. 8 Surgery and surroundings, at a bed and a window.</desc>
