<svg xmlns="http://www.w3.org/2000/svg" id="panc-calcium-d07-threshold-low" viewBox="0 0 720 570" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>A nerve’s trigger point with low calcium</title><desc>A nerve’s charge drawn against time, with a resting line and a dashed trigger point (threshold). Normal calcium: the trigger point is well above rest; the same nudge falls short. Calcium outside the nerve keeps its sodium gates closed at rest. Low calcium: the trigger point sits closer to rest; the same nudge reaches it and the nerve fires. With less calcium the gates open more easily, and the nerve fires with little or no push.</desc>
<rect width="720" height="570" fill="#fdf8ee"/>
<g id="panc-calcium-d07l-low"><rect x="30" y="20" width="672" height="540" rx="14" fill="#241c15"/><rect x="24" y="14" width="672" height="540" rx="14" fill="#fbe4d3" stroke="#241c15" stroke-width="3" /><text font-size="30" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="62.0">Low calcium</tspan></text><path d="M60 330 H676" stroke="#463a2c" stroke-width="3"/><path d="M60 266 H676" stroke="#c8531b" stroke-width="4" stroke-dasharray="12 9"/><text font-size="28" font-weight="700" fill="#a53f12" text-anchor="end" ><tspan x="676.0" y="254.0">Trigger point (threshold)</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="end" ><tspan x="676.0" y="366.0">Resting charge</tspan></text><path d="M60 330 H200 C230 330 240 254 262 260 C270 266 274 100 288 96 C300 100 306 370 330 360 C360 350 380 330 420 330 H416" fill="none" stroke="#241c15" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M60 330 H200 C230 330 240 254 262 260 C270 266 274 100 288 96 C300 100 306 370 330 360 C360 350 380 330 420 330 H416" fill="none" stroke="#e0a521" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M160.0 400.0 L226.2 357.6" stroke="#463a2c" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M238.0 350.0 L231.9 366.4 L220.5 348.7 Z" fill="#463a2c" stroke="#463a2c" stroke-width="2" stroke-linejoin="round"/><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="middle" ><tspan x="150.0" y="428.0">the same nudge</tspan></text><rect x="312.3" y="88.2" width="135.3" height="47.6" rx="23.8" fill="#c8531b" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="800" fill="#fdf8ee" text-anchor="middle" ><tspan x="380.0" y="121.8">it fires</tspan></text><text font-size="28" font-weight="400" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="492.0">With less calcium the gates open more easily,</tspan><tspan x="48.0" y="524.2">and the nerve fires with little or no push.</tspan></text></g>
</svg>
