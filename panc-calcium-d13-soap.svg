<svg xmlns="http://www.w3.org/2000/svg" id="panc-calcium-d13-soap" viewBox="0 0 720 881" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Fat around the gland turning into calcium soap, in three steps</title><desc>Three steps down the page. 1: enzymes leaking from the inflamed gland digest the fat around it. 2: the fatty acids are freed. 3: they bind calcium into chalky soaps (saponification). In the first week, a parathyroid that fails to respond and low magnesium add to the fall. Later in the illness, sepsis takes over as a cause.</desc>
