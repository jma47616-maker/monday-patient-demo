<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320" role="img" aria-label="Abdominal examination: a supine abdomen being palpated by a flat hand, soft and unremarkable, rising and falling gently with respiration, with no mass and no guarding">
  <defs>
    <linearGradient id="skinAbx" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3cdb4"/>
      <stop offset=".5" stop-color="#f0deca"/>
      <stop offset="1" stop-color="#dcc5ab"/>
    </linearGradient>
    <pattern id="dotsAbx" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#b8552e" opacity=".14"/>
    </pattern>
    <clipPath id="bodyAbx">
      <path d="M118 6 C118 40 108 66 96 88 C86 108 82 140 86 178 C90 218 102 258 112 300 L118 320 L322 320 L328 300 C338 258 350 218 354 178 C358 140 354 108 344 88 C332 66 322 40 322 6 Z"/>
    </clipPath>
  </defs>

  <rect width="440" height="320" fill="#faf6f0"/>
  <rect width="440" height="320" fill="url(#dotsAbx)"/>

  <!-- the abdomen, rising and falling -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="4.6s" repeatCount="indefinite"/>

    <path d="M118 6 C118 40 108 66 96 88 C86 108 82 140 86 178 C90 218 102 258 112 300 L118 320 L322 320 L328 300 C338 258 350 218 354 178 C358 140 354 108 344 88 C332 66 322 40 322 6 Z"
          fill="url(#skinAbx)" stroke="#2b241d" stroke-width="4"/>

    <!-- soft cel shading down the flanks: relaxed, nothing standing proud -->
    <g clip-path="url(#bodyAbx)">
      <path d="M86 120 C92 200 100 260 112 330 L146 330 C132 250 126 190 128 120 Z" fill="#dcc5ab" opacity=".45"/>
      <path d="M354 120 C348 200 340 260 328 330 L294 330 C308 250 314 190 312 120 Z" fill="#dcc5ab" opacity=".45"/>
      <path d="M150 40 C176 78 196 92 220 94 C244 92 264 78 290 40 C272 96 250 112 220 112 C190 112 168 96 150 40 Z" fill="#e8d3ba" opacity=".5"/>

      <!-- the nine regions, only as the faintest guide -->
      <g stroke="#b8552e" stroke-width="1.6" opacity=".16" stroke-dasharray="5 7" fill="none">
        <path d="M172 40 L172 320"/>
        <path d="M268 40 L268 320"/>
        <path d="M90 118 L350 118"/>
        <path d="M90 236 L350 236"/>
      </g>
    </g>

    <!-- costal margins -->
    <path d="M150 34 C170 66 196 82 220 84 C244 82 270 66 290 34" fill="none" stroke="#2b241d" stroke-width="3" opacity=".55"/>
    <!-- linea alba -->
    <path d="M220 92 C221 140 220 240 220 306" fill="none" stroke="#2b241d" stroke-width="2" opacity=".14"/>
    <!-- inguinal creases -->
    <g fill="none" stroke="#2b241d" stroke-width="2.6" opacity=".28" stroke-linecap="round">
      <path d="M144 282 C168 302 190 312 202 318"/>
      <path d="M296 282 C272 302 250 312 238 318"/>
    </g>

    <!-- umbilicus -->
    <ellipse cx="220" cy="196" rx="7" ry="9" fill="none" stroke="#2b241d" stroke-width="3" opacity=".6"/>
  </g>

  <!-- the examining hand, laid flat and light -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -2.4; 0 0" dur="4.6s" repeatCount="indefinite"/>
    <g transform="translate(302,248) rotate(-38)">
      <!-- soft shadow the hand casts on a wall that yields -->
      <ellipse cx="-4" cy="4" rx="46" ry="58" fill="#d9bfa4" opacity=".28"/>
      <!-- the wall dips a little under the fingertips: soft, not resisting -->
      <g fill="none" stroke="#2b241d" stroke-width="1.8" opacity=".13" stroke-linecap="round">
        <path d="M-34 -62 C-28 -68 -20 -68 -14 -62"/>
        <path d="M-2 -68 C4 -74 12 -74 18 -68"/>
      </g>
      <!-- forearm running off toward the examiner -->
      <path d="M-26 40 C-30 100 -32 160 -30 210 L32 210 C32 160 30 100 26 40 Z" fill="#e3cdb4" stroke="#2b241d" stroke-width="3.5"/>
      <!-- palm, laid flat -->
      <path d="M-38 -14 C-42 16 -36 42 -27 60 L27 60 C36 42 42 16 38 -14 Z" fill="#f0deca" stroke="#2b241d" stroke-width="3.5"/>
      <!-- thumb, resting along the radial side -->
      <path d="M34 34 C50 30 64 12 61 -6 C59 -17 46 -17 40 -5 C35 5 33 20 33 30 Z" fill="#f0deca" stroke="#2b241d" stroke-width="3.5"/>
      <!-- fingers, flat and together -->
      <g fill="#f0deca" stroke="#2b241d" stroke-width="3.5">
        <rect x="-36" y="-52" width="17" height="56" rx="8.5"/>
        <rect x="-17" y="-58" width="17" height="62" rx="8.5"/>
        <rect x="2" y="-54" width="17" height="58" rx="8.5"/>
        <rect x="21" y="-42" width="17" height="46" rx="8.5"/>
      </g>
      <!-- knuckle creases -->
      <g fill="none" stroke="#2b241d" stroke-width="2.2" opacity=".35" stroke-linecap="round">
        <path d="M-34 -26 C-30 -22 -24 -22 -20 -26"/>
        <path d="M-15 -32 C-11 -28 -5 -28 -1 -32"/>
        <path d="M4 -28 C8 -24 14 -24 18 -28"/>
        <path d="M23 -18 C27 -14 33 -14 37 -18"/>
      </g>
    </g>
  </g>
</svg>
