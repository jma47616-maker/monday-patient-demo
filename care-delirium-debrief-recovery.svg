<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Recovery after delirium</title><desc>A time line from today, through days and weeks, to six months. Most recover most of the way within days. In about 1 in 5 the climb is slower and levels off lower.</desc>
<rect width="720" height="520" fill="#fdf8ee"/>
<path d="M50.0 410.0 L672.0 410.0" stroke="#241c15" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M692.0 410.0 L672.0 425.0 L672.0 395.0 Z" fill="#241c15" stroke="#241c15" stroke-width="2" stroke-linejoin="round"/><path d="M84 400 V422" fill="none" stroke="#241c15" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><text font-size="28" font-weight="700" fill="#241c15" text-anchor="start" ><tspan x="84.0" y="464.0">Today</tspan></text><path d="M232 400 V422" fill="none" stroke="#241c15" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><text font-size="28" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="232.0" y="464.0">Days</tspan></text><path d="M424 400 V422" fill="none" stroke="#241c15" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><text font-size="28" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="424.0" y="464.0">Weeks</tspan></text><path d="M602 400 V422" fill="none" stroke="#241c15" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><text font-size="28" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="602.0" y="464.0">Six months</tspan></text><path d="M56 96 H690" fill="none" stroke="#d9c9a6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 12"/><path d="M108 340 C210 318 330 240 470 226 C560 218 620 216 680 216" fill="none" stroke="#c8531b" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="2 15"/><path d="M40 96 H74 C92 96 86 338 108 340 C140 342 160 150 232 128 C330 112 520 108 680 108" fill="none" stroke="#241c15" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" /><circle cx="108" cy="340" r="10" fill="#fdf8ee" stroke="#241c15" stroke-width="5"/><text font-size="30" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="360.0" y="160.0">Most</tspan></text><text font-size="30" font-weight="800" fill="#a53f12" text-anchor="middle" ><tspan x="500.0" y="282.0">About 1 in 5</tspan></text>
</svg>
