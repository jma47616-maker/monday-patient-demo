  <title>Mrs Whitworth on the trolley in cubicle 4</title>
  <!-- Cubicle 4, mid-morning. Pauline half sitting on the trolley, both knees drawn up under the blanket, her lap flat, twisting, face screwed up, her left hand gripping the near rail with a cannula taped on the back of it; a cardboard sick bowl on the blanket. Karen behind the trolley in her coat with a carrier bag of medicine boxes. Wall monitor with no numbers. No words. -->
