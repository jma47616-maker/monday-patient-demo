<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img" aria-label="Three fingernails in close-up, each with fine dark linear marks running lengthways under the nail plate">
  <defs>
    <linearGradient id="sk2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0deca"/>
      <stop offset="1" stop-color="#dcc5ab"/>
    </linearGradient>
    <linearGradient id="nail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e7d8"/>
      <stop offset="1" stop-color="#eed6c2"/>
    </linearGradient>
    <pattern id="dots2" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#b8552e" opacity=".14"/>
    </pattern>
  </defs>

  <rect width="440" height="300" fill="#faf6f0"/>
  <rect width="440" height="300" fill="url(#dots2)"/>

  <!-- three fingers, side by side, tips toward the viewer -->
  <g stroke="#2b241d" stroke-width="4.5" stroke-linejoin="round">
    <!-- finger 1 -->
    <path d="M44 300 L44 132 C44 96 68 74 100 74 C132 74 156 96 156 132 L156 300 Z" fill="url(#sk2)"/>
    <!-- finger 2 (slightly proud) -->
    <path d="M166 300 L166 112 C166 74 190 52 222 52 C254 52 278 74 278 112 L278 300 Z" fill="url(#sk2)"/>
    <!-- finger 3 -->
    <path d="M288 300 L288 140 C288 104 312 82 344 82 C376 82 400 104 400 140 L400 300 Z" fill="url(#sk2)"/>
  </g>

  <!-- knuckle creases -->
  <g fill="none" stroke="#2b241d" stroke-width="3" opacity=".4" stroke-linecap="round">
    <path d="M50 246 q50 14 100 0"/>
    <path d="M172 226 q50 14 100 0"/>
    <path d="M294 254 q50 14 100 0"/>
  </g>

  <!-- nail plates -->
  <g stroke="#2b241d" stroke-width="3.5">
    <path d="M62 138 C62 108 78 92 100 92 C122 92 138 108 138 138 L134 194 C130 208 116 216 100 216 C84 216 70 208 66 194 Z" fill="url(#nail)"/>
    <path d="M184 118 C184 88 200 72 222 72 C244 72 260 88 260 118 L256 174 C252 188 238 196 222 196 C206 196 192 188 188 174 Z" fill="url(#nail)"/>
    <path d="M306 146 C306 116 322 100 344 100 C366 100 382 116 382 146 L378 202 C374 216 360 224 344 224 C328 224 314 216 310 202 Z" fill="url(#nail)"/>
  </g>
  <!-- lunulae -->
  <g fill="#fdf6ee" opacity=".9" stroke="none">
    <path d="M78 196 q22 -14 44 0 q-22 12 -44 0 Z"/>
    <path d="M200 176 q22 -14 44 0 q-22 12 -44 0 Z"/>
    <path d="M322 204 q22 -14 44 0 q-22 12 -44 0 Z"/>
  </g>

  <!-- splinter haemorrhages: fine dark longitudinal streaks under the nail plate -->
  <g stroke="#5d2a1e" stroke-width="3.2" stroke-linecap="round">
    <line x1="92"  y1="128" x2="90"  y2="164"/>
    <line x1="114" y1="140" x2="113" y2="170"/>
    <line x1="210" y1="106" x2="208" y2="148"/>
    <line x1="232" y1="118" x2="231" y2="152"/>
    <line x1="246" y1="132" x2="245" y2="158"/>
    <line x1="332" y1="136" x2="330" y2="172"/>
    <line x1="356" y1="150" x2="355" y2="180"/>
  </g>
  <!-- one streak drawn a touch stronger, gently pulsing to draw the eye -->
  <line x1="222" y1="98" x2="220" y2="146" stroke="#4a1f16" stroke-width="3.6" stroke-linecap="round">
    <animate attributeName="opacity" values="1;.45;1" dur="2.2s" repeatCount="indefinite"/>
  </line>
</svg>
