<svg xmlns="http://www.w3.org/2000/svg" id="panc-db-d01-gland" viewBox="0 0 720 1125" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>The gland in place, with the stomach lifted away</title><desc>The stomach is drawn as a dashed outline lifted away. Beneath it the gland lies across the back of the upper abdomen: its head sits in the C-shaped curve of the duodenum and its tail reaches the spleen. The pancreatic duct runs along the gland and meets the bile duct at one shared outlet into the duodenum, the ampulla. Small gold clusters in the gland are the islets. Below: job 1, juice into the gut (exocrine), 750 to 1000 mL a day; job 2, hormones into the blood (endocrine, from the islets), which control blood sugar. Its enzymes leave switched off as zymogens: trypsinogen becomes trypsin only in the gut, switched on by enteropeptidase (enterokinase).</desc>
<rect width="720" height="1125" fill="#fdf8ee"/>
<g id="panc-db-d01-stomach"><path d="M232 128 C214 92 236 58 290 52 C380 40 470 38 540 52 C600 62 616 102 584 122 C540 146 470 120 400 124 C330 128 268 150 232 128 Z" fill="#faf0da" stroke="#a08c6e" stroke-width="4" stroke-dasharray="10 8"/><path d="M596.0 104.0 L596.0 76.0" stroke="#a08c6e" stroke-width="5" stroke-linecap="round" fill="none"/><path d="M596.0 62.0 L606.5 76.0 L585.5 76.0 Z" fill="#a08c6e" stroke="#a08c6e" stroke-width="2" stroke-linejoin="round"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="start" ><tspan x="262.0" y="98.0">Stomach (lifted away)</tspan></text></g><g id="panc-db-d01-duodenum"><path d="M262 178 H140 Q112 178 112 206 V380 Q112 412 144 412 H340 Q370 412 374 384 V318" fill="none" stroke="#241c15" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/><path d="M262 178 H140 Q112 178 112 206 V380 Q112 412 144 412 H340 Q370 412 374 384 V318" fill="none" stroke="#e8a58c" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/><path d="M262 178 H140 Q112 178 112 206 V380 Q112 412 144 412 H340 Q370 412 374 384 V318" fill="none" stroke="#cf7c5f" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round"/></g><g id="panc-db-d01-spleen"><path d="M628 190 C600 176 600 120 640 100 C676 84 702 108 700 150 C698 196 676 226 650 224 C632 222 640 204 628 190 Z" fill="#b56a6a" stroke="#241c15" stroke-width="4" stroke-linejoin="round"/><path d="M650 116 C672 112 684 134 680 160" fill="none" stroke="#d99a9a" stroke-width="5" stroke-linecap="round"/></g><g id="panc-db-d01-pancreas"><path d="M176 222 C206 206 250 214 268 236 C300 236 330 240 360 236 C420 228 480 214 530 200 C566 190 600 186 620 196 C634 204 630 224 612 232 C580 246 540 256 500 266 C450 280 400 290 362 298 C336 304 300 304 286 318 C282 344 262 372 230 376 C196 380 166 362 162 330 C158 296 158 252 176 222 Z" fill="#f2c48d" stroke="#241c15" stroke-width="5" stroke-linejoin="round"/><circle cx="200" cy="260" r="16" fill="none" stroke="#d9a05e" stro