 fill="#c8531b" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="24.0" y="502.0">Shared outlet</tspan><tspan x="24.0" y="534.2">(ampulla)</tspan></text><text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="196.0" y="421.0">Duodenum</tspan></text><path d="M232 112 L140 120" stroke="#241c15" stroke-width="3" stroke-linecap="round"/><circle cx="232" cy="112" r="6" fill="#c8531b" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="20.0" y="108.0">Bile duct</tspan></text><path d="M250 344 L300 470" stroke="#241c15" stroke-width="3" stroke-linecap="round"/><circle cx="250" cy="344" r="6" fill="#c8531b" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="300.0" y="502.0">Head</tspan></text><path d="M470 256 L470 470" stroke="#241c15" stroke-width="3" stroke-linecap="round"/><circle cx="470" cy="256" r="6" fill="#c8531b" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="390.0" y="502.0">Pancreatic duct</tspan></text><path d="M430 238 L410 186" stroke="#241c15" stroke-width="3" stroke-linecap="round"/><circle cx="430" cy="238" r="6" fill="#c8531b" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="330.0" y="174.0">Islets</tspan></text><path d="M596 214 L590 290" stroke="#241c15" stroke-width="3" stroke-linecap="round"/><circle cx="596" cy="214" r="6" fill="#c8531b" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="572.0" y="330.0">Tail</tspan></text><path d="M664 210 L668 290" stroke="#241c15" stroke-width="3" stroke-linecap="round"/><circle cx="664" cy="210" r="6" fill="#c8531b" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="670.0" y="362.0">Spleen</tspan></text><g id="panc-db-d01-exocrine"><rect x="30" y="566" width="326" height="254.8800000000001" rx="14" fill="#241c15"/><rect x="24" y="560" width="326" height="254.8800000000001" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3" /><g transform="translate(64.0 600.0) scale(0.9)" ><path d="M0 -22.1 C6.5 -10.4 13.0 -3.9 13.0 2.6 A13 13 0 1 1 -13.0 2.6 C-13.0 -3.9 -6.5 -10.4 0 -22.1 Z" fill="#f2c48d" stroke="#241c15" stroke-width="2.5" stroke-linejoin="round"/><path d="M26 -3.0 C31.0 6.0 36.0 11.0 36.0 16.0 A10 10 0 1 1 16.0 16.0 C16.0 11.0 21.0 6.0 26 -3.0 Z" fill="#f2c48d" stroke="#241c15" stroke-width="2.5" stroke-linejoin="round"/><path d="M-6 16.7 C-1.5 24.8 3.0 29.3 3.0 33.8 A9 9 0 1 1 -15.0 33.8 C-15.0 29.3 -10.5 24.8 -6 16.7 Z" fill="#f2c48d" stroke="#241c15" stroke-width="2.5" stroke-linejoin="round"/></g><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="110.0" y="606.0">Job 1: juice</tspan><tspan x="110.0" y="637.4">into the gut</tspan></text><text font-size="28" font-weight="700" fill="#a53f12" text-anchor="start" ><tspan x="44.0" y="682.0">(exocrine)</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="44.0" y="718.7">750 to 1000 mL a day</tspan></text></g><g id="panc-db-d01-endocrine"><rect x="376" y="566" width="326" height="254.8800000000001" rx="14" fill="#241c15"/><rect x="370" y="560" width="326" height="254.8800000000001" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3" /><g transform="translate(410.0 600.0) scale(0.9)" ><circle r="11" fill="#e0a521" stroke="#241c15" stroke-width="3"/><circle cx="20" cy="12" r="9" fill="#e0a521" stroke="#241c15" stroke-width="3"/><circle cx="-2" cy="26" r="8" fill="#e0a521" stroke="#241c15" stroke-width="3"/></g><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="456.0" y="606.0">Job 2:</tspan><tspan x="456.0" y="637.4">hormones into</tspan><tspan x="456.0" y="668.7">the blood</tspan></text><text font-size="28" font-weight="700" fill="#a53f12" text-anchor="start" ><tspan x="390.0" y="706.1">(endocrine)</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="390.0" y="742.8">From the islets; they</tspan><tspan x="390.0" y="775.8">control blood sugar</tspan></text></g><g id="panc-db-d01-switch"><rect x="30" y="850.8800000000001" width="672" height="250" rx="14" fill="#241c15"/><rect x="24" y="844.8800000000001" width="672" height="250" rx="14" fill="#fdf8ee" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="890.9">Its enzymes leave switched off</tspan></text><text font-size="28" font-weight="700" fill="#a53f12" text-anchor="start" ><tspan x="48.0" y="926.9">(inactive forms: zymogens)</tspan></text><rect x="30.9" y="971.1" width="218.1" height="47.6" rx="23.8" fill="#f3e5c8" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="140.0" y="1004.7">Trypsinogen</tspan></text><path d="M254.0 994.9 L394.0 994.9" stroke="#241c15" stroke-width="5" stroke-linecap="round" fill="none"/><path d="M410.0 994.9 L394.0 1006.9 L394.0 982.9 Z" fill="#241c15" stroke="#241c15" stroke-width="2" stroke-linejoin="round"/><text font-size="28" font-weight="700" fill="#463a2c" text-anchor="middle" ><tspan x="332.0" y="974.9">in the gut</tspan></text><rect x="458.5" y="971.1" width="203.1" height="47.6" rx="23.8" fill="#c8531b" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="800" fill="#fdf8ee" text-anchor="middle" ><tspan x="560.0" y="1004.7">Trypsin: on</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="middle" ><tspan x="360.0" y="1066.9">by a gut-lining enzyme (enteropeptidase)</tspan></text></g>
</svg>
