<svg xmlns="http://www.w3.org/2000/svg" id="panc-calcium-d19-flowchart-plain" viewBox="0 0 720 1341" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>The trust’s calcium flow chart</title><desc>The trust’s acute hypocalcaemia guideline as three cards, graded by adjusted calcium. Mild, 1.9 to below 2.2 mmol/L: no symptoms, calcium by mouth; symptoms, IV calcium. Moderately severe, 1.8 to 1.89 with no ECG change or circulatory trouble: 10% calcium gluconate 10 mL IV over 5 minutes with ECG monitoring. Severe, below 1.8, or below 1.9 with ECG changes or a struggling circulation: 10% calcium gluconate 20 mL IV over 10 minutes with ECG monitoring; call the senior on call; move to a monitored bed. Get an ECG if below 1.9 or symptoms; send U&amp;E, bone profile, magnesium, PTH and vitamin D. The guideline’s table uses two grades only. National guidance: 10 to 20 mL in 50 to 100 mL of 5% glucose over 10 minutes, repeated until symptoms settle.</desc>
<rect width="720" height="1341" fill="#fdf8ee"/>
<rect x="205.9" y="24.5" width="308.1" height="51.0" rx="25.5" fill="#241c15" stroke="#241c15" stroke-width="3"/><text font-size="30" font-weight="800" fill="#fdf8ee" text-anchor="middle" ><tspan x="360.0" y="60.5">Adjusted calcium</tspan></text><g id="panc-calcium-d19-flowchart-plain-mild"><rect x="30" y="106" width="672" height="229.28000000000003" rx="14" fill="#241c15"/><rect x="24" y="100" width="672" height="229.28000000000003" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3" /><text font-size="30" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="148.0">Mild</tspan></text><text font-size="28" font-weight="700" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="191.2">1.9 to below 2.2 mmol/L</tspan></text><path d="M50 234.56 l16 0" stroke="#241c15" stroke-width="4"/><path d="M72.0 234.6 L62.0 242.1 L62.0 227.1 Z" fill="#241c15" stroke="#241c15" stroke-width="2" stroke-linejoin="round"/><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="84.0" y="244.6">No symptoms: calcium by mouth.</tspan></text><path d="M50 273.92 l16 0" stroke="#241c15" stroke-width="4"/><path d="M72.0 273.9 L62.0 281.4 L62.0 266.4 Z" fill="#241c15" stroke="#241c15" stroke-width="2" stroke-linejoin="round"/><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="84.0" y="283.9">Symptoms: IV calcium, as below.</tspan></text></g><g id="panc-calcium-d19-flowchart-plain-moderate"><rect x="30" y="359.28000000000003" width="672" height="252.64000000000004" rx="14" fill="#241c15"/><rect x="24" y="353.28000000000003" width="672" height="252.64000000000004" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3" /><text font-size="30" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="401.3">Moderately severe</tspan></text><text font-size="28" font-weight="700" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="444.5">1.8–1.89, with no ECG change or</tspan><tspan x="48.0" y="475.8">circulatory trouble</tspan></text><path d="M50 519.2 l16 0" stroke="#241c15" stroke-width="4"/><path d="M72.0 519.2 L62.0 526.7 L62.0 511.7 Z" fill="#241c15" stroke="#241c15" stroke-width="2" stroke-linejoin="round"/><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="84.0" y="529.2">10% calcium gluconate 10 mL IV over 5</tspan><tspan x="84.0" y="560.6">minutes, with ECG monitoring.</tspan></text></g><g id="panc-calcium-d19-flowchart-plain-severe"><rect x="30" y="635.9200000000001" width="672" height="323.3600000000001" rx="14" fill="#241c15"/><rect x="24" y="629.9200000000001" width="672" height="323.3600000000001" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3" /><text font-size="30" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="677.9">Severe</tspan></text><text font-size="28" font-weight="700" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="721.1">below 1.8, or below 1.9 with ECG</tspan><tspan x="48.0" y="752.5">changes or a struggling circulation</tspan></text><path d="M50 795.8400000000001 l16 0" stroke="#241c15" stroke-width="4"/><path d="M72.0 795.8 L62.0 803.3 L62.0 788.3 Z" fill="#241c15" stroke="#241c15" stroke-width="2" stroke-linejoin="round"/><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="84.0" y="805.8">10% calcium gluconate 20 mL IV over 10</tspan><tspan x="84.0" y="837.2">minutes, with ECG monitoring.</tspan></text><path d="M50 866.5600000000002 l16 0" stroke="#241c15" stroke-width="4"/><path d="M72.0 866.6 L62.0 874.1 L62.0 859.1 Z" fill="#241c15" stroke="#241c15" stroke-width="2" stroke-linejoin="round"/><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="84.0" y="876.6">Call the senior on call; move to a monitored</tspan><tspan x="84.0" y="907.9">bed.</tspan></text></g><rect x="30" y="983.2800000000002" width="672" height="337.5999999999999" rx="14" fill="#241c15"/><rect x="24" y="977.2800000000002" width="672" height="337.5999999999999" rx="14" fill="#fdf8ee" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="400" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="1023.3">Get an ECG if the adjusted calcium is below</tspan><tspan x="48.0" y="1055.5">1.9 or there are symptoms. Send U&amp;E, bone</tspan><tspan x="48.0" y="1087.7">profile, magnesium, PTH and vitamin D.</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="48.0" y="1129.9">The guideline’s table uses two grades only:</tspan><tspan x="48.0" y="1162.1">mild 1.9 to below 2.2; severe below 1.9.</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="48.0" y="1204.3">National guidance: 10–20 mL in 50–100 mL of</tspan><tspan x="48.0" y="1236.5">5% glucose over 10 minutes, repeated until</tspan><tspan x="48.0" y="1268.7">symptoms settle.</tspan></text>
</svg>
