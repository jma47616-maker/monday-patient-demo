<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 670" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Four explanations against five findings: only a bleed fits them all</title><desc>A grid. Heart rhythm explains the collapse and the fast pulse. A simple faint and blood pressure tablets explain only the collapse. A bleed explains the collapse, the fast pulse, the black stool, the urea of 14.6 and the haemoglobin of 72.</desc>
