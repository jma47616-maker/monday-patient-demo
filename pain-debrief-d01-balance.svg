<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360">
  <title>Pain against examination</title>
  <!-- Card 2. A balance: her pain (10/10, cannot keep still) weighs down one pan; what the hand finds (soft, mildly tender) rides up on the other. -->
  
  <rect width="360" height="360" rx="16" fill="#f3e5c8"/>
  <path d="M180 296 L156 318 H204 Z" fill="#8d8577" stroke="#241c15" stroke-width="3" stroke-linejoin="round"/><path d="M180 296 V100" stroke="#241c15" stroke-width="5"/><g><path d="M80 118 L280 82" stroke="#241c15" stroke-width="6" stroke-linecap="round"/><circle cx="180" cy="100" r="8" fill="#e3b23c" stroke="#241c15" stroke-width="3"/></g><path d="M80 118 L46 188 M80 118 L114 188" stroke="#241c15" stroke-width="2.5"/><path d="M30 188 H130 Q126 210 80 212 Q34 210 30 188 Z" fill="#e9a27f" stroke="#241c15" stroke-width="3" stroke-linejoin="round"/><text x="80" y="242.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#241c15" text-anchor="middle">Her pain</text><text x="80" y="264.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#241c15" text-anchor="middle">10/10</text><text x="80" y="282.3" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#241c15" text-anchor="middle">can't keep still</text><path d="M280 82 L246 152 M280 82 L314 152" stroke="#241c15" stroke-width="2.5"/><path d="M230 152 H330 Q326 174 280 176 Q234 174 230 152 Z" fill="#a9cbd3" stroke="#241c15" stroke-width="3" stroke-linejoin="round"/><text x="280" y="206.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#241c15" text-anchor="middle">The hand finds</text><text x="280" y="228.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#241c15" text-anchor="middle">soft</text><text x="280" y="246.3" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#241c15" text-anchor="middle">mildly tender</text><text x="180" y="34" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#241c15" text-anchor="middle">Pain out of proportion</text><text x="180" y="346" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#c2643c" text-anchor="middle">The mismatch is the warning</text>
</svg>
