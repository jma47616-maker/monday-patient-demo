<svg xmlns="http://www.w3.org/2000/svg" id="fever-debrief-d12-gp-timeline" viewBox="0 0 720 1034" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Fourteen months in the GP record</title><desc>A vertical timeline with five dated cards and a weight card at the foot.</desc>
<rect width="720" height="1034" fill="#fdf8ee"/>
<text font-size="30" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="36.0" y="54.0">Her GP record</tspan></text>
<path d="M70 120 V840" stroke="#241c15" stroke-width="6"/>
<path d="M70 110 V120" stroke="#241c15" stroke-width="6"/>
<circle cx="70" cy="140" r="16" fill="#e0a521" stroke="#241c15" stroke-width="3.5"/>
<rect x="114" y="114" width="586" height="166" rx="14" fill="#241c15"/><rect x="110" y="110" width="586" height="166" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3" />
<text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="132.0" y="152.0">14 months before</tspan></text>
<text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="132.0" y="190.0">white count 3.1, lymphocytes 0.8,</tspan></text>
<text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="132.0" y="224.0">platelets 138, protein on a urine dip;</tspan></text>
<text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="132.0" y="258.0">"probably post-viral"; repeat never booked</tspan></text>
<circle cx="70" cy="332" r="16" fill="#e0a521" stroke="#241c15" stroke-width="3.5"/>
<rect x="114" y="306" width="586" height="132" rx="14" fill="#241c15"/><rect x="110" y="302" width="586" height="132" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3" />
<text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="132.0" y="344.0">August</tspan></text>
<text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="132.0" y="382.0">sunburn on her face and arms after</tspan></text>
<text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="132.0" y="416.0">Tenerife, not settled after two weeks</tspan></text>
<circle cx="70" cy="490" r="16" fill="#e0a521" stroke="#241c15" stroke-width="3.5"/>
<rect x="114" y="464" width="586" height="166" rx="14" fill="#241c15"/><rect x="110" y="460" width="586" height="166" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3" />
<text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="132.0" y="502.0">Six weeks ago</tspan></text>
<text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="132.0" y="540.0">painful, stiff hands and wrists every</tspan></text>
<text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="132.0" y="574.0">morning; rheumatoid factor negative;</tspan></text>
<text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="132.0" y="608.0">ibuprofen</tspan></text>
<circle cx="70" cy="682" r="16" fill="#e0a521" stroke="#241c15" stroke-width="3.5"/>
<rect x="114" y="656" width="586" height="132" rx="14" fill="#241c15"/><rect x="110" y="652" width="586" height="132" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3" />
<text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="132.0" y="694.0">Ten days ago</tspan></text>
<text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="132.0" y="732.0">sore throat, evening temperatures;</tspan></text>
<text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="132.0" y="766.0">"glandular fever at work"</tspan></text>
<circle cx="70" cy="840" r="16" fill="#c8531b" stroke="#241c15" stroke-width="3.5"/>
<rect x="114" y="814" width="586" height="98" rx="14" fill="#241c15"/><rect x="110" y="810" width="586" height="98" rx="14" fill="#fbe4d3" stroke="#241c15" stroke-width="3" />
<text font-size="28" font-weight="800" fill="#a53f12" text-anchor="start" ><tspan x="132.0" y="852.0">Tuesday</tspan></text>
<text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="132.0" y="890.0">the round, 09:20</tspan></text>
<rect x="114" y="938" width="586" height="70" rx="14" fill="#241c15"/><rect x="110" y="934" width="586" height="70" rx="14" fill="#fbeec6" stroke="#241c15" stroke-width="3" />
<text font-size="28" font-weight="700" fill="#241c15" text-anchor="start" ><tspan x="132.0" y="980.0">Her weight: 62 kg then, 58 kg now</tspan></text>
</svg>
