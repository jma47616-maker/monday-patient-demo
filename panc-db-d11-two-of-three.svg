<svg xmlns="http://www.w3.org/2000/svg" id="panc-db-d11-two-of-three" viewBox="0 0 720 646" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Three rings, two of them lit for Dean</title><desc>Any two of three make the diagnosis. Three rings in a row. Typical pain, upper middle through to the back: lit, with a tick; Dean: yes. Enzyme 3 times normal or more, lipase or amylase: lit, with a tick; Dean: lipase 2,310 (normal 13 to 60). Typical imaging, a scan: dashed and unlit; not needed. Underneath: a raised enzyme supports the diagnosis; it does not prove it alone.</desc>
<rect width="720" height="646" fill="#fdf8ee"/>
<rect x="70.0" y="26.2" width="580.0" height="47.6" rx="23.8" fill="#e0a521" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="360.0" y="59.8">Any two of three make the diagnosis</tspan></text><g id="panc-db-d11-ring-1"><circle cx="128" cy="226" r="104" fill="#fbe4d3" stroke="#241c15" stroke-width="6"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="128.0" y="217.8">Typical</tspan><tspan x="128.0" y="248.0">pain</tspan></text><g transform="translate(202.0 152.0)" ><circle r="20" fill="#3f7a3a" stroke="#241c15" stroke-width="3"/><path d="M-9 1 L-2 8 L10 -7" fill="none" stroke="#fdf8ee" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="middle" ><tspan x="128.0" y="368.0">upper middle,</tspan><tspan x="128.0" y="399.4">through to the</tspan><tspan x="128.0" y="430.7">back</tspan></text><text font-size="28" font-weight="800" fill="#a53f12" text-anchor="middle" ><tspan x="128.0" y="470.1">Dean: yes</tspan></text></g><g id="panc-db-d11-ring-2"><circle cx="360" cy="226" r="104" fill="#fbe4d3" stroke="#241c15" stroke-width="6"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="360.0" y="187.5">Enzyme 3</tspan><tspan x="360.0" y="217.8">times</tspan><tspan x="360.0" y="248.0">normal or</tspan><tspan x="360.0" y="278.2">more</tspan></text><g transform="translate(434.0 152.0)" ><circle r="20" fill="#3f7a3a" stroke="#241c15" stroke-width="3"/><path d="M-9 1 L-2 8 L10 -7" fill="none" stroke="#fdf8ee" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="middle" ><tspan x="360.0" y="368.0">lipase or</tspan><tspan x="360.0" y="399.4">amylase</tspan></text><text font-size="28" font-weight="800" fill="#a53f12" text-anchor="middle" ><tspan x="360.0" y="438.7">Dean: lipase</tspan><tspan x="360.0" y="470.1">2,310 (13–60)</tspan></text></g><g id="panc-db-d11-ring-3"><circle cx="592" cy="226" r="104" fill="#fdf8ee" stroke="#a08c6e" stroke-width="5" stroke-dasharray="12 10"/><text font-size="28" font-weight="800" fill="#7a6a52" text-anchor="middle" ><tspan x="592.0" y="217.8">Typical</tspan><tspan x="592.0" y="248.0">imaging</tspan></text><text font-size="28" font-weight="400" fill="#7a6a52" text-anchor="middle" ><tspan x="592.0" y="368.0">a scan</tspan></text><text font-size="28" font-weight="400" fill="#7a6a52" text-anchor="middle" ><tspan x="592.0" y="407.4">Not needed</tspan></text></g><rect x="28" y="515.44" width="672" height="104.39999999999999" rx="14" fill="#241c15"/><rect x="24" y="511.44000000000005" width="672" height="104.39999999999999" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="middle" ><tspan x="360.0" y="557.4">A raised enzyme supports the diagnosis; it</tspan><tspan x="360.0" y="589.6">does not prove it alone.</tspan></text>
</svg>
