<svg xmlns="http://www.w3.org/2000/svg" id="fitd16" viewBox="0 0 720 851" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>His sodium from Thursday to Sunday as a falling line, with the fluids as bars beneath</title><desc>A falling line through four points: Thu 129, Fri 124, Sun 06:00 118, Sun 15:40 112. Across Saturday the line is dashed with an empty circle: Sat: no bloods. On Sunday morning, a whiteboard with a telephone: 08:12 phoned. Not reviewed. At the right end, a lightning mark: the fit. Beneath, two bars: a short one, 0.9% saline, 1 litre; and a long one from Friday to Sunday, glucose 5%, 1 litre every 8 hours.</desc>
<rect width="720" height="851" fill="#fdf8ee"/>
<g id="fitd16-sodium"><path d="M80 170.0 L220 277.5" stroke="#241c15" stroke-width="7" stroke-linecap="round"/><path d="M220 277.5 L520 406.5" stroke="#241c15" stroke-width="6" stroke-linecap="round" stroke-dasharray="5 14"/><path d="M520 406.5 L660 535.5" stroke="#241c15" stroke-width="7" stroke-linecap="round"/><circle cx="80" cy="170.0" r="11" fill="#c8531b" stroke="#241c15" stroke-width="4"/><circle cx="220" cy="277.5" r="11" fill="#c8531b" stroke="#241c15" stroke-width="4"/><circle cx="520" cy="406.5" r="11" fill="#c8531b" stroke="#241c15" stroke-width="4"/><circle cx="660" cy="535.5" r="11" fill="#c8531b" stroke="#241c15" stroke-width="4"/><circle cx="370" cy="342.0" r="13" fill="#fdf8ee" stroke="#241c15" stroke-width="4" stroke-dasharray="6 5"/><text x="102.0" y="160.0" font-size="30" font-weight="600" fill="#463a2c" text-anchor="start">Thu</text><text font-size="32" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="164.0" y="160.0">129</tspan></text><text font-size="30" font-weight="600" fill="#463a2c" text-anchor="start" ><tspan x="240.0" y="259.5">Fri</tspan></text><text font-size="32" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="286.0" y="259.5">124</tspan></text><text font-size="30" font-weight="700" fill="#463a2c" text-anchor="end" ><tspan x="404.0" y="404.0">Sat: no bloods</tspan></text><text font-size="29" font-weight="600" fill="#463a2c" text-anchor="end" ><tspan x="502.0" y="456.5">Sun 06:00</tspan></text><text font-size="32" font-weight="800" fill="#241c15" text-anchor="end" ><tspan x="502.0" y="494.5">118</tspan></text><text font-size="29" font-weight="600" fill="#463a2c" text-anchor="end" ><tspan x="622.0" y="583.5">Sun 15:40</tspan></text><text font-size="32" font-weight="800" fill="#241c15" text-anchor="end" ><tspan x="690.0" y="583.5">112</tspan></text></g><g id="fitd16-whiteboard"><path d="M551.9 148 V423.8" stroke="#241c15" stroke-width="4" stroke-linecap="round" stroke-dasharray="3 9"/><circle cx="551.9" cy="435.8" r="7" fill="#241c15"/><rect x="398" y="36" width="300" height="118" rx="8" fill="#241c15"/><rect x="392" y="30" width="300" height="118" rx="8" fill="#ffffff" stroke="#241c15" stroke-width="6"/><g transform="translate(440.0 90.0) scale(0.78)" ><path d="M-34 32 L-24 -4 H24 L34 32 Z" fill="#c8531b" stroke="#241c15" stroke-width="4" stroke-linejoin="round"/><circle cx="0" cy="14" r="11" fill="#fdf8ee" stroke="#241c15" stroke-width="3.5"/><circle cx="0" cy="14" r="3" fill="#241c15"/><path d="M-38 -12 C-30 -34 30 -34 38 -12" fill="none" stroke="#241c15" stroke-width="15" stroke-linecap="round"/><rect x="-50" y="-20" width="24" height="18" rx="6" fill="#241c15"/><rect x="26" y="-20" width="24" height="18" rx="6" fill="#241c15"/></g><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="490.0" y="82.0">08:12 phoned.</tspan></text><text font-size="28" font-weight="800" fill="#a53f12" text-anchor="start" ><tspan x="490.0" y="120.0">Not reviewed</tspan></text></g><g id="fitd16-fit"><g transform="translate(672.0 437.5)" ><path d="M10 -46 L-24 6 H-3 L-12 46 L26 -10 H5 Z" fill="#e0a521" stroke="#241c15" stroke-width="4" stroke-linejoin="round"/></g><text font-size="30" font-weight="800" fill="#a53f12" text-anchor="end" ><tspan x="690.0" y="623.5">The fit</tspan></text></g><path d="M60 659.5 H690" stroke="#241c15" stroke-width="4.5" stroke-linecap="round"/><path d="M80 650.5 v18" stroke="#241c15" stroke-width="4" stroke-linecap="round"/><path d="M220 650.5 v18" stroke="#241c15" stroke-width="4" stroke-linecap="round"/><path d="M370 650.5 v18" stroke="#241c15" stroke-width="4" stroke-linecap="round"/><path d="M520 650.5 v18" stroke="#241c15" stroke-width="4" stroke-linecap="round"/><path d="M660 650.5 v18" stroke="#241c15" stroke-width="4" stroke-linecap="round"/><g id="fitd16-fluids"><rect x="86" y="685.5" width="112" height="40" rx="8" fill="#b9c6dc" stroke="#241c15" stroke-width="4"/><text font-size="29" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="214.0" y="715.5">0.9% saline, 1 litre</tspan></text><rect x="220" y="745.5" width="440" height="40" rx="8" fill="#f0a27c" stroke="#241c15" stroke-width="4"/><text font-size="29" font-weight="800" fill="#241c15" text-anchor="end" ><tspan x="660.0" y="825.5">Glucose 5%, 1 litre every 8 hours</tspan></text></g>
</svg>
