<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 820" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>HALT-IT: tranexamic acid did not reduce deaths from bleeding and doubled clots in the veins</title><desc>Two pairs of bars. Died from bleeding within 5 days: 3.7 percent with tranexamic acid, 3.8 percent without. Clots in the veins: 0.8 percent with, 0.4 percent without. HALT-IT, 12,009 patients, Lancet 2020.</desc>
<rect width="720" height="820" fill="#fdf8ee"/>
<rect x="30" y="20" width="660" height="62" rx="31" fill="#241c15"/><text font-size="28" font-weight="800" fill="#fdf8ee" text-anchor="middle" ><tspan x="360.0" y="61.0">Tranexamic acid: with or without</tspan></text><rect x="36" y="112" width="322" height="560" rx="16" fill="#241c15"/><rect x="30" y="106" width="322" height="560" rx="16" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><text font-size="27" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="191.0" y="152.0">Died from</tspan><tspan x="191.0" y="184.9">bleeding</tspan><tspan x="191.0" y="217.9">within 5 days</tspan></text><rect x="81" y="368" width="100" height="232" fill="#241c15"/><rect x="76" y="363" width="100" height="237" fill="#463a2c" stroke="#241c15" stroke-width="3"/><text font-size="32" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="126.0" y="347.2">3.7%</tspan></text><text font-size="27" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="126.0" y="640.0">with</tspan></text><rect x="209" y="362" width="100" height="238" fill="#241c15"/><rect x="204" y="357" width="100" height="243" fill="#f3e5c8" stroke="#241c15" stroke-width="3"/><text font-size="32" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="254.0" y="340.8">3.8%</tspan></text><text font-size="27" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="254.0" y="640.0">without</tspan></text><path d="M54 600 H328" stroke="#241c15" stroke-width="5" stroke-linecap="round"/><rect x="374" y="112" width="322" height="560" rx="16" fill="#241c15"/><rect x="368" y="106" width="322" height="560" rx="16" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><text font-size="27" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="529.0" y="152.0">Clots in</tspan><tspan x="529.0" y="184.9">the veins</tspan></text><rect x="419" y="362" width="100" height="238" fill="#241c15"/><rect x="414" y="357" width="100" height="243" fill="#c8531b" stroke="#241c15" stroke-width="3"/><text font-size="32" font-weight="800" fill="#a53f12" text-anchor="middle" ><tspan x="464.0" y="340.8">0.8%</tspan></text><text font-size="27" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="464.0" y="640.0">with</tspan></text><rect x="547" y="483" width="100" height="117" fill="#241c15"/><rect x="542" y="478" width="100" height="122" fill="#f3e5c8" stroke="#241c15" stroke-width="3"/><text font-size="32" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="592.0" y="462.4">0.4%</tspan></text><text font-size="27" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="592.0" y="640.0">without</tspan></text><path d="M392 600 H666" stroke="#241c15" stroke-width="5" stroke-linecap="round"/><text font-size="24" font-weight="500" fill="#7a6a52" text-anchor="middle" ><tspan x="360.0" y="716.0">Each pair is drawn to its own scale</tspan></text><path d="M30 742 H690" stroke="#d9c9a6" stroke-width="3"/><text font-size="28" font-weight="700" fill="#463a2c" text-anchor="middle" ><tspan x="360.0" y="786.0">HALT-IT, 12,009 patients, Lancet 2020</tspan></text>
