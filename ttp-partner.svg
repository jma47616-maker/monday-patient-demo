<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Lauren's partner">
  <rect width="200" height="200" fill="#efe7da"/>
  <!-- shoulders / jumper thrown on in a hurry -->
  <path d="M22 200 C28 152 58 134 100 134 C142 134 172 152 178 200 Z" fill="#7f8f6d" stroke="#2b241d" stroke-width="4"/>
  <path d="M78 140 q22 16 44 0" fill="none" stroke="#2b241d" stroke-width="3" opacity=".55"/>
  <!-- neck -->
  <path d="M86 112 h28 v30 c0 8 -28 8 -28 0 Z" fill="#c99873" stroke="#2b241d" stroke-width="3.5"/>
  <!-- hair behind: shoulder-length, tucked back -->
  <path d="M50 90 C48 46 72 24 100 24 C128 24 152 46 150 90 C149 112 147 124 144 138
           C141 118 140 106 138 96 L62 96 C60 106 59 118 56 138 C53 124 51 112 50 90 Z"
        fill="#8a5a34" stroke="#2b241d" stroke-width="4" stroke-linejoin="round"/>
  <!-- head -->
  <ellipse cx="100" cy="80" rx="43" ry="46" fill="#dcae83" stroke="#2b241d" stroke-width="4"/>
  <!-- soft curls at the crown -->
  <path d="M58 68 C58 38 78 26 100 26 C122 26 142 38 142 68
           C136 54 128 48 118 50 C112 40 100 38 92 44 C82 42 70 50 58 68 Z"
        fill="#8a5a34" stroke="#2b241d" stroke-width="3.8" stroke-linejoin="round"/>
  <g fill="none" stroke="#6d4526" stroke-width="2.6" stroke-linecap="round" opacity=".7">
    <path d="M70 52 q8 -8 16 -4"/><path d="M96 40 q10 -6 18 2"/><path d="M120 50 q8 -6 14 2"/>
  </g>
  <!-- worried brows, drawn together -->
  <path d="M68 64 q14 -6 24 1" fill="none" stroke="#2b241d" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M132 64 q-14 -6 -24 1" fill="none" stroke="#2b241d" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M96 58 q4 6 0 11" fill="none" stroke="#2b241d" stroke-width="2.4" stroke-linecap="round" opacity=".55"/>
  <path d="M104 58 q-4 6 0 11" fill="none" stroke="#2b241d" stroke-width="2.4" stroke-linecap="round" opacity=".55"/>
  <!-- eyes, watching Lauren rather than you -->
  <ellipse cx="82" cy="82" rx="10" ry="8.5" fill="#faf6f0" stroke="#2b241d" stroke-width="3.4"/>
  <ellipse cx="118" cy="82" rx="10" ry="8.5" fill="#faf6f0" stroke="#2b241d" stroke-width="3.4"/>
  <g fill="#2b241d">
    <circle cx="79" cy="83" r="4.1"/>
    <circle cx="115" cy="83" r="4.1"/>
  </g>
  <!-- nose -->
  <path d="M100 84 q5 10 -3 15" fill="none" stroke="#2b241d" stroke-width="3.1" stroke-linecap="round"/>
  <!-- flat, tight mouth -->
  <path d="M89 113 q11 5 22 0" fill="none" stroke="#2b241d" stroke-width="3.8" stroke-linecap="round"/>
</svg>
