<svg xmlns="http://www.w3.org/2000/svg" id="panc-db-d02-cell" viewBox="0 0 720 1810" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>One enzyme-making cell in four frames</title><desc>One enzyme-making cell of the gland, in four frames. 1: the cell is injured. 2: calcium builds up inside it. 3: the gold enzyme packets and the purple waste-disposal packets (lysosomes) come together (co-localisation). 4: trypsinogen is switched on into trypsin too early, inside the gland, and the gland digests itself (autodigestion); inflammation follows.</desc>
<rect width="720" height="1810" fill="#fdf8ee"/>
