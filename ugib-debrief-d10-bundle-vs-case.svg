<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1275" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>The BSG bundle beside what the case marked, step by step</title><desc>Six steps in two columns. The two agree on Recognition, Resuscitation, Risk and Refer in substance, and differ on Rx (the bundle continues aspirin; the case stopped it) and on Review (after the endoscopy against before it).</desc>
<rect width="720" height="1275" fill="#fdf8ee"/>
<rect x="30" y="20" width="322" height="92" rx="14" fill="#241c15" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="800" fill="#fdf8ee" text-anchor="middle" ><tspan x="191.0" y="60.0">The BSG</tspan><tspan x="191.0" y="92.2">bundle</tspan></text><rect x="368" y="20" width="322" height="92" rx="14" fill="#f3e5c8" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="529.0" y="60.0">What the</tspan><tspan x="529.0" y="92.2">case marked</tspan></text><rect x="35" y="151" width="322" height="134.44" rx="14" fill="#241c15"/><rect x="30" y="146" width="322" height="134.44" rx="14" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><g transform="translate(0 188)"><text font-size="27" fill="#241c15"><tspan x="46" y="0.0"><tspan font-weight="400" xml:space="preserve">Blood vomited, black</tspan></tspan><tspan x="46" y="33.5"><tspan font-weight="400" xml:space="preserve">stool or</tspan></tspan><tspan x="46" y="67.0"><tspan font-weight="400" xml:space="preserve">coffee-ground vomit</tspan></tspan></text></g><rect x="373" y="151" width="322" height="134.44" rx="14" fill="#241c15"/><rect x="368" y="146" width="322" height="134.44" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3"/><g transform="translate(0 188)"><text font-size="27" fill="#241c15"><tspan x="384" y="0.0"><tspan font-weight="400" xml:space="preserve">Naming the diagnosis</tspan></tspan></text></g><rect x="261" y="122" width="197" height="42" rx="21" fill="#e0a521" stroke="#241c15" stroke-width="3"/><text font-size="26" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="360.0" y="152.0">Recognition</tspan></text><rect x="35" y="329.44" width="322" height="134.44" rx="14" fill="#241c15"/><rect x="30" y="324.44" width="322" height="134.44" rx="14" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><g transform="translate(0 366.44)"><text font-size="27" fill="#241c15"><tspan x="46" y="0.0"><tspan font-weight="400" xml:space="preserve">NEWS, fluid,</tspan></tspan><tspan x="46" y="33.5"><tspan font-weight="400" xml:space="preserve">transfuse below 70</tspan></tspan></text></g><rect x="373" y="329.44" width="322" height="134.44" rx="14" fill="#241c15"/><rect x="368" y="324.44" width="322" height="134.44" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3"/><g transform="translate(0 366.44)"><text font-size="27" fill="#241c15"><tspan x="384" y="0.0"><tspan font-weight="400" xml:space="preserve">Two large cannulas,</tspan></tspan><tspan x="384" y="33.5"><tspan font-weight="400" xml:space="preserve">fluid, crossmatched</tspan></tspan><tspan x="384" y="67.0"><tspan font-weight="400" xml:space="preserve">blood</tspan></tspan></text></g><rect x="248" y="300.44" width="223" height="42" rx="21" fill="#e0a521" stroke="#241c15" stroke-width="3"/><text font-size="26" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="360.0" y="330.4">Resuscitation</tspan></text><rect x="35" y="507.88" width="322" height="100.96" rx="14" fill="#241c15"/><rect x="30" y="502.88" width="322" height="100.96" rx="14" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><g transform="translate(0 544.88)"><text font-size="27" fill="#241c15"><tspan x="46" y="0.0"><tspan font-weight="400" xml:space="preserve">Glasgow-Blatchford</tspan></tspan><tspan x="46" y="33.5"><tspan font-weight="400" xml:space="preserve">score</tspan></tspan></text></g><rect x="373" y="507.88" width="322" height="100.96" rx="14" fill="#241c15"/><rect x="368" y="502.88" width="322" height="100.96" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3"/><g transform="translate(0 544.88)"><text font-size="27" fill="#241c15"><tspan x="384" y="0.0"><tspan font-weight="400" xml:space="preserve">The same</tspan></tspan></text></g><rect x="310" y="478.88" width="99" height="42" rx="21" fill="#e0a521" stroke="#241c15" stroke-width="3"/><text font-size="26" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="360.0" y="508.9">Risk</tspan></text><rect x="35" y="652.8399999999999" width="322" height="167.92" rx="14" fill="#c8531b"/><rect x="30" y="647.8399999999999" width="322" height="167.92" rx="14" fill="#fbe4d3" stroke="#c8531b" stroke-width="5"/><g transform="translate(0 689.8399999999999)"><text font-size="27" fill="#241c15"><tspan x="46" y="0.0"><tspan font-weight="400" xml:space="preserve">Suspend the blood</tspan></tspan><tspan x="46" y="33.5"><tspan font-weight="400" xml:space="preserve">thinner. </tspan><tspan font-weight="800" xml:space="preserve">Continue</tspan></tspan><tspan x="46" y="67.0"><tspan font-weight="800" xml:space="preserve">aspirin.</tspan></tspan></text></g><rect x="373" y="652.8399999999999" width="322" height="167.92" rx="14" fill="#c8531b"/><rect x="368" y="647.8399999999999" width="322" height="167.92" rx="14" fill="#fbe4d3" stroke="#c8531b" stroke-width="5"/><g transform="translate(0 689.8399999999999)"><text font-size="27" fill="#241c15"><tspan x="384" y="0.0"><tspan font-weight="400" xml:space="preserve">Stop the apixaban.</tspan></tspan><tspan x="384" y="33.5"><tspan font-weight="800" xml:space="preserve">Stop the aspirin</tspan></tspan><tspan x="384" y="67.0"><tspan font-weight="400" xml:space="preserve">and the naproxen. No</tspan></tspan><tspan x="384" y="100.4"><tspan font-weight="400" xml:space="preserve">tranexamic acid</tspan></tspan></text></g><rect x="322" y="623.8399999999999" width="75" height="42" rx="21" fill="#e0a521" stroke="#241c15" stroke-width="3"/><text font-size="26" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="360.0" y="653.8">Rx</tspan></text><rect x="35" y="864.7599999999999" width="322" height="134.44" rx="14" fill="#241c15"/><rect x="30" y="859.7599999999999" width="322" height="134.44" rx="14" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><g transform="translate(0 901.7599999999999)"><text font-size="27" fill="#241c15"><tspan x="46" y="0.0"><tspan font-weight="400" xml:space="preserve">Endoscopy within 24</tspan></tspan><tspan x="46" y="33.5"><tspan font-weight="400" xml:space="preserve">hours</tspan></tspan></text></g><rect x="373" y="864.7599999999999" width="322" height="134.44" rx="14" fill="#241c15"/><rect x="368" y="859.7599999999999" width="322" height="134.44" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3"/><g transform="translate(0 901.7599999999999)"><text font-size="27" fill="#241c15"><tspan x="384" y="0.0"><tspan font-weight="400" xml:space="preserve">Gastroenterology</tspan></tspan><tspan x="384" y="33.5"><tspan font-weight="400" xml:space="preserve">called and the</tspan></tspan><tspan x="384" y="67.0"><tspan font-weight="400" xml:space="preserve">endoscopy requested</tspan></tspan></text></g><rect x="304" y="835.7599999999999" width="112" height="42" rx="21" fill="#e0a521" stroke="#241c15" stroke-width="3"/><text font-size="26" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="360.0" y="865.8">Refer</tspan></text><rect x="35" y="1043.1999999999998" width="322" height="201.4" rx="14" fill="#c8531b"/><rect x="30" y="1038.1999999999998" width="322" height="201.4" rx="14" fill="#fbe4d3" stroke="#c8531b" stroke-width="5"/><g transform="translate(0 1080.1999999999998)"><text font-size="27" fill="#241c15"><tspan x="46" y="0.0"><tspan font-weight="800" xml:space="preserve">After the</tspan></tspan><tspan x="46" y="33.5"><tspan font-weight="800" xml:space="preserve">endoscopy: </tspan><tspan font-weight="400" xml:space="preserve">read the</tspan></tspan><tspan x="46" y="67.0"><tspan font-weight="400" xml:space="preserve">report, PPI for a</tspan></tspan><tspan x="46" y="100.4"><tspan font-weight="400" xml:space="preserve">high-risk ulcer, a plan</tspan></tspan><tspan x="46" y="133.9"><tspan font-weight="400" xml:space="preserve">for the blood thinners</tspan></tspan></text></g><rect x="373" y="1043.1999999999998" width="322" height="201.4" rx="14" fill="#c8531b"/><rect x="368" y="1038.1999999999998" width="322" height="201.4" rx="14" fill="#fbe4d3" stroke="#c8531b" stroke-width="5"/><g transform="translate(0 1080.1999999999998)"><text font-size="27" fill="#241c15"><tspan x="384" y="0.0"><tspan font-weight="800" xml:space="preserve">Before it: </tspan><tspan font-weight="400" xml:space="preserve">nil by</tspan></tspan><tspan x="384" y="33.5"><tspan font-weight="400" xml:space="preserve">mouth, a bed, close</tspan></tspan><tspan x="384" y="67.0"><tspan font-weight="400" xml:space="preserve">observation, a</tspan></tspan><tspan x="384" y="100.4"><tspan font-weight="400" xml:space="preserve">rebleed plan</tspan></tspan></text></g><rect x="290" y="1014.1999999999998" width="140" height="42" rx="21" fill="#e0a521" stroke="#241c15" stroke-width="3"/><text font-size="26" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="360.0" y="1044.2">Review</tspan></text>
</svg>
