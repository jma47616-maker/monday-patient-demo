<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 392" width="360" height="392">
  <title>The triad</title>
  <!-- Card 10. A triangle with one corner per feature: pain out of proportion (10/10 with a soft abdomen), the gut emptying (two vomits and a loose stool in the first hour), a source of clot (AF with no anticoagulant). -->
  
  <rect width="360" height="392" rx="16" fill="#f3e5c8"/>
  <path d="M180 70 L50 300 L310 300 Z" fill="#f6e3cf" stroke="#241c15" stroke-width="4" stroke-linejoin="round"/><circle cx="180" cy="70" r="16" fill="#c2643c" stroke="#241c15" stroke-width="3"/><circle cx="50" cy="300" r="16" fill="#c2643c" stroke="#241c15" stroke-width="3"/><circle cx="310" cy="300" r="16" fill="#c2643c" stroke="#241c15" stroke-width="3"/><text x="180" y="30" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#241c15" text-anchor="middle">Pain out of proportion</text><text x="180" y="50" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#c2643c" text-anchor="middle">10/10, soft abdomen</text><text x="180" y="214.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2f6b70" text-anchor="middle">Any AF with</text><text x="180" y="231.07999999999998" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2f6b70" text-anchor="middle">sudden abdominal</text><text x="180" y="248.16" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2f6b70" text-anchor="middle">pain: suspect it</text><text x="16" y="340.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#241c15" text-anchor="start">The gut empties</text><text x="16" y="360.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#c2643c" text-anchor="start">2 vomits and a loose</text><text x="16" y="376.47" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#c2643c" text-anchor="start">stool in the first hour</text><text x="344" y="340.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#241c15" text-anchor="end">A source of clot</text><text x="344" y="360.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#c2643c" text-anchor="end">AF, no</text><text x="344" y="376.47" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#c2643c" text-anchor="end">anticoagulant</text>
</svg>
