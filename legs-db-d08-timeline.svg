<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="600" height="520">
  <title>From the shared meal to his feet</title>
  <!-- A timeline read from the top: the meal, the family's illness, a gap, his feet, and an ambulance at the foot with no lettering. A bracket down the right side, open at the top, stands for the six-week window. Labels: rows 8.12 to 8.17. -->
  <rect width="600" height="520" fill="#faf0da"/>
  <path d="M62 50 V250" stroke="#241c15" stroke-width="6" stroke-linecap="round"/>
  <path d="M62 250 V350" stroke="#241c15" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 14"/>
  <path d="M62 350 V466" stroke="#241c15" stroke-width="6" stroke-linecap="round"/>
  <circle cx="62" cy="58" r="15" fill="#fdf8ee" stroke="#241c15" stroke-width="4.5"/><circle cx="62" cy="58" r="6.5" fill="#c8531b"/><circle cx="62" cy="150" r="15" fill="#fdf8ee" stroke="#241c15" stroke-width="4.5"/><circle cx="62" cy="150" r="6.5" fill="#c8531b"/><circle cx="62" cy="366" r="15" fill="#fdf8ee" stroke="#241c15" stroke-width="4.5"/><circle cx="62" cy="366" r="6.5" fill="#c8531b"/><circle cx="62" cy="466" r="15" fill="#fdf8ee" stroke="#241c15" stroke-width="4.5"/><circle cx="62" cy="466" r="6.5" fill="#241c15"/>
  <text x="96" y="66" text-anchor="start" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#241c15">Tuesday: a shared paella</text>
  <g transform="translate(420 58)"><ellipse cx="0" cy="0" rx="50" ry="18" fill="#e0a521" stroke="#241c15" stroke-width="4.5"/><ellipse cx="0" cy="-2" rx="38" ry="11" fill="#f1cf6d"/><circle cx="-16" cy="-4" r="4" fill="#c8531b"/><circle cx="6" cy="0" r="4" fill="#c8531b"/><circle cx="20" cy="-6" r="3.5" fill="#3f7d52"/><circle cx="-4" cy="-8" r="3" fill="#3f7d52"/><path d="M-50 0 h-18 M50 0 h18" stroke="#241c15" stroke-width="6" stroke-linecap="round"/></g>
  <text x="96" y="158" text-anchor="start" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#241c15">Wednesday to Friday: four of seven ill</text>
  <g transform="translate(118 196)"><circle cx="0" cy="-22" r="10" fill="#c8531b" stroke="#241c15" stroke-width="3.5"/><path d="M-13 12 C-13 -8 13 -8 13 12 Z" fill="#c8531b" stroke="#241c15" stroke-width="3.5" stroke-linejoin="round"/></g><g transform="translate(158 196)"><circle cx="0" cy="-22" r="10" fill="#c8531b" stroke="#241c15" stroke-width="3.5"/><path d="M-13 12 C-13 -8 13 -8 13 12 Z" fill="#c8531b" stroke="#241c15" stroke-width="3.5" stroke-linejoin="round"/></g><g transform="translate(198 196)"><circle cx="0" cy="-22" r="10" fill="#c8531b" stroke="#241c15" stroke-width="3.5"/><path d="M-13 12 C-13 -8 13 -8 13 12 Z" fill="#c8531b" stroke="#241c15" stroke-width="3.5" stroke-linejoin="round"/></g><g transform="translate(238 196)"><circle cx="0" cy="-22" r="10" fill="#c8531b" stroke="#241c15" stroke-width="3.5"/><path d="M-13 12 C-13 -8 13 -8 13 12 Z" fill="#c8531b" stroke="#241c15" stroke-width="3.5" stroke-linejoin="round"/></g><g transform="translate(278 196)"><circle cx="0" cy="-22" r="10" fill="#fdf8ee" stroke="#241c15" stroke-width="3.5"/><path d="M-13 12 C-13 -8 13 -8 13 12 Z" fill="#fdf8ee" stroke="#241c15" stroke-width="3.5" stroke-linejoin="round"/></g><g transform="translate(318 196)"><circle cx="0" cy="-22" r="10" fill="#fdf8ee" stroke="#241c15" stroke-width="3.5"/><path d="M-13 12 C-13 -8 13 -8 13 12 Z" fill="#fdf8ee" stroke="#241c15" stroke-width="3.5" stroke-linejoin="round"/></g><g transform="translate(358 196)"><circle cx="0" cy="-22" r="10" fill="#fdf8ee" stroke="#241c15" stroke-width="3.5"/><path d="M-13 12 C-13 -8 13 -8 13 12 Z" fill="#fdf8ee" stroke="#241c15" stroke-width="3.5" stroke-linejoin="round"/></g>
  <rect x="96" y="226" width="420" height="40" rx="10" fill="#fbe4d3" stroke="#a53f12" stroke-width="3" stroke-dasharray="7 6"/>
  <text x="110" y="254" text-anchor="start" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#a53f12">Campylobacter suspected, never proved</text>
  <text x="96" y="310" text-anchor="start" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#7a6a52">Nine days</text>
  <text x="96" y="374" text-anchor="start" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#241c15">Friday: pins and needles, both feet</text>
  <g transform="translate(452 440) scale(1 1)"><path d="M-12 26 C-18 6 -16 -14 -8 -22 C2 -30 16 -22 14 -6 C12 8 10 18 6 26 C2 32 -8 32 -12 26 Z" fill="#e9c9ad" stroke="#241c15" stroke-width="4" stroke-linejoin="round"/><path d="M-22 -30 l-8 -8 M-2 -38 v-11 M18 -30 l8 -8" stroke="#c8531b" stroke-width="4" stroke-linecap="round"/></g><g transform="translate(498 440) scale(-1 1)"><path d="M-12 26 C-18 6 -16 -14 -8 -22 C2 -30 16 -22 14 -6 C12 8 10 18 6 26 C2 32 -8 32 -12 26 Z" fill="#e9c9ad" stroke="#241c15" stroke-width="4" stroke-linejoin="round"/><path d="M-22 -30 l-8 -8 M-2 -38 v-11 M18 -30 l8 -8" stroke="#c8531b" stroke-width="4" stroke-linecap="round"/></g>
  <g transform="translate(108 462)"><rect x="0" y="-30" width="96" height="46" rx="6" fill="#fdf8ee" stroke="#241c15" stroke-width="4.5"/><path d="M96 -12 h22 l14 14 v14 h-36 Z" fill="#fdf8ee" stroke="#241c15" stroke-width="4.5" stroke-linejoin="round"/><path d="M0 -4 H96" stroke="#e0a521" stroke-width="7"/><path d="M40 -24 v16 M32 -16 h16" stroke="#c8531b" stroke-width="5"/><rect x="36" y="-40" width="14" height="10" rx="3" fill="#8fbbd0" stroke="#241c15" stroke-width="3"/><circle cx="24" cy="18" r="10" fill="#55504a" stroke="#241c15" stroke-width="4"/><circle cx="106" cy="18" r="10" fill="#55504a" stroke="#241c15" stroke-width="4"/></g>
  <path d="M546 16 V36" stroke="#241c15" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 8"/>
  <path d="M532 36 H546 V366 H532" fill="none" stroke="#241c15" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <g transform="translate(578 200) rotate(-90)"><text x="0" y="0" text-anchor="middle" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#241c15">Six weeks: the window that counts</text></g>
</svg>
