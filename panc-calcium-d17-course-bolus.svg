<svg xmlns="http://www.w3.org/2000/svg" id="panc-calcium-d17-course-bolus" viewBox="0 0 720 918" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Calcium after a bolus alone</title><desc>A chart, in the case, of adjusted calcium against minutes after the bolus, with a dashed line where symptoms usually appear, about 1.9. Bolus alone: 1.62, then 1.92 at 10 minutes, 1.80 at 45, 1.66 at 90 and 1.63 at three hours. Bolus, then infusion: 1.92, 1.88, 1.84, 1.82. After a bolus the level begins to fall within about 30 minutes. Without magnesium any rise in calcium may be short-lived. Giving magnesium does not lift PTH or calcium at once; once it is replaced, calcium may right itself after about two days.</desc>
<rect width="720" height="918" fill="#fdf8ee"/>
<rect x="48.9" y="28.2" width="202.1" height="47.6" rx="23.8" fill="#e0a521" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="150.0" y="61.8">In the case</tspan></text><rect x="110" y="120" width="570" height="350" fill="#faf0da"/><path d="M110 400.0 H680" stroke="#e8dcc2" stroke-width="2"/><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="end" ><tspan x="98.0" y="410.0">1.6</tspan></text><path d="M110 330.0 H680" stroke="#e8dcc2" stroke-width="2"/><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="end" ><tspan x="98.0" y="340.0">1.7</tspan></text><path d="M110 260.0 H680" stroke="#e8dcc2" stroke-width="2"/><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="end" ><tspan x="98.0" y="270.0">1.8</tspan></text><path d="M110 190.0 H680" stroke="#e8dcc2" stroke-width="2"/><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="end" ><tspan x="98.0" y="200.0">1.9</tspan></text><path d="M110 120.0 H680" stroke="#e8dcc2" stroke-width="2"/><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="end" ><tspan x="98.0" y="130.0">2.0</tspan></text><path d="M110 190.0 H680" stroke="#241c15" stroke-width="3" stroke-dasharray="9 8"/><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="205.0" y="176.0">symptoms usually below about 1.9</tspan></text><g id="panc-calcium-d17b-bolus"><path d="M110.0 386.0 L141.7 176.0 L252.5 260.0 L395.0 358.0 L680.0 379.0" fill="none" stroke="#241c15" stroke-width="10" stroke-linejoin="round"/><path d="M110.0 386.0 L141.7 176.0 L252.5 260.0 L395.0 358.0 L680.0 379.0" fill="none" stroke="#c8531b" stroke-width="5" stroke-linejoin="round"/><circle cx="110.0" cy="386.0" r="8" fill="#c8531b" stroke="#241c15" stroke-width="2.5"/><circle cx="141.7" cy="176.0" r="8" fill="#c8531b" stroke="#241c15" stroke-width="2.5"/><circle cx="252.5" cy="260.0" r="8" fill="#c8531b" stroke="#241c15" stroke-width="2.5"/><circle cx="395.0" cy="358.0" r="8" fill="#c8531b" stroke="#241c15" stroke-width="2.5"/><circle cx="680.0" cy="379.0" r="8" fill="#c8531b" stroke="#241c15" stroke-width="2.5"/></g><g id="panc-calcium-d17b-infusion" opacity=".12"><path d="M110.0 386.0 L141.7 176.0 L252.5 204.0 L395.0 232.0 L680.0 246.0" fill="none" stroke="#241c15" stroke-width="10" stroke-linejoin="round"/><path d="M110.0 386.0 L141.7 176.0 L252.5 204.0 L395.0 232.0 L680.0 246.0" fill="none" stroke="#3f6fa8" stroke-width="5" stroke-linejoin="round"/><circle cx="110.0" cy="386.0" r="8" fill="#3f6fa8" stroke="#241c15" stroke-width="2.5"/><circle cx="141.7" cy="176.0" r="8" fill="#3f6fa8" stroke="#241c15" stroke-width="2.5"/><circle cx="252.5" cy="204.0" r="8" fill="#3f6fa8" stroke="#241c15" stroke-width="2.5"/><circle cx="395.0" cy="232.0" r="8" fill="#3f6fa8" stroke="#241c15" stroke-width="2.5"/><circle cx="680.0" cy="246.0" r="8" fill="#3f6fa8" stroke="#241c15" stroke-width="2.5"/></g><text font-size="28" font-weight="800" fill="#a53f12" text-anchor="end" ><tspan x="676.0" y="421.0">bolus alone: 1.63</tspan></text><path d="M110 120 V470 H680" fill="none" stroke="#241c15" stroke-width="4" stroke-linejoin="round"/><path d="M110.0 470 v12" stroke="#241c15" stroke-width="4"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="110.0" y="512.0">0</tspan></text><path d="M252.5 470 v12" stroke="#241c15" stroke-width="4"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="252.5" y="512.0">45</tspan></text><path d="M395.0 470 v12" stroke="#241c15" stroke-width="4"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="395.0" y="512.0">90</tspan></text><path d="M680.0 470 v12" stroke="#241c15" stroke-width="4"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="680.0" y="512.0">180</tspan></text><text font-size="28" font-weight="700" fill="#463a2c" text-anchor="middle" ><tspan x="395.0" y="552.0">Minutes after the bolus</tspan></text><text font-size="28" font-weight="700" fill="#463a2c" text-anchor="middle" transform="rotate(-90 40 295.0)"><tspan x="40.0" y="295.0">Adjusted calcium</tspan></text><rect x="30" y="592" width="672" height="305.4" rx="14" fill="#241c15"/><rect x="24" y="586" width="672" height="305.4" rx="14" fill="#fdf8ee" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="400" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="632.0">After a bolus the level begins to fall within</tspan><tspan x="48.0" y="664.2">about 30 minutes.</tspan></text><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="706.4">Without magnesium any rise in calcium</tspan><tspan x="48.0" y="738.6">may be short-lived.</tspan></text><text font-size="28" font-weight="400" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="780.8">Giving magnesium does not lift PTH or calcium</tspan><tspan x="48.0" y="813.0">at once; once it is replaced, calcium may right</tspan><tspan x="48.0" y="845.2">itself after about two days.</tspan></text>
