0">next day</tspan></text><text font-size="28" font-weight="700" fill="#463a2c" text-anchor="middle" transform="rotate(-90 40 240.0)"><tspan x="40.0" y="240.0">Magnesium</tspan></text><rect x="30" y="502" width="672" height="347.6" rx="14" fill="#241c15"/><rect x="24" y="496" width="672" height="347.6" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="542.0">Magnesium sulfate 24 mmol (6 g) over 24</tspan><tspan x="48.0" y="574.2">hours, in 500 mL of 0.9% sodium chloride</tspan><tspan x="48.0" y="606.4">or 5% glucose.</tspan></text><text font-size="28" font-weight="400" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="648.6">Each gram raises the blood level by only about</tspan><tspan x="48.0" y="680.8">0.04 mmol/L a day later.</tspan></text><text font-size="28" font-weight="400" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="723.0">So 6 g from 0.44 reaches about 0.68 by the</tspan><tspan x="48.0" y="755.2">next day: one bag will not finish the job.</tspan></text><text font-size="28" font-weight="700" fill="#7a6a52" text-anchor="start" ><tspan x="48.0" y="797.4">Our reasoning</tspan></text><rect x="30" y="875.6" width="672" height="156.60000000000002" rx="14" fill="#241c15"/><rect x="24" y="869.6" width="672" height="156.60000000000002" rx="14" fill="#fdf8ee" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="400" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="915.6">One review advises correcting magnesium</tspan><tspan x="48.0" y="947.8">before calcium. Never in the same line as the</tspan><tspan x="48.0" y="980.0">calcium.</tspan></text><rect x="28" y="1056.2" width="672" height="124.40000000000009" rx="14" fill="#241c15"/><rect x="24" y="1052.2" width="672" height="124.40000000000009" rx="14" fill="#fbeec6" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="1098.2">Check your local policy: the magnesium</tspan><tspan x="48.0" y="1130.4">guideline.</tspan></text>
