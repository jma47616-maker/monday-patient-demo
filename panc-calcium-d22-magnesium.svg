<svg xmlns="http://www.w3.org/2000/svg" id="panc-calcium-d22-magnesium" viewBox="0 0 720 1203" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Magnesium climbing slowly over a day of replacement</title><desc>A chart of magnesium with bands: normal 0.70 to 1.00; symptoms more likely below 0.5; severe below 0.4. A dashed line climbs from Dean’s 0.44 at the start to about 0.68 the next day, still below normal. Magnesium sulfate 24 mmol (6 g) over 24 hours, in 500 mL of 0.9% sodium chloride or 5% glucose. Each gram raises the blood level by only about 0.04 mmol/L a day later. So 6 g from 0.44 reaches about 0.68 by the next day: one bag will not finish the job (our reasoning). One review advises correcting magnesium before calcium. Never in the same line as the calcium. Check your local policy: the magnesium guideline.</desc>
<rect width="720" height="1203" fill="#fdf8ee"/>
