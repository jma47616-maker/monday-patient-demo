<svg xmlns="http://www.w3.org/2000/svg" id="thd10" viewBox="0 0 720 936" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Sepsis and thyroid storm as two overlapping circles</title><desc>Shared by both: fever, fast heart, confusion, raised white count, raised lactate. Thyroid storm only: goitre, eye signs, weight loss with a big appetite. Nothing sits in sepsis alone. He had both.</desc>
<rect width="720" height="936" fill="#fdf8ee"/>
<circle id="thd10-sepsis" cx="360" cy="290" r="262" fill="#f3e5c8" stroke="#241c15" stroke-width="5"/><circle id="thd10-storm" cx="360" cy="574" r="262" fill="#fbe4d3" stroke="#241c15" stroke-width="5"/><clipPath id="thd10-clip"><circle cx="360" cy="290" r="262"/></clipPath><circle id="thd10-both" cx="360" cy="574" r="262" fill="#fbeec6" clip-path="url(#thd10-clip)"/><circle cx="360" cy="290" r="262" fill="none" stroke="#241c15" stroke-width="5"/><circle cx="360" cy="574" r="262" fill="none" stroke="#241c15" stroke-width="5"/><text font-size="38" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="360.0" y="170.0">Sepsis</tspan></text><text font-size="29" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="360.0" y="362.0">Fever</tspan></text><text font-size="29" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="360.0" y="404.0">Fast heart</tspan></text><text font-size="29" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="360.0" y="446.0">Raised white count</tspan></text><text font-size="29" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="360.0" y="488.0">Raised lactate</tspan></text><text font-size="29" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="360.0" y="530.0">Confusion</tspan></text><text font-size="38" font-weight="800" fill="#a53f12" text-anchor="middle" ><tspan x="360.0" y="590.0">Thyroid storm</tspan></text><text font-size="29" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="360.0" y="644.0">Goitre</tspan></text><text font-size="29" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="360.0" y="684.0">Eye signs</tspan></text><text font-size="29" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="360.0" y="724.0">Weight loss with</tspan></text><text font-size="29" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="360.0" y="764.0">a big appetite</tspan></text><rect x="246.6" y="862.5" width="226.8" height="51.0" rx="25.5" fill="#e0a521" stroke="#241c15" stroke-width="3"/><text font-size="30" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="360.0" y="898.5">He had both</tspan></text>
</svg>
