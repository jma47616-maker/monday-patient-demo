ddle" ><tspan x="59.0" y="654.0">S</tspan></text><text font-size="28" font-weight="700" fill="#241c15" text-anchor="start" ><tspan x="100.0" y="652.0">Sugar over 10</tspan></text><rect x="520" y="624" width="80" height="36" rx="6" fill="#fdf8ee" stroke="#d9c9a6" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="632" y="624" width="40" height="36" rx="6" fill="#fdf8ee" stroke="#d9c9a6" stroke-width="2.5" stroke-dasharray="6 5"/></g><rect x="30" y="696" width="672" height="150" rx="14" fill="#241c15"/><rect x="24" y="690" width="672" height="150" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="734.0">Total:</tspan></text><text font-size="28" font-weight="700" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="774.0">3 or more predicts a severe attack.</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="48.0" y="808.0">It can only be completed at 48 hours.</tspan></text>
</svg>
