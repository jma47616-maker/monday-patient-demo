<svg xmlns="http://www.w3.org/2000/svg" id="panc-db-d14-pancreas-score-blank" viewBox="0 0 720 866" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>The Glasgow score as a blank scorecard</title><desc>The Glasgow score (PANCREAS), one point each, with empty boxes for Dean. P, PaO2 below 7.9 kPa. A, age over 55. N, white count over 15. C, calcium below 2.0. R, urea over 16. E, LDH over 600. A, albumin below 32. S, sugar over 10. 3 or more predicts a severe attack. It can only be completed at 48 hours.</desc>
<rect width="720" height="866" fill="#fdf8ee"/>
