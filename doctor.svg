<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="You — the doctor">
  <rect width="200" height="200" fill="#f6e6db"/>
  <!-- scrubs -->
  <path d="M28 200 C34 156 62 138 100 138 C138 138 166 156 172 200 Z" fill="#4e7d84" stroke="#2b241d" stroke-width="4"/>
  <path d="M84 146 L100 168 L116 146" fill="none" stroke="#2b241d" stroke-width="3.5"/>
  <!-- stethoscope -->
  <path d="M66 158 C70 182 84 192 100 192 C116 192 130 182 134 158" fill="none" stroke="#2b241d" stroke-width="4.5"/>
  <circle cx="100" cy="192" r="7" fill="#b8552e" stroke="#2b241d" stroke-width="3"/>
  <!-- neck -->
  <path d="M87 116 h26 v26 c0 8 -26 8 -26 0 Z" fill="#eccfae" stroke="#2b241d" stroke-width="3.5"/>
  <!-- head -->
  <ellipse cx="100" cy="82" rx="43" ry="47" fill="#f2d8b8" stroke="#2b241d" stroke-width="4"/>
  <!-- dark hair, manhwa fringe -->
  <path d="M58 84 C54 46 74 28 100 28 C126 28 146 46 142 84 C138 66 132 58 126 54 C128 62 126 68 122 72 C118 58 112 50 100 48 C88 50 78 60 76 74 C70 68 68 60 72 52 C64 58 60 68 58 84 Z" fill="#3a3230" stroke="#2b241d" stroke-width="3.5"/>
  <!-- steady eyes -->
  <path d="M70 80 h20" stroke="#2b241d" stroke-width="4" stroke-linecap="round"/>
  <path d="M110 80 h20" stroke="#2b241d" stroke-width="4" stroke-linecap="round"/>
  <circle cx="80" cy="86" r="4" fill="#2b241d"/>
  <circle cx="120" cy="86" r="4" fill="#2b241d"/>
  <!-- calm mouth -->
  <path d="M90 114 q10 6 20 0" fill="none" stroke="#2b241d" stroke-width="3.5" stroke-linecap="round"/>
  <!-- ID badge -->
  <rect x="126" y="158" width="26" height="18" rx="3" fill="#faf6f0" stroke="#2b241d" stroke-width="3"/>
  <line x1="130" y1="164" x2="148" y2="164" stroke="#b8552e" stroke-width="3"/>
  <line x1="130" y1="170" x2="144" y2="170" stroke="#7a6f60" stroke-width="2"/>
</svg>
