<svg xmlns="http://www.w3.org/2000/svg" id="panc-db-d17-feeding" viewBox="0 0 720 954" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>A feeding ladder: mouth, then tube, then vein</title><desc>A ladder with three rungs, top to bottom, arrows going down. By mouth: as soon as he can eat; no nil by mouth without a clear reason, such as vomiting. By tube into the gut (enteral): within 72 hours in a moderately severe or severe attack. Into a vein (parenteral): only if gut feeding fails or cannot be used. Start at the top; step down only if needed. Against feeding into a vein, gut feeding lowered infection, organ failure, surgery and death. Rest the bowel is out of date.</desc>
<rect width="720" height="954" fill="#fdf8ee"/>
<path d="M62 14 V661.92 M190 14 V661.92 M62 40 H190 M62 92 H190 M62 144 H190 M62 196 H190 M62 248 H190 M62 300 H190 M62 352 H190 M62 404 H190 M62 456 H190 M62 508 H190 M62 560 H190 M62 612 H190" stroke="#241c15" stroke-width="12" stroke-linecap="round"/><path d="M62 14 V661.92 M190 14 V661.92 M62 40 H190 M62 92 H190 M62 144 H190 M62 196 H190 M62 248 H190 M62 300 H190 M62 352 H190 M62 404 H190 M62 456 H190 M62 508 H190 M62 560 H190 M62 612 H190" stroke="#c9a46e" stroke-width="5" stroke-linecap="round"/><g id="panc-db-d17-mouth"><rect x="206" y="30" width="496" height="198.68" rx="14" fill="#241c15"/><rect x="200" y="24" width="496" height="198.68" rx="14" fill="#fbe4d3" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="250.0" y="68.0">By mouth</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="250.0" y="106.2">As soon as he can eat. No nil</tspan><tspan x="250.0" y="140.4">by mouth without a clear</tspan><tspan x="250.0" y="174.5">reason, such as vomiting.</tspan></text><g transform="translate(130.0 123.3)" ><circle r="54" fill="#fdf8ee" stroke="#241c15" stroke-width="4"/><g transform="translate(0.0 0.0) scale(0.8)" ><ellipse cx="0" cy="8" rx="38" ry="16" fill="#fdf8ee" stroke="#241c15" stroke-width="4"/><ellipse cx="0" cy="5" rx="22" ry="8" fill="#fbeec6" stroke="#241c15" stroke-width="2.5"/><path d="M-50 -24 V20 M-56 -24 V-8 Q-50 0 -44 -8 V-24" fill="none" stroke="#241c15" stroke-width="3.5" stroke-linecap="round"/><path d="M50 -24 Q60 -6 50 4 V20" fill="none" stroke="#241c15" stroke-width="3.5" stroke-linecap="round"/></g></g></g><g id="panc-db-d17-tube"><rect x="206" y="262.68" width="496" height="196.71999999999997" rx="14" fill="#241c15"/><rect x="200" y="256.68" width="496" height="196.71999999999997" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="250.0" y="300.7">By tube into the gut</tspan><tspan x="250.0" y="332.9">(enteral)</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="250.0" y="371.1">Within 72 hours in a moderately</tspan><tspan x="250.0" y="405.2">severe or severe attack.</tspan></text><g transform="translate(130.0 355.0)" ><circle r="54" fill="#fdf8ee" stroke="#241c15" stroke-width="4"/><g transform="translate(0.0 0.0) scale(0.8)" ><path d="M-10 -26 C-30 -26 -36 0 -24 10 C-14 18 -4 10 -8 0" fill="none" stroke="#241c15" stroke-width="10" stroke-linecap="round"/><path d="M-10 -26 C-30 -26 -36 0 -24 10 C-14 18 -4 10 -8 0" fill="none" stroke="#e9f1ee" stroke-width="5" stroke-linecap="round"/><rect x="4" y="-36" width="34" height="46" rx="6" fill="#fbeec6" stroke="#241c15" stroke-width="3.5"/><path d="M21 10 V24 C21 34 -6 36 -10 -26" fill="none" stroke="#241c15" stroke-width="3"/></g></g></g><g id="panc-db-d17-vein"><rect x="206" y="493.4" width="496" height="164.51999999999998" rx="14" fill="#241c15"/><rect x="200" y="487.4" width="496" height="164.51999999999998" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="250.0" y="531.4">Into a vein (parenteral)</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="250.0" y="569.6">Only if gut feeding fails or</tspan><tspan x="250.0" y="603.8">cannot be used.</tspan></text><g transform="translate(130.0 569.7)" ><circle r="54" fill="#fdf8ee" stroke="#241c15" stroke-width="4"/><g transform="translate(0.0 0.0) scale(0.8)" ><rect x="-22" y="-38" width="44" height="54" rx="10" fill="#e9f1ee" stroke="#241c15" stroke-width="4"/><path d="M-19 -12 q10 -6 19 0 t19 0 V8 a8 8 0 0 1 -8 8 H-11 a8 8 0 0 1 -8 -8 Z" fill="#fbeec6"/><rect x="-22" y="-38" width="44" height="54" rx="10" fill="none" stroke="#241c15" stroke-width="4"/><path d="M0 16 V40" stroke="#241c15" stroke-width="4" stroke-linecap="round"/></g></g></g><path d="M130.0 181.3 L130.0 281.0" stroke="#c8531b" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M130.0 297.0 L118.0 281.0 L142.0 281.0 Z" fill="#c8531b" stroke="#c8531b" stroke-width="2" stroke-linejoin="round"/><path d="M130.0 413.0 L130.0 495.7" stroke="#c8531b" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M130.0 511.7 L118.0 495.7 L142.0 495.7 Z" fill="#c8531b" stroke="#c8531b" stroke-width="2" stroke-linejoin="round"/><rect x="34.6" y="674.1" width="650.9" height="47.6" rx="23.8" fill="#e0a521" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="360.0" y="707.7">Start at the top; step down only if needed</tspan></text><rect x="28" y="745.92" width="672" height="181.32" rx="14" fill="#241c15"/><rect x="24" y="741.92" width="672" height="181.32" rx="14" fill="#fdf8ee" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="785.9">Against feeding into a vein, gut feeding</tspan><tspan x="48.0" y="818.1">lowered infection, organ failure, surgery</tspan><tspan x="48.0" y="850.3">and death.</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="48.0" y="892.5">“Rest the bowel” is out of date.</tspan></text>
</svg>
