<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 590" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Three stages, by how far the creatinine has risen</title><desc>A ladder of three steps. Stage 1: 1.5 times. Stage 2: 2 times. Stage 3: 3 times.</desc>
<rect width="720" height="590" fill="#fdf8ee"/>
<rect x="31" y="417" width="224" height="150" fill="#241c15"/><rect x="24" y="410" width="224" height="150" fill="#fbeec6" stroke="#241c15" stroke-width="4"/><text font-size="34" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="136.0" y="466.0">Stage 1:</tspan></text><text font-size="34" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="136.0" y="510.0">1.5 times</tspan></text><rect x="255" y="287" width="224" height="280" fill="#241c15"/><rect x="248" y="280" width="224" height="280" fill="#f6c9a4" stroke="#241c15" stroke-width="4"/><text font-size="34" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="360.0" y="336.0">Stage 2:</tspan></text><text font-size="34" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="360.0" y="380.0">2 times</tspan></text><rect x="479" y="157" width="224" height="410" fill="#241c15"/><rect x="472" y="150" width="224" height="410" fill="#f0a878" stroke="#241c15" stroke-width="4"/><text font-size="34" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="584.0" y="206.0">Stage 3:</tspan></text><text font-size="34" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="584.0" y="250.0">3 times</tspan></text><path d="M10 560 h700" stroke="#241c15" stroke-width="6" stroke-linecap="round"/>
</svg>
