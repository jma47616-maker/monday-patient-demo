<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="This morning: Marcus grey and sweating, gripping the bathroom door frame; Sophie reaching for him.">
  <defs>
    <pattern id="tile" width="46" height="46" patternUnits="userSpaceOnUse">
      <rect width="46" height="46" fill="#dfe6e4"/>
      <path d="M0 0 H46 V46" fill="none" stroke="#c8d2cf" stroke-width="2"/>
    </pattern>
    <pattern id="half" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#2b241d" opacity=".12"/>
    </pattern>
    <radialGradient id="vig" cx=".5" cy=".5" r=".75">
      <stop offset=".6" stop-color="#2b241d" stop-opacity="0"/>
      <stop offset="1" stop-color="#2b241d" stop-opacity=".28"/>
    </radialGradient>
  </defs>

  <!-- landing: hallway wall left, bathroom tile right of the door -->
  <rect width="800" height="240" fill="#e9ddc9"/>
  <rect x="430" width="370" height="240" fill="url(#tile)"/>
  <rect y="240" width="800" height="100" fill="#b9aa96"/>
  <line x1="0" y1="240" x2="800" y2="240" stroke="#2b241d" stroke-width="4"/>
  <rect width="800" height="340" fill="url(#half)"/>

  <!-- door frame he grips -->
  <g stroke="#2b241d" stroke-width="5" fill="#a98d68">
    <rect x="418" y="26" width="26" height="216"/>
    <rect x="620" y="26" width="26" height="216"/>
    <rect x="418" y="14" width="228" height="20"/>
  </g>
  <!-- ajar door -->
  <path d="M446 34 L588 52 L588 240 L446 240 Z" fill="#c3a97f" stroke="#2b241d" stroke-width="4"/>
  <circle cx="572" cy="150" r="6" fill="#2b241d"/>

  <!-- sink glimpsed through the doorway -->
  <g stroke="#2b241d" stroke-width="3.5" fill="#f2f0ea">
    <path d="M596 150 h44 v16 c0 12 -10 20 -22 20 c-12 0 -22 -8 -22 -20 Z"/>
    <rect x="612" y="120" width="12" height="20" rx="4" fill="#d8d4ca"/>
  </g>

  <!-- manga speed lines converging on Marcus -->
  <g stroke="#2b241d" stroke-linecap="round" opacity=".5">
    <line x1="30" y1="20" x2="230" y2="130" stroke-width="5"/>
    <line x1="110" y1="0" x2="260" y2="110" stroke-width="3"/>
    <line x1="780" y1="20" x2="560" y2="120" stroke-width="5"/>
    <line x1="710" y1="0" x2="545" y2="100" stroke-width="3"/>
    <line x1="790" y1="130" x2="610" y2="180" stroke-width="4"/>
    <line x1="10" y1="140" x2="210" y2="190" stroke-width="4"/>
    <animate attributeName="opacity" values=".5;.2;.5" dur="1.2s" repeatCount="indefinite"/>
  </g>

  <!-- Marcus: buckled at the door frame, one hand clamped to it, the other to his chest -->
  <g stroke="#2b241d" stroke-width="4">
    <!-- legs giving way -->
    <path d="M330 300 C336 268 348 250 366 242 L392 250 C376 262 366 280 362 302 Z" fill="#5d6b7a"/>
    <path d="M392 250 C404 266 408 284 406 306 L376 308 C378 288 376 270 366 256 Z" fill="#54616f"/>
    <!-- torso in work tee, hunched forward -->
    <path d="M336 160 C330 128 352 104 384 106 C414 108 432 132 428 166 L414 246 L352 244 Z" fill="#7d8b6f"/>
    <path d="M348 180 l68 10" fill="none" opacity=".4" stroke-width="3"/>
    <!-- right arm clamped to chest -->
    <path d="M420 150 C404 158 390 168 382 180" fill="none" stroke-width="9" stroke-linecap="round"/>
    <path d="M378 176 a10 10 0 1 0 10 12" fill="#dcc0a4" stroke-width="3.5"/>
    <!-- left arm locked onto the door frame -->
    <path d="M352 138 C392 120 416 108 432 92" fill="none" stroke-width="9" stroke-linecap="round"/>
    <path d="M426 84 l16 10 -8 14 -16 -8 Z" fill="#dcc0a4" stroke-width="3.5"/>
    <!-- head hanging, grey -->
    <ellipse cx="366" cy="98" rx="27" ry="29" fill="#dcd0be"/>
    <path d="M344 84 C344 66 354 56 370 54 C360 64 356 74 356 84 Z" fill="#4a4136" stroke-width="3"/>
    <!-- shut eye, open dragging mouth -->
    <path d="M354 100 q6 5 12 1" fill="none" stroke-width="3.5" stroke-linecap="round"/>
    <ellipse cx="368" cy="116" rx="6" ry="4.5" fill="#8c6a5a" stroke-width="3"/>
    <!-- grey cheek tint -->
    <ellipse cx="352" cy="108" rx="8" ry="5" fill="#b9c2c6" opacity=".55" stroke="none"/>
  </g>

  <!-- sweat flying off him -->
  <g fill="#8fb6d9" stroke="#2b241d" stroke-width="2.5">
    <path d="M322 96 c6 8 6 14 0 17 c-6 -3 -6 -9 0 -17 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;-6 12" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="1.3s" repeatCount="indefinite"/>
    </path>
    <path d="M406 84 c5 7 5 12 0 15 c-5 -3 -5 -8 0 -15 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;6 12" dur="1.6s" begin=".4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="1.6s" begin=".4s" repeatCount="indefinite"/>
    </path>
    <path d="M336 70 c4 6 4 10 0 13 c-4 -3 -4 -7 0 -13 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;-4 10" dur="1.9s" begin=".8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="1.9s" begin=".8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Sophie: rushing in from the left, arm out -->
  <g stroke="#2b241d" stroke-width="4">
    <!-- skirt / legs mid-stride -->
    <path d="M132 236 C136 210 150 196 170 196 C190 196 202 212 204 238 L188 306 L168 306 L172 252 L156 252 L148 306 L128 306 Z" fill="#8d7f9c"/>
    <!-- torso in cardigan, leaning toward him -->
    <path d="M138 128 C134 102 152 84 178 88 C202 92 214 112 208 140 L204 204 L146 202 Z" fill="#b8552e"/>
    <!-- reaching arm -->
    <path d="M204 132 C244 122 274 116 300 116" fill="none" stroke-width="9" stroke-linecap="round"/>
    <path d="M298 108 l18 6 -4 14 -18 -4 Z" fill="#e8cdb2" stroke-width="3.5"/>
    <!-- trailing arm -->
    <path d="M148 140 C138 158 134 174 136 190" fill="none" stroke-width="9" stroke-linecap="round"/>
    <!-- head, auburn tied back -->
    <ellipse cx="176" cy="70" rx="26" ry="28" fill="#f0dcc4"/>
    <path d="M152 62 C152 42 162 32 180 30 C196 32 202 42 202 60 C196 46 188 42 178 42 C166 42 156 50 152 62 Z" fill="#8a4b32" stroke-width="3"/>
    <path d="M200 58 C210 62 212 74 206 80 C208 72 204 64 200 62 Z" fill="#8a4b32" stroke-width="3"/>
    <!-- alarmed eye + open mouth calling his name -->
    <circle cx="184" cy="70" r="4" fill="#2b241d" stroke="none"/>
    <path d="M188 84 a6 6 0 1 0 8 4" fill="#8c6a5a" stroke-width="3"/>
  </g>

  <!-- her motion lines -->
  <g stroke="#2b241d" stroke-width="3" stroke-linecap="round" opacity=".45">
    <line x1="96" y1="120" x2="126" y2="118"/>
    <line x1="90" y1="150" x2="122" y2="150"/>
    <line x1="98" y1="180" x2="126" y2="182"/>
  </g>

  <rect width="800" height="340" fill="url(#vig)"/>
</svg>
