<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 488" width="360" height="488">
  <title>Opening the artery</title>
  <!-- Card 18 inset. Two ways to open the artery: through a catheter, considered first line; or open embolectomy when a laparotomy is needed anyway; then a second look within 24 to 48 hours. -->
  
  <rect width="360" height="488" rx="16" fill="#f3e5c8"/>
  <rect x="12" y="12" width="336" height="190" rx="12" fill="#fbf6ec" stroke="#241c15" stroke-width="3"/><text x="26" y="40" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#2f6b70" text-anchor="start">Through a catheter</text><text x="26" y="60" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#241c15" text-anchor="start">considered first line</text><path d="M40 180 Q120 170 170 120 Q200 90 250 92" stroke="#241c15" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M40 180 Q120 170 170 120 Q200 90 250 92" stroke="#d7837a" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M40 180 Q120 170 170 120 Q200 90 238 92" stroke="#2f6b70" stroke-width="3" fill="none" stroke-dasharray="6 4"/><ellipse cx="254" cy="92" rx="10" ry="7" fill="#5a1f1a"/><rect x="12" y="212" width="336" height="160" rx="12" fill="#fbf6ec" stroke="#241c15" stroke-width="3"/><text x="26" y="240" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#c2643c" text-anchor="start">Open surgery</text><text x="26" y="260" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#241c15" text-anchor="start">when a laparotomy is needed anyway</text><path d="M60 330 Q180 280 300 330" stroke="#241c15" stroke-width="4" fill="none"/><path d="M110 312 l10 10 M150 300 l10 10 M190 298 l10 10 M230 304 l10 10" stroke="#241c15" stroke-width="2.5"/><text x="180" y="358" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#241c15" text-anchor="middle">embolectomy at the operation</text><rect x="12" y="382" width="336" height="70" rx="12" fill="#fff3c8" stroke="#241c15" stroke-width="3"/><text x="26" y="410" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#241c15" text-anchor="start">Then a second look</text><text x="26" y="434" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#c2643c" text-anchor="start">within 24–48 hours</text><text x="180" y="474" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#8d8577" text-anchor="middle">No trial compares the two for emboli</text>
</svg>
