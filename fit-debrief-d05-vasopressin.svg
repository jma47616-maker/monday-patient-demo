<svg xmlns="http://www.w3.org/2000/svg" id="fitd05" viewBox="0 0 720 1092" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Vasopressin: three triggers, the pituitary, and the collecting duct</title><desc>Three triggers feed the pituitary: blood too concentrated; volume down; illness: nausea, pain, stress. Pituitary: vasopressin (ADH). A drop travels down to a collecting duct drawn in section, where water leaves the urine and goes back into the body. Collecting duct: water taken back. Water kept. Urine concentrates.</desc>
