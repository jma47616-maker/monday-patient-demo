<svg xmlns="http://www.w3.org/2000/svg" id="panc-db-d15-pathway" viewBox="0 0 720 1184" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>The first hours on one picture: nine steps down the page</title><desc>Nine boxes joined by arrows. 1, ABCDE first. 2, moderate fluid, started early, reassessed. 3, pain relief. 4, an antiemetic that leaves the QT alone. 5, oxygen only if needed. 6, SIRS or organ failure: a monitored bed. 7, feed when he can, early. 8, find and treat the cause. 9, check calcium and magnesium (debrief 2).</desc>
