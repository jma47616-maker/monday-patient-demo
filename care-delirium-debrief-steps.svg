th="6" stroke-linejoin="round" stroke-linecap="round" /><path d="M446 300 V204 M524 300 V204" fill="none" stroke="#241c15" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" /><path d="M446 218 H524 M446 274 H524 M446 218 L524 274" fill="none" stroke="#c8531b" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" /><circle cx="524" cy="246" r="9" fill="#e0a521" stroke="#241c15" stroke-width="3"/><rect x="26" y="46" width="400" height="120" rx="16" fill="#c8531b"/><rect x="20" y="40" width="400" height="120" rx="16" fill="#fdf8ee" stroke="#c8531b" stroke-width="5"/><text font-size="29" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="220.0" y="90.0">Only if distressed</tspan><tspan x="220.0" y="124.8">or in danger</tspan></text><path d="M400 166 Q452 190 472 192" fill="none" stroke="#c8531b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 9"/>
