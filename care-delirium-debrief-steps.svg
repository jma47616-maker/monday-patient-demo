<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 800" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Four steps, with a gate before the last</title><desc>A staircase. 1 Find the cause. 2 Care without a drug. 3 Calm without a drug. A closed gate: only if distressed or in danger. 4 One drug, lowest dose, short.</desc>
