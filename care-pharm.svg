<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <title>The ward pharmacist</title>
  <!-- The ward pharmacist, forties: green lanyard, tablet computer under one arm, glasses, greying beard. -->
  <rect width="120" height="120" fill="#f3e5c8"/>
  <circle cx="60" cy="60" r="56" fill="#faf0da" stroke="#241c15" stroke-width="3"/>
  <!-- shirt -->
  <path d="M22 120 C24 102 40 95 60 95 C80 95 96 102 98 120 Z" fill="#e8e2f0" stroke="#241c15" stroke-width="3"/>
  <path d="M50 96 L60 106 L70 96" fill="#faf0da" stroke="#241c15" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M50 96 L54 108 L60 106 L66 108 L70 96" fill="none" stroke="#241c15" stroke-width="2"/>
  <!-- green lanyard and card -->
  <path d="M48 98 L56 120 M72 98 L64 120" stroke="#3f8f5b" stroke-width="4" stroke-linecap="round"/>
  <!-- tablet computer under his left arm (viewer right) -->
  <g transform="rotate(-8 92 108)">
    <rect x="78" y="94" width="26" height="30" rx="3" fill="#3a3646" stroke="#241c15" stroke-width="3"/>
    <rect x="82" y="98" width="18" height="22" rx="1.5" fill="#b9d4dc"/>
  </g>
  <!-- neck -->
  <path d="M51 82 h18 v14 c0 6 -18 6 -18 0 Z" fill="#d7a57c" stroke="#241c15" stroke-width="3"/>
  <!-- ears -->
  <ellipse cx="35" cy="58" rx="4.5" ry="8" fill="#e0b189" stroke="#241c15" stroke-width="3"/>
  <ellipse cx="85" cy="58" rx="4.5" ry="8" fill="#e0b189" stroke="#241c15" stroke-width="3"/>
  <!-- head: oval -->
  <path d="M36 54 Q36 26 60 26 Q84 26 84 54 Q84 74 75 84 Q68 92 60 92 Q52 92 45 84 Q36 74 36 54 Z" fill="#e0b189" stroke="#241c15" stroke-width="3"/>
  <path d="M68 30 Q82 36 82 54 Q82 72 74 83 Q78 62 68 30 Z" fill="#c08f66" opacity=".5"/>
  <!-- hair: receding, swept back, greying -->
  <path d="M36 48 Q36 22 60 22 Q84 22 84 48 Q80 34 70 30 Q60 34 50 30 Q40 34 36 48 Z" fill="#5b5148" stroke="#241c15" stroke-width="3" stroke-linejoin="round"/>
  <path d="M42 32 Q50 26 58 27 M64 27 Q74 28 80 38" fill="none" stroke="#a8a096" stroke-width="2" stroke-linecap="round"/>
  <!-- short beard, greying -->
  <path d="M40 68 Q42 88 60 92 Q78 88 80 68 Q76 78 68 76 Q60 72 52 76 Q44 78 40 68 Z" fill="#6b6057" stroke="#241c15" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M50 84 l2 3 M60 86 v3 M70 84 l-2 3" stroke="#b5ada3" stroke-width="1.8" stroke-linecap="round"/>
  <!-- brows -->
  <path d="M43 47 q6 -3 12 -1 M65 46 q6 -2 12 1" fill="none" stroke="#241c15" stroke-width="2.8" stroke-linecap="round"/>
  <!-- round glasses -->
  <circle cx="49" cy="56" r="8" fill="#eaf5f6" fill-opacity=".6" stroke="#241c15" stroke-width="2.6"/>
  <circle cx="71" cy="56" r="8" fill="#eaf5f6" fill-opacity=".6" stroke="#241c15" stroke-width="2.6"/>
  <path d="M57 55 q3 -2 6 0 M41 55 L36 53 M79 55 L84 53" fill="none" stroke="#241c15" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="49" cy="56.5" r="2.1" fill="#241c15"/>
  <circle cx="71" cy="56.5" r="2.1" fill="#241c15"/>
  <!-- nose and mouth -->
  <path d="M60 58 q-4 9 1 11" fill="none" stroke="#241c15" stroke-width="2.3" stroke-linecap="round"/>
  <path d="M53 79 q7 3 14 0" fill="none" stroke="#241c15" stroke-width="2.4" stroke-linecap="round"/>
</svg>
