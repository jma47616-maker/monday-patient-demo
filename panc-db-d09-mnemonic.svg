<svg xmlns="http://www.w3.org/2000/svg" id="panc-db-d09-mnemonic" viewBox="0 0 720 1395" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>I GET SMASHED, one tile per letter</title><desc>The memory aid I GET SMASHED, a tile per letter, gallstones and ethanol picked out. I, idiopathic: no cause found. G, gallstones. E, ethanol: alcohol. T, trauma: a blow to the abdomen, or surgery near the gland. S, steroids. M, mumps and malignancy: mumps, Coxsackie B4, Mycoplasma; cancers. A, autoimmune. S, scorpion sting. H, high triglycerides and high calcium: triglycerides only above 11.3 mmol/L. E, ERCP, the camera test of the ducts. D, drugs: thiazides, ACE inhibitors, statins, fenofibrate, azathioprine, tetracyclines, oestrogens, corticosteroids, valproate, DPP-4 inhibitors.</desc>
<rect width="720" height="1395" fill="#fdf8ee"/>
