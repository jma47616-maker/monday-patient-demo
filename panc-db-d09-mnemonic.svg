idth="56" height="54" rx="8" fill="#e0a521" stroke="#241c15" stroke-width="3"/><text font-size="32" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="64.0" y="736.8">M</tspan></text><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="118.0" y="698.5">Mumps and malignancy</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="118.0" y="733.8">infections (mumps, Coxsackie B4,</tspan><tspan x="118.0" y="767.4">Mycoplasma); cancers</tspan></text></g><g id="panc-db-d09-letter-7"><rect x="28" y="805.04" width="672" height="68" rx="12" fill="#241c15"/><rect x="24" y="801.04" width="672" height="68" rx="12" fill="#faf0da" stroke="#241c15" stroke-width="3" /><rect x="36" y="808.0" width="56" height="54" rx="8" fill="#e0a521" stroke="#241c15" stroke-width="3"/><text font-size="32" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="64.0" y="847.0">A</tspan></text><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="118.0" y="837.0">Autoimmune</tspan></text></g><g id="panc-db-d09-letter-8"><rect x="28" y="887.04" width="672" height="68" rx="12" fill="#241c15"/><rect x="24" y="883.04" width="672" height="68" rx="12" fill="#faf0da" stroke="#241c15" stroke-width="3" /><rect x="36" y="890.0" width="56" height="54" rx="8" fill="#e0a521" stroke="#241c15" stroke-width="3"/><text font-size="32" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="64.0" y="929.0">S</tspan></text><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="118.0" y="919.0">Scorpion sting</tspan></text></g><g id="panc-db-d09-letter-9"><rect x="28" y="969.04" width="672" height="90.96000000000001" rx="12" fill="#241c15"/><rect x="24" y="965.04" width="672" height="90.96000000000001" rx="12" fill="#faf0da" stroke="#241c15" stroke-width="3" /><rect x="36" y="983.5" width="56" height="54" rx="8" fill="#e0a521" stroke="#241c15" stroke-widt