<svg xmlns="http://www.w3.org/2000/svg" id="fitd10" viewBox="0 0 720 956" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>The bolus pathway in five boxes</title><desc>Five boxes down the card. 150 mL of 3% saline over 20 minutes. Check the sodium. Second bolus while you wait. Up to three, until the sodium is up 5; an arrow loops back from this box to the one before. Stop. Keep the line open. Treat the cause. Sodium at 6 hours, 12 hours, then daily. Along the side of the first three boxes: the first hour: aim for plus 5.</desc>
