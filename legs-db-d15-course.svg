<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <title>The course over six months, not to scale</title>
  <!-- A curve over time, not to scale: it falls to a trough inside the first four weeks, runs flat, then climbs. A dashed second dip inside two months. A small spirometer repeated along the first stretch. Labels: rows 15.11 to 15.13. -->
  <rect width="600" height="320" fill="#faf0da"/>
  <rect x="19" y="19" width="568" height="246" rx="10" fill="#241c15"/><rect x="14" y="14" width="568" height="246" rx="10" fill="#fdf8ee" stroke="#241c15" stroke-width="4"/>
  <path d="M276 16 V258 M410 16 V258" stroke="#d9d2c4" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/>
  <path d="M44 96 C90 110 120 176 176 196 C230 212 270 204 300 196 C380 176 440 110 560 76" fill="none" stroke="#241c15" stroke-width="7" stroke-linecap="round"/>
  <path d="M318 188 C336 196 348 222 366 220 C384 218 388 176 404 148" fill="none" stroke="#c8531b" stroke-width="5" stroke-linecap="round" stroke-dasharray="4 10"/>
  <text x="372" y="248" text-anchor="middle" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#a53f12">About 1 in 10 dip again</text>
  <text x="40" y="50" text-anchor="start" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#241c15">Keep measuring</text>
  <g transform="translate(70 78)"><rect x="-11" y="-16" width="22" height="34" rx="5" fill="#fdf8ee" stroke="#241c15" stroke-width="3.5"/><rect x="-6" y="-11" width="12" height="9" rx="2" fill="#d5e3cf" stroke="#241c15" stroke-width="2"/><path d="M-11 -8 h-12" stroke="#241c15" stroke-width="8" stroke-linecap="round"/><path d="M-11 -8 h-12" stroke="#fdf8ee" stroke-width="3.5" stroke-linecap="round"/></g><g transform="translate(128 116)"><rect x="-11" y="-16" width="22" height="34" rx="5" fill="#fdf8ee" stroke="#241c15" stroke-width="3.5"/><rect x="-6" y="-11" width="12" height="9" rx="2" fill="#d5e3cf" stroke="#241c15" stroke-width="2"/><path d="M-11 -8 h-12" stroke="#241c15" stroke-width="8" stroke-linecap="round"/><path d="M-11 -8 h-12" stroke="#fdf8ee" stroke-width="3.5" stroke-linecap="round"/></g><g transform="translate(186 162)"><rect x="-11" y="-16" width="22" height="34" rx="5" fill="#fdf8ee" stroke="#241c15" stroke-width="3.5"/><rect x="-6" y="-11" width="12" height="9" rx="2" fill="#d5e3cf" stroke="#241c15" stroke-width="2"/><path d="M-11 -8 h-12" stroke="#241c15" stroke-width="8" stroke-linecap="round"/><path d="M-11 -8 h-12" stroke="#fdf8ee" stroke-width="3.5" stroke-linecap="round"/></g><g transform="translate(244 172)"><rect x="-11" y="-16" width="22" height="34" rx="5" fill="#fdf8ee" stroke="#241c15" stroke-width="3.5"/><rect x="-6" y="-11" width="12" height="9" rx="2" fill="#d5e3cf" stroke="#241c15" stroke-width="2"/><path d="M-11 -8 h-12" stroke="#241c15" stroke-width="8" stroke-linecap="round"/><path d="M-11 -8 h-12" stroke="#fdf8ee" stroke-width="3.5" stroke-linecap="round"/></g>
  <path d="M30 260 H566" stroke="#241c15" stroke-width="4"/>
  <path d="M44 260 v10" stroke="#241c15" stroke-width="3.5" stroke-linecap="round"/><text x="44" y="298" text-anchor="middle" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#241c15">Today</text><path d="M142 260 v10" stroke="#241c15" stroke-width="3.5" stroke-linecap="round"/><text x="142" y="298" text-anchor="middle" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#241c15">First days</text><path d="M276 260 v10" stroke="#241c15" stroke-width="3.5" stroke-linecap="round"/><text x="276" y="298" text-anchor="middle" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#241c15">Four weeks</text><path d="M410 260 v10" stroke="#241c15" stroke-width="3.5" stroke-linecap="round"/><text x="410" y="298" text-anchor="middle" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#241c15">Two months</text><path d="M540 260 v10" stroke="#241c15" stroke-width="3.5" stroke-linecap="round"/><text x="540" y="298" text-anchor="middle" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#241c15">Six months</text>
</svg>
