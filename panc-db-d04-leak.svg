<svg xmlns="http://www.w3.org/2000/svg" id="panc-db-d04-leak" viewBox="0 0 720 900" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>A leaky vessel, the fluid in the tissues, and the blood left behind</title><desc>A blood vessel runs across the top with gaps in its lower wall; blue drops of fluid fall into the swollen tissue below: fluid in the tissues and the belly. Below, two measuring cylinders. Blood before: full. An arrow, 2 to 4 litres in 48 hours. Blood after: the level has fallen below a dashed line where it was, and the red cells sit closer together: less, and thicker.</desc>
