<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="Lauren has arrested; the monitor has flatlined and resuscitation was unsuccessful">
  <defs>
    <pattern id="dgrain" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#b8552e" opacity=".06"/>
    </pattern>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20262b"/>
      <stop offset="1" stop-color="#141a1e"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7ee08a" stop-opacity=".5"/>
      <stop offset="1" stop-color="#7ee08a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="560" fill="#faf6f0"/>
  <rect width="900" height="560" fill="url(#dgrain)"/>

  <!-- ================= monitor ================= -->
  <g>
    <rect x="512" y="46" width="330" height="212" rx="16" fill="#2b241d"/>
    <rect x="526" y="60" width="302" height="168" rx="8" fill="url(#screen)"/>
    <path d="M536 150 h34 l10 -30 l12 58 l12 -28 h26" fill="none" stroke="#7ee08a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity=".35">
      <animate attributeName="opacity" values=".45;0;0;.45" keyTimes="0;0.25;0.9;1" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M630 150 H820" fill="none" stroke="#7ee08a" stroke-width="3.5" stroke-linecap="round"/>
    <circle r="6" fill="#a9f2b3">
      <animateMotion path="M630 150 H820" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="16" fill="url(#glow)">
      <animateMotion path="M630 150 H820" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="546" y="200" font-family="ui-monospace, monospace" font-size="30" fill="#c6483a">0</text>
    <text x="546" y="222" font-family="ui-monospace, monospace" font-size="12" fill="#6e8189">HR</text>
    <text x="640" y="200" font-family="ui-monospace, monospace" font-size="30" fill="#c6483a">--/--</text>
    <text x="640" y="222" font-family="ui-monospace, monospace" font-size="12" fill="#6e8189">NIBP</text>
    <circle cx="806" cy="82" r="9" fill="#c6483a">
      <animate attributeName="opacity" values="1;.15;1" dur=".85s" repeatCount="indefinite"/>
    </circle>
    <rect x="668" y="258" width="18" height="86" fill="#2b241d"/>
    <rect x="628" y="344" width="98" height="14" rx="7" fill="#2b241d"/>
  </g>

  <!-- ================= bed ================= -->
  <g stroke="#2b241d" stroke-width="6" stroke-linejoin="round">
    <rect x="70" y="330" width="470" height="34" rx="10" fill="#cfd8dc"/>
    <rect x="88" y="364" width="16" height="96" fill="#9aa4ac"/>
    <rect x="506" y="364" width="16" height="96" fill="#9aa4ac"/>
    <rect x="46" y="236" width="18" height="130" rx="8" fill="#9aa4ac"/>
  </g>
  <path d="M176 330 C186 292 260 280 340 284 C420 288 500 296 522 330 Z" fill="#a9bcc4" stroke="#2b241d" stroke-width="6" stroke-linejoin="round"/>
  <g stroke="#7f939c" stroke-width="3.5" opacity=".8">
    <path d="M240 292 C246 306 246 318 240 330"/>
    <path d="M330 286 C336 302 336 316 330 330"/>
    <path d="M420 292 C426 306 426 318 420 330"/>
  </g>
  <path d="M78 300 C74 268 110 250 148 254 C186 258 200 284 192 312 C184 336 106 338 78 300 Z" fill="#f2ede4" stroke="#2b241d" stroke-width="6" stroke-linejoin="round"/>

  <!-- ================= Lauren, definitively unwell ================= -->
  <g>
    <!-- long hair spread on the pillow -->
    <path d="M96 266 C88 224 112 200 150 200 C188 200 212 224 204 266 C200 288 198 300 194 312 C190 288 188 276 186 264 L114 264 C112 276 110 288 106 312 C102 300 100 288 96 266 Z"
          fill="#5b4238" stroke="#2b241d" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- head -->
    <ellipse cx="150" cy="280" rx="50" ry="48" fill="#ded7cb" stroke="#2b241d" stroke-width="6"/>
    <!-- fringe -->
    <path d="M110 258 C114 226 132 216 150 216 C168 216 188 226 190 258 C178 240 166 236 150 237 C134 238 120 244 110 258 Z"
          fill="#5b4238" stroke="#2b241d" stroke-width="4" stroke-linejoin="round"/>
    <!-- X eyes -->
    <g stroke="#2b241d" stroke-width="7" stroke-linecap="round">
      <path d="M118 268 l20 20 M138 268 l-20 20"/>
      <path d="M164 268 l20 20 M184 268 l-20 20"/>
    </g>
    <!-- open mouth + lolling tongue -->
    <ellipse cx="151" cy="308" rx="14" ry="10" fill="#7d5647" stroke="#2b241d" stroke-width="5"/>
    <path d="M148 313 q10 16 20 4 q-4 -8 -14 -8 Z" fill="#c9737a" stroke="#2b241d" stroke-width="4" stroke-linejoin="round"/>
    <!-- the purpura that told you, still there -->
    <g fill="#9c3247" opacity=".8">
      <circle cx="112" cy="240" r="3"/><circle cx="126" cy="232" r="2.6"/><circle cx="180" cy="238" r="2.8"/>
      <circle cx="192" cy="248" r="2.4"/><circle cx="104" cy="252" r="2.6"/>
    </g>
  </g>

  <!-- the untouched exchange machine, still in its corner -->
  <g stroke="#2b241d" stroke-width="6" stroke-linejoin="round">
    <rect x="238" y="392" width="126" height="118" rx="10" fill="#cfd8dc"/>
    <rect x="252" y="406" width="98" height="42" rx="6" fill="#20262b"/>
    <circle cx="278" cy="476" r="17" fill="none" stroke="#2b241d" stroke-width="6"/>
    <circle cx="330" cy="476" r="17" fill="none" stroke="#2b241d" stroke-width="6"/>
  </g>
  <text x="301" y="432" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#6e8189">STANDBY</text>
  <!-- an unopened bag of plasma hanging beside it -->
  <g stroke="#2b241d" stroke-width="5" stroke-linejoin="round">
    <rect x="386" y="382" width="42" height="66" rx="10" fill="#e8d98f"/>
    <path d="M407 382 v-22" stroke-width="4"/>
  </g>
  <text x="407" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#7a6f60">never hung</text>

  <!-- ============ TTP itself, sorry about the whole thing ============ -->
  <g>
    <!-- the speech bubble -->
    <g>
      <path d="M300 66 h250 a14 14 0 0 1 14 14 v58 a14 14 0 0 1 -14 14 h-150 l-26 26 l2 -26 h-76
               a14 14 0 0 1 -14 -14 v-58 a14 14 0 0 1 14 -14 Z"
            fill="#faf6f0" stroke="#2b241d" stroke-width="5" stroke-linejoin="round"/>
      <text x="424" y="104" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
            font-size="27" font-style="italic" fill="#2b241d">You could have</text>
      <text x="424" y="134" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
            font-size="27" font-style="italic" fill="#2b241d">saved me…</text>
    </g>

    <!-- the character: a schistocyte, with a bite out of it, having a little cry -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0" dur="3.4s" repeatCount="indefinite"/>
      <!-- body: helmet cell -->
      <path d="M262 250 a58 58 0 1 1 -0.6 -0.6 l-40 44 l44 18 Z"
            fill="#d97e66" stroke="#2b241d" stroke-width="6" stroke-linejoin="round"/>
      <!-- central pallor, off to one side -->
      <ellipse cx="238" cy="222" rx="16" ry="13" fill="#f0b7a3" opacity=".8"/>
      <!-- big sorry eyes -->
      <g>
        <ellipse cx="216" cy="216" rx="15" ry="17" fill="#faf6f0" stroke="#2b241d" stroke-width="4.5"/>
        <ellipse cx="258" cy="216" rx="15" ry="17" fill="#faf6f0" stroke="#2b241d" stroke-width="4.5"/>
        <circle cx="216" cy="220" r="7.5" fill="#2b241d"/>
        <circle cx="258" cy="220" r="7.5" fill="#2b241d"/>
        <circle cx="219" cy="215" r="2.6" fill="#faf6f0"/>
        <circle cx="261" cy="215" r="2.6" fill="#faf6f0"/>
      </g>
      <!-- sad brows -->
      <path d="M202 196 q14 -7 26 -1" fill="none" stroke="#2b241d" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M272 196 q-14 -7 -26 -1" fill="none" stroke="#2b241d" stroke-width="4.5" stroke-linecap="round"/>
      <!-- wobbly downturned mouth -->
      <path d="M222 252 q10 -11 20 -1 q10 10 18 -2" fill="none" stroke="#2b241d" stroke-width="5" stroke-linecap="round"/>
      <!-- tears, falling -->
      <g fill="#8fb6d9" stroke="#2b241d" stroke-width="2.6">
        <path d="M206 236 c6 9 6 15 0 18 c-6 -3 -6 -9 0 -18 Z">
          <animateTransform attributeName="transform" type="translate" values="0 0;0 42" dur="1.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;1;0" dur="1.5s" repeatCount="indefinite"/>
        </path>
        <path d="M268 236 c6 9 6 15 0 18 c-6 -3 -6 -9 0 -18 Z">
          <animateTransform attributeName="transform" type="translate" values="0 0;0 42" dur="1.8s" begin=".5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;1;0" dur="1.8s" begin=".5s" repeatCount="indefinite"/>
        </path>
      </g>
      <!-- little arms, wringing -->
      <path d="M182 262 q-22 10 -18 26" fill="none" stroke="#2b241d" stroke-width="5.5" stroke-linecap="round"/>
      <path d="M292 262 q22 10 18 26" fill="none" stroke="#2b241d" stroke-width="5.5" stroke-linecap="round"/>
      <!-- name badge, so there is no doubt who this is -->
      <g transform="rotate(-6 240 296)">
        <rect x="196" y="282" width="88" height="30" rx="6" fill="#faf6f0" stroke="#2b241d" stroke-width="4"/>
        <text x="240" y="304" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#a02c42">TTP</text>
      </g>
    </g>
  </g>

  <!-- crash trolley, arrived -->
  <g stroke="#2b241d" stroke-width="6" stroke-linejoin="round">
    <rect x="596" y="392" width="150" height="112" rx="10" fill="#c6483a"/>
    <path d="M596 428 H746 M596 464 H746" stroke-width="4"/>
    <circle cx="626" cy="518" r="14" fill="#2b241d"/>
    <circle cx="716" cy="518" r="14" fill="#2b241d"/>
  </g>
  <text x="671" y="420" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#faf6f0">CRASH</text>

  <!-- time of the call -->
  <g>
    <rect x="60" y="486" width="230" height="42" rx="8" fill="#2b241d" opacity=".9"/>
    <text x="175" y="514" text-anchor="middle" font-family="ui-monospace, monospace" font-size="19" fill="#faf6f0">crash call · 04:50</text>
  </g>
</svg>
