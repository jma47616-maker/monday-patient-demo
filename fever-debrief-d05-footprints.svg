<circle cx="324" cy="720" r="26" fill="#e0a521" stroke="#241c15" stroke-width="3.5"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="324.0" y="730.1">3</tspan></text>
<text font-size="28" font-weight="700" fill="#241c15" text-anchor="start" ><tspan x="560.0" y="160.0">1 Fever</tspan></text>
<text font-size="28" font-weight="700" fill="#241c15" text-anchor="start" ><tspan x="560.0" y="395.0">2 Spleen</tspan></text><text font-size="28" font-weight="700" fill="#241c15" text-anchor="start" ><tspan x="560.0" y="429.0">and liver</tspan></text>
<text font-size="28" font-weight="700" fill="#241c15" text-anchor="start" ><tspan x="560.0" y="712.0">3 Falling</tspan></text><text font-size="28" font-weight="700" fill="#241c15" text-anchor="start" ><tspan x="560.0" y="746.0">counts</tspan></text>
<text font-size="30" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="360.0" y="930.0">In the blood</tspan></text>
