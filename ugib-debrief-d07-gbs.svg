<title>The Glasgow-Blatchford score: what it counts, the points, and Arthur at 16</title><desc>Nine tiles with their points: urea, haemoglobin for men and for women, systolic blood pressure, pulse, melaena, fainting, liver disease, heart failure. A scale from 0 to 23 marks 0 or 1, 7 or more, and Arthur at 16.</desc>
