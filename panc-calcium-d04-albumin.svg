<svg xmlns="http://www.w3.org/2000/svg" id="panc-calcium-d04-albumin" viewBox="0 0 720 1041" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Two jars: the same free calcium, fewer albumin seats</title><desc>Two jars of blood. Normal albumin: many albumin carriers, each with a calcium on it, and free calcium floating. Low albumin (Dean: 33 g/L): fewer carriers, the same free calcium. Free calcium: the same in both. Total: lower when albumin is low. Adjusted calcium = total + 0.02 times (40 minus albumin in g/L). Dean: 1.48 + 0.02 times (40 minus 33) = 1.62. Each laboratory may use its own version. In the very sick the adjusted figure can mislead; a blood gas prints the free (ionised) calcium directly, and fast.</desc>
<rect width="720" height="1041" fill="#fdf8ee"/>
