e="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="175.0" y="446.0">Normal albumin</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="middle" ><tspan x="175.0" y="482.0"></tspan></text></g><g id="panc-calcium-d04-low"><rect x="400" y="70" width="290" height="330" rx="20" fill="#e9f1ee" stroke="#241c15" stroke-width="5"/><rect x="392" y="54" width="306" height="28" rx="8" fill="#f3e5c8" stroke="#241c15" stroke-width="4"/><ellipse cx="460" cy="330" rx="30" ry="17" fill="#9fb0cc" stroke="#241c15" stroke-width="3"/><circle cx="460.0" cy="314.0" r="9" fill="#5b8fc9" stroke="#241c15" stroke-width="2.5"/><ellipse cx="580" cy="360" rx="30" ry="17" fill="#9fb0cc" stroke="#241c15" stroke-width="3"/><circle cx="580.0" cy="344.0" r="9" fill="#5b8fc9" stroke="#241c15" stroke-width="2.5"/><ellipse cx="520" cy="280" rx="30" ry="17" fill="#9fb0cc" stroke="#241c15" stroke-width="3"/><circle cx="520.0" cy="264.0" r="9" fill="#5b8fc9" stroke="#241c15" stroke-width="2.5"/><circle cx="450.0" cy="120.0" r="10" fill="#5b8fc9" stroke="#241c15" stroke-width="2.5"/><circle cx="540.0" cy="150.0" r="10" fill="#5b8fc9" stroke="#241c15" stroke-width="2.5"/><circle cx="630.0" cy="118.0" r="10" fill="#5b8fc9" stroke="#241c15" stroke-width="2.5"/><circle cx="490.0" cy="210.0" r="10" fill="#5b8fc9" stroke="#241c15" stroke-width="2.5"/><circle cx="600.0" cy="230.0" r="10" fill="#5b8fc9" stroke="#241c15" stroke-width="2.5"/><circle cx="650.0" cy="300.0" r="10" fill="#5b8fc9" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="545.0" y="446.0">Low albumin</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="middle" ><tspan x="545.0" y="482.0">(Dean: 33 g/L)</tspan></text></g><rect x="28" y="520" width="672" height="116" rx="14" fill="#241c15"/><rect x="24" y="516" width="672" height="116" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3" /><circle cx="62" cy="556" r="10" fill="#5b8fc9" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="84.0" y="566.0">Free calcium: the same in both</tspan></text><ellipse cx="62" cy="602" rx="22" ry="12" fill="#9fb0cc" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="98.0" y="612.0">Total: lower when albumin is low</tspan></text><g id="panc-calcium-d04-formula"><rect x="30" y="668" width="672" height="193.83999999999997" rx="14" fill="#241c15"/><rect x="24" y="662" width="672" height="193.83999999999997" rx="14" fill="#fdf8ee" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="708.0">Adjusted calcium = total + 0.02 × (40 −</tspan><tspan x="48.0" y="740.2">albumin in g/L)</tspan></text><text font-size="28" font-weight="700" fill="#a53f12" text-anchor="start" ><tspan x="48.0" y="784.4">Dean: 1.48 + 0.02 × (40 − 33) = 1.62</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="48.0" y="831.1">Each laboratory may use its own version.</tspan></text></g><rect x="28" y="885.8399999999999" width="672" height="132.6" rx="14" fill="#241c15"/><rect x="24" y="881.8399999999999" width="672" height="132.6" rx="14" fill="#fbe4d3" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="400" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="927.8">In the very sick the adjusted figure can</tspan><tspan x="48.0" y="960.0">mislead; a blood gas prints the free (ionised)</tspan><tspan x="48.0" y="992.2">calcium directly, and fast.</tspan></text>
</svg>
