<svg xmlns="http://www.w3.org/2000/svg" id="panc-db-d03-cascade-3" viewBox="0 0 720 964" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>From the gland to the whole body, step 3 of 4</title><desc>The inflamed gland sends out alarm signals. They spread the inflammation to the whole body (SIRS). Vessels in and around the gland turn leaky.</desc>
<rect width="720" height="964" fill="#fdf8ee"/>
<g id="panc-db-d03s3-row-1"><rect x="30" y="26" width="672" height="178" rx="14" fill="#241c15"/><rect x="24" y="20" width="672" height="178" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3" /><g transform="translate(118.0 113.0)" ><path d="M-62 4 C-60 -22 -34 -26 -18 -14 C10 -16 40 -26 62 -22 C76 -18 74 2 58 6 C30 14 0 18 -20 26 C-30 40 -60 34 -62 4 Z" fill="#f2c48d" stroke="#241c15" stroke-width="4" stroke-linejoin="round"/><path d="M-6 -40 l6 -8 l6 8 l-6 8 Z" fill="#c8531b" stroke="#241c15" stroke-width="2.5" stroke-linejoin="round"/><path d="M28 -46 l6 -8 l6 8 l-6 8 Z" fill="#c8531b" stroke="#241c15" stroke-width="2.5" stroke-linejoin="round"/><path d="M56 -40 l6 -8 l6 8 l-6 8 Z" fill="#c8531b" stroke="#241c15" stroke-width="2.5" stroke-linejoin="round"/><path d="M-40 -38 l6 -8 l6 8 l-6 8 Z" fill="#c8531b" stroke="#241c15" stroke-width="2.5" stroke-linejoin="round"/><g transform="translate(-30.0 -8.0)" ><path d="M0 -12 C7 -4 8 2 4 7 C2 3 1 2 0 5 C-1 2 -2 3 -4 7 C-8 2 -7 -4 0 -12 Z" fill="#f0a27c" stroke="#241c15" stroke-width="2"/></g><g transform="translate(10.0 -4.0)" ><path d="M0 -12 C7 -4 8 2 4 7 C2 3 1 2 0 5 C-1 2 -2 3 -4 7 C-8 2 -7 -4 0 -12 Z" fill="#f0a27c" stroke="#241c15" stroke-width="2"/></g><g transform="translate(40.0 -8.0)" ><path d="M0 -12 C7 -4 8 2 4 7 C2 3 1 2 0 5 C-1 2 -2 3 -4 7 C-8 2 -7 -4 0 -12 Z" fill="#f0a27c" stroke="#241c15" stroke-width="2"/></g></g><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="214.0" y="66.0">The inflamed gland sends out</tspan><tspan x="214.0" y="98.2">alarm signals</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="214.0" y="136.4">(cytokines, such as TNF-α and</tspan><tspan x="214.0" y="170.0">interleukin-6)</tspan></text><path d="M360.0 206.0 L360.0 232.0" stroke="#c8531b" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M360.0 250.0 L346.5 232.0 L373.5 232.0 Z" fill="#c8531b" stroke="#c8531b" stroke-width="2" stroke-linejoin="round"/></g><g id="panc-db-d03s3-row-2"><rect x="30" y="262" width="672" height="178" rx="14" fill="#241c15"/><rect x="24" y="256" width="672" height="178" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3" /><g transform="translate(118.0 349.0)" ><circle cx="0" cy="-48" r="17" fill="#f3e5c8" stroke="#241c15" stroke-width="4"/><path d="M-26 -26 H26 L22 30 H-22 Z" fill="#f3e5c8" stroke="#241c15" stroke-width="4" stroke-linejoin="round"/><path d="M-22 30 L-20 60 M22 30 L20 60 M-26 -22 L-38 22 M26 -22 L38 22" stroke="#241c15" stroke-width="8" stroke-linecap="round"/><path d="M-12 -10 Q0 -2 12 -10 Q4 8 0 22 Q-4 8 -12 -10" fill="#f0a27c" opacity=".9"/><path d="M-50 -40 l5 -7 l5 7 l-5 7 Z" fill="#c8531b" stroke="#241c15" stroke-width="2" stroke-linejoin="round"/><path d="M44 -46 l5 -7 l5 7 l-5 7 Z" fill="#c8531b" stroke="#241c15" stroke-width="2" stroke-linejoin="round"/><path d="M-56 18 l5 -7 l5 7 l-5 7 Z" fill="#c8531b" stroke="#241c15" stroke-width="2" stroke-linejoin="round"/><path d="M50 14 l5 -7 l5 7 l-5 7 Z" fill="#c8531b" stroke="#241c15" stroke-width="2" stroke-linejoin="round"/></g><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="214.0" y="302.0">They spread the inflammation</tspan><tspan x="214.0" y="334.2">to the whole body (SIRS)</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="214.0" y="372.4">Fever, a fast pulse, fast breathing,</tspan><tspan x="214.0" y="406.0">a high or low white count</tspan></text><path d="M360.0 442.0 L360.0 468.0" stroke="#c8531b" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M360.0 486.0 L346.5 468.0 L373.5 468.0 Z" fill="#c8531b" stroke="#c8531b" stroke-width="2" stroke-linejoin="round"/></g><g id="panc-db-d03s3-row-3"><rect x="30" y="498" width="672" height="178" rx="14" fill="#241c15"/><rect x="24" y="492" width="672" height="178" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3" /><g transform="translate(118.0 585.0)" ><rect x="-70" y="-22" width="140" height="40" rx="20" fill="#d9534a" stroke="#241c15" stroke-width="4"/><path d="M-62 -2 H62" stroke="#f08b80" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 10"/><rect x="-45" y="14" width="10" height="8" fill="#fdf8ee"/><path d="M-40 28.4 C-36.0 35.6 -32.0 39.6 -32.0 43.6 A8 8 0 1 1 -48.0 43.6 C-48.0 39.6 -44.0 35.6 -40 28.4 Z" fill="#b9c6dc" stroke="#241c15" stroke-width="2.5" stroke-linejoin="round"/><rect x="-5" y="14" width="10" height="8" fill="#fdf8ee"/><path d="M0 28.4 C4.0 35.6 8.0 39.6 8.0 43.6 A8 8 0 1 1 -8.0 43.6 C-8.0 39.6 -4.0 35.6 0 28.4 Z" fill="#b9c6dc" stroke="#241c15" stroke-width="2.5" stroke-linejoin="round"/><rect x="35" y="14" width="10" height="8" fill="#fdf8ee"/><path d="M40 28.4 C44.0 35.6 48.0 39.6 48.0 43.6 A8 8 0 1 1 32.0 43.6 C32.0 39.6 36.0 35.6 40 28.4 Z" fill="#b9c6dc" stroke="#241c15" stroke-width="2.5" stroke-linejoin="round"/></g><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="214.0" y="538.0">Vessels in and around the</tspan><tspan x="214.0" y="570.2">gland turn leaky</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="214.0" y="608.4">Fluid leaves the blood for the</tspan><tspan x="214.0" y="642.0">tissues</tspan></text><path d="M360.0 678.0 L360.0 704.0" stroke="#c8531b" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M360.0 722.0 L346.5 704.0 L373.5 704.0 Z" fill="#c8531b" stroke="#c8531b" stroke-width="2" stroke-linejoin="round"/></g><g id="panc-db-d03s3-row-4" opacity=".13"><rect x="30" y="734" width="672" height="178" rx="14" fill="#241c15"/><rect x="24" y="728" width="672" height="178" rx="14" fill="#fbe4d3" stroke="#241c15" stroke-width="3" /><g transform="translate(78.0 798.0) scale(0.78)" ><path d="M0 -46 V-22 M0 -24 L-12 -10 M0 -24 L12 -10" fill="none" stroke="#241c15" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8,-22 C-30,-26 -44,-2 -44,22 C-44,40 -34,46 -22,40 C-12,36 -8,26 -8,14 Z" fill="#e8a58c" stroke="#241c15" stroke-width="4" stroke-linejoin="round"/><g transform="scale(-1 1)"><path d="M-8,-22 C-30,-26 -44,-2 -44,22 C-44,40 -34,46 -22,40 C-12,36 -8,26 -8,14 Z" fill="#e8a58c" stroke="#241c15" stroke-width="4" stroke-linejoin="round"/></g></g><g transform="translate(134.0 802.0) scale(0.74)" ><path d="M-6 -40 C-36 -40 -40 -10 -40 4 C-40 30 -24 42 -6 40 C8 38 10 26 4 16 C-2 8 -2 -6 4 -14 C12 -24 10 -40 -6 -40 Z" fill="#b5574a" stroke="#241c15" stroke-width="4" stroke-linejoin="round"/><path d="M4 2 C16 2 22 10 30 22" fill="none" stroke="#241c15" stroke-width="5" stroke-linecap="round"/></g><g transform="translate(110.0 866.0) scale(0.62)" ><path d="M0 34 C-30 12 -44 -4 -40 -20 C-36 -36 -14 -40 0 -22 C14 -40 36 -36 40 -20 C44 -4 30 12 0 34 Z" fill="#d9534a" stroke="#241c15" stroke-width="4" stroke-linejoin="round"/><path d="M-24 -4 H-10 L-4 -16 L4 10 L10 -4 H24" fill="none" stroke="#fdf8ee" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/></g><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="214.0" y="774.0">If it goes on, organs fail</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="214.0" y="812.2">The lungs, the kidneys and the</tspan><tspan x="214.0" y="845.8">circulation</tspan></text></g>
</svg>
