<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 620" width="360" height="620">
  <title>The clot's journey</title>
  <!-- Card 4. Three frames: a clot forms in the left atrial appendage of a fibrillating atrium; a piece rides down the aorta; it lodges 3 to 10 cm down the superior mesenteric artery, sparing the first loops, the bowel beyond pale. -->
  
  <rect width="360" height="620" rx="16" fill="#f3e5c8"/>
  <rect x="12" y="14" width="336" height="200" rx="12" fill="#fbf6ec" stroke="#241c15" stroke-width="3"/><text x="28" y="42" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#241c15" text-anchor="start">1  The left atrium quivers</text><path d="M80 74 Q60 124 100 164 Q170 184 210 144 Q232 110 206 78 Q170 56 120 64 Z" fill="#e7a99e" stroke="#241c15" stroke-width="3"/><path d="M206 78 Q240 60 254 84 Q252 110 222 110" fill="#e7a99e" stroke="#241c15" stroke-width="3"/><ellipse cx="236" cy="90" rx="12" ry="9" fill="#5a1f1a" stroke="#241c15" stroke-width="2"/><path d="M110 106 q8 -8 16 0 t16 0 t16 0" stroke="#241c15" stroke-width="2.5" fill="none"><animate attributeName="opacity" values="1;.3;1" dur=".6s" repeatCount="indefinite"/></path><text x="262" y="86.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#241c15" text-anchor="start">Clot forms</text><text x="262" y="103.08" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#241c15" text-anchor="start">in the</text><text x="262" y="120.16" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#241c15" text-anchor="start">appendage</text><text x="28" y="204" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#c2643c" text-anchor="start">Over 9 in 10 AF clots form here</text><rect x="12" y="226" width="336" height="150" rx="12" fill="#fbf6ec" stroke="#241c15" stroke-width="3"/><text x="28" y="254" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#241c15" text-anchor="start">2  A piece rides the aorta</text><path d="M60 286 Q120 266 170 296 L170 366" stroke="#241c15" stroke-width="30" fill="none"/><path d="M60 286 Q120 266 170 296 L170 366" stroke="#d7837a" stroke-width="23" fill="none"/><ellipse cx="170" cy="330" rx="7" ry="10" fill="#5a1f1a" stroke="#241c15" stroke-width="2"><animate attributeName="cy" values="300;358" dur="2.4s" repeatCount="indefinite"/></ellipse><text x="200" y="306.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#241c15" text-anchor="start">Down the</text><text x="200" y="324.3" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#241c15" text-anchor="start">aorta</text><rect x="12" y="388" width="336" height="220" rx="12" fill="#fbf6ec" stroke="#241c15" stroke-width="3"/><text x="28" y="416" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#241c15" text-anchor="start">3  It lodges in the SMA</text><path d="M40 444 V598" stroke="#241c15" stroke-width="28"/><path d="M40 444 V598" stroke="#d7837a" stroke-width="21"/><path d="M48 468 Q120 474 180 508 Q230 538 260 584" stroke="#241c15" stroke-width="14" fill="none" stroke-linecap="round"/><path d="M48 468 Q120 474 180 508 Q230 538 260 584" stroke="#c2643c" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M96 472 Q100 508 82 538" stroke="#c2643c" stroke-width="4" fill="none"/><ellipse cx="160" cy="498" rx="12" ry="7" fill="#5a1f1a" stroke="#241c15" stroke-width="2" transform="rotate(28 160 498)"/><path d="M184 516 Q230 538 258 582" stroke="#d9d2c6" stroke-width="7" fill="none" stroke-linecap="round"/><text x="76" y="560.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#241c15" text-anchor="start">First loops</text><text x="76" y="577.08" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#241c15" text-anchor="start">spared</text><text x="200" y="454.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#c2643c" text-anchor="start">3–10 cm</text><text x="200" y="472.3" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#c2643c" text-anchor="start">down</text><text x="262" y="538.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#8d8577" text-anchor="start">Bowel</text><text x="262" y="555.08" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#8d8577" text-anchor="start">beyond:</text><text x="262" y="572.16" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#8d8577" text-anchor="start">pale</text>
</svg>
