<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 2177" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>The UK acute upper GI bleeding bundle (BSG, 2020), redrawn</title><desc>Six steps in order: Recognition, Resuscitation, Risk Assessment, Rx (Treatment), Refer, Review, with the items of each, and a footer on haemodynamic instability. Redrawn from Siau K, et al. Frontline Gastroenterology 2020, Figure 1, CC BY-NC 4.0.</desc>
<rect width="720" height="2177" fill="#fdf8ee"/>
<rect x="30" y="20" width="660" height="150" rx="16" fill="#241c15" stroke="#241c15" stroke-width="3"/><text font-size="34" font-weight="800" fill="#fdf8ee" text-anchor="middle" ><tspan x="360.0" y="76.0">UK Acute Upper GI</tspan><tspan x="360.0" y="115.1">Bleeding Bundle</tspan></text><text font-size="25" font-weight="500" fill="#f3e5c8" text-anchor="middle" ><tspan x="360.0" y="152.0">(to be performed within 24h)</tspan></text><rect x="36" y="202" width="660" height="204.16000000000003" rx="16" fill="#241c15"/><rect x="30" y="196" width="660" height="204.16000000000003" rx="16" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><path d="M30 258 V212 a16 16 0 0 1 16 -16 H674 a16 16 0 0 1 16 16 V258 Z" fill="#e0a521" stroke="#241c15" stroke-width="3"/><text font-size="31" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="52.0" y="238.0">Recognition</tspan></text><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="52.0" y="298.0">If reported:</tspan></text><rect x="52" y="319.72" width="14" height="14" rx="3" fill="#c8531b" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="500" fill="#241c15" text-anchor="start" ><tspan x="80.0" y="338.7">Haematemesis, melaena or coffee ground</tspan><tspan x="80.0" y="373.4">vomiting</tspan></text><path d="M360.0 412.2 L360.0 448.2" stroke="#241c15" stroke-width="9" stroke-linecap="round" fill="none"/><path d="M360.0 468.2 L345.0 448.2 L375.0 448.2 Z" fill="#241c15" stroke="#241c15" stroke-width="2" stroke-linejoin="round"/><text font-size="23" font-weight="700" fill="#463a2c" text-anchor="start" ><tspan x="392.0" y="426.2">Trigger bundle and</tspan><tspan x="392.0" y="452.6">record if performed</tspan></text><rect x="36" y="486.16" width="660" height="222.16000000000014" rx="16" fill="#241c15"/><rect x="30" y="480.16" width="660" height="222.16000000000014" rx="16" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><path d="M30 542.1600000000001 V496.16 a16 16 0 0 1 16 -16 H674 a16 16 0 0 1 16 16 V542.1600000000001 Z" fill="#e0a521" stroke="#241c15" stroke-width="3"/><text font-size="31" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="52.0" y="522.2">Resuscitation</tspan></text><rect x="52" y="563.1600000000001" width="14" height="14" rx="3" fill="#c8531b" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="500" fill="#241c15" text-anchor="start" ><tspan x="80.0" y="582.2">Perform NEWS as indicated</tspan></text><rect x="52" y="609.8800000000001" width="14" height="14" rx="3" fill="#c8531b" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="500" fill="#241c15" text-anchor="start" ><tspan x="80.0" y="628.9">Commence IV crystalloid</tspan></text><rect x="52" y="656.6000000000001" width="14" height="14" rx="3" fill="#c8531b" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="500" fill="#241c15" text-anchor="start" ><tspan x="80.0" y="675.6">Transfuse if Hb &lt;70g/L, aim for 70-100g/L</tspan></text><path d="M360.0 714.3 L360.0 728.3" stroke="#241c15" stroke-width="9" stroke-linecap="round" fill="none"/><path d="M360.0 748.3 L345.0 728.3 L375.0 728.3 Z" fill="#241c15" stroke="#241c15" stroke-width="2" stroke-linejoin="round"/><rect x="36" y="766.3200000000002" width="660" height="210.16000000000008" rx="16" fill="#241c15"/><rect x="30" y="760.3200000000002" width="660" height="210.16000000000008" rx="16" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><path d="M30 822.3200000000002 V776.3200000000002 a16 16 0 0 1 16 -16 H674 a16 16 0 0 1 16 16 V822.3200000000002 Z" fill="#e0a521" stroke="#241c15" stroke-width="3"/><text font-size="31" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="52.0" y="802.3">Risk Assessment</tspan></text><rect x="52" y="843.3200000000002" width="14" height="14" rx="3" fill="#c8531b" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="500" fill="#241c15" text-anchor="start" ><tspan x="80.0" y="862.3">Calculate Glasgow-Blatchford Score (GBS):</tspan><tspan x="80.0" y="897.0">enter value</tspan></text><circle cx="68" cy="934.7600000000002" r="5" fill="#241c15"/><text font-size="28" font-weight="500" fill="#241c15" text-anchor="start" ><tspan x="84.0" y="943.8">Consider discharge if GBS 0 or 1</tspan></text><path d="M360.0 982.5 L360.0 996.5" stroke="#241c15" stroke-width="9" stroke-linecap="round" fill="none"/><path d="M360.0 1016.5 L345.0 996.5 L375.0 996.5 Z" fill="#241c15" stroke="#241c15" stroke-width="2" stroke-linejoin="round"/><rect x="36" y="1034.4800000000002" width="660" height="291.60000000000014" rx="16" fill="#241c15"/><rect x="30" y="1028.4800000000002" width="660" height="291.60000000000014" rx="16" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><path d="M30 1090.4800000000002 V1044.4800000000002 a16 16 0 0 1 16 -16 H674 a16 16 0 0 1 16 16 V1090.4800000000002 Z" fill="#e0a521" stroke="#241c15" stroke-width="3"/><text font-size="31" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="52.0" y="1070.5">Rx (Treatment)</tspan></text><rect x="52" y="1111.4800000000002" width="14" height="14" rx="3" fill="#c8531b" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="500" fill="#241c15" text-anchor="start" ><tspan x="80.0" y="1130.5">If suspected cirrhosis/variceal bleed, give</tspan><tspan x="80.0" y="1165.2">terlipressin 2mg QDS and antibiotics as per</tspan><tspan x="80.0" y="1199.9">local protocol</tspan></text><rect x="52" y="1227.6400000000003" width="14" height="14" rx="3" fill="#c8531b" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="500" fill="#241c15" text-anchor="start" ><tspan x="80.0" y="1246.6">Continue aspirin</tspan></text><rect x="52" y="1274.3600000000004" width="14" height="14" rx="3" fill="#c8531b" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="500" fill="#241c15" text-anchor="start" ><tspan x="80.0" y="1293.4">Suspend all other antithrombotics</tspan></text><path d="M360.0 1332.1 L360.0 1346.1" stroke="#241c15" stroke-width="9" stroke-linecap="round" fill="none"/><path d="M360.0 1366.1 L345.0 1346.1 L375.0 1346.1 Z" fill="#241c15" stroke="#241c15" stroke-width="2" stroke-linejoin="round"/><rect x="36" y="1384.0800000000004" width="660" height="244.8800000000001" rx="16" fill="#241c15"/><rect x="30" y="1378.0800000000004" width="660" height="244.8800000000001" rx="16" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><path d="M30 1440.0800000000004 V1394.0800000000004 a16 16 0 0 1 16 -16 H674 a16 16 0 0 1 16 16 V1440.0800000000004 Z" fill="#e0a521" stroke="#241c15" stroke-width="3"/><text font-size="31" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="52.0" y="1420.1">Refer</tspan></text><rect x="52" y="1461.0800000000004" width="14" height="14" rx="3" fill="#c8531b" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="500" fill="#241c15" text-anchor="start" ><tspan x="80.0" y="1480.1">Referral to ensure that endoscopy is</tspan><tspan x="80.0" y="1514.8">performed within 24h of presentation</tspan></text><rect x="52" y="1542.5200000000004" width="14" height="14" rx="3" fill="#c8531b" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="500" fill="#241c15" text-anchor="start" ><tspan x="80.0" y="1561.5">Refer to GI specialist if varices or requiring</tspan><tspan x="80.0" y="1596.2">therapeutic endoscopy</tspan></text><path d="M360.0 1635.0 L360.0 1649.0" stroke="#241c15" stroke-width="9" stroke-linecap="round" fill="none"/><path d="M360.0 1669.0 L345.0 1649.0 L375.0 1649.0 Z" fill="#241c15" stroke="#241c15" stroke-width="2" stroke-linejoin="round"/><rect x="36" y="1686.9600000000005" width="660" height="222.16000000000008" rx="16" fill="#241c15"/><rect x="30" y="1680.9600000000005" width="660" height="222.16000000000008" rx="16" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><path d="M30 1742.9600000000005 V1696.9600000000005 a16 16 0 0 1 16 -16 H674 a16 16 0 0 1 16 16 V1742.9600000000005 Z" fill="#e0a521" stroke="#241c15" stroke-width="3"/><text font-size="31" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="52.0" y="1723.0">Review</tspan></text><rect x="52" y="1763.9600000000005" width="14" height="14" rx="3" fill="#c8531b" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="500" fill="#241c15" text-anchor="start" ><tspan x="80.0" y="1783.0">Review endoscopy report</tspan></text><rect x="52" y="1810.6800000000005" width="14" height="14" rx="3" fill="#c8531b" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="500" fill="#241c15" text-anchor="start" ><tspan x="80.0" y="1829.7">PPI if high risk ulcer post-endoscopy</tspan></text><rect x="52" y="1857.4000000000005" width="14" height="14" rx="3" fill="#c8531b" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="500" fill="#241c15" text-anchor="start" ><tspan x="80.0" y="1876.4">Post-haemostasis antithrombotic plan</tspan></text><rect x="36" y="1937.1200000000006" width="660" height="150" rx="16" fill="#241c15"/><rect x="30" y="1931.1200000000006" width="660" height="150" rx="16" fill="#c8531b" stroke="#241c15" stroke-width="3"/><text font-size="29" font-weight="800" fill="#fdf8ee" text-anchor="middle" ><tspan x="360.0" y="1977.1">Haemodynamic instability?</tspan><tspan x="360.0" y="2013.4">Think Major Haemorrhage Protocol</tspan><tspan x="360.0" y="2049.6">+/- critical care review</tspan></text><text font-size="21" font-weight="500" fill="#7a6a52" text-anchor="middle" ><tspan x="360.0" y="2125.1">Redrawn from Siau K, et al. Frontline Gastroenterology</tspan><tspan x="360.0" y="2152.4">2020;11:311-323, Figure 1. CC BY-NC 4.0.</tspan></text>
</svg>
