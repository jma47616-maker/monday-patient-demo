<svg xmlns="http://www.w3.org/2000/svg" id="panc-calcium-d21-timeline" viewBox="0 0 720 860" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>From the bolus to the next morning: a timeline</title><desc>A timeline down the page. 0: the bolus, 20 mL of 10% calcium gluconate over 10 minutes. 2 hours: repeat the ECG and calcium. Then the infusion: 100 mL of 10% calcium gluconate in 1,000 mL of 0.9% sodium chloride at 50 to 100 mL an hour (national guidance also allows 5% glucose). 2 to 4 hours into it: recheck the calcium and adjust the rate. Recheck at its end. Keep going until the cause is treated.</desc>
<rect width="720" height="860" fill="#fdf8ee"/>
<path d="M88 64 V773.0400000000001" stroke="#241c15" stroke-width="6"/><g id="panc-calcium-d21-step-1"><rect x="180" y="28" width="520" height="130.08" rx="12" fill="#241c15"/><rect x="176" y="24" width="520" height="130.08" rx="12" fill="#fbe4d3" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="200.0" y="68.0">The bolus</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="200.0" y="103.4">20 mL of 10% calcium gluconate</tspan><tspan x="200.0" y="134.7">over 10 minutes</tspan></text><rect x="59.4" y="40.2" width="57.2" height="47.6" rx="23.8" fill="#e0a521" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="88.0" y="73.8">0</tspan></text></g><g id="panc-calcium-d21-step-2"><rect x="180" y="176.08" width="520" height="98.72" rx="12" fill="#241c15"/><rect x="176" y="172.08" width="520" height="98.72" rx="12" fill="#faf0da" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="200.0" y="216.1">Repeat the ECG and calcium</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="200.0" y="251.4">2 hours after the bolus</tspan></text><rect x="45.3" y="188.3" width="85.5" height="47.6" rx="23.8" fill="#e0a521" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="88.0" y="221.9">2 h</tspan></text></g><g id="panc-calcium-d21-step-3"><rect x="180" y="292.8" width="520" height="192.8" rx="12" fill="#241c15"/><rect x="176" y="288.8" width="520" height="192.8" rx="12" fill="#faf0da" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="200.0" y="332.8">The infusion</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="200.0" y="368.2">100 mL of 10% calcium gluconate in</tspan><tspan x="200.0" y="399.5">1,000 mL of 0.9% sodium chloride at</tspan><tspan x="200.0" y="430.9">50–100 mL an hour (national</tspan><tspan x="200.0" y="462.2">guidance also allows 5% glucose)</tspan></text><rect x="36.6" y="305.0" width="102.7" height="47.6" rx="23.8" fill="#e0a521" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="88.0" y="338.6">then</tspan></text></g><g id="panc-calcium-d21-step-4"><rect x="180" y="503.6" width="520" height="130.08" rx="12" fill="#241c15"/><rect x="176" y="499.6" width="520" height="130.08" rx="12" fill="#faf0da" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="200.0" y="543.6">Recheck the calcium</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="200.0" y="579.0">2–4 hours into the infusion, and</tspan><tspan x="200.0" y="610.3">adjust the rate</tspan></text><rect x="28.0" y="515.8" width="120.0" height="47.6" rx="23.8" fill="#e0a521" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="88.0" y="549.4">2–4 h</tspan></text></g><g id="panc-calcium-d21-step-5"><rect x="180" y="651.6800000000001" width="520" height="67.36" rx="12" fill="#241c15"/><rect x="176" y="647.6800000000001" width="520" height="67.36" rx="12" fill="#faf0da" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="200.0" y="691.7">Recheck at its end</tspan></text><rect x="42.1" y="663.9" width="91.7" height="47.6" rx="23.8" fill="#e0a521" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="88.0" y="697.5">end</tspan></text></g><g id="panc-calcium-d21-step-6"><rect x="180" y="737.0400000000001" width="520" height="98.72" rx="12" fill="#241c15"/><rect x="176" y="733.0400000000001" width="520" height="98.72" rx="12" fill="#faf0da" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="200.0" y="777.0">Keep going until the cause is</tspan><tspan x="200.0" y="808.4">treated</tspan></text><rect x="36.8" y="749.2" width="102.4" height="47.6" rx="23.8" fill="#e0a521" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="88.0" y="782.8">until</tspan></text></g>
</svg>
