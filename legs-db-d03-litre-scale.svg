<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" width="360" height="560">
  <title>A litre scale for an 80 kg man</title>
  <!-- A vertical litre scale from 0.6 at the foot to 1.8 at the top, 0.1 to a tick, with no tick numbered. An orange line at 1.6, a pin at 1.70, a bracket from 1.70 to 1.19, a grey marker at 0.8. Meant to be shown about 170 px wide. Labels: rows 4.17 to 4.20. -->
  <rect width="360" height="560" fill="#faf0da"/>
  <path d="M48 40 V520" stroke="#241c15" stroke-width="5" stroke-linecap="round"/>
  <path d="M48 520 h16" stroke="#241c15" stroke-width="3" stroke-linecap="round"/><path d="M48 480 h10" stroke="#241c15" stroke-width="3" stroke-linecap="round"/><path d="M48 440 h16" stroke="#241c15" stroke-width="3" stroke-linecap="round"/><path d="M48 400 h10" stroke="#241c15" stroke-width="3" stroke-linecap="round"/><path d="M48 360 h16" stroke="#241c15" stroke-width="3" stroke-linecap="round"/><path d="M48 320 h10" stroke="#241c15" stroke-width="3" stroke-linecap="round"/><path d="M48 280 h16" stroke="#241c15" stroke-width="3" stroke-linecap="round"/><path d="M48 240 h10" stroke="#241c15" stroke-width="3" stroke-linecap="round"/><path d="M48 200 h16" stroke="#241c15" stroke-width="3" stroke-linecap="round"/><path d="M48 160 h10" stroke="#241c15" stroke-width="3" stroke-linecap="round"/><path d="M48 120 h16" stroke="#241c15" stroke-width="3" stroke-linecap="round"/><path d="M48 80 h10" stroke="#241c15" stroke-width="3" stroke-linecap="round"/><path d="M48 40 h16" stroke="#241c15" stroke-width="3" stroke-linecap="round"/>
  <path d="M30 120 H350" stroke="#c8531b" stroke-width="6" stroke-linecap="round"/>
  <text x="84" y="156.0" text-anchor="start" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#a53f12">1.6 L: call</text><text x="84" y="188.0" text-anchor="start" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#a53f12">critical care</text>
  <circle cx="48" cy="80" r="11" fill="#241c15"/><circle cx="48" cy="80" r="5" fill="#fdf8ee"/>
  <path d="M60 80 H78" stroke="#241c15" stroke-width="3" stroke-linecap="round"/>
  <text x="84" y="66.00000000000003" text-anchor="start" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#241c15">1.70 L at 10:40</text>
  <path d="M34 80 H20 V284 H34" fill="none" stroke="#241c15" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M60 284 H78" stroke="#241c15" stroke-width="3" stroke-linecap="round"/>
  <text x="84" y="278.0" text-anchor="start" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#241c15">A fall of 30%:</text><text x="84" y="310.0" text-anchor="start" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#241c15">1.19 L</text>
  <path d="M30 440 H76" stroke="#8a8378" stroke-width="6" stroke-linecap="round"/>
  <text x="84" y="410.0" text-anchor="start" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#6c6257">0.8 L: ventilation</text><text x="84" y="442.0" text-anchor="start" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#6c6257">almost inevitable.</text><text x="84" y="474.0" text-anchor="start" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#6c6257">Far too late for</text><text x="84" y="506.0" text-anchor="start" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#6c6257">a first call</text>
</svg>
