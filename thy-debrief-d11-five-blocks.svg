<svg xmlns="http://www.w3.org/2000/svg" id="thd11" viewBox="0 0 720 1020" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Five blocks, each at a different point between the gland and the heart</title><desc>The thyroid drawn as a workshop: hormone is made inside and leaves by a door into the blood, where T4 becomes T3 on its way to a tissue cell. Five numbered stops: 1 beta blocker blocks the effect, at the cell; 2 thionamide blocks the making, inside the gland; 3 iodine, an hour later, blocks the release, at the door; 4 hydrocortisone blocks T4 becoming T3, in the blood; 5 cooling, fluids and treating the trigger, beneath it all.</desc>
