<title>CT head, lumbar puncture, EEG: none is routine</title><desc>Three doors. CT head has five keys: focal signs; drowsy, unexplained; recent fall; head injury; anticoagulant. Lumbar puncture has none: not routine. EEG has one: suspected hidden seizures.</desc>
