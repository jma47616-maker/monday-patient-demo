<svg xmlns="http://www.w3.org/2000/svg" id="panc-db-d18-timeline" viewBox="0 0 720 1334" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>What can follow, from the first days to the months after</title><desc>Most people improve within a week. Deaths come in two peaks: early, from the whole body; late, from complications. Three stages down a line. First days, the whole body: failure of several organs, kidney injury, lung failure (ARDS), clotting failure (DIC), sepsis. Weeks, the gland and around it: fluid and dead tissue (necrosis) collect; from about 4 weeks a wall can grow around fluid (pseudocyst) or dead tissue (walled-off necrosis); dead tissue is infected in 20 to 40% of severe attacks, and infected necrosis causes 80% of deaths; bleeding vessels, a clot in the splenic vein, leaks (fistulae). After a first attack: another attack 21%, chronic pancreatitis 10%, poor digestion (exocrine insufficiency).</desc>
<rect width="720" height="1334" fill="#fdf8ee"/>
<rect x="78.6" y="22.2" width="562.8" height="47.6" rx="23.8" fill="#e0a521" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="360.0" y="55.8">Most people improve within a week</tspan></text><rect x="28" y="100" width="672" height="206" rx="14" fill="#241c15"/><rect x="24" y="96" width="672" height="206" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="136.0">Deaths come in two peaks</tspan></text><path d="M60 242 H660" stroke="#241c15" stroke-width="3"/><path d="M60 242 C120 242 140 156 190 156 C240 156 250 236 330 236 C410 236 440 176 500 176 C560 176 590 242 660 242" fill="#f0a27c" stroke="#241c15" stroke-width="4" opacity=".95"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="190.0" y="276.0">Early: the whole body</tspan></text><text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="500.0" y="276.0">Late: complications</tspan></text><path d="M62 364 V1126.4" stroke="#241c15" stroke-width="6"/><g id="panc-db-d18-stage-1"><rect x="96" y="338" width="606" height="292.0000000000001" rx="14" fill="#241c15"/><rect x="90" y="332" width="606" height="292.0000000000001" rx="14" fill="#fbe4d3" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="108.0" y="372.0">First days</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="265.0" y="372.0">the whole body</tspan></text><circle cx="118" cy="402" r="5" fill="#c8531b"/><text font-size="28" font-weight="400" fill="#241c15" text-anchor="start" ><tspan x="134.0" y="410.0">Failure of several organs</tspan></text><circle cx="118" cy="443.6" r="5" fill="#c8531b"/><text font-size="28" font-weight="400" fill="#241c15" text-anchor="start" ><tspan x="134.0" y="451.6">Kidney injury</tspan></text><circle cx="118" cy="485.20000000000005" r="5" fill="#c8531b"/><text font-size="28" font-weight="400" fill="#241c15" text-anchor="start" ><tspan x="134.0" y="493.2">Lung failure (ARDS)</tspan></text><circle cx="118" cy="526.8000000000001" r="5" fill="#c8531b"/><text font-size="28" font-weight="400" fill="#241c15" text-anchor="start" ><tspan x="134.0" y="534.8">Clotting failure (DIC)</tspan></text><circle cx="118" cy="568.4000000000001" r="5" fill="#c8531b"/><text font-size="28" font-weight="400" fill="#241c15" text-anchor="start" ><tspan x="134.0" y="576.4">Sepsis</tspan></text><circle cx="62" cy="364" r="22" fill="#c8531b" stroke="#241c15" stroke-width="3.5"/><text font-size="28" font-weight="800" fill="#fdf8ee" text-anchor="middle" ><tspan x="62.0" y="372.6">1</tspan></text></g><g id="panc-db-d18-stage-2"><rect x="96" y="656.0000000000001" width="606" height="418.4" rx="14" fill="#241c15"/><rect x="90" y="650.0000000000001" width="606" height="418.4" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="108.0" y="690.0">Weeks</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="214.5" y="690.0">the gland and around it</tspan></text><circle cx="118" cy="720.0000000000001" r="5" fill="#c8531b"/><text font-size="28" font-weight="400" fill="#241c15" text-anchor="start" ><tspan x="134.0" y="728.0">Fluid and dead tissue (necrosis) collect</tspan></text><circle cx="118" cy="761.6000000000001" r="5" fill="#c8531b"/><text font-size="28" font-weight="400" fill="#241c15" text-anchor="start" ><tspan x="134.0" y="769.6">From about 4 weeks a wall can grow</tspan><tspan x="134.0" y="803.2">around fluid (pseudocyst) or dead tissue</tspan><tspan x="134.0" y="836.8">(walled-off necrosis)</tspan></text><circle cx="118" cy="870.4000000000001" r="5" fill="#c8531b"/><text font-size="28" font-weight="400" fill="#241c15" text-anchor="start" ><tspan x="134.0" y="878.4">Dead tissue is infected in 20 to 40% of</tspan><tspan x="134.0" y="912.0">severe attacks; infected necrosis</tspan><tspan x="134.0" y="945.6">causes 80% of deaths</tspan></text><circle cx="118" cy="979.2" r="5" fill="#c8531b"/><text font-size="28" font-weight="400" fill="#241c15" text-anchor="start" ><tspan x="134.0" y="987.2">Bleeding vessels, a clot in the splenic</tspan><tspan x="134.0" y="1020.8">vein, leaks (fistulae)</tspan></text><circle cx="62" cy="682.0000000000001" r="22" fill="#c8531b" stroke="#241c15" stroke-width="3.5"/><text font-size="28" font-weight="800" fill="#fdf8ee" text-anchor="middle" ><tspan x="62.0" y="690.6">2</tspan></text></g><g id="panc-db-d18-stage-3"><rect x="96" y="1100.4" width="606" height="208.79999999999973" rx="14" fill="#241c15"/><rect x="90" y="1094.4" width="606" height="208.79999999999973" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="108.0" y="1134.4">After a first attack</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="383.0" y="1134.4">months and years</tspan></text><circle cx="118" cy="1164.4" r="5" fill="#c8531b"/><text font-size="28" font-weight="400" fill="#241c15" text-anchor="start" ><tspan x="134.0" y="1172.4">Another attack: 21%</tspan></text><circle cx="118" cy="1206.0" r="5" fill="#c8531b"/><text font-size="28" font-weight="400" fill="#241c15" text-anchor="start" ><tspan x="134.0" y="1214.0">Chronic pancreatitis: 10%</tspan></text><circle cx="118" cy="1247.6" r="5" fill="#c8531b"/><text font-size="28" font-weight="400" fill="#241c15" text-anchor="start" ><tspan x="134.0" y="1255.6">Poor digestion (exocrine insufficiency)</tspan></text><circle cx="62" cy="1126.4" r="22" fill="#c8531b" stroke="#241c15" stroke-width="3.5"/><text font-size="28" font-weight="800" fill="#fdf8ee" text-anchor="middle" ><tspan x="62.0" y="1135.0">3</tspan></text></g>
</svg>
