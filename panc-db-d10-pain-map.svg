<title>Where the pain is: front and back</title><desc>Two body outlines. Front: a burst of pain in the upper middle of the abdomen. Back: a matching burst in the middle of the back, with an arrow from front to back, through to the back. Underneath: severe, in the upper middle of the abdomen (epigastric), through to the back. Worse on moving. Eased by leaning forward, with a small figure sitting and leaning forward.</desc>
