<svg xmlns="http://www.w3.org/2000/svg" id="panc-calcium-d02-fractions" viewBox="0 0 720 745" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>A drop of blood with its calcium in three layers</title><desc>A drop of blood split into three layers by size. About half: free (ionised) calcium, the part that does the work. About 40%: riding on albumin, doing nothing while bound. About 10%: joined to small partners such as citrate and phosphate. Free calcium is normally about 1.1 to 1.3 mmol/L.</desc>
