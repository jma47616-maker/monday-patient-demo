<svg xmlns="http://www.w3.org/2000/svg" id="fitd02" viewBox="0 0 720 770" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Three rulers: the number, the time and the symptoms, each with a pin</title><desc>Ruler one, the number: mild, moderate, profound, with marks at 135, 130 and 125 and a pin at 112. Ruler two, the time: acute, chronic, with a mark at 48 hours and a pin at Since Thursday. Ruler three, the symptoms: mild or none, moderately severe, severe, with a pin at A seizure.</desc>
