<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320" role="img" aria-label="Abdominal examination: focal epigastric tenderness, soft, no guarding">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3cdb4"/>
      <stop offset=".5" stop-color="#f0deca"/>
      <stop offset="1" stop-color="#dcc5ab"/>
    </linearGradient>
    <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#b8552e" opacity=".14"/>
    </pattern>
  </defs>

  <rect width="440" height="320" fill="#faf6f0"/>
  <rect width="440" height="320" fill="url(#dots)"/>

  <!-- torso -->
  <path d="M118 6 C118 40 108 66 96 88 C86 108 82 140 86 178 C90 218 102 258 112 300 L118 320 L322 320 L328 300 C338 258 350 218 354 178 C358 140 354 108 344 88 C332 66 322 40 322 6 Z"
        fill="url(#skin)" stroke="#2b241d" stroke-width="4"/>
  <!-- costal margins -->
  <path d="M150 34 C170 66 196 82 220 84 C244 82 270 66 290 34" fill="none" stroke="#2b241d" stroke-width="3" opacity=".55"/>
  <!-- umbilicus -->
  <ellipse cx="220" cy="196" rx="7" ry="9" fill="none" stroke="#2b241d" stroke-width="3" opacity=".6"/>
  <path d="M220 189 q3 6 0 13" stroke="#2b241d" stroke-width="2" opacity=".4" fill="none"/>
  <!-- soft belly shading -->
  <path d="M132 250 q88 34 176 0" stroke="#c9a986" stroke-width="4" fill="none" opacity=".5"/>
  <path d="M150 120 q-14 60 -6 120" stroke="#c9a986" stroke-width="4" fill="none" opacity=".35"/>

  <!-- 9-region grid, faint -->
  <g stroke="#7a6f60" stroke-width="1.6" stroke-dasharray="6 7" opacity=".38">
    <line x1="168" y1="46" x2="168" y2="312"/>
    <line x1="272" y1="46" x2="272" y2="312"/>
    <line x1="92" y1="130" x2="348" y2="130"/>
    <line x1="88" y1="226" x2="352" y2="226"/>
  </g>

  <!-- epigastric tender point -->
  <g>
    <circle cx="220" cy="104" r="30" fill="none" stroke="#b23b2e" stroke-width="3" opacity=".8">
      <animate attributeName="r" values="16;40" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".85;0" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="104" r="22" fill="none" stroke="#b23b2e" stroke-width="3" opacity=".6">
      <animate attributeName="r" values="16;40" dur="1.6s" begin=".8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".85;0" dur="1.6s" begin=".8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="104" r="13" fill="#b23b2e" opacity=".85">
      <animate attributeName="r" values="12;15;12" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="104" r="5" fill="#faf6f0"/>
  </g>
  <!-- manga wince sparks at the point -->
  <g stroke="#b23b2e" stroke-width="4" stroke-linecap="round">
    <line x1="184" y1="70" x2="172" y2="58"/>
    <line x1="256" y1="70" x2="268" y2="58"/>
    <line x1="182" y1="132" x2="169" y2="141"/>
    <line x1="258" y1="132" x2="271" y2="141"/>
  </g>
</svg>
