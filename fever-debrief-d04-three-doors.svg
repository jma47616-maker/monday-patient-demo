<svg xmlns="http://www.w3.org/2000/svg" id="fever-debrief-d04-three-doors" viewBox="0 0 720 960" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Three doors</title><desc>Three doors side by side, each with a short label, with arrows down to one storm cloud.</desc>
<rect width="720" height="960" fill="#fdf8ee"/>
<rect x="42" y="76" width="184" height="300" rx="10" fill="#241c15"/><rect x="36" y="70" width="184" height="300" rx="10" fill="#faf0da" stroke="#241c15" stroke-width="3" />
<rect x="56" y="92" width="144" height="256" rx="6" fill="#fbe4d3" stroke="#241c15" stroke-width="3"/>
<circle cx="176" cy="230" r="9" fill="#e0a521" stroke="#241c15" stroke-width="3"/>
<text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="128.0" y="410.0">Infection</tspan></text>
<text font-size="28" font-weight="400" fill="#463a2c" text-anchor="middle" ><tspan x="128.0" y="448.0">the commonest</tspan></text>
<text font-size="28" font-weight="400" fill="#463a2c" text-anchor="middle" ><tspan x="128.0" y="482.0">trigger;</tspan></text>
<text font-size="28" font-weight="400" fill="#463a2c" text-anchor="middle" ><tspan x="128.0" y="516.0">EBV, CMV, HIV</tspan></text>
<path d="M128.0 560.0 L283.8 631.6" stroke="#c8531b" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M302.0 640.0 L277.6 645.3 L290.1 618.0 Z" fill="#c8531b" stroke="#c8531b" stroke-width="2" stroke-linejoin="round"/>
<rect x="274" y="76" width="184" height="300" rx="10" fill="#241c15"/><rect x="268" y="70" width="184" height="300" rx="10" fill="#faf0da" stroke="#241c15" stroke-width="3" />
<rect x="288" y="92" width="144" height="256" rx="6" fill="#fbe4d3" stroke="#241c15" stroke-width="3"/>
<circle cx="408" cy="230" r="9" fill="#e0a521" stroke="#241c15" stroke-width="3"/>
<text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="360.0" y="410.0">Cancer</tspan></text>
<text font-size="28" font-weight="400" fill="#463a2c" text-anchor="middle" ><tspan x="360.0" y="448.0">mostly lymphoma;</tspan></text>
<text font-size="28" font-weight="400" fill="#463a2c" text-anchor="middle" ><tspan x="360.0" y="482.0">40% to 70% of</tspan></text>
<text font-size="28" font-weight="400" fill="#463a2c" text-anchor="middle" ><tspan x="360.0" y="516.0">adult HLH</tspan></text>
<path d="M360.0 560.0 L360.0 620.0" stroke="#c8531b" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M360.0 640.0 L345.0 620.0 L375.0 620.0 Z" fill="#c8531b" stroke="#c8531b" stroke-width="2" stroke-linejoin="round"/>
<rect x="502" y="76" width="184" height="300" rx="10" fill="#241c15"/><rect x="496" y="70" width="184" height="300" rx="10" fill="#faf0da" stroke="#241c15" stroke-width="3" />
<rect x="516" y="92" width="144" height="256" rx="6" fill="#fbe4d3" stroke="#241c15" stroke-width="3"/>
<circle cx="636" cy="230" r="9" fill="#e0a521" stroke="#241c15" stroke-width="3"/>
<text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="588.0" y="410.0">Autoimmune</tspan></text>
<text font-size="28" font-weight="400" fill="#463a2c" text-anchor="middle" ><tspan x="588.0" y="448.0">disease:</tspan></text>
<text font-size="28" font-weight="400" fill="#463a2c" text-anchor="middle" ><tspan x="588.0" y="482.0">lupus,</tspan></text>
<text font-size="28" font-weight="400" fill="#463a2c" text-anchor="middle" ><tspan x="588.0" y="516.0">Still's</tspan></text>
<path d="M588.0 560.0 L435.1 631.5" stroke="#c8531b" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M417.0 640.0 L428.8 617.9 L441.5 645.1 Z" fill="#c8531b" stroke="#c8531b" stroke-width="2" stroke-linejoin="round"/>
<path d="M190 760 C150 760 140 700 196 690 C200 640 270 630 300 660 C330 618 420 618 440 664 C480 640 560 660 548 712 C600 724 590 790 540 790 L210 790 C180 790 168 772 190 760 Z" fill="#fbeec6" stroke="#241c15" stroke-width="4" stroke-linejoin="round"/>
<text font-size="32" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="370.0" y="740.0">one storm: HLH</tspan></text>
<path d="M250 800 l-14 34 h16 l-12 34" fill="none" stroke="#c8531b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M340 800 l-14 34 h16 l-12 34" fill="none" stroke="#c8531b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M430 800 l-14 34 h16 l-12 34" fill="none" stroke="#c8531b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<text font-size="28" font-weight="700" fill="#463a2c" text-anchor="middle" ><tspan x="360.0" y="920.0">More than one door can be open at once.</tspan></text>
</svg>
