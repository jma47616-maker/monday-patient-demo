<title>Care that is not a drug: one bed space</title><desc>A bed space from above. Clock and calendar on the wall. Glasses and hearing aids on the locker. Drink and food in reach. A walking frame: up and walking. A dim lamp: sleep at night. A chair and a photograph: family. Familiar staff, same bed.</desc>
