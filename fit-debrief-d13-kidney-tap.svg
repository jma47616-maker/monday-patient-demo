<svg xmlns="http://www.w3.org/2000/svg" id="fitd13" viewBox="0 0 720 1030" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Two kidneys drawn as taps over a jug: vasopressin on, and vasopressin off</title><desc>Top: a kidney drawn as a tap, nearly shut, with a few dark drops falling into a jug, and a flat sodium line beside it. Vasopressin on: a little concentrated urine. Bottom: the tap wide open, pale urine pouring into a full jug, and the sodium line beside it climbing steeply. Vasopressin off: dilute urine pours out. Sodium climbs by itself. A tag on the jug: above 100 mL an hour: sodium every 2 hours.</desc>
<rect width="720" height="1030" fill="#fdf8ee"/>
