<svg xmlns="http://www.w3.org/2000/svg" id="thd16" viewBox="0 0 720 922" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>If he does not turn: a staircase of five steps, and a landing with three doors</title><desc>Five steps rising: cholestyramine, lithium, plasma exchange, thyroidectomy, ECMO for shock. Along the base: no steadying by 24 to 48 hours, reassess, then climb. On the landing, three doors: once stable, radioiodine, surgery or tablets.</desc>
<rect width="720" height="922" fill="#fdf8ee"/>
