roke-width="4"/><circle cx="0" cy="12" r="15" fill="#fdf8ee" stroke="#241c15" stroke-width="3.5"/><circle cx="0" cy="12" r="5" fill="#c8531b"/><rect x="-22" y="-18" width="44" height="12" rx="2" fill="#463a2c"/><path d="M-18 -26 V-52 M18 -26 V-52" stroke="#241c15" stroke-width="4"/><rect x="-28" y="-72" width="20" height="26" rx="5" fill="#fbeec6" stroke="#241c15" stroke-width="3"/><rect x="8" y="-72" width="20" height="26" rx="5" fill="#f6cfc4" stroke="#241c15" stroke-width="3"/><circle cx="-20" cy="46" r="6" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><circle cx="20" cy="46" r="6" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/></g></g><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="254.0" y="596.0">Plasma exchange</tspan></text></g><g id="thd16-step-4" data-step="thyroidectomy"><path d="M345 542 H690" stroke="#d9c9a6" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/><g transform="translate(397.5 456.0)" ><g transform="translate(0.0 -44.0) scale(0.9)" ><path d="M-40 -30 H40 L46 40 H-46 Z" fill="#9fc5bd" stroke="#241c15" stroke-width="4" stroke-linejoin="round"/><ellipse cx="0" cy="2" rx="20" ry="13" fill="#f6cfc4" stroke="#241c15" stroke-width="3.5"/><path d="M-30 -30 L-34 40 M30 -30 L34 40" stroke="#6f9a91" stroke-width="3"/><path d="M-8 2 H10" stroke="#241c15" stroke-width="3" stroke-linecap="round"/></g></g><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="359.0" y="510.0">Thyroidectomy</tspan></text></g><g id="thd16-step-5" data-step="ecmo"><path d="M450 456 H690" stroke="#d9c9a6" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/><g transform="translate(502.5 370.0)" ><g transform="translate(0.0 -42.0) scale(0.95)" ><rect x="-34" y="-12" width="68" height="52" rx="7" fill="#f3e5c8" stroke="#241c15" stroke-width="4"/><circle cx="0" cy="14" r="17" fill="#fdf8ee" stroke="#241c15" stroke-width="3.5"/><path d="M0 14 L0 -1 M0 14 L13 21 M0 14 L-13 21" stroke="#241c15" stroke-width="3.5" stroke-linecap="round"/><path d="M-20 -12 C-20 -50 -44 -40 -44 -66" fill="none" stroke="#241c15" stroke-width="10" stroke-linecap="round"/><path d="M-20 -12 C-20 -50 -44 -40 -44 -66" fill="none" stroke="#7f93b8" stroke-width="5" stroke-linecap="round"/><path d="M20 -12 C20 -50 44 -40 44 -66" fill="none" stroke="#241c15" stroke-width="10" stroke-linecap="round"/><path d="M20 -12 C20 -50 44 -40 44 -66" fill="none" stroke="#c8531b" stroke-width="5" stroke-linecap="round"/></g></g><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="464.0" y="424.0">ECMO for shock</tspan></text></g><g id="thd16-landing"><rect x="565" y="214" width="34" height="70" rx="3" fill="#fdf8ee" stroke="#241c15" stroke-width="4"/><circle cx="590" cy="252" r="3.5" fill="#241c15"/><rect x="607" y="214" width="34" height="70" rx="3" fill="#fdf8ee" stroke="#241c15" stroke-width="4"/><circle cx="632" cy="252" r="3.5" fill="#241c15"/><rect x="649" y="214" width="34" height="70" rx="3" fill="#fdf8ee" stroke="#241c15" stroke-width="4"/><circle cx="674" cy="252" r="3.5" fill="#241c15"/><text font-size="29" font-weight="800" fill="#a53f12" text-anchor="end" ><tspan x="690.0" y="56.0">Once stable:</tspan></text><text font-size="29" font-weight="700" fill="#241c15" text-anchor="end" ><tspan x="690.0" y="96.0">radioiodine, surgery</tspan><tspan x="690.0" y="131.4">or tablets</tspan></text></g><g id="thd16-base"><text font-size="29" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="30.0" y="856.0">No steadying by 24 to 48 hours:</tspan></text><text font-size="29" font-weight="600" fill="#463a2c" text-anchor="start" ><tspan x="30.0" y="894.0">reassess, then climb</tspan></text><path d="M330.0 884.0 L386.0 884.0" stroke="#c8531b" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M402.0 884.0 L386.0 896.0 L386.0 872.0 Z" fill="#c8531b" stroke="#c8531b" stroke-width="2" stroke-linejoin="round"/></g>
