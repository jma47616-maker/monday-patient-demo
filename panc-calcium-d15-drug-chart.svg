<svg xmlns="http://www.w3.org/2000/svg" id="panc-calcium-d15-drug-chart" viewBox="0 0 720 885" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>A drug chart with the drugs that lower calcium ringed</title><desc>A drug chart with eight entries ringed in red. Omeprazole, acid-suppressing (a PPI), lowers magnesium. Furosemide, a loop diuretic. An IV bisphosphonate, especially with low vitamin D. Some anticonvulsants. Phosphate. Foscarnet. Cisplatin, chemotherapy. Gentamicin, an aminoglycoside.</desc>
<rect width="720" height="885" fill="#fdf8ee"/>
<rect x="30" y="30" width="672" height="820.8000000000001" rx="6" fill="#241c15"/><rect x="24" y="24" width="672" height="820.8000000000001" rx="6" fill="#fdf8ee" stroke="#241c15" stroke-width="3" /><rect x="24" y="24" width="672" height="96" rx="6" fill="#f3e5c8" stroke="#241c15" stroke-width="3"/><text font-size="30" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="84.0">Drug chart: check for these</tspan></text><rect x="24" y="120" width="672" height="105.36" fill="#f6f1e4"/><path d="M24 225.36 H696" stroke="#d9c9a6" stroke-width="2"/><text font-size="30" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="64.0" y="166.0">Omeprazole</tspan></text><ellipse cx="157.4" cy="156" rx="121.4" ry="28" fill="none" stroke="#c8531b" stroke-width="4" transform="rotate(-2 155.4 156)"/><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="64.0" y="202.0">acid-suppressing (a PPI): lowers magnesium</tspan></text><rect x="24" y="225.36" width="672" height="105.36" fill="#fdf8ee"/><path d="M24 330.72 H696" stroke="#d9c9a6" stroke-width="2"/><text font-size="30" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="64.0" y="271.4">Furosemide</tspan></text><ellipse cx="157.4" cy="261.36" rx="121.4" ry="28" fill="none" stroke="#c8531b" stroke-width="4" transform="rotate(-2 155.4 261.36)"/><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="64.0" y="307.4">a loop diuretic</tspan></text><rect x="24" y="330.72" width="672" height="105.36" fill="#f6f1e4"/><path d="M24 436.08000000000004 H696" stroke="#d9c9a6" stroke-width="2"/><text font-size="30" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="64.0" y="376.7">An IV bisphosphonate</tspan></text><ellipse cx="235.0" cy="366.72" rx="199.0" ry="28" fill="none" stroke="#c8531b" stroke-width="4" transform="rotate(-2 233.0 366.72)"/><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="64.0" y="412.7">especially with low vitamin D</tspan></text><rect x="24" y="436.08000000000004" width="672" height="66" fill="#fdf8ee"/><path d="M24 502.08000000000004 H696" stroke="#d9c9a6" stroke-width="2"/><text font-size="30" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="64.0" y="482.1">Some anticonvulsants</tspan></text><ellipse cx="238.4" cy="472.08000000000004" rx="202.4" ry="28" fill="none" stroke="#c8531b" stroke-width="4" transform="rotate(-2 236.4 472.08000000000004)"/><rect x="24" y="502.08000000000004" width="672" height="66" fill="#f6f1e4"/><path d="M24 568.08 H696" stroke="#d9c9a6" stroke-width="2"/><text font-size="30" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="64.0" y="548.1">Phosphate</tspan></text><ellipse cx="147.6" cy="538.08" rx="111.6" ry="28" fill="none" stroke="#c8531b" stroke-width="4" transform="rotate(-2 145.6 538.08)"/><rect x="24" y="568.08" width="672" height="66" fill="#fdf8ee"/><path d="M24 634.08 H696" stroke="#d9c9a6" stroke-width="2"/><text font-size="30" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="64.0" y="614.1">Foscarnet</tspan></text><ellipse cx="144.3" cy="604.08" rx="108.3" ry="28" fill="none" stroke="#c8531b" stroke-width="4" transform="rotate(-2 142.3 604.08)"/><rect x="24" y="634.08" width="672" height="105.36" fill="#f6f1e4"/><path d="M24 739.44 H696" stroke="#d9c9a6" stroke-width="2"/><text font-size="30" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="64.0" y="680.1">Cisplatin</tspan></text><ellipse cx="133.5" cy="670.08" rx="97.5" ry="28" fill="none" stroke="#c8531b" stroke-width="4" transform="rotate(-2 131.5 670.08)"/><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="64.0" y="716.1">chemotherapy</tspan></text><rect x="24" y="739.44" width="672" height="105.36" fill="#fdf8ee"/><path d="M24 844.8000000000001 H696" stroke="#d9c9a6" stroke-width="2"/><text font-size="30" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="64.0" y="785.4">Gentamicin</tspan></text><ellipse cx="152.7" cy="775.44" rx="116.7" ry="28" fill="none" stroke="#c8531b" stroke-width="4" transform="rotate(-2 150.7 775.44)"/><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="64.0" y="821.4">an aminoglycoside</tspan></text><rect x="24" y="24" width="672" height="820.8000000000001" rx="6" fill="none" stroke="#241c15" stroke-width="3"/>
