<svg xmlns="http://www.w3.org/2000/svg" id="panc-calcium-d11-st-qt-normal" viewBox="0 0 720 400" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>A normal beat</title><desc>Two heartbeats drawn on ECG paper, one above the other. Normal: a short flat ST segment and a normal QT. Low calcium (Dean): the same beat with a much longer flat ST segment, so the QT is longer. Low calcium lengthens the flat part of the beat (the ST segment), and so the QT. The T wave keeps its ordinary shape; there is no ST elevation.</desc>
<rect width="720" height="400" fill="#fdf8ee"/>
