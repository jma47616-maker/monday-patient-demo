<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 800" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>One dipstick, two groups of pads</title><desc>A urine dipstick with its pads in two bracketed groups. Blood, protein: read these for the kidney. Leucocytes, nitrite: not a diagnosis of infection.</desc>
<rect width="720" height="800" fill="#fdf8ee"/>
