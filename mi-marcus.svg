<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Marcus">
  <rect width="200" height="200" fill="#efe7da"/>
  <!-- shoulders / work tee -->
  <path d="M28 200 C34 156 62 138 100 138 C138 138 166 156 172 200 Z" fill="#7d8b6f" stroke="#2b241d" stroke-width="4"/>
  <path d="M84 148 L100 168 L116 148" fill="none" stroke="#2b241d" stroke-width="3" opacity=".6"/>
  <!-- neck -->
  <path d="M86 118 h28 v28 c0 8 -28 8 -28 0 Z" fill="#dcc0a4" stroke="#2b241d" stroke-width="3.5"/>
  <!-- head: pale under the tan -->
  <ellipse cx="100" cy="82" rx="46" ry="50" fill="#e6cfb6" stroke="#2b241d" stroke-width="4"/>
  <!-- grey pallor tint on cheeks -->
  <ellipse cx="76" cy="102" rx="12" ry="7" fill="#b9c2c6" opacity=".5"/>
  <ellipse cx="124" cy="102" rx="12" ry="7" fill="#b9c2c6" opacity=".5"/>
  <!-- short dark hair, receding a little -->
  <path d="M56 68 C56 44 74 30 100 30 C126 30 144 44 144 68 C138 52 124 44 100 44 C76 44 62 52 56 68 Z" fill="#4a4136" stroke="#2b241d" stroke-width="3.5"/>
  <!-- stubble -->
  <path d="M66 108 C72 130 86 138 100 138 C114 138 128 130 134 108 C126 124 112 130 100 130 C88 130 74 124 66 108 Z" fill="#4a4136" opacity=".18"/>
  <!-- worried brows -->
  <path d="M64 64 q16 -9 28 -2" fill="none" stroke="#2b241d" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M136 64 q-16 -9 -28 -2" fill="none" stroke="#2b241d" stroke-width="4.5" stroke-linecap="round"/>
  <!-- strained eyes -->
  <path d="M70 82 q11 8 22 0" fill="none" stroke="#2b241d" stroke-width="4" stroke-linecap="round"/>
  <path d="M108 82 q11 8 22 0" fill="none" stroke="#2b241d" stroke-width="4" stroke-linecap="round"/>
  <path d="M72 92 q10 4 18 0" fill="none" stroke="#7a6f60" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
  <path d="M110 92 q10 4 18 0" fill="none" stroke="#7a6f60" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
  <!-- nose + tight grimacing mouth -->
  <path d="M100 88 q4 10 -2 16" fill="none" stroke="#2b241d" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M88 118 q12 -5 24 0" fill="none" stroke="#2b241d" stroke-width="3.5" stroke-linecap="round"/>
  <!-- animated sweat drops -->
  <g fill="#8fb6d9" stroke="#2b241d" stroke-width="2.5">
    <path d="M146 56 c6 8 6 14 0 17 c-6 -3 -6 -9 0 -17 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 10" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="1.3s" repeatCount="indefinite"/>
    </path>
    <path d="M54 70 c5 7 5 12 0 15 c-5 -3 -5 -8 0 -15 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 9" dur="1.6s" begin=".4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="1.6s" begin=".4s" repeatCount="indefinite"/>
    </path>
    <path d="M132 44 c4 6 4 10 0 13 c-4 -3 -4 -7 0 -13 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 8" dur="1.9s" begin=".9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="1.9s" begin=".9s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
