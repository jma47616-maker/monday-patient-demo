<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360">
  <title>The pain across the morning</title>
  <!-- Card 9. A pain line across the morning from 06:40 to 14:00: sudden severe pain (reversible), a lull, then peritonitis (not reversible), with 12:30 marked grey and still and an in-the-case tag. -->
  
  <rect width="360" height="360" rx="16" fill="#f3e5c8"/>
  <rect x="30" y="60" width="160" height="190" fill="#dfe9d6" opacity=".8"/><rect x="250" y="60" width="90" height="190" fill="#f0c7b8" opacity=".8"/><path d="M30 250 H340 M30 250 V56" stroke="#241c15" stroke-width="3"/><text x="24" y="50" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#241c15" text-anchor="start">Pain</text><path d="M34 244 L44 84 Q90 80 140 100 Q180 150 220 160 Q246 160 260 120 Q290 80 336 76" stroke="#c2643c" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="52" y="122.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#241c15" text-anchor="start">Sudden</text><text x="52" y="139.07999999999998" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#241c15" text-anchor="start">severe pain</text><text x="166" y="196.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#241c15" text-anchor="start">The lull</text><text x="292" y="156" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#b8432f" text-anchor="middle">Peritonitis</text><text x="110" y="240" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#4f7a4a" text-anchor="middle">Reversible</text><text x="296" y="240" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#b8432f" text-anchor="middle">Not reversible</text><text x="30" y="272" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#241c15" text-anchor="start">06:40</text><text x="256" y="272" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#241c15" text-anchor="middle">12:30</text><text x="340" y="272" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#241c15" text-anchor="end">14:00</text><text x="256" y="290" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#8d8577" text-anchor="middle">grey and still</text><rect x="12" y="312" width="336" height="36" rx="8" fill="#fbf6ec" stroke="#241c15" stroke-width="2"/><text x="180" y="335" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2f6b70" text-anchor="middle">In the case: the timing is compressed</text><text x="180" y="30" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#241c15" text-anchor="middle">A quieter patient is not a better patient</text>
</svg>
