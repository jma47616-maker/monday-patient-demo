<svg xmlns="http://www.w3.org/2000/svg" id="panc-calcium-d03-loop-4" viewBox="0 0 720 1022" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>The calcium loop, arm 4 of 4</title><desc>A loop down the page. Blood calcium falls. The parathyroid glands, behind the thyroid, release parathyroid hormone (PTH). PTH acts on: 1, bone releases calcium; 2, the kidney keeps calcium instead of losing it in urine; 3, the kidney activates vitamin D (calcitriol); 4, vitamin D makes the gut absorb more calcium. Blood calcium rises, and an arrow back up the side: PTH falls back (negative feedback).</desc>
<rect width="720" height="1022" fill="#fdf8ee"/>
<rect x="30" y="30" width="600" height="96" rx="14" fill="#241c15"/><rect x="24" y="24" width="600" height="96" rx="14" fill="#fbe4d3" stroke="#241c15" stroke-width="3" /><g transform="translate(84.0 76.0) scale(0.8)" ><path d="M0 -40 C14 -18 30 0 30 16 A30 30 0 1 1 -30 16 C-30 0 -14 -18 0 -40 Z" fill="#d9534a" stroke="#241c15" stroke-width="4" stroke-linejoin="round"/><circle cx="-8.0" cy="14.0" r="7" fill="#5b8fc9" stroke="#241c15" stroke-width="2.5"/><circle cx="10.0" cy="22.0" r="7" fill="#5b8fc9" stroke="#241c15" stroke-width="2.5"/></g><text font-size="30" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="150.0" y="84.0">Blood calcium falls</tspan></text><path d="M320.0 126.0 L320.0 144.0" stroke="#241c15" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M320.0 160.0 L308.0 144.0 L332.0 144.0 Z" fill="#241c15" stroke="#241c15" stroke-width="2" stroke-linejoin="round"/><rect x="30" y="172" width="600" height="140" rx="14" fill="#241c15"/><rect x="24" y="166" width="600" height="140" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3" /><g transform="translate(94.0 236.0) scale(0.42)" ><g fill="#f6cfc4" stroke="#241c15" stroke-width="5" stroke-linejoin="round"><path d="M30,-20 C30,-80 55,-120 80,-118 C112,-116 125,-60 122,0 C120,60 100,105 70,108 C45,110 30,80 30,40 Z"/><g transform="scale(-1 1)"><path d="M30,-20 C30,-80 55,-120 80,-118 C112,-116 125,-60 122,0 C120,60 100,105 70,108 C45,110 30,80 30,40 Z"/></g><rect x="-40" y="0" width="80" height="58" rx="14"/></g><g fill="#f6cfc4"><path d="M30,-20 C30,-80 55,-120 80,-118 C112,-116 125,-60 122,0 C120,60 100,105 70,108 C45,110 30,80 30,40 Z" transform="scale(.96)"/><path d="M30,-20 C30,-80 55,-120 80,-118 C112,-116 125,-60 122,0 C120,60 100,105 70,108 C45,110 30,80 30,40 Z" transform="scale(-.96 .96)"/><rect x="-36" y="4" width="72" height="50" rx="12"/></g><ellipse cx="-82" cy="-60" rx="20" ry="15" fill="#8a6bb8" stroke="#241c15" stroke-width="3.5"/><ellipse cx="82" cy="-60" rx="20" ry="15" fill="#8a6bb8" stroke="#241c15" stroke-width="3.5"/><ellipse cx="-78" cy="56" rx="20" ry="15" fill="#8a6bb8" stroke="#241c15" stroke-width="3.5"/><ellipse cx="78" cy="56" rx="20" ry="15" fill="#8a6bb8" stroke="#241c15" stroke-width="3.5"/></g><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="176.0" y="212.0">The parathyroid glands,</tspan><tspan x="176.0" y="243.4">behind the thyroid, release</tspan><tspan x="176.0" y="274.7">parathyroid hormone (PTH)</tspan></text><path d="M320.0 312.0 L320.0 330.0" stroke="#241c15" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M320.0 346.0 L308.0 330.0 L332.0 330.0 Z" fill="#241c15" stroke="#241c15" stroke-width="2" stroke-linejoin="round"/><text font-size="28" font-weight="700" fill="#463a2c" text-anchor="start" ><tspan x="48.0" y="358.0">PTH acts on:</tspan></text><g id="panc-calcium-d03s4-arm-bone"><rect x="30" y="380" width="600" height="104" rx="14" fill="#241c15"/><rect x="24" y="374" width="600" height="104" rx="14" fill="#fdf8ee" stroke="#241c15" stroke-width="3" /><g transform="translate(82.0 426.0) scale(0.9)" ><g fill="#241c15" stroke="#241c15" stroke-width="8"><circle cx="-40" cy="-12" r="14"/><circle cx="-40" cy="12" r="14"/><circle cx="40" cy="-12" r="14"/><circle cx="40" cy="12" r="14"/><rect x="-40" y="-11" width="80" height="22"/></g><g fill="#f4ecd8"><circle cx="-40" cy="-12" r="14"/><circle cx="-40" cy="12" r="14"/><circle cx="40" cy="-12" r="14"/><circle cx="40" cy="12" r="14"/><rect x="-40" y="-11" width="80" height="22"/></g></g><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="150.0" y="420.0">Bone releases calcium</tspan></text><circle cx="594" cy="404" r="18" fill="#c8531b" stroke="#241c15" stroke-width="3.5"/><text font-size="28" font-weight="800" fill="#fdf8ee" text-anchor="middle" ><tspan x="594.0" y="411.9">1</tspan></text></g><g id="panc-calcium-d03s4-arm-kidney"><rect x="30" y="498" width="600" height="104" rx="14" fill="#241c15"/><rect x="24" y="492" width="600" height="104" rx="14" fill="#fdf8ee" stroke="#241c15" stroke-width="3" /><g transform="translate(82.0 544.0) scale(0.9)" ><path d="M-6 -40 C-36 -40 -40 -10 -40 4 C-40 30 -24 42 -6 40 C8 38 10 26 4 16 C-2 8 -2 -6 4 -14 C12 -24 10 -40 -6 -40 Z" fill="#b5574a" stroke="#241c15" stroke-width="4" stroke-linejoin="round"/><path d="M4 2 C16 2 22 10 30 22" fill="none" stroke="#241c15" stroke-width="5" stroke-linecap="round"/></g><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="150.0" y="538.0">The kidney keeps calcium</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="150.0" y="573.4">instead of losing it in urine</tspan></text><circle cx="594" cy="522" r="18" fill="#c8531b" stroke="#241c15" stroke-width="3.5"/><text font-size="28" font-weight="800" fill="#fdf8ee" text-anchor="middle" ><tspan x="594.0" y="529.9">2</tspan></text></g><g id="panc-calcium-d03s4-arm-vitd"><rect x="30" y="616" width="600" height="104" rx="14" fill="#241c15"/><rect x="24" y="610" width="600" height="104" rx="14" fill="#fdf8ee" stroke="#241c15" stroke-width="3" /><g transform="translate(82.0 662.0) scale(0.9)" ><path d="M24.0 0.0 L36.0 0.0" stroke="#241c15" stroke-width="5" stroke-linecap="round"/><path d="M17.0 17.0 L25.5 25.5" stroke="#241c15" stroke-width="5" stroke-linecap="round"/><path d="M0.0 24.0 L0.0 36.0" stroke="#241c15" stroke-width="5" stroke-linecap="round"/><path d="M-17.0 17.0 L-25.5 25.5" stroke="#241c15" stroke-width="5" stroke-linecap="round"/><path d="M-24.0 0.0 L-36.0 0.0" stroke="#241c15" stroke-width="5" stroke-linecap="round"/><path d="M-17.0 -17.0 L-25.5 -25.5" stroke="#241c15" stroke-width="5" stroke-linecap="round"/><path d="M-0.0 -24.0 L-0.0 -36.0" stroke="#241c15" stroke-width="5" stroke-linecap="round"/><path d="M17.0 -17.0 L25.5 -25.5" stroke="#241c15" stroke-width="5" stroke-linecap="round"/><circle r="21" fill="#e0a521" stroke="#241c15" stroke-width="4"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="0.0" y="10.0">D</tspan></text></g><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="150.0" y="656.0">The kidney activates vitamin</tspan><tspan x="150.0" y="687.4">D (calcitriol)</tspan></text><circle cx="594" cy="640" r="18" fill="#c8531b" stroke="#241c15" stroke-width="3.5"/><text font-size="28" font-weight="800" fill="#fdf8ee" text-anchor="middle" ><tspan x="594.0" y="647.9">3</tspan></text></g><path d="M90.0 718.0 L90.0 730.0" stroke="#241c15" stroke-width="5" stroke-linecap="round" fill="none"/><path d="M90.0 744.0 L79.5 730.0 L100.5 730.0 Z" fill="#241c15" stroke="#241c15" stroke-width="2" stroke-linejoin="round"/><g id="panc-calcium-d03s4-arm-gut"><rect x="66" y="754" width="564" height="104" rx="14" fill="#241c15"/><rect x="60" y="748" width="564" height="104" rx="14" fill="#fdf8ee" stroke="#241c15" stroke-width="3" /><g transform="translate(118.0 800.0) scale(0.9)" ><path d="M-38 -26 H30 C44 -26 44 -6 30 -6 H-30 C-44 -6 -44 14 -30 14 H30 C44 14 44 34 30 34 H-20" fill="none" stroke="#241c15" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><path d="M-38 -26 H30 C44 -26 44 -6 30 -6 H-30 C-44 -6 -44 14 -30 14 H30 C44 14 44 34 30 34 H-20" fill="none" stroke="#e8a58c" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></g><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="186.0" y="794.0">Vitamin D makes the gut</tspan><tspan x="186.0" y="825.4">absorb more calcium</tspan></text><circle cx="594" cy="778" r="18" fill="#c8531b" stroke="#241c15" stroke-width="3.5"/><text font-size="28" font-weight="800" fill="#fdf8ee" text-anchor="middle" ><tspan x="594.0" y="785.9">4</tspan></text></g><path d="M320.0 874.0 L320.0 892.0" stroke="#241c15" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M320.0 908.0 L308.0 892.0 L332.0 892.0 Z" fill="#241c1