<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Ronald">
  <rect width="200" height="200" fill="#efe7da"/>
  <!-- shoulders / shirt + knitted tank -->
  <path d="M26 200 C32 154 60 136 100 136 C140 136 168 154 174 200 Z" fill="#7d8b6f" stroke="#2b241d" stroke-width="4"/>
  <path d="M74 148 L100 178 L126 148 L126 200 L74 200 Z" fill="#a8b39a" stroke="#2b241d" stroke-width="3"/>
  <path d="M86 142 L100 160 L114 142" fill="#e8e2d4" stroke="#2b241d" stroke-width="3"/>
  <!-- neck -->
  <path d="M86 116 h28 v26 c0 8 -28 8 -28 0 Z" fill="#d6c6b4" stroke="#2b241d" stroke-width="3.5"/>
  <!-- head: long, weathered, grey-pale -->
  <path d="M58 84 C58 46 76 28 100 28 C124 28 142 46 142 84 C142 112 124 132 100 132 C76 132 58 112 58 84 Z" fill="#e0d3c2" stroke="#2b241d" stroke-width="4"/>
  <!-- grey pallor on cheeks -->
  <ellipse cx="77" cy="100" rx="11" ry="6" fill="#b7bfc2" opacity=".45"/>
  <ellipse cx="123" cy="100" rx="11" ry="6" fill="#b7bfc2" opacity=".45"/>
  <!-- flat cap -->
  <path d="M54 60 C58 34 82 22 100 22 C118 22 142 34 146 60 C132 50 68 50 54 60 Z" fill="#8a7a63" stroke="#2b241d" stroke-width="4"/>
  <path d="M50 62 C70 50 130 50 150 62 C150 68 144 70 138 68 C112 58 88 58 62 68 C56 70 50 68 50 62 Z" fill="#6e614f" stroke="#2b241d" stroke-width="3.5"/>
  <!-- side hair, grey -->
  <path d="M58 76 C56 86 57 96 60 104 L66 100 C63 92 62 84 63 76 Z" fill="#b5aea2" stroke="#2b241d" stroke-width="3"/>
  <path d="M142 76 C144 86 143 96 140 104 L134 100 C137 92 138 84 137 76 Z" fill="#b5aea2" stroke="#2b241d" stroke-width="3"/>
  <!-- tired brows -->
  <path d="M68 74 q13 -6 25 -2" fill="none" stroke="#2b241d" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M132 74 q-13 -6 -25 -2" fill="none" stroke="#2b241d" stroke-width="4.5" stroke-linecap="round"/>
  <!-- heavy-lidded eyes -->
  <path d="M73 88 q10 7 20 1" fill="none" stroke="#2b241d" stroke-width="4" stroke-linecap="round"/>
  <path d="M107 89 q10 6 20 -1" fill="none" stroke="#2b241d" stroke-width="4" stroke-linecap="round"/>
  <!-- under-eye shadows -->
  <path d="M75 95 q9 4 17 1" fill="none" stroke="#9aa0a4" stroke-width="3" stroke-linecap="round" opacity=".7"/>
  <path d="M109 96 q9 3 17 -1" fill="none" stroke="#9aa0a4" stroke-width="3" stroke-linecap="round" opacity=".7"/>
  <!-- nose -->
  <path d="M100 88 C98 96 96 102 94 106 q6 5 12 0" fill="none" stroke="#2b241d" stroke-width="3.5" stroke-linecap="round"/>
  <!-- deep nasolabial lines -->
  <path d="M84 106 q2 8 8 13" fill="none" stroke="#2b241d" stroke-width="2.5" stroke-linecap="round" opacity=".6"/>
  <path d="M116 106 q-2 8 -8 13" fill="none" stroke="#2b241d" stroke-width="2.5" stroke-linecap="round" opacity=".6"/>
  <!-- dry, set mouth -->
  <path d="M88 119 q12 3 24 0" fill="none" stroke="#2b241d" stroke-width="4" stroke-linecap="round"/>
  <path d="M92 124 q8 2 16 0" fill="none" stroke="#b08d7c" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>
  <!-- ears -->
  <path d="M56 88 c-7 -2 -8 10 -1 12" fill="#d6c6b4" stroke="#2b241d" stroke-width="3"/>
  <path d="M144 88 c7 -2 8 10 1 12" fill="#d6c6b4" stroke="#2b241d" stroke-width="3"/>
</svg>
