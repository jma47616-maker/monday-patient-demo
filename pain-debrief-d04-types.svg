="2.5"/><circle cx="135" cy="302" r="2.2" fill="#241c15"/><circle cx="149" cy="302" r="2.2" fill="#241c15"/><path d="M136 315 Q142 309 148 315" stroke="#241c15" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M122 306 Q134 310 139 308 M162 306 Q150 310 145 308" fill="none" stroke="#6fa0c8" stroke-width="2.5"/><text x="20" y="360.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#241c15" text-anchor="start">The very ill: shock,</text><text x="20" y="376.47" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#241c15" text-anchor="start">heart failure, after</text><text x="20" y="392.94" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#241c15" text-anchor="start">heart surgery.</text><rect x="185" y="220" width="165" height="200" rx="12" fill="#fbf6ec" stroke="#241c15" stroke-width="3"/><text x="195" y="246.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#241c15" text-anchor="start">Clot in the vein</text><path d="M199 304 H277" stroke="#241c15" stroke-width="20" stroke-linecap="round"/><path d="M199 304 H277" stroke="#6f8fb8" stroke-width="14" stroke-linecap="round"/><ellipse cx="239" cy="304" rx="14" ry="5" fill="#2f3f6b"/><circle cx="317" cy="304" r="20" fill="#efd6c2" stroke="#241c15" stroke-width="2.5"/><path d="M297 302 Q297 278 317 280 Q337 278 337 302 L331 294 Q317 286 303 294 Z" fill="#6b4a34" stroke="#241c15" stroke-width="2"/><circle cx="310" cy="302" r="2.2" fill="#241c15"/><circle cx="324" cy="302" r="2.2" fill="#241c15"/><path d="M311 315 Q317 319 323 315" stroke="#241c15" stroke-width="2.2" fill="none" stroke-linecap="round"/><text x="195" y="360.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" fon