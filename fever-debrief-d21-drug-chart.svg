<svg xmlns="http://www.w3.org/2000/svg" id="fever-debrief-d21-drug-chart" viewBox="0 0 720 502" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Her drug chart</title><desc>A drug chart card with a dark header and three rows, two of them struck through with a note.</desc>
<rect width="720" height="502" fill="#fdf8ee"/>
<rect x="30" y="30" width="672" height="452" rx="8" fill="#241c15"/><rect x="24" y="24" width="672" height="452" rx="8" fill="#fbfaf6" stroke="#241c15" stroke-width="3" />
<rect x="24" y="24" width="672" height="64" rx="8" fill="#241c15"/>
<text font-size="28" font-weight="800" fill="#fdf8ee" text-anchor="start" ><tspan x="48.0" y="66.0">Drug chart: Simone Clarke</tspan></text>
<path d="M24 234 H696" stroke="#d9c9a6" stroke-width="3"/>
<text font-size="28" font-weight="700" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="160.0">Meropenem 1 g IV 8-hourly</tspan></text>
<text font-size="28" font-weight="700" fill="#3f7a3a" text-anchor="start" ><tspan x="48.0" y="194.0">keep</tspan></text>
<path d="M24 348 H696" stroke="#d9c9a6" stroke-width="3"/>
<text font-size="28" font-weight="700" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="274.0">Enoxaparin 40 mg SC at 18:00</tspan></text>
<path d="M44 265 H494" stroke="#c8531b" stroke-width="5" stroke-linecap="round"/>
<text font-size="28" font-weight="400" fill="#a53f12" text-anchor="start" ><tspan x="48.0" y="308.0">written at platelets 142; now 61, fibrinogen 1.4</tspan></text>
<path d="M24 462 H696" stroke="#d9c9a6" stroke-width="3"/>
<text font-size="28" font-weight="700" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="388.0">Ibuprofen 400 mg (her own)</tspan></text>
<path d="M44 379 H455" stroke="#c8531b" stroke-width="5" stroke-linecap="round"/>
<text font-size="28" font-weight="400" fill="#a53f12" text-anchor="start" ><tspan x="48.0" y="422.0">two or three times a day for six weeks</tspan></text>
</svg>
