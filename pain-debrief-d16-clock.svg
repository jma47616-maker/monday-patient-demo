<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" width="360" height="520">
  <title>The morning as a clock</title>
  <!-- Card 17. The morning as a vertical band from 06:40 to 14:00, coloured by the case's three endings (saved, resected, too late in words only), with the fastest route marked at 09:30. -->
  
  <rect width="360" height="520" rx="16" fill="#f3e5c8"/>
  <rect x="50" y="40.0" width="28" height="302.3" fill="#8fae8b" stroke="#241c15" stroke-width="2.5"/><rect x="50" y="342.3" width="28" height="77.7" fill="#e3b23c" stroke="#241c15" stroke-width="2.5"/><rect x="50" y="420.0" width="28" height="30" fill="#5a4a44" stroke="#241c15" stroke-width="2.5"/><path d="M44 40.0 h-6" stroke="#241c15" stroke-width="2"/><text x="34" y="45.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#241c15" text-anchor="end">06:40</text><path d="M44 186.8 h-6" stroke="#241c15" stroke-width="2"/><text x="34" y="191.8181818181818" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#241c15" text-anchor="end">09:30</text><path d="M44 342.3 h-6" stroke="#241c15" stroke-width="2"/><text x="34" y="347.27272727272725" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#241c15" text-anchor="end">12:30</text><path d="M44 420.0 h-6" stroke="#241c15" stroke-width="2"/><text x="34" y="425.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#241c15" text-anchor="end">14:00</text><text x="100" y="56.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#8d8577" text-anchor="start">Pain starts</text><text x="100" y="190.8181818181818" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#2f6b70" text-anchor="start">Seen. Scan in the first round,</text><text x="100" y="208.8181818181818" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#2f6b70" text-anchor="start">surgeons as soon as it is back</text><text x="100" y="274.5454545454545" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#3f6b3a" text-anchor="start">Flow back before 12:30:</text><text x="100" y="294.5454545454545" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#241c15" text-anchor="start">short ileal resection,</text><text x="100" y="312.5454545454545" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#241c15" text-anchor="start">home on day 12</text><text x="100" y="364.27272727272725" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#8a6410" text-anchor="start">Before 14:00: 1.5 m resected,</text><text x="100" y="384.27272727272725" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#241c15" text-anchor="start">second look, home at 5 weeks</text><text x="100" y="440.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#5a4a44" text-anchor="start">Later: too late</text><rect x="12" y="470" width="336" height="40" rx="8" fill="#fbf6ec" stroke="#241c15" stroke-width="2"/><text x="180" y="495" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#c2643c" text-anchor="middle">The sooner, the more bowel</text>
</svg>
