<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240">
  <!-- The bleep. Chunky grey-black plastic, three-quarter view, green LCD, red LED flashing, buzzing. Transparent: it sits on a red page. -->
  <defs>
    <linearGradient id="fpg-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a50"/>
      <stop offset="1" stop-color="#2c2c31"/>
    </linearGradient>
    <linearGradient id="fpg-lcd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9e8a2"/>
      <stop offset="1" stop-color="#8fd27a"/>
    </linearGradient>
    <radialGradient id="fpg-led" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#ffd0c8"/>
      <stop offset=".4" stop-color="#ff3b2a"/>
      <stop offset="1" stop-color="#9e1208"/>
    </radialGradient>
    <radialGradient id="fpg-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff5a40" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ff5a40" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- buzz lines, left -->
  <g fill="none" stroke="#fdf8ee" stroke-width="5" stroke-linecap="round">
    <path d="M40 92 q-10 26 0 52"><animate attributeName="opacity" values="1;.15;1" dur=".45s" repeatCount="indefinite"/></path>
    <path d="M20 78 q-16 40 0 80"><animate attributeName="opacity" values=".15;1;.15" dur=".45s" repeatCount="indefinite"/></path>
  </g>
  <!-- buzz lines, right -->
  <g fill="none" stroke="#fdf8ee" stroke-width="5" stroke-linecap="round">
    <path d="M320 92 q10 26 0 52"><animate attributeName="opacity" values="1;.15;1" dur=".45s" repeatCount="indefinite"/></path>
    <path d="M340 78 q16 40 0 80"><animate attributeName="opacity" values=".15;1;.15" dur=".45s" repeatCount="indefinite"/></path>
  </g>

  <!-- the whole pager shakes -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 180 124;-2.5 180 124;0 180 124;2.5 180 124;0 180 124" dur=".22s" repeatCount="indefinite"/>
    <!-- shadow -->
    <ellipse cx="186" cy="212" rx="118" ry="10" fill="#241c15" opacity=".35"/>
    <!-- side / depth face (three-quarter) -->
    <path d="M66 62 L80 50 L300 50 L300 186 L286 198 L66 198 Z" fill="#1e1e22" stroke="#241c15" stroke-width="4" stroke-linejoin="round"/>
    <path d="M286 62 L300 50 L300 186 L286 198 Z" fill="#151518" stroke="#241c15" stroke-width="3" stroke-linejoin="round"/>
    <!-- LED housing on the top edge -->
    <path d="M226 50 L236 40 L268 40 L258 50 Z" fill="#2c2c31" stroke="#241c15" stroke-width="3" stroke-linejoin="round"/>
    <!-- front face -->
    <rect x="66" y="62" width="220" height="136" rx="16" fill="url(#fpg-face)" stroke="#241c15" stroke-width="4"/>
    <!-- cel highlight -->
    <path d="M80 70 H272 Q280 70 280 78 V84 Q180 76 76 90 V78 Q76 70 80 70 Z" fill="#6a6a72" opacity=".55"/>
    <!-- grip ridges -->
    <g stroke="#1a1a1d" stroke-width="2.5" stroke-linecap="round">
      <path d="M78 150 V186 M86 150 V186 M94 150 V186"/>
    </g>
    <!-- LCD bezel -->
    <rect x="102" y="80" width="172" height="74" rx="8" fill="#1a1a1d" stroke="#241c15" stroke-width="3"/>
    <!-- LCD -->
    <rect x="110" y="87" width="156" height="60" rx="4" fill="url(#fpg-lcd)" stroke="#241c15" stroke-width="2">
      <animate attributeName="opacity" values="1;.82;1" dur=".9s" repeatCount="indefinite"/>
    </rect>
    <path d="M114 90 H262 V96 Q190 92 114 100 Z" fill="#e7fbd9" opacity=".5"/>
    <text x="188" y="113" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="18" font-weight="700" fill="#1b3a14" letter-spacing="1">2417 URGENT</text>
    <text x="188" y="136" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="15" font-weight="700" fill="#1b3a14" letter-spacing="1">AMU BED 14</text>
    <!-- buttons -->
    <rect x="112" y="164" width="40" height="20" rx="6" fill="#5a5a62" stroke="#241c15" stroke-width="3"/>
    <rect x="166" y="164" width="40" height="20" rx="6" fill="#5a5a62" stroke="#241c15" stroke-width="3"/>
    <rect x="220" y="164" width="40" height="20" rx="6" fill="#b8552e" stroke="#241c15" stroke-width="3"/>
    <path d="M118 168 H146 M172 168 H200 M226 168 H254" stroke="#fdf8ee" stroke-width="2" stroke-linecap="round" opacity=".35"/>
    <!-- belt clip peeking on the right side -->
    <path d="M300 80 L312 76 L312 160 L300 164 Z" fill="#3a3a40" stroke="#241c15" stroke-width="3" stroke-linejoin="round"/>
    <!-- red LED, flashing -->
    <circle cx="247" cy="40" r="22" fill="url(#fpg-glow)">
      <animate attributeName="opacity" values="1;0;1" dur=".6s" repeatCount="indefinite"/>
    </circle>
    <ellipse cx="247" cy="40" rx="9" ry="6" fill="url(#fpg-led)" stroke="#241c15" stroke-width="2.5">
      <animate attributeName="fill-opacity" values="1;.35;1" dur=".6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="244" cy="38" rx="3" ry="1.6" fill="#fff" opacity=".85"/>
  </g>
</svg>
