<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="His sister">
  <rect width="200" height="200" fill="#efe7da"/>
  <!-- outdoor coat, still zipped: she came straight from the car -->
  <path d="M22 200 C28 152 60 134 100 134 C140 134 172 152 178 200 Z" fill="#8d6a4f" stroke="#2b241d" stroke-width="4"/>
  <path d="M100 136 v64" fill="none" stroke="#2b241d" stroke-width="3.5"/>
  <path d="M78 142 L100 160 L122 142" fill="none" stroke="#2b241d" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M64 168 h14" stroke="#e8d9c4" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M122 168 h14" stroke="#e8d9c4" stroke-width="3.5" stroke-linecap="round"/>
  <!-- neck -->
  <path d="M88 112 h24 v28 c0 8 -24 8 -24 0 Z" fill="#e2c4a8" stroke="#2b241d" stroke-width="3.5"/>
  <!-- hair: shoulder length, pushed back, a bit undone -->
  <path d="M50 92 C46 44 72 22 100 22 C128 22 154 44 150 92 C148 116 146 128 142 140 C138 116 136 100 134 88 L66 88 C64 100 62 116 58 140 C54 128 52 116 50 92 Z"
        fill="#6a4a34" stroke="#2b241d" stroke-width="4" stroke-linejoin="round"/>
  <path d="M60 58 C68 34 86 26 100 26 C116 26 134 34 140 58 C128 44 114 40 100 42 C86 44 70 48 60 58 Z"
        fill="#6a4a34" stroke="#2b241d" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M56 74 q4 -14 12 -22" fill="none" stroke="#8c6a4e" stroke-width="3" stroke-linecap="round" opacity=".8"/>
  <!-- head -->
  <ellipse cx="100" cy="78" rx="42" ry="46" fill="#eccdb1" stroke="#2b241d" stroke-width="4"/>
  <!-- worried brows, drawn together and up at the inner ends -->
  <path d="M68 60 q13 -3 24 3" fill="none" stroke="#2b241d" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M132 60 q-13 -3 -24 3" fill="none" stroke="#2b241d" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M96 54 q4 6 0 12" fill="none" stroke="#2b241d" stroke-width="2.4" stroke-linecap="round" opacity=".6"/>
  <path d="M104 54 q-4 6 0 12" fill="none" stroke="#2b241d" stroke-width="2.4" stroke-linecap="round" opacity=".6"/>
  <!-- eyes, watching him rather than you -->
  <ellipse cx="83" cy="78" rx="10" ry="9" fill="#faf6f0" stroke="#2b241d" stroke-width="3.5"/>
  <ellipse cx="117" cy="78" rx="10" ry="9" fill="#faf6f0" stroke="#2b241d" stroke-width="3.5"/>
  <g fill="#2b241d">
    <circle cx="80" cy="79" r="4.2"><animate attributeName="cx" values="80;80;77;80" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="114" cy="79" r="4.2"><animate attributeName="cx" values="114;114;111;114" dur="6s" repeatCount="indefinite"/></circle>
  </g>
  <path d="M74 88 q9 4 17 0" fill="none" stroke="#9a8b7c" stroke-width="2.4" stroke-linecap="round" opacity=".7"/>
  <path d="M109 88 q9 4 17 0" fill="none" stroke="#9a8b7c" stroke-width="2.4" stroke-linecap="round" opacity=".7"/>
  <!-- nose -->
  <path d="M100 82 q4 10 -2 14" fill="none" stroke="#2b241d" stroke-width="3.2" stroke-linecap="round"/>
  <!-- mouth: pressed thin -->
  <path d="M88 110 q12 5 24 0" fill="none" stroke="#2b241d" stroke-width="3.4" stroke-linecap="round"/>
</svg>
