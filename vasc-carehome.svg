<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- The care home, on the phone: the night staff, unnamed. A handset and a transfer sheet. -->
  <rect width="120" height="120" fill="#f3e5c8"/>
  <circle cx="60" cy="60" r="56" fill="#faf0da" stroke="#241c15" stroke-width="3"/>
  <!-- transfer sheet behind -->
  <g transform="rotate(-10 70 66)">
    <rect x="52" y="40" width="40" height="52" rx="3" fill="#fdf8ee" stroke="#241c15" stroke-width="2.5"/>
    <path d="M58 50 H86 M58 58 H82 M58 66 H86 M58 74 H78 M58 82 H84" stroke="#a08c6e" stroke-width="2"/>
  </g>
  <!-- handset -->
  <g transform="rotate(-38 50 64)">
    <rect x="24" y="52" width="52" height="24" rx="12" fill="#4d6b5a" stroke="#241c15" stroke-width="3"/>
    <circle cx="34" cy="64" r="12" fill="#4d6b5a" stroke="#241c15" stroke-width="3"/>
    <circle cx="66" cy="64" r="12" fill="#4d6b5a" stroke="#241c15" stroke-width="3"/>
    <circle cx="34" cy="64" r="4" fill="#241c15"/><circle cx="66" cy="64" r="4" fill="#241c15"/>
  </g>
  <!-- ring waves -->
  <g fill="none" stroke="#c8531b" stroke-width="3" stroke-linecap="round">
    <path d="M84 30 q8 8 0 16"><animate attributeName="opacity" values="1;.2;1" dur="1.4s" repeatCount="indefinite"/></path>
    <path d="M92 24 q14 14 0 28"><animate attributeName="opacity" values=".2;1;.2" dur="1.4s" repeatCount="indefinite"/></path>
  </g>
  <text x="60" y="110" text-anchor="middle" font-family="Geist, sans-serif" font-size="11" font-weight="700" fill="#241c15">MEADOWCROFT</text>
</svg>
