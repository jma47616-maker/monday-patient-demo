<svg xmlns="http://www.w3.org/2000/svg" id="fitd14" viewBox="0 0 720 640" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>The same graph: the sodium line crosses the ceiling and is brought back under it</title><desc>The same axes and stepped ceiling. The sodium line starts at 112, climbs through the ceiling into the hatched area to a peak of 123, then bends back down under it. At the crossing: past 10 in 24 hours. At the bend, a telephone: Stop. Ring. Bring it back.</desc>
<rect width="720" height="640" fill="#fdf8ee"/>
<defs><pattern id="fitd14-hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="16" height="16" fill="#fbe4d3"/><path d="M4 0 V16" stroke="#f0a27c" stroke-width="5"/></pattern></defs><g id="fitd14-ceiling"><path d="M112 56 H676 V124 H440 V300 H112 Z" fill="url(#fitd14-hatch)"/><path d="M112 300 H440 V124 H676" fill="none" stroke="#241c15" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/></g><g id="fitd14-axes"><path d="M112 42 V552 H690" fill="none" stroke="#241c15" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M112 552 v14" stroke="#241c15" stroke-width="4" stroke-linecap="round"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="112.0" y="602.0">Start</tspan></text><path d="M216 552 v14" stroke="#241c15" stroke-width="4" stroke-linecap="round"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="216.0" y="602.0">1 hour</tspan></text><path d="M440 552 v14" stroke="#241c15" stroke-width="4" stroke-linecap="round"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="440.0" y="602.0">24 hours</tspan></text><path d="M676 552 v14" stroke="#241c15" stroke-width="4" stroke-linecap="round"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="end" ><tspan x="690.0" y="602.0">48 hours</tspan></text><path d="M100 520 H112" stroke="#241c15" stroke-width="4" stroke-linecap="round"/><text font-size="29" font-weight="800" fill="#241c15" text-anchor="end" ><tspan x="92.0" y="530.0">112</tspan></text></g><g id="fitd14-line"><path d="M112 520 L346 278 L440 322 L676 334" fill="none" stroke="#c8531b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="112" cy="520" r="10" fill="#c8531b" stroke="#241c15" stroke-width="3.5"/><circle cx="346" cy="278" r="10" fill="#fdf8ee" stroke="#241c15" stroke-width="4"/></g><g id="fitd14-crossing"><path d="M250 150 L320.7 292" stroke="#241c15" stroke-width="4" stroke-linecap="round"/><circle cx="324.7" cy="300" r="7" fill="#241c15"/><rect x="122.0" y="105.5" width="318.9" height="43.5" rx="9" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><text font-size="29" font-weight="800" fill="#a53f12" text-anchor="start" ><tspan x="134.0" y="136.0">Past 10 in 24 hours</tspan></text></g><g id="fitd14-peak"><rect x="312.3" y="220.5" width="79.4" height="45.0" rx="9" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><text font-size="30" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="352.0" y="252.0">123</tspan></text></g><g id="fitd14-ring"><path d="M398 392 L354 294" stroke="#241c15" stroke-width="4" stroke-linecap="round" stroke-dasharray="3 9"/><g transform="translate(408.0 432.0) scale(1.15)" ><path d="M-34 32 L-24 -4 H24 L34 32 Z" fill="#c8531b" stroke="#241c15" stroke-width="4" stroke-linejoin="round"/><circle cx="0" cy="14" r="11" fill="#fdf8ee" stroke="#241c15" stroke-width="3.5"/><circle cx="0" cy="14" r="3" fill="#241c15"/><path d="M-38 -12 C-30 -34 30 -34 38 -12" fill="none" stroke="#241c15" stroke-width="15" stroke-linecap="round"/><rect x="-50" y="-20" width="24" height="18" rx="6" fill="#241c15"/><rect x="26" y="-20" width="24" height="18" rx="6" fill="#241c15"/></g><text font-size="30" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="476.0" y="428.0">Stop. Ring.</tspan><tspan x="476.0" y="464.6">Bring it back</tspan></text></g>
</svg>
