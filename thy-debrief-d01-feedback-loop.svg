<svg xmlns="http://www.w3.org/2000/svg" id="thd01" viewBox="0 0 720 716" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>The hypothalamus, the pituitary and the thyroid as a loop</title><desc>A head and neck, front on. The hypothalamus at the base of the brain releases TRH; the pituitary just beneath it releases TSH; the thyroid in the front of the neck releases T4 and T3. A return arrow runs from the thyroid back up to both: hormone turns TSH down.</desc>
