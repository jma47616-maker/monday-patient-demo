<svg xmlns="http://www.w3.org/2000/svg" id="fitd12" viewBox="0 0 720 630" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>A seven-day strip: the fast rise on day 0, and a shaded band from day 2 to day 6</title><desc>Seven boxes numbered 0 to 6. Box 0 carries a steep upward arrow: sodium raised too fast. Boxes 2 to 6 are shaded: typically 2 to 6 days later. Beneath, three drawings: a mouth with speech marks, speech; a throat, swallowing; a figure with four limbs marked, all four limbs.</desc>
<rect width="720" height="630" fill="#fdf8ee"/>
<g id="fitd12-day-0"><text font-size="30" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="30.0" y="62.0">Sodium raised too fast</tspan></text><path d="M52 76 V98" stroke="#241c15" stroke-width="4" stroke-linecap="round"/></g><g id="fitd12-strip"><rect x="35.0" y="109" width="88" height="150" rx="12" fill="#241c15"/><rect x="30.0" y="104" width="88" height="150" rx="12" fill="#fdf8ee" stroke="#241c15" stroke-width="4"/><text font-size="44" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="74.0" y="232.0">0</tspan></text><rect x="130.3" y="109" width="88" height="150" rx="12" fill="#241c15"/><rect x="125.3" y="104" width="88" height="150" rx="12" fill="#fdf8ee" stroke="#241c15" stroke-width="4"/><text font-size="44" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="169.3" y="232.0">1</tspan></text><rect x="225.7" y="109" width="88" height="150" rx="12" fill="#241c15"/><rect x="220.7" y="104" width="88" height="150" rx="12" fill="#f0a27c" stroke="#241c15" stroke-width="4"/><text font-size="44" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="264.7" y="232.0">2</tspan></text><rect x="321.0" y="109" width="88" height="150" rx="12" fill="#241c15"/><rect x="316.0" y="104" width="88" height="150" rx="12" fill="#f0a27c" stroke="#241c15" stroke-width="4"/><text font-size="44" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="360.0" y="232.0">3</tspan></text><rect x="416.3" y="109" width="88" height="150" rx="12" fill="#241c15"/><rect x="411.3" y="104" width="88" height="150" rx="12" fill="#f0a27c" stroke="#241c15" stroke-width="4"/><text font-size="44" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="455.3" y="232.0">4</tspan></text><rect x="511.6" y="109" width="88" height="150" rx="12" fill="#241c15"/><rect x="506.6" y="104" width="88" height="150" rx="12" fill="#f0a27c" stroke="#241c15" stroke-width="4"/><text font-size="44" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="550.6" y="232.0">5</tspan></text><rect x="607.0" y="109" width="88" height="150" rx="12" fill="#241c15"/><rect x="602.0" y="104" width="88" height="150" rx="12" fill="#f0a27c" stroke="#241c15" stroke-width="4"/><text font-size="44" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="646.0" y="232.0">6</tspan></text><path d="M54.0 188.0 L80.8 142.9" stroke="#c8531b" stroke-width="10" stroke-linecap="round" fill="none"/><path d="M92.0 124.0 L95.0 151.3 L66.6 134.5 Z" fill="#c8531b" stroke="#c8531b" stroke-width="2" stroke-linejoin="round"/></g><g id="fitd12-band"><path d="M220.7 274 v16 H690.0 v-16" fill="none" stroke="#241c15" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><text font-size="30" font-weight="800" fill="#a53f12" text-anchor="middle" ><tspan x="455.3" y="338.0">Typically 2 to 6 days later</tspan></text></g><g id="fitd12-sign-1"><rect x="36" y="392" width="200" height="170" rx="14" fill="#241c15"/><rect x="30" y="386" width="200" height="170" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3"/><g transform="translate(130.0 484.0) scale(1.2)" ><path d="M-44 0 C-26 -22 -10 -24 0 -16 C10 -24 26 -22 44 0 C26 24 -26 24 -44 0 Z" fill="#c9584a" stroke="#241c15" stroke-width="4" stroke-linejoin="round"/><path d="M-44 0 C-20 6 20 6 44 0" fill="none" stroke="#241c15" stroke-width="3.5" stroke-linecap="round"/><path d="M-8 -62 c-12 4 -16 14 -14 24 a9 9 0 1 0 8 -9 c0 -6 3 -9 8 -11 Z" fill="#241c15"/><path d="M22 -62 c-12 4 -16 14 -14 24 a9 9 0 1 0 8 -9 c0 -6 3 -9 8 -11 Z" fill="#241c15"/></g><text font-size="30" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="130.0" y="604.0">Speech</tspan></text></g><g id="fitd12-sign-2"><rect x="266" y="392" width="200" height="170" rx="14" fill="#241c15"/><rect x="260" y="386" width="200" height="170" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3"/><g transform="translate(360.0 472.0) scale(1.05)" ><path d="M-46 -52 C-40 -30 -30 -22 -24 -16 V52 H24 V-16 C30 