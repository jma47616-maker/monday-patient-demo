<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 626" width="550" height="626">
  <title>The scanner's report page</title>
  <!-- A scanner's printed report page: a heading, one large figure, blank fields and a circle with cross-hairs. To change the reading, set the text of csn-vol (digits only); to resize the grey shape, set the scale on csn-outline. -->
  <defs><filter id="csn-soft" x="-2%" y="-2%" width="104%" height="104%"><feGaussianBlur stdDeviation=".45"/></filter></defs>
  <rect width="550" height="626" fill="#e7ecf3"/>
  <rect x="0" y="24" width="550" height="594" fill="#fdfdfd"/>
  <g filter="url(#csn-soft)" font-family="Verdana, 'DejaVu Sans', Geneva, Tahoma, sans-serif" fill="#111111">
    <text x="278" y="64" font-size="21" font-weight="700" text-anchor="middle">Bladder scan</text>
    <path d="M6 72 H526" stroke="#222222" stroke-width="1.3"/>
    <text x="281" y="172" font-size="70" font-weight="700" text-anchor="middle" xml:space="preserve"><tspan id="csn-vol">999</tspan><tspan id="csn-unit"> mL</tspan></text>
    <g font-size="15.500" fill="#222222"><text x="8" y="205">Patient Name</text><text x="8" y="270">Patient ID</text><text x="8" y="333">Date of Birth</text><text x="8" y="396">Patient Sex</text><text x="8" y="460">Procedure Code</text><text x="8" y="524">Operator ID</text><text x="8" y="587">Signature</text></g>
    <rect x="6" y="212" width="60" height="23" fill="#4f93d8" stroke="#3a6fa8" stroke-width="1"/><rect x="6" y="277" width="60" height="23" fill="#4f93d8" stroke="#3a6fa8" stroke-width="1"/><rect x="6" y="531" width="60" height="23" fill="#4f93d8" stroke="#3a6fa8" stroke-width="1"/>
    <text x="330" y="391" font-size="18" text-anchor="middle" fill="#222222">C-Mode</text>
    <circle cx="395" cy="515" r="93" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
    <g transform="translate(395 515)">
      <g id="csn-outline" transform="scale(1.0000)">
        <path d="M84.5 0.0 L81.9 14.0 L75.4 26.6 L68.1 38.1 L60.6 49.3 L51.2 59.2 L39.1 65.6 L25.4 67.8 L12.3 67.7 L0.0 68.6 L-12.9 70.9 L-27.0 72.0 L-40.8 68.5 L-52.0 60.1 L-60.6 49.3 L-68.1 38.1 L-75.4 26.6 L-80.7 13.8 L-81.1 0.0 L-76.6 -13.1 L-69.8 -24.6 L-63.8 -35.7 L-58.6 -47.7 L-51.5 -59.5 L-40.8 -68.5 L-27.3 -72.7 L-13.3 -73.4 L-0.0 -73.4 L13.3 -73.4 L26.8 -71.6 L39.1 -65.6 L48.5 -56.1 L56.0 -45.6 L63.8 -35.7 L73.0 -25.8 L81.1 -13.9 Z" fill="#c2c2c2" stroke="#4a4a4a" stroke-width="1.1" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      </g>
    </g>
    <path d="M302 515 H489 M395 420 V608" stroke="#222222" stroke-width="1.3"/>
  </g>
</svg>
