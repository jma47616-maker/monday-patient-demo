<svg xmlns="http://www.w3.org/2000/svg" id="panc-db-d16-fluid" viewBox="0 0 720 834" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Moderate against aggressive fluid: two pairs of bars</title><desc>Two regimens. Moderate: 10 mL/kg if dry, then 1.5 mL/kg an hour. Aggressive: 20 mL/kg, then 3 mL/kg an hour. Fluid overload: moderate 6.3%, aggressive 20.5%, three times as common with aggressive fluid. Moderately severe or severe attacks: moderate 17.3%, aggressive 22.1%, not reduced by aggressive fluid. The WATERFALL trial (2022) stopped early. Older, higher rates were written before it.</desc>
<rect width="720" height="834" fill="#fdf8ee"/>
<g id="panc-db-d16-moderate"><rect x="30" y="30" width="326" height="150" rx="14" fill="#241c15"/><rect x="24" y="24" width="326" height="150" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3" /><rect x="44" y="44" width="34" height="34" rx="8" fill="#b9c6dc" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="92.0" y="71.0">Moderate</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="46.0" y="118.0">10 mL/kg if dry,</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="46.0" y="150.0">then 1.5 mL/kg an hour</tspan></text></g><g id="panc-db-d16-aggressive"><rect x="376" y="30" width="326" height="150" rx="14" fill="#241c15"/><rect x="370" y="24" width="326" height="150" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3" /><rect x="390" y="44" width="34" height="34" rx="8" fill="#c8531b" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="438.0" y="71.0">Aggressive</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="392.0" y="118.0">20 mL/kg,</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="392.0" y="150.0">then 3 mL/kg an hour</tspan></text></g><g id="panc-db-d16-overload"><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="24.0" y="236.0">Fluid overload</tspan></text><text font-size="28" font-weight="700" fill="#241c15" text-anchor="end" ><tspan x="234.0" y="296.0">Moderate</tspan></text><rect x="250" y="262" width="105.8" height="48" rx="6" fill="#b9c6dc" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="367.8" y="296.0">6.3%</tspan></text><text font-size="28" font-weight="700" fill="#241c15" text-anchor="end" ><tspan x="234.0" y="358.0">Aggressive</tspan></text><rect x="250" y="324" width="344.4" height="48" rx="6" fill="#c8531b" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="606.4" y="358.0">20.5%</tspan></text><path d="M250 250 V384" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="800" fill="#a53f12" text-anchor="start" ><tspan x="24.0" y="424.0">Three times as common with aggressive fluid</tspan></text></g><g id="panc-db-d16-severity"><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="24.0" y="482.0">Moderately severe or severe attacks</tspan></text><text font-size="28" font-weight="700" fill="#241c15" text-anchor="end" ><tspan x="234.0" y="542.0">Moderate</tspan></text><rect x="250" y="508" width="290.6" height="48" rx="6" fill="#b9c6dc" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="552.6" y="542.0">17.3%</tspan></text><text font-size="28" font-weight="700" fill="#241c15" text-anchor="end" ><tspan x="234.0" y="604.0">Aggressive</tspan></text><rect x="250" y="570" width="371.3" height="48" rx="6" fill="#c8531b" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="633.3" y="604.0">22.1%</tspan></text><path d="M250 496 V630" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="800" fill="#a53f12" text-anchor="start" ><tspan x="24.0" y="670.0">Not reduced by aggressive fluid</tspan></text></g><rect x="28" y="702" width="672" height="110" rx="14" fill="#241c15"/><rect x="24" y="698" width="672" height="110" rx="14" fill="#fdf8ee" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="740.0">The WATERFALL trial (2022) stopped early.</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="48.0" y="774.0">Older, higher rates were written before it.</tspan></text>
</svg>
