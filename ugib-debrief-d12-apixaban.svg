<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 870" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>What does and does not work against apixaban</title><desc>Apixaban in the centre. Ticked: stop it; time, it wears off over 12 to 24 hours. Crossed: vitamin K; fresh frozen plasma; INR and APTT, unreliable for this drug. Amber, with a telephone: reversal agent, haematology, life-threatening bleeding only.</desc>
