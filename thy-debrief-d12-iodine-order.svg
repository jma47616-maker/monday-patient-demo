<svg xmlns="http://www.w3.org/2000/svg" id="thd12" viewBox="0 0 720 1056" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Iodine before or after the thionamide: the same drug, two results</title><desc>Two panels using the same workshop gland. Top, iodine first: the workshop is running and the door is open, so the iodine arriving becomes raw material for more hormone, which pours out. Bottom, thionamide first and iodine an hour later: a padlock on the workshop, the same iodine arriving, and the door now held shut: making blocked, release blocked. Wolff–Chaikoff: making. Plummer: release.</desc>
