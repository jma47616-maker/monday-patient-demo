<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Joanne, the night senior carer: coat still on, transfer sheet in hand, frightened but steady. -->
  <rect width="120" height="120" fill="#f3e5c8"/>
  <circle cx="60" cy="60" r="56" fill="#faf0da" stroke="#241c15" stroke-width="3"/>
  <!-- coat -->
  <path d="M28 120 L34 92 Q60 82 86 92 L92 120 Z" fill="#4d6b5a" stroke="#241c15" stroke-width="3"/>
  <path d="M60 86 L60 120" stroke="#241c15" stroke-width="2"/>
  <!-- lanyard -->
  <path d="M50 92 L56 116 M70 92 L64 116" stroke="#c8531b" stroke-width="2.5"/>
  <rect x="54" y="112" width="12" height="8" rx="1.5" fill="#fdf8ee" stroke="#241c15" stroke-width="2"/>
  <!-- transfer sheet -->
  <g transform="rotate(-8 24 100)">
    <rect x="12" y="92" width="22" height="26" rx="2" fill="#fdf8ee" stroke="#241c15" stroke-width="2.5"/>
    <path d="M16 99 H30 M16 104 H28 M16 109 H30" stroke="#a08c6e" stroke-width="1.6"/>
  </g>
  <!-- neck, head -->
  <path d="M50 84 H70 V92 H50 Z" fill="#d9a77c" stroke="#241c15" stroke-width="3"/>
  <ellipse cx="60" cy="58" rx="27" ry="31" fill="#e9b892" stroke="#241c15" stroke-width="3"/>
  <ellipse cx="66" cy="62" rx="20" ry="25" fill="#d6996f" opacity=".35"/>
  <!-- hair: scraped back for a night shift -->
  <path d="M33 56 Q33 26 60 25 Q87 26 87 56 Q78 40 60 38 Q42 40 33 56 Z" fill="#3b2a1e" stroke="#241c15" stroke-width="3"/>
  <circle cx="86" cy="42" r="8" fill="#3b2a1e" stroke="#241c15" stroke-width="3"/>
  <!-- brows raised: worried -->
  <path d="M46 46 q7 -7 14 -3 M60 43 q7 -4 14 3" fill="none" stroke="#3b2a1e" stroke-width="3.2" stroke-linecap="round"/>
  <!-- eyes -->
  <ellipse cx="51" cy="56" rx="4.5" ry="4.5" fill="#fff" stroke="#241c15" stroke-width="2"/>
  <ellipse cx="70" cy="56" rx="4.5" ry="4.5" fill="#fff" stroke="#241c15" stroke-width="2"/>
  <circle cx="52" cy="56.5" r="2.2" fill="#241c15"/>
  <circle cx="71" cy="56.5" r="2.2" fill="#241c15"/>
  <!-- nose, mouth pressed -->
  <path d="M60 58 q-3 8 1 11" fill="none" stroke="#241c15" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M52 78 q8 -3 16 0" fill="none" stroke="#241c15" stroke-width="2.4" stroke-linecap="round"/>
  <!-- tired shadows -->
  <path d="M46 62 q5 3 10 0 M65 62 q5 3 10 0" fill="none" stroke="#b07a5a" stroke-width="1.5" opacity=".6"/>
  <!-- blinking -->
  <rect x="46" y="51" width="11" height="11" fill="#e9b892" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.85;.88;.91;1" dur="4.3s" repeatCount="indefinite"/>
  </rect>
  <rect x="65" y="51" width="11" height="11" fill="#e9b892" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.85;.88;.91;1" dur="4.3s" repeatCount="indefinite"/>
  </rect>
</svg>
