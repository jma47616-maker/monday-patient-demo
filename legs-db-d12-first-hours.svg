<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 980" width="600" height="980">
  <title>Six things to do in the first hours, in order</title>
  <!-- Six numbered blocks stacked down the page with arrows between, the six triggers for critical care in a box inside block 3, and a rail down the whole left side. Labels: rows 12.03 to 12.12, 12.14, 12.18 to 12.20 and 12.22. -->
  <rect width="600" height="980" fill="#faf0da"/>
  <rect x="12" y="20" width="34" height="902" rx="17" fill="#c8531b" stroke="#241c15" stroke-width="4"/><g transform="translate(36 472) rotate(-90)"><text x="0" y="0" text-anchor="middle" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fdf8ee">Keep measuring</text></g><path d="M22 884 L29 898 L36 884" fill="none" stroke="#fdf8ee" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 70 L29 84 L36 70" fill="none" stroke="#fdf8ee" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="69" y="25" width="520" height="86" rx="12" fill="#241c15"/><rect x="64" y="20" width="520" height="86" rx="12" fill="#fdf8ee" stroke="#241c15" stroke-width="4"/><circle cx="96" cy="52" r="19" fill="#c8531b" stroke="#241c15" stroke-width="4"/><text x="96" y="60" text-anchor="middle" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#fdf8ee">1</text><text x="128" y="60" text-anchor="start" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#241c15"><tspan font-weight="700">Measure.</tspan> His vital capacity, at first</text><text x="128" y="89" text-anchor="start" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#241c15">assessment.</text><path d="M96 113 V127 M88 120 L96 129 L104 120" fill="none" stroke="#241c15" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="69" y="139" width="520" height="86" rx="12" fill="#241c15"/><rect x="64" y="134" width="520" height="86" rx="12" fill="#fdf8ee" stroke="#241c15" stroke-width="4"/><circle cx="96" cy="166" r="19" fill="#c8531b" stroke="#241c15" stroke-width="4"/><text x="96" y="174" text-anchor="middle" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#fdf8ee">2</text><text x="128" y="174" text-anchor="start" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#241c15"><tspan font-weight="700">Repeat.</tspan> Four-hourly or closer, and</text><text x="128" y="203" text-anchor="start" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#241c15">act on the trend.</text><path d="M96 227 V241 M88 234 L96 243 L104 234" fill="none" stroke="#241c15" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="69" y="253" width="520" height="304" rx="12" fill="#241c15"/><rect x="64" y="248" width="520" height="304" rx="12" fill="#fdf8ee" stroke="#241c15" stroke-width="4"/><circle cx="96" cy="280" r="19" fill="#c8531b" stroke="#241c15" stroke-width="4"/><text x="96" y="288" text-anchor="middle" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#fdf8ee">3</text><text x="128" y="288" text-anchor="start" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#241c15"><tspan font-weight="700">Call.</tspan> Neurology immediately.</text><rect x="82" y="306" width="484" height="232" rx="10" fill="#fbe4d3" stroke="#a53f12" stroke-width="3.5"/><text x="98" y="338" text-anchor="start" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#a53f12">Critical care on any one of these:</text><circle cx="106" cy="364" r="5" fill="#a53f12"/><text x="120" y="371" text-anchor="start" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#241c15">Vital capacity under 20 mL/kg</text><circle cx="106" cy="395" r="5" fill="#a53f12"/><text x="120" y="402" text-anchor="start" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#241c15">A fall of more than 30%</text><circle cx="106" cy="426" r="5" fill="#a53f12"/><text x="120" y="433" text-anchor="start" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#241c15">Cannot count to 20 on one breath</text><circle cx="106" cy="457" r="5" fill="#a53f12"/><text x="120" y="464" text-anchor="start" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#241c15">Aspiration, or the threat of it</text><circle cx="106" cy="488" r="5" fill="#a53f12"/><text x="120" y="495" text-anchor="start" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#241c15">Unstable pulse or blood pressure</text><circle cx="106" cy="519" r="5" fill="#a53f12"/><text x="120" y="526" text-anchor="start" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#241c15">The swallow or the neck getting weaker</text><path d="M96 559 V573 M88 566 L96 575 L104 566" fill="none" stroke="#241c15" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="69" y="585" width="520" height="86" rx="12" fill="#241c15"/><rect x="64" y="580" width="520" height="86" rx="12" fill="#fdf8ee" stroke="#241c15" stroke-width="4"/><circle cx="96" cy="612" r="19" fill="#c8531b" stroke="#241c15" stroke-width="4"/><text x="96" y="620" text-anchor="middle" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#fdf8ee">4</text><text x="128" y="620" text-anchor="start" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#241c15"><tspan font-weight="700">Protect the swallow.</tspan> Assess it</text><text x="128" y="649" text-anchor="start" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#241c15">before anything goes in by mouth.</text><path d="M96 673 V687 M88 680 L96 689 L104 680" fill="none" stroke="#241c15" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="69" y="699" width="520" height="114" rx="12" fill="#241c15"/><rect x="64" y="694" width="520" height="114" rx="12" fill="#fdf8ee" stroke="#241c15" stroke-width="4"/><circle cx="96" cy="726" r="19" fill="#c8531b" stroke="#241c15" stroke-width="4"/><text x="96" y="734" text-anchor="middle" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#fdf8ee">5</text><text x="128" y="734" text-anchor="start" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#241c15"><tspan font-weight="700">Monitor.</tspan> A 12-lead ECG.</text><text x="128" y="763" text-anchor="start" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#241c15">A cardiac monitor and regular blood</text><text x="128" y="792" text-anchor="start" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#241c15">pressure.</text><path d="M96 815 V829 M88 822 L96 831 L104 822" fill="none" stroke="#241c15" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="69" y="841" width="520" height="86" rx="12" fill="#241c15"/><rect x="64" y="836" width="520" height="86" rx="12" fill="#fdf8ee" stroke="#241c15" stroke-width="4"/><circle cx="96" cy="868" r="19" fill="#c8531b" stroke="#241c15" stroke-width="4"/><text x="96" y="876" text-anchor="middle" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#fdf8ee">6</text><text x="128" y="876" text-anchor="start" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#241c15"><tspan font-weight="700">Treat.</tspan> One immunotherapy, without</text><text x="128" y="905" text-anchor="start" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#241c15">waiting for a test.</text>
</svg>
