<svg xmlns="http://www.w3.org/2000/svg" id="panc-db-d07-stone" viewBox="0 0 720 690" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>A gallstone stuck in the shared outlet, with juice backing up both ducts</title><desc>Close up of the outlet. The bowel wall (duodenum) runs down the left. The bile duct comes down from above and the pancreatic duct comes in from the gland on the right; they join and pass through the wall at one shared outlet, the ampulla. A stone is stuck in that outlet. Arrows show bile backing up the bile duct and juice backing up the pancreatic duct into the gland, where the juice is switched on.</desc>
