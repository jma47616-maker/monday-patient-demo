<title>One filter: a way in, a way out and the pressure between them</title><desc>One kidney filter drawn as a small bag with a vessel in, a vessel out and a pressure dial reading low. Low fluid: less arrives. NSAID: the way in will not widen. ACE inhibitor or ARB: the way out widens.</desc>
