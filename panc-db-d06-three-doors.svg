<svg xmlns="http://www.w3.org/2000/svg" id="panc-db-d06-three-doors" viewBox="0 0 720 1165" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Three doors into the cell, with the causes that use each</title><desc>Three doors, one under the other. Door 1, a blocked duct (ductal obstruction): alcohol, gallstones, after ERCP, cancers, mucinous tumours, pancreas divisum, sphincter of Oddi dysfunction. Door 2, an injured cell (acinar cell injury): alcohol, trauma, poor blood supply (ischaemia), drugs (corticosteroids, azathioprine, thiazides), viruses. Door 3, a cell that mishandles its own contents (defective intracellular transport): alcohol, hereditary, high calcium, high triglycerides, autoimmune. Alcohol is behind all three doors.</desc>
<rect width="720" height="1165" fill="#fdf8ee"/>
<g id="panc-db-d06-door-1"><rect x="30" y="30" width="672" height="349.20000000000005" rx="14" fill="#241c15"/><rect x="24" y="24" width="672" height="349.20000000000005" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3" /><g transform="translate(76.0 88.0) scale(0.7)" ><rect x="-40" y="-62" width="80" height="124" rx="4" fill="#241c15"/><rect x="-34" y="-56" width="68" height="112" rx="3" fill="#f6cfc4" stroke="#241c15" stroke-width="3"/><rect x="-24" y="-46" width="48" height="40" rx="3" fill="none" stroke="#241c15" stroke-width="2.5"/><rect x="-24" y="4" width="48" height="40" rx="3" fill="none" stroke="#241c15" stroke-width="2.5"/><circle cx="22" cy="0" r="5" fill="#e0a521" stroke="#241c15" stroke-width="2"/><rect x="-50" y="-10" width="100" height="20" rx="5" fill="#463a2c" stroke="#241c15" stroke-width="3" transform="rotate(-12)"/></g><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="128.0" y="68.0">Door 1: a blocked duct</tspan></text><text font-size="28" font-weight="700" fill="#a53f12" text-anchor="start" ><tspan x="128.0" y="106.2">(ductal obstruction)</tspan></text><rect x="46.0" y="142.0" width="136.9" height="44.8" rx="22.4" fill="#c8531b" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="700" fill="#fdf8ee" text-anchor="middle" ><tspan x="114.4" y="174.5">Alcohol</tspan></text><rect x="192.9" y="142.0" width="184.2" height="44.8" rx="22.4" fill="#fdf8ee" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="285.0" y="174.5">Gallstones</tspan></text><rect x="387.1" y="142.0" width="197.2" height="44.8" rx="22.4" fill="#fdf8ee" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="485.7" y="174.5">After ERCP</tspan></text><rect x="46.0" y="196.8" width="148.6" height="44.8" rx="22.4" fill="#fdf8ee" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="120.3" y="229.3">Cancers</tspan></text><rect x="204.6" y="196.8" width="304.5" height="44.8" rx="22.4" fill="#fdf8ee" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="356.9" y="229.3">Mucinous tumours</tspan></text><rect x="46.0" y="251.6" width="295.4" height="44.8" rx="22.4" fill="#fdf8ee" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="193.7" y="284.1">Pancreas divisum</tspan></text><rect x="46.0" y="306.4" width="473.8" height="44.8" rx="22.4" fill="#fdf8ee" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="282.9" y="338.9">Sphincter of Oddi dysfunction</tspan></text></g><g id="panc-db-d06-door-2"><rect x="30" y="405.20000000000005" width="672" height="381.39999999999986" rx="14" fill="#241c15"/><rect x="24" y="399.20000000000005" width="672" height="381.39999999999986" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3" /><g transform="translate(76.0 463.2) scale(0.7)" ><rect x="-40" y="-62" width="80" height="124" rx="4" fill="#241c15"/><rect x="-34" y="-56" width="68" height="112" rx="3" fill="#f6cfc4" stroke="#241c15" stroke-width="3"/><rect x="-24" y="-46" width="48" height="40" rx="3" fill="none" stroke="#241c15" stroke-width="2.5"/><rect x="-24" y="4" width="48" height="40" rx="3" fill="none" stroke="#241c15" stroke-width="2.5"/><circle cx="22" cy="0" r="5" fill="#e0a521" stroke="#241c15" stroke-width="2"/><path d="M-8 -56 L4 -26 L-10 -6 L8 22 L-2 56" fill="none" stroke="#241c15" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/></g><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="128.0" y="443.2">Door 2: an injured cell</tspan></text><text font-size="28" font-weight="700" fill="#a53f12" text-anchor="start" ><tspan x="128.0" y="481.4">(acinar cell injury)</tspan></text><rect x="46.0" y="517.2" width="136.9" height="44.8" rx="22.4" fill="#c8531b" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="700" fill="#fdf8ee" text-anchor="middle" ><tspan x="114.4" y="549.7">Alcohol</tspan></text><rect x="192.9" y="517.2" width="140.8" height="44.8" rx="22.4" fill="#fdf8ee" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="263.3" y="549.7">Trauma</tspan></text><rect x="46.0" y="572.0" width="484.2" height="44.8" rx="22.4" fill="#fdf8ee" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="288.1" y="604.5">Poor blood supply (ischaemia)</tspan></text><rect x="46.0" y="626.8" width="570.7" height="77.0" rx="18.0" fill="#fdf8ee" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="331.3" y="659.3">Drugs: corticosteroids, azathioprine,</tspan><tspan x="331.3" y="691.5">thiazides</tspan></text><rect x="46.0" y="713.8" width="139.5" height="44.8" rx="22.4" fill="#fdf8ee" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="115.7" y="746.3">Viruses</tspan></text></g><g id="panc-db-d06-door-3"><rect x="30" y="812.5999999999999" width="672" height="256.0" rx="14" fill="#241c15"/><rect x="24" y="806.5999999999999" width="672" height="256.0" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3" /><g transform="translate(76.0 870.6) scale(0.7)" ><rect x="-40" y="-62" width="80" height="124" rx="4" fill="#241c15"/><rect x="-34" y="-56" width="68" height="112" rx="3" fill="#f6cfc4" stroke="#241c15" stroke-width="3"/><rect x="-24" y="-46" width="48" height="40" rx="3" fill="none" stroke="#241c15" stroke-width="2.5"/><rect x="-24" y="4" width="48" height="40" rx="3" fill="none" stroke="#241c15" stroke-width="2.5"/><circle cx="22" cy="0" r="5" fill="#e0a521" stroke="#241c15" stroke-width="2"/><path d="M-18 -20 C-30 0 10 10 -2 26 C-12 40 18 44 20 30" fill="none" stroke="#c8531b" stroke-width="5" stroke-linecap="round"/><circle cx="-18" cy="-24" r="7" fill="#e0a521" stroke="#241c15" stroke-width="2.5"/><path d="M20.0 30.0 L24.7 45.6 L6.4 38.9 Z" fill="#c8531b" stroke="#c8531b" stroke-width="2" stroke-linejoin="round"/></g><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="128.0" y="850.6">Door 3: a cell that mishandles its</tspan><tspan x="128.0" y="882.8">own contents</tspan></text><text font-size="28" font-weight="700" fill="#a53f12" text-anchor="start" ><tspan x="128.0" y="921.0">(defective intracellular transport)</tspan></text><rect x="46.0" y="941.0" width="136.9" height="44.8" rx="22.4" fill="#c8531b" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="700" fill="#fdf8ee" text-anchor="middle" ><tspan x="114.4" y="973.5">Alcohol</tspan></text><rect x="192.9" y="941.0" width="180.3" height="44.8" rx="22.4" fill="#fdf8ee" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="283.0" y="973.5">Hereditary</tspan></text><rect x="383.2" y="941.0" width="221.0" height="44.8" rx="22.4" fill="#fdf8ee" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="493.7" y="973.5">High calcium</tspan></text><rect x="46.0" y="995.8" width="289.9" height="44.8" rx="22.4" fill="#fdf8ee" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="190.9" y="1028.3">High triglycerides</tspan></text><rect x="345.9" y="995.8" width="213.5" height="44.8" rx="22.4" fill="#fdf8ee" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="452.6" y="1028.3">Autoimmune</tspan></text></g>