<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 906" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Aspirin in an upper GI bleed: the answer depends on why it is taken</title><desc>A decision fork. Why is this patient on aspirin? Heart attack, stroke or stent in the past: continue, and if stopped restart within days. No cardiovascular disease: stop, and ask if it is needed at all. Separately: an NSAID such as naproxen, always stop.</desc>
<rect width="720" height="906" fill="#fdf8ee"/>
<rect x="110" y="20" width="500" height="124" rx="18" fill="#241c15" stroke="#241c15" stroke-width="3"/><text font-size="32" font-weight="800" fill="#fdf8ee" text-anchor="middle" ><tspan x="360.0" y="70.0">Why is this patient</tspan><tspan x="360.0" y="108.4">on aspirin?</tspan></text><path d="M360 144 V186 M191 222 V186 H529 V222" fill="none" stroke="#241c15" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><rect x="36" y="230" width="322" height="176" rx="16" fill="#241c15"/><rect x="30" y="224" width="322" height="176" rx="16" fill="#faf0da" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="191.0" y="276.0">Heart attack,</tspan><tspan x="191.0" y="311.0">stroke or stent</tspan><tspan x="191.0" y="346.0">in the past</tspan></text><rect x="374" y="230" width="322" height="176" rx="16" fill="#241c15"/><rect x="368" y="224" width="322" height="176" rx="16" fill="#faf0da" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="529.0" y="294.0">No cardiovascular</tspan><tspan x="529.0" y="329.0">disease</tspan></text><path d="M191.0 412.0 L191.0 442.0" stroke="#241c15" stroke-width="9" stroke-linecap="round" fill="none"/><path d="M191.0 462.0 L176.0 442.0 L206.0 442.0 Z" fill="#241c15" stroke="#241c15" stroke-width="2" stroke-linejoin="round"/><path d="M529.0 412.0 L529.0 442.0" stroke="#241c15" stroke-width="9" stroke-linecap="round" fill="none"/><path d="M529.0 462.0 L514.0 442.0 L544.0 442.0 Z" fill="#241c15" stroke="#241c15" stroke-width="2" stroke-linejoin="round"/><rect x="36" y="476" width="322" height="214" rx="16" fill="#241c15"/><rect x="30" y="470" width="322" height="214" rx="16" fill="#e6f0e6" stroke="#241c15" stroke-width="3"/><circle cx="191" cy="514" r="26" fill="#3f7d52" stroke="#241c15" stroke-width="3"/><path d="M179.3 514.5 L188.4 523.9 L203.5 504.6" fill="none" stroke="#fdf8ee" stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="191.0" y="580.0">Continue.</tspan><tspan x="191.0" y="615.0">If stopped, restart</tspan><tspan x="191.0" y="650.0">within days</tspan></text><rect x="374" y="476" width="322" height="214" rx="16" fill="#241c15"/><rect x="368" y="470" width="322" height="214" rx="16" fill="#fbe4d3" stroke="#241c15" stroke-width="3"/><circle cx="529" cy="514" r="26" fill="#c8531b" stroke="#241c15" stroke-width="3"/><rect x="514" y="499" width="30" height="30" rx="4" fill="#fdf8ee"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="529.0" y="580.0">Stop, and ask</tspan><tspan x="529.0" y="615.0">if it is needed</tspan><tspan x="529.0" y="650.0">at all</tspan></text><path d="M30 724 H690" stroke="#d9c9a6" stroke-width="4" stroke-dasharray="4 12" stroke-linecap="round"/><rect x="36" y="762" width="660" height="120" rx="16" fill="#b23b2e"/><rect x="30" y="756" width="660" height="120" rx="16" fill="#fdf8ee" stroke="#b23b2e" stroke-width="5"/><circle cx="84" cy="816" r="27" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><path d="M73.2 805.2 L94.8 826.8 M94.8 805.2 L73.2 826.8" fill="none" stroke="#b23b2e" stroke-width="6.5" stroke-linecap="round"/><text font-size="29" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="130.0" y="806.0">NSAID such as naproxen:</tspan><tspan x="130.0" y="841.4">always stop</tspan></text>
</svg>
