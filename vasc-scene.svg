<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <!-- Resus bay 3 at 02:40. Lights dimmed, Walter under a sheet with cannulae in. Nobody came with him: a transfer sheet on the locker, and the phone. -->
  <defs>
    <linearGradient id="vsc-night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2a3a"/>
      <stop offset="1" stop-color="#4a4356"/>
    </linearGradient>
    <linearGradient id="vsc-lamp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9b0" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffe9b0" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="360" fill="url(#vsc-night)"/>
  <rect x="0" y="120" width="800" height="14" fill="#3a3646" stroke="#241c15" stroke-width="3"/>
  <rect x="470" y="40" width="150" height="70" rx="6" fill="#2a2734" stroke="#241c15" stroke-width="3"/>
  <rect x="490" y="52" width="110" height="46" rx="3" fill="#0f2a22"/>
  <text x="498" y="70" font-family="ui-monospace,monospace" font-size="13" fill="#7dd3a0">HR 124</text>
  <text x="498" y="90" font-family="ui-monospace,monospace" font-size="13" fill="#7dd3a0">SpO₂ 94 · 4L</text>
  <polyline points="560,84 566,84 569,72 573,94 577,84 596,84" fill="none" stroke="#7dd3a0" stroke-width="2">
    <animate attributeName="points" values="560,84 566,84 569,72 573,94 577,84 596,84;560,84 562,84 565,72 569,94 573,84 596,84;560,84 566,84 569,72 573,94 577,84 596,84" dur="1.1s" repeatCount="indefinite"/>
  </polyline>
  <path d="M250 0 L150 200 L560 200 L460 0 Z" fill="url(#vsc-lamp)"/>
  <!-- bed -->
  <rect x="130" y="205" width="470" height="60" rx="10" fill="#dfe7e3" stroke="#241c15" stroke-width="4"/>
  <rect x="130" y="265" width="470" height="18" fill="#8f9aa6" stroke="#241c15" stroke-width="4"/>
  <rect x="150" y="283" width="18" height="45" fill="#6f7a86" stroke="#241c15" stroke-width="3"/>
  <rect x="560" y="283" width="18" height="45" fill="#6f7a86" stroke="#241c15" stroke-width="3"/>
  <circle cx="159" cy="335" r="12" fill="#3a3646" stroke="#241c15" stroke-width="3"/>
  <circle cx="569" cy="335" r="12" fill="#3a3646" stroke="#241c15" stroke-width="3"/>
  <path d="M170 205 Q170 175 200 175 H540 Q570 175 570 205" fill="none" stroke="#b8c2cc" stroke-width="7"/>
  <path d="M170 205 Q170 175 200 175 H540 Q570 175 570 205" fill="none" stroke="#241c15" stroke-width="2.5"/>
  <ellipse cx="520" cy="205" rx="55" ry="22" fill="#fdf8ee" stroke="#241c15" stroke-width="3.5"/>
  <path d="M150 215 Q300 190 470 208 L470 240 Q300 250 150 240 Z" fill="#f6f1e4" stroke="#241c15" stroke-width="3.5">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <!-- the two forearms out on the blanket, purpura unremarked -->
  <path d="M330 232 q40 -6 80 0 q4 10 -4 14 q-40 4 -80 0 q-4 -10 4 -14 Z" fill="#e8c2a2" stroke="#241c15" stroke-width="3"/>
  <g fill="#7a2a3e" opacity=".85">
    <circle cx="350" cy="238" r="1.6"/><circle cx="362" cy="242" r="1.3"/><circle cx="376" cy="237" r="1.8"/><circle cx="388" cy="243" r="1.4"/><circle cx="398" cy="239" r="1.2"/><circle cx="369" cy="245" r="1.1"/>
  </g>
  <rect x="392" y="230" width="14" height="7" rx="2" fill="#fdf8ee" stroke="#241c15" stroke-width="2"/>
  <path d="M406 233 C440 215 470 190 500 150" fill="none" stroke="#dfe7e3" stroke-width="3"/>
  <!-- head on the pillow -->
  <ellipse cx="500" cy="200" rx="30" ry="26" fill="#e8c2a2" stroke="#241c15" stroke-width="3.5"/>
  <path d="M478 182 Q490 172 506 176 M516 176 Q524 178 528 188" fill="none" stroke="#f4f1ea" stroke-width="4" stroke-linecap="round"/>
  <path d="M488 200 q5 3 10 0 M506 200 q5 3 10 0" fill="none" stroke="#241c15" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M494 214 q8 5 16 0" fill="none" stroke="#241c15" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M478 206 H526" stroke="#7aa9b3" stroke-width="3" stroke-linecap="round"/>
  <path d="M478 206 C466 220 466 250 480 262 M526 206 C538 220 538 250 524 262" fill="none" stroke="#7aa9b3" stroke-width="2.5"/>
  <!-- the locker: tissue, transfer sheet, phone -->
  <rect x="620" y="215" width="120" height="110" rx="6" fill="#c7a06e" stroke="#241c15" stroke-width="4"/>
  <rect x="632" y="232" width="96" height="10" rx="2" fill="#a67d4c" stroke="#241c15" stroke-width="2"/>
  <path d="M645 205 q20 -14 40 -2 q10 6 -2 12 q-20 8 -38 -2 Z" fill="#fdf8ee" stroke="#241c15" stroke-width="2.5"/>
  <ellipse cx="668" cy="206" rx="6" ry="3.5" fill="#b8202a"/>
  <g transform="rotate(-6 712 190)">
    <rect x="694" y="168" width="36" height="46" rx="2" fill="#fdf8ee" stroke="#241c15" stroke-width="2.5"/>
    <path d="M700 178 H724 M700 186 H720 M700 194 H724 M700 202 H716" stroke="#a08c6e" stroke-width="2"/>
  </g>
  <!-- the ward phone, ringing back -->
  <g transform="translate(40 150)">
    <rect x="0" y="40" width="120" height="70" rx="8" fill="#3a3646" stroke="#241c15" stroke-width="4"/>
    <rect x="14" y="52" width="60" height="22" rx="3" fill="#0f2a22"/>
    <text x="18" y="67" font-family="ui-monospace,monospace" font-size="11" fill="#7dd3a0">MEADOWCROFT</text>
    <g fill="#8f9aa6"><rect x="16" y="82" width="12" height="8" rx="2"/><rect x="34" y="82" width="12" height="8" rx="2"/><rect x="52" y="82" width="12" height="8" rx="2"/><rect x="16" y="94" width="12" height="8" rx="2"/><rect x="34" y="94" width="12" height="8" rx="2"/><rect x="52" y="94" width="12" height="8" rx="2"/></g>
    <rect x="78" y="20" width="34" height="86" rx="10" fill="#4d6b5a" stroke="#241c15" stroke-width="4">
      <animateTransform attributeName="transform" type="rotate" values="0 95 60;-4 95 60;0 95 60;4 95 60;0 95 60" dur=".6s" repeatCount="indefinite"/>
    </rect>
    <g fill="none" stroke="#c8531b" stroke-width="3" stroke-linecap="round">
      <path d="M124 26 q8 8 0 16"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite"/></path>
      <path d="M132 20 q14 14 0 28"><animate attributeName="opacity" values=".2;1;.2" dur="1.2s" repeatCount="indefinite"/></path>
    </g>
  </g>
  <rect x="0" y="328" width="800" height="32" fill="#3d4a52" stroke="#241c15" stroke-width="3"/>
  <text x="20" y="28" font-family="Bricolage Grotesque, Geist, sans-serif" font-size="18" font-weight="700" fill="#fdf8ee">Resus bay 3 · 02:40</text>
  <text x="20" y="50" font-family="Geist, sans-serif" font-size="13" fill="#d9c9a6">Nobody came with him. The home rang 999, and they will answer the phone.</text>
</svg>
