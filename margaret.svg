<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Margaret">
  <rect width="200" height="200" fill="#f3e8e0"/>
  <!-- cardigan -->
  <path d="M28 200 C34 158 62 140 100 140 C138 140 166 158 172 200 Z" fill="#a5788a" stroke="#2b241d" stroke-width="4"/>
  <path d="M100 142 v58" stroke="#2b241d" stroke-width="3" opacity=".5"/>
  <circle cx="100" cy="162" r="3" fill="#2b241d" opacity=".6"/>
  <circle cx="100" cy="180" r="3" fill="#2b241d" opacity=".6"/>
  <!-- neck -->
  <path d="M87 118 h26 v26 c0 8 -26 8 -26 0 Z" fill="#ecd9c6" stroke="#2b241d" stroke-width="3.5"/>
  <!-- head -->
  <ellipse cx="100" cy="84" rx="44" ry="48" fill="#f4e3d0" stroke="#2b241d" stroke-width="4"/>
  <!-- grey bob -->
  <path d="M56 96 C48 58 66 30 100 30 C134 30 152 58 144 96 C148 74 142 58 132 50 C136 62 134 72 130 78 C128 60 118 48 100 46 C82 48 72 60 70 78 C66 72 64 62 68 50 C58 58 52 74 56 96 Z" fill="#cfc9c0" stroke="#2b241d" stroke-width="3.5"/>
  <path d="M56 92 c-4 10 -2 20 4 26" fill="none" stroke="#2b241d" stroke-width="3.5"/>
  <path d="M144 92 c4 10 2 20 -4 26" fill="none" stroke="#2b241d" stroke-width="3.5"/>
  <!-- glasses -->
  <g fill="none" stroke="#2b241d" stroke-width="3.5">
    <circle cx="80" cy="84" r="13"/>
    <circle cx="120" cy="84" r="13"/>
    <path d="M93 84 h14"/>
    <path d="M67 82 l-10 -3"/>
    <path d="M133 82 l10 -3"/>
  </g>
  <!-- concerned eyes behind glasses -->
  <circle cx="80" cy="85" r="3.5" fill="#2b241d"/>
  <circle cx="120" cy="85" r="3.5" fill="#2b241d"/>
  <path d="M68 68 q12 -7 22 -2" fill="none" stroke="#2b241d" stroke-width="4" stroke-linecap="round"/>
  <path d="M132 68 q-12 -7 -22 -2" fill="none" stroke="#2b241d" stroke-width="4" stroke-linecap="round"/>
  <!-- mouth: tight worry -->
  <path d="M88 116 q12 -5 24 0" fill="none" stroke="#2b241d" stroke-width="3.5" stroke-linecap="round"/>
  <!-- blush of agitation -->
  <ellipse cx="72" cy="102" rx="9" ry="5" fill="#e0a08f" opacity=".55"/>
  <ellipse cx="128" cy="102" rx="9" ry="5" fill="#e0a08f" opacity=".55"/>
</svg>
