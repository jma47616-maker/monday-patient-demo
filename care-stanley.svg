<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <title>Stanley</title>
  <!-- Stanley Garside, 84: portrait. Long thin face, white hair standing up, two days unshaven, wary, eyes off to one side. -->
  <rect width="120" height="120" fill="#f3e5c8"/>
  <circle cx="60" cy="60" r="56" fill="#faf0da" stroke="#241c15" stroke-width="3"/>
  <!-- gown, collar pulled askew -->
  <path d="M30 120 Q32 100 50 96 L72 94 Q90 98 92 120 Z" fill="#cfdccf" stroke="#241c15" stroke-width="3" stroke-linejoin="round"/>
  <path d="M46 98 Q60 112 78 96" fill="none" stroke="#241c15" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M40 108 l4 4 M54 114 l4 3 M70 108 l4 4 M82 112 l3 4" stroke="#93a996" stroke-width="2" stroke-linecap="round"/>
  <!-- thin neck -->
  <path d="M51 84 L50 100 Q60 108 70 99 L69 84 Z" fill="#e3bfa2" stroke="#241c15" stroke-width="3" stroke-linejoin="round"/>
  <path d="M56 90 L55 100 M65 90 L66 99" stroke="#b98f73" stroke-width="1.6" stroke-linecap="round"/>
  <!-- ears, large -->
  <ellipse cx="36" cy="60" rx="5" ry="10" fill="#e3bfa2" stroke="#241c15" stroke-width="3"/>
  <ellipse cx="84" cy="60" rx="5" ry="10" fill="#e3bfa2" stroke="#241c15" stroke-width="3"/>
  <!-- head: long, narrow jaw -->
  <path d="M38 52 Q38 26 60 26 Q82 26 82 52 Q82 72 74 84 Q67 94 60 94 Q53 94 46 84 Q38 72 38 52 Z" fill="#e9c9ad" stroke="#241c15" stroke-width="3"/>
  <path d="M68 30 Q80 36 80 54 Q80 72 73 83 Q67 91 63 92 Q74 68 68 30 Z" fill="#cfa285" opacity=".5"/>
  <!-- white hair, uncombed, standing up in tufts -->
  <path d="M36 50 Q29 36 36 26 Q32 20 38 17 Q42 15 44 19 Q46 11 53 14 Q56 15 57 18 Q62 9 69 14 Q72 16 71 20 Q78 13 83 19 Q85 23 82 27 Q91 36 84 50 Q82 37 74 33 Q62 28 48 32 Q40 37 36 50 Z" fill="#fbfaf5" stroke="#241c15" stroke-width="3" stroke-linejoin="round"/>
  <path d="M45 21 Q46 26 50 29 M58 19 Q58 24 61 28 M71 21 Q69 26 71 30 M39 30 Q41 33 44 34" fill="none" stroke="#c9c6bc" stroke-width="1.6" stroke-linecap="round"/>
  <!-- forehead lines -->
  <path d="M48 38 q12 -3 24 0 M50 43 q10 -2 20 0" fill="none" stroke="#b98f73" stroke-width="1.5" stroke-linecap="round"/>
  <!-- brows, white, drawn down and together -->
  <path d="M44 51 q6 -5 12 -1 M64 50 q6 -4 12 1" fill="none" stroke="#fbfaf5" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M44 51 q6 -5 12 -1 M64 50 q6 -4 12 1" fill="none" stroke="#241c15" stroke-width="1.3" stroke-linecap="round"/>
  <!-- eyes, both looking off to his left (viewer right) -->
  <ellipse cx="50" cy="58" rx="5.2" ry="4" fill="#fff" stroke="#241c15" stroke-width="2"/>
  <ellipse cx="70" cy="58" rx="5.2" ry="4" fill="#fff" stroke="#241c15" stroke-width="2"/>
  <circle cx="53" cy="58.4" r="2.2" fill="#241c15"/>
  <circle cx="73" cy="58.4" r="2.2" fill="#241c15"/>
  <path d="M45 63 q5 3 10 0 M65 63 q5 3 10 0" fill="none" stroke="#b98f73" stroke-width="1.5" stroke-linecap="round"/>
  <!-- cheeks, hollow -->
  <path d="M43 68 q3 8 7 11 M77 68 q-3 8 -7 11" fill="none" stroke="#b98f73" stroke-width="1.8" stroke-linecap="round"/>
  <!-- nose, long -->
  <path d="M60 58 q-5 12 0 15 q4 1 5 -3" fill="none" stroke="#241c15" stroke-width="2.4" stroke-linecap="round"/>
  <!-- stubble -->
  <path d="M45 76 Q49 91 60 93 Q71 91 75 76 Q70 86 60 86 Q50 86 45 76 Z" fill="#a9a59b" opacity=".4"/>
  <g fill="#77736a"><circle cx="49" cy="82" r=".9"/><circle cx="53" cy="86" r=".9"/><circle cx="57" cy="89" r=".9"/><circle cx="62" cy="90" r=".9"/><circle cx="67" cy="87" r=".9"/><circle cx="71" cy="83" r=".9"/><circle cx="55" cy="77" r=".9"/><circle cx="65" cy="77" r=".9"/><circle cx="60" cy="86" r=".9"/></g>
  <!-- mouth: thin, set, turned down -->
  <path d="M53 81 q7 -3 14 0" fill="none" stroke="#241c15" stroke-width="2.4" stroke-linecap="round"/>
</svg>
