<svg xmlns="http://www.w3.org/2000/svg" id="panc-db-d13-severity" viewBox="0 0 720 1291" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>A 48-hour track with three lanes: mild, moderately severe, severe</title><desc>Three lanes, each with a track from arrival past a dashed line at 48 hours. Mild: no organ failure, no complications; usually settles within a week; the track is empty. Moderately severe: organ failure that resolves within 48 hours, or a local complication, or a flare of an existing illness; a bar ends before the 48-hour line. Severe: organ failure lasting more than 48 hours; a bar runs past the line. Underneath, organ failure is a modified Marshall score of 2 or more: kidneys, creatinine 170 micromol/L or more; circulation, systolic below 90 mmHg not responding to fluid; breathing, PaO2/FiO2 ratio 300 or less.</desc>
<rect width="720" height="1291" fill="#fdf8ee"/>
<g id="panc-db-d13-lane-1"><rect x="30" y="106" width="672" height="229.92000000000002" rx="14" fill="#241c15"/><rect x="24" y="100" width="672" height="229.92000000000002" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="140.0">Mild</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="48.0" y="178.7">No organ failure, no complications. Usually</tspan><tspan x="48.0" y="212.3">settles within a week.</tspan></text><rect x="60" y="259.92" width="630" height="36" rx="18" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="700" fill="#7a6a52" text-anchor="middle" ><tspan x="240.0" y="286.9">no organ failure</tspan></text><path d="M460 245.92000000000002 V309.92" stroke="#241c15" stroke-width="5" stroke-dasharray="10 7"/></g><g id="panc-db-d13-lane-2"><rect x="30" y="357.92" width="672" height="263.5199999999999" rx="14" fill="#241c15"/><rect x="24" y="351.92" width="672" height="263.5199999999999" rx="14" fill="#fbe4d3" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="391.9">Moderately severe</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="48.0" y="430.6">Organ failure that resolves within 48 hours, or</tspan><tspan x="48.0" y="464.2">a local complication, or a flare of an existing</tspan><tspan x="48.0" y="497.8">illness.</tspan></text><rect x="60" y="545.4399999999999" width="630" height="36" rx="18" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><rect x="100" y="551.4399999999999" width="290" height="24" rx="12" fill="#c8531b" stroke="#241c15" stroke-width="2.5"/><path d="M460 531.4399999999999 V595.4399999999999" stroke="#241c15" stroke-width="5" stroke-dasharray="10 7"/></g><g id="panc-db-d13-lane-3"><rect x="30" y="643.4399999999999" width="672" height="196.32000000000005" rx="14" fill="#241c15"/><rect x="24" y="637.4399999999999" width="672" height="196.32000000000005" rx="14" fill="#f6c9b4" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="677.4">Severe</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="48.0" y="716.2">Organ failure lasting more than 48 hours.</tspan></text><rect x="60" y="763.76" width="630" height="36" rx="18" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><rect x="100" y="769.76" width="584" height="24" rx="12" fill="#c8531b" stroke="#241c15" stroke-width="2.5"/><path d="M688.0 781.8 L668.0 796.8 L668.0 766.8 Z" fill="#241c15" stroke="#241c15" stroke-width="2" stroke-linejoin="round"/><path d="M460 749.76 V813.76" stroke="#241c15" stroke-width="5" stroke-dasharray="10 7"/></g><rect x="377.3" y="36.2" width="165.4" height="47.6" rx="23.8" fill="#e0a521" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="460.0" y="69.8">48 hours</tspan></text><rect x="59.0" y="36.2" width="134.1" height="47.6" rx="23.8" fill="#241c15" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="800" fill="#fdf8ee" text-anchor="middle" ><tspan x="126.0" y="69.8">Arrival</tspan></text><rect x="30" y="865.76" width="672" height="404.8000000000002" rx="14" fill="#241c15"/><rect x="24" y="859.76" width="672" height="404.8000000000002" rx="14" fill="#fdf8ee" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="901.8">Organ failure: a score of 2 or more</tspan></text><text font-size="28" font-weight="700" fill="#a53f12" text-anchor="start" ><tspan x="48.0" y="931.8">(modified Marshall score)</tspan></text><circle cx="58" cy="975.76" r="8" fill="#c8531b" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="78.0" y="983.8">Kidneys</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="78.0" y="1019.8">creatinine 170 µmol/L or more</tspan></text><circle cx="58" cy="1061.96" r="8" fill="#c8531b" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="78.0" y="1070.0">Circulation</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="78.0" y="1106.0">systolic below 90 mmHg, not responding to</tspan><tspan x="78.0" y="1138.2">fluid</tspan></text><circle cx="58" cy="1180.3600000000001" r="8" fill="#c8531b" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="78.0" y="1188.4">Breathing</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="78.0" y="1224.4">PaO₂/FiO₂ ratio 300 or less</tspan></text>
</svg>
