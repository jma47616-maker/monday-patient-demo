<svg xmlns="http://www.w3.org/2000/svg" id="fitd06" viewBox="0 0 720 982" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>The route in five steps: two osmolalities, the urine sodium, a gate, then the bedside</title><desc>Five steps down the card. Serum osmolality: below 275, or normal or high. Urine osmolality: 100 or below, or above 100. Urine sodium: 30 or below, or above 30. A gate: diuretic or kidney disease? The bedside: dry, normal or overloaded. An orange line marks one path: below 275, above 100, above 30, through the gate, normal.</desc>
