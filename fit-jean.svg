<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Jean Rowley, about 68: portrait for the chat. Short grey bob, cardigan, mobile to her ear, worried. -->
  <rect width="120" height="120" fill="#f3e5c8"/>
  <circle cx="60" cy="60" r="56" fill="#faf0da" stroke="#241c15" stroke-width="3"/>
  <!-- neck -->
  <path d="M51 82 h18 v14 c0 6 -18 6 -18 0 Z" fill="#e8c2a2" stroke="#241c15" stroke-width="3"/>
  <!-- blouse and cardigan -->
  <path d="M26 120 C28 102 42 94 60 94 C78 94 92 102 94 120 Z" fill="#7c8f6a" stroke="#241c15" stroke-width="3"/>
  <path d="M50 95 L60 112 L70 95 Z" fill="#fdf8ee" stroke="#241c15" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M54 96 q6 4 12 0" fill="none" stroke="#b8552e" stroke-width="2"/>
  <circle cx="60" cy="114" r="1.8" fill="#fdf8ee" stroke="#241c15" stroke-width="1.2"/>
  <path d="M40 104 v14 M80 104 v14" stroke="#5f704f" stroke-width="2" stroke-linecap="round"/>
  <!-- head -->
  <ellipse cx="58" cy="57" rx="26" ry="30" fill="#e8c2a2" stroke="#241c15" stroke-width="3"/>
  <path d="M64 30 Q82 36 82 58 Q82 78 66 86 Q78 64 64 30 Z" fill="#d9ab86" opacity=".45"/>
  <!-- grey bob: fringe swept, cut at the jaw -->
  <path d="M30 76 C24 44 34 24 58 24 C82 24 92 44 86 76 L80 76 C82 58 78 46 72 40 C62 44 48 44 40 38 C36 46 34 60 36 76 Z" fill="#c9c6bf" stroke="#241c15" stroke-width="3" stroke-linejoin="round"/>
  <path d="M42 34 q12 6 28 2 M36 50 q-2 12 0 22 M82 50 q2 12 0 22" fill="none" stroke="#9e9a92" stroke-width="2" stroke-linecap="round"/>
  <!-- worried brows, raised in the middle -->
  <path d="M40 50 q6 -1 12 -5 M64 45 q6 4 12 5" fill="none" stroke="#8a857c" stroke-width="3.2" stroke-linecap="round"/>
  <!-- eyes -->
  <ellipse cx="47" cy="56" rx="4.2" ry="4" fill="#fff" stroke="#241c15" stroke-width="2"/>
  <ellipse cx="68" cy="56" rx="4.2" ry="4" fill="#fff" stroke="#241c15" stroke-width="2"/>
  <circle cx="47.5" cy="56.5" r="2" fill="#241c15"/>
  <circle cx="68.5" cy="56.5" r="2" fill="#241c15"/>
  <!-- tear-bright eyes -->
  <circle cx="46" cy="54.8" r=".9" fill="#fff"/><circle cx="67" cy="54.8" r=".9" fill="#fff"/>
  <!-- nose -->
  <path d="M58 58 q-3 8 1 10 q3 0 3 -2" fill="none" stroke="#241c15" stroke-width="2.2" stroke-linecap="round"/>
  <!-- worried mouth -->
  <path d="M50 78 q8 -4 16 0" fill="none" stroke="#241c15" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M40 64 q3 2 6 1" fill="none" stroke="#c9967a" stroke-width="1.4" stroke-linecap="round"/>
  <!-- hand and mobile phone at her right ear (viewer's left) -->
  <g>
    <rect x="18" y="42" width="16" height="30" rx="4" fill="#2c2c31" stroke="#241c15" stroke-width="2.6" transform="rotate(-14 26 57)"/>
    <rect x="21" y="46" width="10" height="18" rx="2" fill="#7fb6c9" transform="rotate(-14 26 57)"/>
    <path d="M22 66 Q16 76 22 88 Q30 92 36 86 Q38 76 34 66 Z" fill="#e8c2a2" stroke="#241c15" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M24 70 q6 -2 10 0 M24 76 q6 -2 10 0" fill="none" stroke="#241c15" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M22 88 L18 120 M36 86 L44 104" fill="none" stroke="#241c15" stroke-width="2.6"/>
    <path d="M18 120 L22 88 Q30 92 36 86 L44 104 Q36 116 30 120 Z" fill="#7c8f6a"/>
  </g>
  <!-- little call waves -->
  <g fill="none" stroke="#c8531b" stroke-width="2.4" stroke-linecap="round">
    <path d="M12 38 q-5 5 0 10"><animate attributeName="opacity" values="1;.2;1" dur="1.4s" repeatCount="indefinite"/></path>
    <path d="M7 33 q-9 10 0 20"><animate attributeName="opacity" values=".2;1;.2" dur="1.4s" repeatCount="indefinite"/></path>
  </g>
  <!-- blinking -->
  <rect x="42" y="51" width="11" height="10" fill="#e8c2a2" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.9;.93;.96;1" dur="3.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="63" y="51" width="11" height="10" fill="#e8c2a2" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.9;.93;.96;1" dur="3.6s" repeatCount="indefinite"/>
  </rect>
</svg>
