<svg xmlns="http://www.w3.org/2000/svg" id="fitd11" viewBox="0 0 720 640" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>The sodium against time, with the ceiling drawn as a stepped line</title><desc>A graph of the sodium against time: start, 1 hour, 24 hours, 48 hours. It starts at 112. A stepped ceiling: no more than 10, reaching 122 at 24 hours, then no more than 8 more. The area above the ceiling is hatched: too fast. Beneath it an orange line rises steeply in the first hour and is then nearly flat: up 5, then steady.</desc>
<rect width="720" height="640" fill="#fdf8ee"/>
<defs><pattern id="fitd11-hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="16" height="16" fill="#fbe4d3"/><path d="M4 0 V16" stroke="#f0a27c" stroke-width="5"/></pattern></defs><g id="fitd11-ceiling"><path d="M112 56 H676 V124 H440 V300 H112 Z" fill="url(#fitd11-hatch)"/><path d="M112 300 H440 V124 H676" fill="none" stroke="#241c15" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/></g><g id="fitd11-axes"><path d="M112 42 V552 H690" fill="none" stroke="#241c15" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M112 552 v14" stroke="#241c15" stroke-width="4" stroke-linecap="round"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="112.0" y="602.0">Start</tspan></text><path d="M216 552 v14" stroke="#241c15" stroke-width="4" stroke-linecap="round"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="216.0" y="602.0">1 hour</tspan></text><path d="M440 552 v14" stroke="#241c15" stroke-width="4" stroke-linecap="round"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="440.0" y="602.0">24 hours</tspan></text><path d="M676 552 v14" stroke="#241c15" stroke-width="4" stroke-linecap="round"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="end" ><tspan x="690.0" y="602.0">48 hours</tspan></text><path d="M100 520 H112" stroke="#241c15" stroke-width="4" stroke-linecap="round"/><text font-size="29" font-weight="800" fill="#241c15" text-anchor="end" ><tspan x="92.0" y="530.0">112</tspan></text></g><g id="fitd11-labels"><rect x="124.0" y="161.3" width="168.5" height="49.5" rx="9" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><text font-size="33" font-weight="800" fill="#a53f12" text-anchor="start" ><tspan x="136.0" y="196.0">Too fast</tspan></text><text font-size="29" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="126.0" y="344.0">No more than 10</tspan></text><text font-size="29" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="456.0" y="170.0">No more than</tspan><tspan x="456.0" y="204.8">8 more</tspan></text><circle cx="440" cy="300" r="9" fill="#241c15"/><text font-size="30" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="456.0" y="340.0">122</tspan></text></g><g id="fitd11-safe"><path d="M112 520 L216 410 L676 400" fill="none" stroke="#c8531b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="112" cy="520" r="10" fill="#c8531b" stroke="#241c15" stroke-width="3.5"/><text font-size="30" font-weight="800" fill="#a53f12" text-anchor="start" ><tspan x="238.0" y="460.0">Up 5, then steady</tspan></text></g>
</svg>
