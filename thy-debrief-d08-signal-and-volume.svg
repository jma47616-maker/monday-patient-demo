<svg xmlns="http://www.w3.org/2000/svg" id="thd08" viewBox="0 0 720 830" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>The catecholamine level is normal; the tissue response is turned up</title><desc>A gauge with its needle in the middle: catecholamine level, typically normal. A dial turned to its maximum, carrying a drop of thyroid hormone on its knob and wired to the beta receptors on a cell: tissue response, turned up. Why a beta blocker works.</desc>
