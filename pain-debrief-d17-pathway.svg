<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 614" width="360" height="614">
  <title>The pathway</title>
  <!-- Card 18. The management pathway as one column of seven numbered boxes: suspect, CT angiogram now, refer to general and vascular surgery together, treat while you wait, open the artery, laparotomy with a second look, intensive care. Group ids paind-d17-step1 to step7. -->
  
  <rect width="360" height="614" rx="16" fill="#f3e5c8"/>
  <g id="paind-d17-step1"><rect x="12" y="12" width="336" height="70" rx="12" fill="#fbf6ec" stroke="#241c15" stroke-width="3"/><circle cx="42" cy="47" r="17" fill="#241c15"/><text x="42" y="53" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="70" y="42" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="800" fill="#241c15" text-anchor="start">Suspect it</text><text x="70" y="66" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#241c15" text-anchor="start">AF with abdominal pain</text></g><path d="M180 84 L180 96" stroke="#241c15" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M180 96 L175.7 87.0 L184.3 87.0 Z" fill="#241c15"/><g id="paind-d17-step2"><rect x="12" y="98" width="336" height="70" rx="12" fill="#e9a27f" stroke="#241c15" stroke-width="3"/><circle cx="42" cy="133" r="17" fill="#241c15"/><text x="42" y="139" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="70" y="128" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="800" fill="#241c15" text-anchor="start">CT angiogram now</text><text x="70" y="152" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#241c15" text-anchor="start">suspicion written on the request</text></g><path d="M180 170 L180 182" stroke="#241c15" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M180 182 L175.7 173.0 L184.3 173.0 Z" fill="#241c15"/><g id="paind-d17-step3"><rect x="12" y="184" width="336" height="70" rx="12" fill="#e9a27f" stroke="#241c15" stroke-width="3"/><circle cx="42" cy="219" r="17" fill="#241c15"/><text x="42" y="225" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="70" y="214" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="800" fill="#241c15" text-anchor="start">Refer, at the same time</text><text x="70" y="238" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#241c15" text-anchor="start">general surgeons + vascular and IR</text></g><path d="M180 256 L180 268" stroke="#241c15" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M180 268 L175.7 259.0 L184.3 259.0 Z" fill="#241c15"/><g id="paind-d17-step4"><rect x="12" y="270" width="336" height="70" rx="12" fill="#fbf6ec" stroke="#241c15" stroke-width="3"/><circle cx="42" cy="305" r="17" fill="#241c15"/><text x="42" y="311" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><text x="70" y="300" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="800" fill="#241c15" text-anchor="start">Treat while you wait</text><text x="70" y="324" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#241c15" text-anchor="start">fluids, analgesia, antibiotics, heparin</text></g><path d="M180 342 L180 354" stroke="#241c15" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M180 354 L175.7 345.0 L184.3 345.0 Z" fill="#241c15"/><g id="paind-d17-step5"><rect x="12" y="356" width="336" height="70" rx="12" fill="#a9cbd3" stroke="#241c15" stroke-width="3"/><circle cx="42" cy="391" r="17" fill="#241c15"/><text x="42" y="397" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">5</text><text x="70" y="386" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="800" fill="#241c15" text-anchor="start">Open the artery</text><text x="70" y="410" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#241c15" text-anchor="start">catheter first line, or open surgery</text></g><path d="M180 428 L180 440" stroke="#241c15" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M180 440 L175.7 431.0 L184.3 431.0 Z" fill="#241c15"/><g id="paind-d17-step6"><rect x="12" y="442" width="336" height="70" rx="12" fill="#a9cbd3" stroke="#241c15" stroke-width="3"/><circle cx="42" cy="477" r="17" fill="#241c15"/><text x="42" y="483" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">6</text><text x="70" y="472" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="800" fill="#241c15" text-anchor="start">Laparotomy if peritonitis</text><text x="70" y="496" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#241c15" text-anchor="start">second look in 24–48 h</text></g><path d="M180 514 L180 526" stroke="#241c15" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M180 526 L175.7 517.0 L184.3 517.0 Z" fill="#241c15"/><g id="paind-d17-step7"><rect x="12" y="528" width="336" height="70" rx="12" fill="#fbf6ec" stroke="#241c15" stroke-width="3"/><circle cx="42" cy="563" r="17" fill="#241c15"/><text x="42" y="569" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">7</text><text x="70" y="558" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="800" fill="#241c15" text-anchor="start">Intensive care</text><text x="70" y="582" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#241c15" text-anchor="start">afterwards</text></g>
</svg>
