<svg xmlns="http://www.w3.org/2000/svg" id="panc-calcium-d20-bolus" viewBox="0 0 720 949" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>A syringe, a clock and a monitor: the calcium bolus</title><desc>Three pictures in a row: a syringe, 20 mL of 10% calcium gluconate; a clock, over 10 minutes; a monitor, ECG monitoring throughout and after. No monitored bed free? A portable or crash-trolley monitor is acceptable for the first dose, so treatment is not delayed. A wide cannula, checked often: calcium is very irritant to veins. Never mixed with bicarbonate, phosphate or sulfate (including magnesium sulfate): it precipitates. Given too fast: flushing, a chalky taste, low blood pressure, a slow pulse, abnormal rhythms; cardiac arrest has occurred. Calcium boosts digoxin’s effect on the heart.</desc>
<rect width="720" height="949" fill="#fdf8ee"/>
<g transform="translate(132.0 110.0) scale(0.9)" ><rect x="-70" y="-20" width="110" height="40" rx="5" fill="#e9f1ee" stroke="#241c15" stroke-width="4"/><rect x="-20" y="-20" width="60" height="40" rx="5" fill="#dfe6ea" stroke="#241c15" stroke-width="4"/><path d="M-70 0 H-96 M-96 -22 V22" stroke="#241c15" stroke-width="7" stroke-linecap="round"/><path d="M40 0 H56 L90 0" stroke="#241c15" stroke-width="5" stroke-linecap="round"/><path d="M-50 -20 V-8" stroke="#241c15" stroke-width="3"/><path d="M-35 -20 V-8" stroke="#241c15" stroke-width="3"/><path d="M-20 -20 V-8" stroke="#241c15" stroke-width="3"/><path d="M-5 -20 V-8" stroke="#241c15" stroke-width="3"/><path d="M10 -20 V-8" stroke="#241c15" stroke-width="3"/><path d="M25 -20 V-8" stroke="#241c15" stroke-width="3"/></g><text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="132.0" y="216.0">20 mL of 10%</tspan><tspan x="132.0" y="247.4">calcium</tspan><tspan x="132.0" y="278.7">gluconate</tspan></text><g transform="translate(360.0 110.0)" ><circle r="54" fill="#fdf8ee" stroke="#241c15" stroke-width="5"/><path d="M0 0 L0 -46 A46 46 0 0 1 39.8 -23 Z" fill="#f0a27c"/><path d="M0.0 -44.0 L0.0 -50.0" stroke="#241c15" stroke-width="3"/><path d="M22.0 -38.1 L25.0 -43.3" stroke="#241c15" stroke-width="3"/><path d="M38.1 -22.0 L43.3 -25.0" stroke="#241c15" stroke-width="3"/><path d="M44.0 -0.0 L50.0 -0.0" stroke="#241c15" stroke-width="3"/><path d="M38.1 22.0 L43.3 25.0" stroke="#241c15" stroke-width="3"/><path d="M22.0 38.1 L25.0 43.3" stroke="#241c15" stroke-width="3"/><path d="M0.0 44.0 L0.0 50.0" stroke="#241c15" stroke-width="3"/><path d="M-22.0 38.1 L-25.0 43.3" stroke="#241c15" stroke-width="3"/><path d="M-38.1 22.0 L-43.3 25.0" stroke="#241c15" stroke-width="3"/><path d="M-44.0 0.0 L-50.0 0.0" stroke="#241c15" stroke-width="3"/><path d="M-38.1 -22.0 L-43.3 -25.0" stroke="#241c15" stroke-width="3"/><path d="M-22.0 -38.1 L-25.0 -43.3" stroke="#241c15" stroke-width="3"/><path d="M0 0 V-40 M0 0 L22 10" stroke="#241c15" stroke-width="5" stroke-linecap="round"/><circle r="5" fill="#241c15"/></g><text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="360.0" y="216.0">over 10</tspan><tspan x="360.0" y="247.4">minutes</tspan></text><g transform="translate(588.0 110.0)" ><rect x="-70" y="-50" width="140" height="96" rx="10" fill="#463a2c" stroke="#241c15" stroke-width="4"/><rect x="-60" y="-40" width="120" height="70" rx="4" fill="#123"/><path d="M-56 0 H-30 L-22 -24 L-14 20 L-8 0 H10 L18 -24 L26 20 L32 0 H56" fill="none" stroke="#7fe0a0" stroke-width="4" stroke-linejoin="round"/><rect x="-20" y="46" width="40" height="14" fill="#463a2c" stroke="#241c15" stroke-width="3"/></g><text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="588.0" y="216.0">ECG</tspan><tspan x="588.0" y="247.4">monitoring</tspan><tspan x="588.0" y="278.7">throughout</tspan><tspan x="588.0" y="310.1">and after</tspan></text><rect x="30" y="366" width="672" height="156.60000000000002" rx="14" fill="#241c15"/><rect x="24" y="360" width="672" height="156.60000000000002" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="400" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="406.0">No monitored bed free? A portable or</tspan><tspan x="48.0" y="438.2">crash-trolley monitor is acceptable for the first</tspan><tspan x="48.0" y="470.4">dose, so treatment is not delayed.</tspan></text><rect x="30" y="548.6" width="672" height="379.80000000000007" rx="14" fill="#241c15"/><rect x="24" y="542.6" width="672" height="379.80000000000007" rx="14" fill="#fbe4d3" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="400" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="588.6">A wide cannula, checked often: calcium is very</tspan><tspan x="48.0" y="620.8">irritant to veins.</tspan></text><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="663.0">Never mixed with bicarbonate, phosphate</tspan><tspan x="48.0" y="695.2">or sulfate (including magnesium sulfate):</tspan><tspan x="48.0" y="727.4">it precipitates.</tspan></text><text font-size="28" font-weight="400" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="769.6">Given too fast: flushing, a chalky taste, low</tspan><tspan x="48.0" y="801.8">blood pressure, a slow pulse, abnormal</tspan><tspan x="48.0" y="834.0">rhythms; cardiac arrest has occurred.</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="48.0" y="876.2">Calcium boosts digoxin’s effect on the heart.</tspan></text>
</svg>
