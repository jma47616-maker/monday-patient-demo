roke-linejoin="round"/><rect x="26" y="386" width="330" height="262" rx="16" fill="#241c15"/><rect x="20" y="380" width="330" height="262" rx="16" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><text font-size="31" font-weight="800" fill="#a53f12" text-anchor="start" ><tspan x="40.0" y="428.0">May need fluid:</tspan></text><text font-size="29" font-weight="500" fill="#241c15" text-anchor="start" ><tspan x="40.0" y="466.4">low blood pressure,</tspan><tspan x="40.0" y="502.4">fast heart, slow</tspan><tspan x="40.0" y="538.4">capillary refill, cold</tspan><tspan x="40.0" y="574.3">hands</tspan></text><rect x="376" y="386" width="330" height="262" rx="16" fill="#241c15"/><rect x="370" y="380" width="330" height="262" rx="16" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><text font-size="31" font-weight="800" fill="#a53f12" text-anchor="start" ><tspan x="390.0" y="428.0">Overloaded:</tspan></text><text font-size="29" font-weight="500" fill="#241c15" text-anchor="start" ><tspan x="390.0" y="466.4">swollen ankles, fluid</tspan><tspan x="390.0" y="502.4">on the lungs</tspan></text>
