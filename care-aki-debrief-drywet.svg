<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 664" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Dry or wet: a see-saw, and the patient level in the middle</title><desc>A see-saw with a figure standing level in the middle. One end, an empty glass. May need fluid: low blood pressure, fast heart, slow capillary refill, cold hands. The other end, a brimming glass. Overloaded: swollen ankles, fluid on the lungs.</desc>
<rect width="720" height="664" fill="#fdf8ee"/>
