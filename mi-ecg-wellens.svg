<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-label="Friday's 12-lead ECG, precordial leads: sinus rhythm with biphasic T waves in V2 and V3 and shallow T inversion in V4 — a Wellens type A pattern, filed as normal.">
  <defs>
    <pattern id="egrid" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#fdf4ec"/>
      <path d="M8 0 V8 M0 8 H8" fill="none" stroke="#e8bfa8" stroke-width=".8"/>
    </pattern>
    <pattern id="egridbig" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="url(#egrid)"/>
      <path d="M40 0 V40 M0 40 H40" fill="none" stroke="#d99a78" stroke-width="1.6"/>
    </pattern>

    <!-- one cardiac cycle, drawn about a baseline at the origin -->
    <path id="bNorm"  d="M0 0 h10 q12 -9 24 0 H48 L52 6 L60 -54 L68 16 L76 0 H96 C106 -18 126 -18 136 0 H160"/>
    <path id="bFlat"  d="M0 0 h10 q12 -7 24 0 H48 L52 5 L60 -30 L68 12 L76 0 H96 C106 -8 126 -8 136 0 H160"/>
    <path id="bBiph"  d="M0 0 h10 q12 -9 24 0 H48 L52 6 L60 -56 L68 16 L76 0 H96 C102 -16 110 -16 114 0 C124 30 138 30 146 0 H160"/>
    <path id="bBiphD" d="M0 0 h10 q12 -9 24 0 H48 L52 6 L60 -58 L68 16 L76 0 H96 C102 -18 110 -18 114 0 C124 38 140 38 148 0 H160"/>
    <path id="bInvSh" d="M0 0 h10 q12 -8 24 0 H48 L52 6 L60 -50 L68 14 L76 0 H96 C106 16 126 16 136 0 H160"/>
  </defs>

  <rect width="800" height="470" fill="url(#egridbig)"/>

  <!-- header -->
  <g font-family="Geist, ui-sans-serif, sans-serif" fill="#2b241d">
    <text x="24" y="34" font-size="18" font-weight="600">12-lead ECG · precordial leads</text>
    <text x="24" y="54" font-size="13" fill="#7a6f60">Fri 23:12 · 25 mm/s · 10 mm/mV · sinus rhythm 78 bpm</text>
    <text x="776" y="34" font-size="13" text-anchor="end" fill="#7a6f60">Filed: “normal, no acute change”</text>
  </g>
  <line x1="24" y1="66" x2="776" y2="66" stroke="#2b241d" stroke-width="2" opacity=".35"/>

  <!-- traces -->
  <g fill="none" stroke="#2b241d" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- V1: small r, flat T -->
    <g>
      <path d="M24 130 H44 L44 96 H56 L56 130 H74"/>
      <use href="#bFlat" transform="translate(74,130)"/>
      <use href="#bFlat" transform="translate(234,130)"/>
      <use href="#bFlat" transform="translate(394,130)"/>
      <use href="#bFlat" transform="translate(554,130)"/>
      <path d="M714 130 H776"/>
    </g>
    <!-- V2: biphasic T -->
    <g>
      <path d="M24 230 H44 L44 196 H56 L56 230 H74"/>
      <use href="#bBiph" transform="translate(74,230)"/>
      <use href="#bBiph" transform="translate(234,230)"/>
      <use href="#bBiph" transform="translate(394,230)"/>
      <use href="#bBiph" transform="translate(554,230)"/>
      <path d="M714 230 H776"/>
    </g>
    <!-- V3: biphasic T, deepest terminal negativity -->
    <g>
      <path d="M24 330 H44 L44 296 H56 L56 330 H74"/>
      <use href="#bBiphD" transform="translate(74,330)"/>
      <use href="#bBiphD" transform="translate(234,330)"/>
      <use href="#bBiphD" transform="translate(394,330)"/>
      <use href="#bBiphD" transform="translate(554,330)"/>
      <path d="M714 330 H776"/>
    </g>
    <!-- V4: shallow inversion -->
    <g>
      <path d="M24 430 H44 L44 396 H56 L56 430 H74"/>
      <use href="#bInvSh" transform="translate(74,430)"/>
      <use href="#bInvSh" transform="translate(234,430)"/>
      <use href="#bInvSh" transform="translate(394,430)"/>
      <use href="#bInvSh" transform="translate(554,430)"/>
      <path d="M714 430 H776"/>
    </g>
  </g>

  <!-- lead labels -->
  <g font-family="Geist Mono, ui-monospace, monospace" font-size="15" font-weight="500" fill="#9c4525">
    <text x="30" y="118">V1</text>
    <text x="30" y="218">V2</text>
    <text x="30" y="318">V3</text>
    <text x="30" y="418">V4</text>
  </g>
</svg>
