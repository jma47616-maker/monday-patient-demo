<svg xmlns="http://www.w3.org/2000/svg" id="fever-debrief-d03-two-loops" viewBox="0 0 720 1660" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Two loops and the names</title><desc>Two circular loop diagrams stacked, one with a stop sign and one broken, above a three-level name tree.</desc>
<rect width="720" height="1660" fill="#fdf8ee"/>
<rect x="24" y="70" width="416.0" height="56" rx="28" fill="#241c15"/><text font-size="28" font-weight="800" fill="#fdf8ee" text-anchor="start" ><tspan x="52.0" y="108.1">Normally: it switches off</tspan></text><path d="M210 300 A150 150 0 1 1 465 405" fill="none" stroke="#3f7a3a" stroke-width="12" stroke-linecap="round"/><path d="M465.0 405.0 L470.3 367.9 L502.1 399.7 Z" fill="#3f7a3a" stroke="#3f7a3a" stroke-width="2" stroke-linejoin="round"/><circle cx="360" cy="300" r="92" fill="#faf0da" stroke="#241c15" stroke-width="3.5"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="360.0" y="278.0">scavenger</tspan></text><text font-size="28" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="360.0" y="310.0">and killer</tspan></text><text font-size="28" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="360.0" y="342.0">cells</tspan></text><rect x="24" y="414" width="230" height="104" rx="14" fill="#241c15"/><rect x="20" y="410" width="230" height="104" rx="14" fill="#dcebd3" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="800" fill="#3f7a3a" text-anchor="middle" ><tspan x="135.0" y="452.0">feedback</tspan></text><text font-size="28" font-weight="800" fill="#3f7a3a" text-anchor="middle" ><tspan x="135.0" y="486.0">switches off</tspan></text><g transform="translate(244 404)"><polygon points="-26,-11 -11,-26 11,-26 26,-11 26,11 11,26 -11,26 -26,11" fill="#3f7a3a" stroke="#241c15" stroke-width="3"/><path d="M-12 0 H12" stroke="#fdf8ee" stroke-width="6" stroke-linecap="round"/></g>
<rect x="24" y="630" width="401.3" height="56" rx="28" fill="#a53f12"/><text font-size="28" font-weight="800" fill="#fdf8ee" text-anchor="start" ><tspan x="52.0" y="668.1">In HLH: it keeps turning</tspan></text><path d="M210 860 A150 150 0 1 1 465 965" fill="none" stroke="#c8531b" stroke-width="12" stroke-linecap="round"/><path d="M465.0 965.0 L470.3 927.9 L502.1 959.7 Z" fill="#c8531b" stroke="#c8531b" stroke-width="2" stroke-linejoin="round"/><circle cx="360" cy="860" r="92" fill="#faf0da" stroke="#241c15" stroke-width="3.5"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="360.0" y="838.0">scavenger</tspan></text><text font-size="28" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="360.0" y="870.0">and killer</tspan></text><text font-size="28" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="360.0" y="902.0">cells</tspan></text><rect x="24" y="974" width="230" height="104" rx="14" fill="#241c15"/><rect x="20" y="970" width="230" height="104" rx="14" fill="#fbe4d3" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="800" fill="#a53f12" text-anchor="middle" ><tspan x="135.0" y="1012.0">feedback</tspan></text><text font-size="28" font-weight="800" fill="#a53f12" text-anchor="middle" ><tspan x="135.0" y="1046.0">fails</tspan></text><path d="M190 930 l24 -10 l-8 -14 l26 -6" fill="none" stroke="#c8531b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="550" cy="750" r="9" fill="#e0a521" stroke="#241c15" stroke-width="2.5"/><circle cx="590" cy="800" r="9" fill="#e0a521" stroke="#241c15" stroke-width="2.5"/><circle cx="630" cy="850" r="9" fill="#e0a521" stroke="#241c15" stroke-width="2.5"/><circle cx="570" cy="890" r="9" fill="#e0a521" stroke="#241c15" stroke-width="2.5"/><circle cx="650" cy="770" r="9" fill="#e0a521" stroke="#241c15" stroke-width="2.5"/><rect x="404" y="984" width="300" height="150" rx="14" fill="#241c15"/><rect x="400" y="980" width="300" height="150" rx="14" fill="#fdf8ee" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="550.0" y="1018.0">cytokine storm;</tspan></text><text font-size="28" font-weight="600" fill="#463a2c" text-anchor="middle" ><tspan x="550.0" y="1052.0">blood cells</tspan></text><text font-size="28" font-weight="600" fill="#463a2c" text-anchor="middle" ><tspan x="550.0" y="1084.0">swallowed</tspan></text><text font-size="28" font-weight="600" fill="#463a2c" text-anchor="middle" ><tspan x="550.0" y="1116.0">(haemophagocytosis)</tspan></text>
<text font-size="30" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="360.0" y="1190.0">The names</tspan></text>
<rect x="95" y="1219" width="540" height="74" rx="14" fill="#241c15"/><rect x="90" y="1214" width="540" height="74" rx="14" fill="#fbeec6" stroke="#241c15" stroke-width="3" />
<text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="360.0" y="1262.0">HLH/MAS: the whole spectrum</tspan></text>
<path d="M360 1292 V1320 M180 1320 H540 M180 1320 V1340 M540 1320 V1340" fill="none" stroke="#241c15" stroke-width="4"/>
<rect x="29" y="1345" width="320" height="128" rx="14" fill="#241c15"/><rect x="24" y="1340" width="320" height="128" rx="14" fill="#fdf8ee" stroke="#241c15" stroke-width="3" />
<text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="184.0" y="1382.0">Primary</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="middle" ><tspan x="184.0" y="1416.0">inherited;</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="middle" ><tspan x="184.0" y="1448.0">mostly children</tspan></text>
<rect x="381" y="1345" width="320" height="128" rx="14" fill="#241c15"/><rect x="376" y="1340" width="320" height="128" rx="14" fill="#fdf8ee" stroke="#241c15" stroke-width="3" />
<text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="536.0" y="1382.0">Secondary</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="middle" ><tspan x="536.0" y="1416.0">acquired; by far</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="middle" ><tspan x="536.0" y="1448.0">commonest in adults</tspan></text>
<path d="M536 1472 V1506" stroke="#241c15" stroke-width="4"/>
<rect x="305" y="1511" width="396" height="128" rx="14" fill="#241c15"/><rect x="300" y="1506" width="396" height="128" rx="14" fill="#fbe4d3" stroke="#241c15" stroke-width="3" />
<text font-size="28" font-weight="800" fill="#a53f12" text-anchor="middle" ><tspan x="498.0" y="1548.0">MAS</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="middle" ><tspan x="498.0" y="1582.0">when the trigger is an</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="middle" ><tspan x="498.0" y="1614.0">autoimmune disease</tspan></text>
</svg>
