<svg xmlns="http://www.w3.org/2000/svg" id="panc-calcium-d12-loop-breaks" viewBox="0 0 720 1888" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>The calcium loop with four places it breaks</title><desc>A loop down the page. Blood calcium falls. The parathyroid glands, behind the thyroid, release parathyroid hormone (PTH). PTH acts on: 1, bone releases calcium; 2, the kidney keeps calcium instead of losing it in urine; 3, the kidney activates vitamin D (calcitriol); 4, vitamin D makes the gut absorb more calcium. Blood calcium rises, and an arrow back up the side: PTH falls back (negative feedback). Four numbered breaks. 1, no hormone: damage at neck surgery, the commonest cause in hospital; hypoparathyroidism, autoimmune or genetic. 2, hormone that cannot be made or obeyed: low magnesium. 3, no vitamin D: severe deficiency. 4, calcium pulled out of the blood: pancreatitis; muscle breakdown and tumour lysis, where released phosphate binds calcium; large transfusions. Also critical illness and septic shock, kidney failure and drugs.</desc>
<rect width="720" height="1888" fill="#fdf8ee"/>
