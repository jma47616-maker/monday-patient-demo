pan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="100.0" y="1109.4">Damage to the parathyroid glands at neck</tspan><tspan x="100.0" y="1141.6">surgery, the commonest cause in hospital,</tspan><tspan x="100.0" y="1173.8">temporary or permanent. Long-term low</tspan><tspan x="100.0" y="1206.0">parathyroid function (hypoparathyroidism),</tspan><tspan x="100.0" y="1238.2">autoimmune or genetic.</tspan></text></g><g id="panc-calcium-d12-break-2"><rect x="30" y="1282.3600000000001" width="672" height="134.92000000000002" rx="14" fill="#241c15"/><rect x="24" y="1276.3600000000001" width="672" height="134.92000000000002" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3" /><polygon points="88.0,1312.4 76.7,1320.9 75.0,1334.9 62.0,1329.4 49.0,1334.9 47.3,1320.9 36.0,1312.4 47.3,1303.9 49.0,1289.8 62.0,1295.4 75.0,1289.8 76.7,1303.9" fill="#c8531b" stroke="#241c15" stroke-width="3" stroke-linejoin="round"/><text font-size="28" font-weight="800" fill="#fdf8ee" text-anchor="middle" ><tspan x="62.0" y="1322.4">2</tspan></text><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="100.0" y="1320.4">Hormone that cannot be made or</tspan><tspan x="100.0" y="1351.7">obeyed</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="100.0" y="1389.1">Low magnesium.</tspan></text></g><g id="panc-calcium-d12-break-3"><rect x="30" y="1433.2800000000002" width="672" height="103.56" rx="14" fill="#241c15"/><rect x="24" y="1427.2800000000002" width="672" height="103.56" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3" /><polygon points="88.0,1463.3 76.7,1471.8 75.0,1485.8 62.0,1480.3 49.0,1485.8 47.3,1471.8 36.0,1463.3 47.3,1454.8 49.0,1440.8 62.0,1446.3 75.0,1440.8 76.7,1454.8" fill="#c8531b" stroke="#241c15" stroke-width="3" stroke-linejoin="round"/><text font-size="28" font-weight="800" fill="#fdf8ee" text-anchor="middle" ><tspan x="62.0" y="1473.3">3</tspan></text><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="100.0" y="1471.3">No vitamin D</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="100.0" y="1508.6">Severe deficiency.</tspan></text></g><g id="panc-calcium-d12-break-4"><rect x="30" y="1552.8400000000001" width="672" height="200.16" rx="14" fill="#241c15"/><rect x="24" y="1546.8400000000001" width="672" height="200.16" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3" /><polygon points="88.0,1582.8 76.7,1591.3 75.0,1605.4 62.0,1599.8 49.0,1605.4 47.3,1591.3 36.0,1582.8 47.3,1574.3 49.0,1560.3 62.0,1565.8 75.0,1560.3 76.7,1574.3" fill="#c8531b" stroke="#241c15" stroke-width="3" stroke-linejoin="round"/><text font-size="28" font-weight="800" fill="#fdf8ee" text-anchor="middle" ><tspan x="62.0" y="1592.8">4</tspan></text><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="100.0" y="1590.8">Calcium pulled out of the blood</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="100.0" y="1628.2">Pancreatitis; muscle breakdown</tspan><tspan x="100.0" y="1660.4">(rhabdomyolysis) and tumour lysis, where</tspan><tspan x="100.0" y="1692.6">released phosphate binds calcium; large</tspan><tspan x="100.0" y="1724.8">transfusions.</tspan></text></g><rect x="28" y="1767.0000000000002" width="672" height="100.39999999999999" rx="14" fill="#241c15"/><rect x="24" y="1763.0000000000002" width="672" height="100.39999999999999" rx="14" fill="#fdf8ee" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="700" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="1807.0">Also: critical illness and septic shock;</tspan><tspan x="48.0" y="1839.2">kidney failure; drugs.</tspan></text>
