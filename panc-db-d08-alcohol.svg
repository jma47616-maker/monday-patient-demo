<svg xmlns="http://www.w3.org/2000/svg" id="panc-db-d08-alcohol" viewBox="0 0 720 832" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>A glass, a cell, and the three ways alcohol harms it</title><desc>A glass of beer points at an enzyme-making cell. Three numbered marks. 1: a burst on the cell wall, alcohol poisons the cell directly, with inflammation and cell destruction. 2: a plug in the small duct above the cell, protein plugs block the small ducts and the pressure behind them rises. 3: a curved arrow back down the duct, juice flows back into the gland and is switched on there. How alcohol does it is still poorly understood.</desc>
<rect width="720" height="832" fill="#fdf8ee"/>
