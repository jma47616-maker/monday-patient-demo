0.0 L59.9 -118.4 L71.9 -97.6 Z" fill="#c8531b" stroke="#c8531b" stroke-width="2" stroke-linejoin="round"/></g><path d="M200.0 220.0 L313.2 263.5" stroke="#241c15" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M330.0 270.0 L308.4 276.1 L318.0 250.9 Z" fill="#241c15" stroke="#241c15" stroke-width="2" stroke-linejoin="round"/><circle cx="330" cy="344" r="22" fill="#c8531b" stroke="#241c15" stroke-width="3.5"/><text font-size="28" font-weight="800" fill="#fdf8ee" text-anchor="middle" ><tspan x="330.0" y="352.6">1</tspan></text><circle cx="430" cy="92" r="22" fill="#c8531b" stroke="#241c15" stroke-width="3.5"/><text font-size="28" font-weight="800" fill="#fdf8ee" text-anchor="middle" ><tspan x="430.0" y="100.6">2</tspan></text><circle cx="600" cy="150" r="22" fill="#c8531b" stroke="#241c15" stroke-width="3.5"/><text font-size="28" font-weight="800" fill="#fdf8ee" text-anchor="middle" ><tspan x="600.0" y="158.6">3</tspan></text><circle cx="56" cy="522" r="22" fill="#c8531b" stroke="#241c15" stroke-width="3.5"/><text font-size="28" font-weight="800" fill="#fdf8ee" text-anchor="middle" ><tspan x="56.0" y="530.6">1</tspan></text><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="96.0" y="522.0">Poisons the cell directly</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="96.0" y="554.0">inflammation and cell destruction</tspan></text><circle cx="56" cy="614" r="22" fill="#c8531b" stroke="#241c15" stroke-width="3.5"/><text font-size="28" font-weight="800" fill="#fdf8ee" text-anchor="middle" ><tspan x="56.0" y="622.6">2</tspan></text><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="96.0" y="614.0">Protein plugs block the small ducts</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="96.0" y="646.0">the pressure behind them rises</tspan></text><circle cx="56" cy="706" r="22" fill="#c8531b" stroke="#2