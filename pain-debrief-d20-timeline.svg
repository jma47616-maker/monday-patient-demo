<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 514" width="360" height="514">
  <title>Anticoagulation afterwards</title>
  <!-- Card 22. A timeline from theatre to home: flow restored, a heparin pump (APTT 40 to 60), then a DOAC or warfarin once recovered and the surgeons are content, then usually for life after an embolus. -->
  
  <rect width="360" height="514" rx="16" fill="#f3e5c8"/>
  <circle cx="46" cy="54" r="26" fill="#fbf6ec" stroke="#241c15" stroke-width="3"/><path d="M34 60 h24 M46 44 v22" stroke="#241c15" stroke-width="3"/><text x="86" y="50" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#241c15" text-anchor="start">Theatre</text><text x="86" y="72.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#241c15" text-anchor="start">The artery opened</text><path d="M46 82 L46 118" stroke="#241c15" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M46 118 L41.7 109.0 L50.3 109.0 Z" fill="#241c15"/><circle cx="46" cy="164" r="26" fill="#a9cbd3" stroke="#241c15" stroke-width="3"/><rect x="32" y="154" width="28" height="20" rx="3" fill="#d9dde0" stroke="#241c15" stroke-width="2"/><text x="86" y="160" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#241c15" text-anchor="start">Heparin pump</text><text x="86" y="182.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#241c15" text-anchor="start">APTT 40–60</text><path d="M46 192 L46 228" stroke="#241c15" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M46 228 L41.7 219.0 L50.3 219.0 Z" fill="#241c15"/><circle cx="46" cy="274" r="26" fill="#e3b23c" stroke="#241c15" stroke-width="3"/><rect x="32" y="262" width="28" height="24" rx="3" fill="#ffffff" stroke="#241c15" stroke-width="2"/><circle cx="40" cy="274" r="3" fill="#c2643c"/><circle cx="52" cy="274" r="3" fill="#c2643c"/><text x="86" y="270" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#241c15" text-anchor="start">DOAC or warfarin</text><text x="86" y="292.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#241c15" text-anchor="start">once recovered and</text><text x="86" y="309.08" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#241c15" text-anchor="start">the surgeons are content</text><path d="M46 302 L46 338" stroke="#241c15" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M46 338 L41.7 329.0 L50.3 329.0 Z" fill="#241c15"/><circle cx="46" cy="384" r="26" fill="#e9a27f" stroke="#241c15" stroke-width="3"/><path d="M34 384 c0 -10 12 -10 12 0 c0 10 12 10 12 0 c0 -10 -12 -10 -12 0 c0 10 -12 10 -12 0 Z" fill="none" stroke="#241c15" stroke-width="3"/><text x="86" y="380" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#241c15" text-anchor="start">For life</text><text x="86" y="402.0" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#241c15" text-anchor="start">usually, after</text><text x="86" y="419.08" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#241c15" text-anchor="start">an embolus</text><rect x="12" y="462" width="336" height="40" rx="8" fill="#fbf6ec" stroke="#241c15" stroke-width="2"/><text x="180" y="487" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#c2643c" text-anchor="middle">Talk about the nosebleed</text>
</svg>
