<svg xmlns="http://www.w3.org/2000/svg" id="panc-calcium-d05-ph" viewBox="0 0 720 772" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Albumin seats before and after over-breathing</title><desc>Two panels. Before: an albumin with six seats, two taken by calcium, and four free calcium floating. After over-breathing, blood more alkaline: five seats taken and one free calcium left. Over-breathing blows off carbon dioxide and makes blood more alkaline. About 0.05 mmol/L less free calcium for every 0.1 rise in pH. The total, and so the adjusted, calcium do not change: calcium moves between the bound and free forms of the same total (our reasoning).</desc>
<rect width="720" height="772" fill="#fdf8ee"/>
<g id="panc-calcium-d05-before"><rect x="30" y="30" width="316" height="360" rx="14" fill="#241c15"/><rect x="24" y="24" width="316" height="360" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="182.0" y="70.0">Before</tspan></text><rect x="62" y="244" width="240" height="48" rx="24" fill="#9fb0cc" stroke="#241c15" stroke-width="4"/><path d="M69 246 a13 13 0 0 1 26 0" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><circle cx="82.0" cy="234.0" r="11" fill="#5b8fc9" stroke="#241c15" stroke-width="2.5"/><path d="M109 246 a13 13 0 0 1 26 0" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><circle cx="122.0" cy="234.0" r="11" fill="#5b8fc9" stroke="#241c15" stroke-width="2.5"/><path d="M149 246 a13 13 0 0 1 26 0" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><path d="M189 246 a13 13 0 0 1 26 0" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><path d="M229 246 a13 13 0 0 1 26 0" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><path d="M269 246 a13 13 0 0 1 26 0" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><circle cx="84.0" cy="174.0" r="11" fill="#5b8fc9" stroke="#241c15" stroke-width="2.5"/><circle cx="154.0" cy="194.0" r="11" fill="#5b8fc9" stroke="#241c15" stroke-width="2.5"/><circle cx="224.0" cy="174.0" r="11" fill="#5b8fc9" stroke="#241c15" stroke-width="2.5"/><circle cx="284.0" cy="199.0" r="11" fill="#5b8fc9" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="middle" ><tspan x="182.0" y="340.0">albumin</tspan></text></g><g id="panc-calcium-d05-after"><rect x="386" y="30" width="316" height="360" rx="14" fill="#241c15"/><rect x="380" y="24" width="316" height="360" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="538.0" y="70.0">After</tspan><tspan x="538.0" y="100.8">over-breathing</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="middle" ><tspan x="538.0" y="137.6">blood more alkaline</tspan></text><rect x="418" y="244" width="240" height="48" rx="24" fill="#9fb0cc" stroke="#241c15" stroke-width="4"/><path d="M425 246 a13 13 0 0 1 26 0" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><circle cx="438.0" cy="234.0" r="11" fill="#5b8fc9" stroke="#241c15" stroke-width="2.5"/><path d="M465 246 a13 13 0 0 1 26 0" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><circle cx="478.0" cy="234.0" r="11" fill="#5b8fc9" stroke="#241c15" stroke-width="2.5"/><path d="M505 246 a13 13 0 0 1 26 0" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><circle cx="518.0" cy="234.0" r="11" fill="#5b8fc9" stroke="#241c15" stroke-width="2.5"/><path d="M545 246 a13 13 0 0 1 26 0" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><circle cx="558.0" cy="234.0" r="11" fill="#5b8fc9" stroke="#241c15" stroke-width="2.5"/><path d="M585 246 a13 13 0 0 1 26 0" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><circle cx="598.0" cy="234.0" r="11" fill="#5b8fc9" stroke="#241c15" stroke-width="2.5"/><path d="M625 246 a13 13 0 0 1 26 0" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><circle cx="630.0" cy="184.0" r="11" fill="#5b8fc9" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="middle" ><tspan x="538.0" y="340.0">albumin</tspan></text></g><path d="M342.0 220.0 L360.0 220.0" stroke="#241c15" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M376.0 220.0 L360.0 232.0 L360.0 208.0 Z" fill="#241c15" stroke="#241c15" stroke-width="2" stroke-linejoin="round"/><rect x="30" y="416" width="672" height="331.4" rx="14" fill="#241c15"/><rect x="24" y="410" width="672" height="331.4" rx="14" fill="#fdf8ee" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="400" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="456.0">Over-breathing blows off carbon dioxide and</tspan><tspan x="48.0" y="488.2">makes blood more alkaline.</tspan></text><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="530.4">About 0.05 mmol/L less free calcium for</tspan><tspan x="48.0" y="562.6">every 0.1 rise in pH.</tspan></text><text font-size="28" font-weight="400" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="604.8">The total, and so the adjusted, calcium do not</tspan><tspan x="48.0" y="637.0">change: calcium moves between the bound and</tspan><tspan x="48.0" y="669.2">free forms of the same total.</tspan></text><text font-size="28" font-weight="700" fill="#7a6a52" text-anchor="start" ><tspan x="48.0" y="719.4">Our reasoning</tspan></text>
</svg>
