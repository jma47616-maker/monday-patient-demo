<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>A signpost with two arms: when the kidney screen is sent</title><desc>A signpost. One arm: no clear cause, blood and protein together, no infection, no catheter: think nephritis, ring the kidney team. The other arm: a clear cause: not needed.</desc>
<rect width="720" height="620" fill="#fdf8ee"/>
<ellipse cx="360" cy="590" rx="150" ry="16" fill="#f3e5c8" stroke="#241c15" stroke-width="4"/><rect x="342" y="20" width="36" height="570" rx="6" fill="#c69a6b" stroke="#241c15" stroke-width="5"/><path d="M30 46 H636 L704 151 L636 256 H30 Z" fill="#241c15" transform="translate(6 7)"/><path d="M30 46 H636 L704 151 L636 256 H30 Z" fill="#fbe4d3" stroke="#241c15" stroke-width="4" stroke-linejoin="round"/><text font-size="30" font-weight="500" fill="#241c15" text-anchor="start" ><tspan x="52.0" y="94.0">No clear cause, blood and protein</tspan><tspan x="52.0" y="131.2">together, no infection, no catheter:</tspan></text><text font-size="31" font-weight="800" fill="#a53f12" text-anchor="start" ><tspan x="52.0" y="174.4">think nephritis, ring the kidney</tspan><tspan x="52.0" y="212.8">team</tspan></text><path d="M560 322 H100 L28 382 L100 442 H560 Z" fill="#241c15" transform="translate(6 7)"/><path d="M560 322 H100 L28 382 L100 442 H560 Z" fill="#fdf8ee" stroke="#241c15" stroke-width="4" stroke-linejoin="round"/><text font-size="31" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="108.0" y="394.0">A clear cause:</tspan></text><text font-size="31" font-weight="500" fill="#241c15" text-anchor="start" ><tspan x="351.0" y="394.0">not needed</tspan></text>
</svg>
