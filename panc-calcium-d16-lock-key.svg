<svg xmlns="http://www.w3.org/2000/svg" id="panc-calcium-d16-lock-key" viewBox="0 0 720 1098" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>The parathyroid with a magnesium key, and without it</title><desc>Two panels. With magnesium: the parathyroid glands, a magnesium key in an open lock, an arrow of PTH reaching bone and kidney, ticked: PTH is released, and bone and kidney respond to it. Severe low magnesium: the glands greyed, the lock shut and no key, the PTH arrow faint, bone and kidney crossed: the glands stop releasing PTH, and bone and kidney respond less. With a low calcium a healthy gland should push PTH up; a normal PTH beside a low calcium is too low. Dean, back on Wednesday: PTH 3.2 pmol/L (1.6 to 6.9), with an adjusted calcium of 1.62.</desc>
