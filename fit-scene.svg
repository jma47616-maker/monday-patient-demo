<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <!-- AMU, Bed 14, mid-afternoon. Dennis on his side in the recovery position with an airway and oxygen, a drip running, Priya on the obs machine. Behind: the ward phone off its cradle, Jean ringing back. Charts on the clipboard at the foot of the bed. -->
  <defs>
    <linearGradient id="fsc-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e7c6"/>
      <stop offset="1" stop-color="#ecd6ad"/>
    </linearGradient>
    <linearGradient id="fsc-sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2c2" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fff2c2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fsc-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcd9ea"/>
      <stop offset="1" stop-color="#f2d9a6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="360" fill="url(#fsc-wall)"/>

  <!-- window, afternoon sun -->
  <rect x="30" y="70" width="170" height="130" rx="6" fill="url(#fsc-sky)" stroke="#241c15" stroke-width="4"/>
  <circle cx="160" cy="110" r="16" fill="#f7d77e" stroke="#241c15" stroke-width="3"/>
  <path d="M115 70 V200 M30 135 H200" stroke="#241c15" stroke-width="3"/>
  <path d="M40 186 q20 -18 40 -6 q20 -16 44 -2 q16 -10 30 0 q14 -8 36 4 V196 H40 Z" fill="#8fb07a" opacity=".7"/>
  <!-- curtain rail and a drawn-back bay curtain -->
  <path d="M0 62 H800" stroke="#8f9aa6" stroke-width="4"/>
  <path d="M206 62 q10 60 0 120 q12 60 4 118 L236 300 q-6 -60 6 -118 q-10 -60 2 -120 Z" fill="#9cc2b6" stroke="#241c15" stroke-width="3" stroke-linejoin="round"/>
  <path d="M216 70 q8 60 0 120 M228 70 q-6 60 4 120" fill="none" stroke="#6f998c" stroke-width="2"/>
  <!-- sunbeam across the bay -->
  <path d="M30 70 L200 70 L520 300 L140 300 Z" fill="url(#fsc-sun)">
    <animate attributeName="opacity" values=".9;.6;.9" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- nurses' station in the background, with the ward phone off its cradle -->
  <g>
    <rect x="300" y="96" width="210" height="56" rx="4" fill="#c7a06e" stroke="#241c15" stroke-width="3"/>
    <rect x="300" y="90" width="210" height="10" rx="2" fill="#a67d4c" stroke="#241c15" stroke-width="3"/>
    <rect x="312" y="70" width="42" height="24" rx="2" fill="#3a3646" stroke="#241c15" stroke-width="2.5"/>
    <rect x="316" y="74" width="34" height="16" fill="#9cc2d6"/>
    <text x="380" y="84" text-anchor="middle" font-family="Bricolage Grotesque, Geist, sans-serif" font-size="11" font-weight="700" fill="#241c15">AMU</text>
    <!-- phone base on the desk -->
    <rect x="410" y="78" width="36" height="14" rx="3" fill="#3a3646" stroke="#241c15" stroke-width="2.5"/>
    <circle cx="418" cy="85" r="2" fill="#e85a5a"><animate attributeName="opacity" values="1;.2;1" dur=".7s" repeatCount="indefinite"/></circle>
    <!-- handset dangling over the desk edge on its curly cord -->
    <path d="M438 90 q-4 6 2 10 q6 4 0 8 q-6 4 0 8 q6 4 0 8" fill="none" stroke="#3a3646" stroke-width="2.2"/>
    <g>
      <rect x="430" y="124" width="12" height="30" rx="5" fill="#3a3646" stroke="#241c15" stroke-width="2.5"/>
      <animateTransform attributeName="transform" type="rotate" values="-6 436 124;6 436 124;-6 436 124" dur="1.6s" repeatCount="indefinite"/>
    </g>
    <g fill="none" stroke="#c8531b" stroke-width="2.6" stroke-linecap="round">
      <path d="M454 124 q6 6 0 12"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite"/></path>
      <path d="M460 118 q12 12 0 24"><animate attributeName="opacity" values=".2;1;.2" dur="1.2s" repeatCount="indefinite"/></path>
    </g>
  </g>

  <!-- floor -->
  <rect x="0" y="300" width="800" height="60" fill="#c9b894" stroke="#241c15" stroke-width="3"/>
  <path d="M0 330 H800" stroke="#b3a27c" stroke-width="2"/>

  <!-- drip stand, running -->
  <g>
    <path d="M556 60 V300 M536 302 H576" stroke="#6f7a86" stroke-width="5" stroke-linecap="round"/>
    <path d="M540 62 H572" stroke="#6f7a86" stroke-width="4" stroke-linecap="round"/>
    <path d="M540 64 v6 M572 64 v6" stroke="#6f7a86" stroke-width="3"/>
    <rect x="528" y="70" width="26" height="40" rx="6" fill="#e9f2f4" stroke="#241c15" stroke-width="3"/>
    <rect x="532" y="84" width="18" height="22" rx="3" fill="#cfe6ef"/>
    <path d="M533 76 h16" stroke="#7aa9b3" stroke-width="2"/>
    <rect x="537" y="110" width="8" height="14" rx="2" fill="#fdf8ee" stroke="#241c15" stroke-width="2"/>
    <circle cx="541" cy="116" r="1.6" fill="#7aa9b3"><animate attributeName="cy" values="113;121;113" dur="1.1s" repeatCount="indefinite"/></circle>
    <path d="M541 124 C540 170 520 196 480 222" fill="none" stroke="#dfe7e3" stroke-width="3"/>
    <path d="M541 124 C540 170 520 196 480 222" fill="none" stroke="#241c15" stroke-width="1" opacity=".4"/>
  </g>

  <!-- bed -->
  <rect x="96" y="212" width="440" height="52" rx="10" fill="#dfe7e3" stroke="#241c15" stroke-width="4"/>
  <rect x="96" y="264" width="440" height="16" fill="#8f9aa6" stroke="#241c15" stroke-width="4"/>
  <rect x="116" y="280" width="16" height="26" fill="#6f7a86" stroke="#241c15" stroke-width="3"/>
  <rect x="500" y="280" width="16" height="26" fill="#6f7a86" stroke="#241c15" stroke-width="3"/>
  <circle cx="124" cy="310" r="9" fill="#3a3646" stroke="#241c15" stroke-width="3"/>
  <circle cx="508" cy="310" r="9" fill="#3a3646" stroke="#241c15" stroke-width="3"/>
  <!-- foot board -->
  <rect x="84" y="176" width="22" height="104" rx="6" fill="#b8c2cc" stroke="#241c15" stroke-width="4"/>
  <!-- head board -->
  <rect x="526" y="160" width="20" height="120" rx="6" fill="#b8c2cc" stroke="#241c15" stroke-width="4"/>
  <!-- pillow -->
  <ellipse cx="470" cy="210" rx="52" ry="18" fill="#fdf8ee" stroke="#241c15" stroke-width="3.5"/>

  <!-- Dennis under the blanket, on his left side: hip high, top knee drawn up towards the viewer -->
  <path d="M130 222 Q170 188 230 196 Q270 168 320 184 Q360 176 400 190 Q430 186 446 204 L446 236 Q300 250 130 244 Z" fill="#f6f1e4" stroke="#241c15" stroke-width="3.5">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.8;0 0" dur="1.8s" repeatCount="indefinite"/>
  </path>
  <path d="M170 236 Q220 214 270 226 M300 206 Q320 196 340 206" fill="none" stroke="#c9bfa8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- shoulder in the gown -->
  <path d="M400 190 Q424 170 450 180 Q458 196 448 214 L400 214 Z" fill="#c9d7d3" stroke="#241c15" stroke-width="3.5"/>
  <!-- top arm forward over the blanket, hand near the face, cannula and dressing -->
  <path d="M436 196 Q420 214 424 232 Q440 238 468 230" fill="none" stroke="#dcae8a" stroke-width="14" stroke-linecap="round"/>
  <path d="M436 196 Q420 214 424 232 Q440 238 468 230" fill="none" stroke="#241c15" stroke-width="3" stroke-linecap="round" opacity=".85"/>
  <rect x="440" y="228" width="14" height="8" rx="2" fill="#fdf8ee" stroke="#241c15" stroke-width="2"/>
  <!-- obs probe lead from the finger to the machine -->
  <path d="M470 230 C520 250 560 240 600 214 C640 188 680 170 704 150" fill="none" stroke="#3a3646" stroke-width="2.2"/>
  <rect x="464" y="224" width="10" height="10" rx="3" fill="#e85a5a" stroke="#241c15" stroke-width="1.8"/>

  <!-- head, on its side on the pillow: crown to the headboard, chin down towards the chest, eyes shut -->
  <g transform="rotate(80 482 194)">
    <ellipse cx="482" cy="194" rx="25" ry="30" fill="#dcae8a" stroke="#241c15" stroke-width="3.5"/>
    <path d="M458 190 Q456 170 468 164 M506 190 Q508 170 496 164" fill="none" stroke="#b9b6ae" stroke-width="6" stroke-linecap="round"/>
    <path d="M468 190 q5 3 10 0 M486 190 q5 3 10 0" fill="none" stroke="#241c15" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M466 184 q6 -3 11 -1 M487 183 q6 -2 11 1" fill="none" stroke="#9c958a" stroke-width="3" stroke-linecap="round"/>
    <path d="M462 206 Q482 230 502 206 Q494 222 482 222 Q470 222 462 206 Z" fill="#9c958a" opacity=".5"/>
    <!-- mask over nose and mouth, the airway flange showing through it -->
    <ellipse cx="482" cy="208" rx="13" ry="15" fill="#cfeee0" fill-opacity=".75" stroke="#241c15" stroke-width="2.6"/>
    <path d="M478 198 q-2 6 4 8" fill="none" stroke="#241c15" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="486" cy="204" rx="4.5" ry="2.2" fill="#e38a3a" stroke="#241c15" stroke-width="1.6"/>
    <ellipse cx="482" cy="214" rx="4" ry="2.2" fill="#7a3a2e" opacity=".8"/>
    <path d="M469 204 L456 200 M495 204 L508 200" stroke="#7aa9b3" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- reservoir bag and oxygen tubing up to the wall outlet -->
  <path d="M452 200 q-10 4 -10 16 q10 8 20 0 q0 -12 -10 -16 Z" fill="#cfeee0" fill-opacity=".85" stroke="#241c15" stroke-width="2.2">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1.5;0 0" dur="1.8s" repeatCount="indefinite"/>
  </path>
  <path d="M458 196 C470 150 500 140 534 140" fill="none" stroke="#7aa9b3" stroke-width="3"/>
  <rect x="530" y="132" width="16" height="16" rx="3" fill="#dfe7e3" stroke="#241c15" stroke-width="2.5"/>
  <circle cx="538" cy="140" r="3" fill="#7dd3a0"/>

  <!-- clipboard on the foot board: CIWA chart and drug chart -->
  <g transform="rotate(-4 96 220)">
    <rect x="66" y="186" width="52" height="68" rx="3" fill="#a67d4c" stroke="#241c15" stroke-width="3"/>
    <rect x="72" y="194" width="40" height="54" rx="1" fill="#fdf8ee" stroke="#241c15" stroke-width="2"/>
    <rect x="76" y="192" width="40" height="54" rx="1" fill="#f6e3e3" stroke="#241c15" stroke-width="2"/>
    <text x="96" y="204" text-anchor="middle" font-family="Geist, sans-serif" font-size="8" font-weight="700" fill="#7a2a1e">CIWA</text>
    <path d="M80 210 H112 M80 216 H112 M80 222 H112 M80 228 H112 M80 234 H112 M80 240 H112" stroke="#c9a0a0" stroke-width="1.2"/>
    <path d="M82 236 L88 226 L94 230 L100 218 L106 224" fill="none" stroke="#241c15" stroke-width="1.6"/>
    <rect x="86" y="182" width="20" height="8" rx="2" fill="#8f9aa6" stroke="#241c15" stroke-width="2"/>
  </g>
  <g>
    <rect x="58" y="238" width="30" height="40" rx="1" fill="#fdf8ee" stroke="#241c15" stroke-width="2" transform="rotate(8 73 258)"/>
    <path d="M62 250 H84 M62 256 H80 M62 262 H84 M62 268 H78" stroke="#a08c6e" stroke-width="1.6" transform="rotate(8 73 258)"/>
    <text x="73" y="247" text-anchor="middle" font-family="Geist, sans-serif" font-size="6" font-weight="700" fill="#241c15" transform="rotate(8 73 258)">DRUGS</text>
  </g>

  <!-- obs machine on its wheeled stand -->
  <g>
    <path d="M722 190 V300 M702 302 H742" stroke="#6f7a86" stroke-width="5" stroke-linecap="round"/>
    <circle cx="704" cy="306" r="5" fill="#3a3646"/><circle cx="740" cy="306" r="5" fill="#3a3646"/>
    <rect x="690" y="126" width="80" height="66" rx="6" fill="#dfe7e3" stroke="#241c15" stroke-width="3.5"/>
    <rect x="698" y="134" width="64" height="36" rx="3" fill="#0f2a22"/>
    <text x="702" y="148" font-family="ui-monospace,monospace" font-size="10" fill="#7dd3a0">HR 108</text>
    <text x="702" y="163" font-family="ui-monospace,monospace" font-size="10" fill="#7dd3a0">SpO₂ 95</text>
    <circle cx="756" cy="146" r="3" fill="#7dd3a0"><animate attributeName="opacity" values="1;.2;1" dur=".56s" repeatCount="indefinite"/></circle>
    <rect x="700" y="176" width="14" height="8" rx="2" fill="#8f9aa6"/><rect x="718" y="176" width="14" height="8" rx="2" fill="#8f9aa6"/><rect x="736" y="176" width="14" height="8" rx="2" fill="#c8531b"/>
    <path d="M690 180 C660 186 650 210 664 222" fill="none" stroke="#3a3646" stroke-width="2.4"/>
  </g>

  <!-- Staff Nurse Priya Nair, standing at the bedside, pressing the cycle button -->
  <g>
    <!-- legs -->
    <path d="M608 286 V304 M632 286 V304" stroke="#1f3a64" stroke-width="12" stroke-linecap="round"/>
    <path d="M600 306 h16 M626 306 h16" stroke="#241c15" stroke-width="6" stroke-linecap="round"/>
    <!-- tunic and trousers -->
    <path d="M590 288 L594 206 Q620 192 646 206 L650 288 Z" fill="#1f3a64" stroke="#241c15" stroke-width="3.5"/>
    <path d="M608 204 L620 222 L632 204" fill="none" stroke="#c0282d" stroke-width="3"/>
    <path d="M594 250 H650" stroke="#c0282d" stroke-width="2"/>
    <!-- fob watch -->
    <circle cx="604" cy="226" r="4.5" fill="#fdf8ee" stroke="#241c15" stroke-width="2"/>
    <!-- arm reaching to the machine -->
    <path d="M644 214 Q670 196 694 180" fill="none" stroke="#1f3a64" stroke-width="12" stroke-linecap="round"/>
    <path d="M644 214 Q670 196 694 180" fill="none" stroke="#241c15" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
    <circle cx="700" cy="178" r="6" fill="#c68b5f" stroke="#241c15" stroke-width="2.5"/>
    <!-- other arm, hand resting on the bed rail -->
    <path d="M596 214 Q584 236 560 238" fill="none" stroke="#1f3a64" stroke-width="12" stroke-linecap="round"/>
    <circle cx="556" cy="238" r="6" fill="#c68b5f" stroke="#241c15" stroke-width="2.5"/>
    <!-- neck and head -->
    <rect x="613" y="186" width="14" height="14" fill="#b07a52" stroke="#241c15" stroke-width="2.5"/>
    <circle cx="640" cy="152" r="8" fill="#1f1714" stroke="#241c15" stroke-width="2.5"/>
    <ellipse cx="620" cy="166" rx="20" ry="23" fill="#c68b5f" stroke="#241c15" stroke-width="3.5"/>
    <path d="M600 168 C598 146 608 140 620 140 C634 140 642 146 640 168 C636 156 630 150 620 150 C610 150 604 156 600 168 Z" fill="#1f1714" stroke="#241c15" stroke-width="2.5"/>
    <path d="M608 166 q4 -2 8 0 M624 166 q4 -2 8 0" fill="none" stroke="#241c15" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="612" cy="170" r="1.8" fill="#241c15"/><circle cx="628" cy="170" r="1.8" fill="#241c15"/>
    <path d="M614 180 q6 3 12 0" fill="none" stroke="#241c15" stroke-width="2" stroke-linecap="round"/>
  </g>

  <text x="20" y="28" font-family="Bricolage Grotesque, Geist, sans-serif" font-size="18" font-weight="700" fill="#241c15">AMU · Bed 14 · 15:20</text>
  <text x="20" y="50" font-family="Geist, sans-serif" font-size="13" fill="#7a6a52">On his side now, breathing through an airway. The phone at the station is ringing.</text>
</svg>
