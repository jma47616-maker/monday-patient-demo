<svg xmlns="http://www.w3.org/2000/svg" id="panc-calcium-d24-qt-stack" viewBox="0 0 720 914" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>A QT built from stacked blocks</title><desc>A bar built from blocks: a normal QT, then low calcium, low magnesium and low potassium, reaching a dashed line: Dean, QTc 510 ms; a dashed block beyond it, a QT drug: then ondansetron, plus 15 ms. Each adds length; the sizes are a sketch. Low calcium, low magnesium and low potassium all lengthen the QT. Ondansetron lengthens it, more with higher doses; correct low potassium and magnesium before giving it. In the case, ondansetron lengthened Dean’s QTc by 15 ms and brought single early beats. Cyclizine: the BNF lists no QT caution.</desc>
<rect width="720" height="914" fill="#fdf8ee"/>
<rect x="40" y="40" width="220" height="70" fill="#f3e5c8" stroke="#241c15" stroke-width="3"/><rect x="260" y="40" width="110" height="70" fill="#c8531b" stroke="#241c15" stroke-width="3"/><rect x="370" y="40" width="110" height="70" fill="#4f9a8c" stroke="#241c15" stroke-width="3"/><rect x="480" y="40" width="110" height="70" fill="#c9a43a" stroke="#241c15" stroke-width="3"/><path d="M590 20 V130" stroke="#241c15" stroke-width="5" stroke-dasharray="10 8"/><text font-size="28" font-weight="800" fill="#a53f12" text-anchor="end" ><tspan x="582.0" y="168.0">Dean: QTc 510 ms</tspan></text><rect x="590" y="40" width="90" height="70" fill="#8a6bb8" stroke="#241c15" stroke-width="3" stroke-dasharray="10 6"/><text font-size="28" font-weight="700" fill="#8a6bb8" text-anchor="end" ><tspan x="680.0" y="208.0">then ondansetron: +15 ms</tspan></text><rect x="40" y="226" width="34" height="34" rx="6" fill="#f3e5c8" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="start" ><tspan x="90.0" y="252.0">Normal QT</tspan></text><rect x="40" y="276" width="34" height="34" rx="6" fill="#c8531b" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="start" ><tspan x="90.0" y="302.0">Low calcium</tspan></text><rect x="40" y="326" width="34" height="34" rx="6" fill="#4f9a8c" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="start" ><tspan x="90.0" y="352.0">Low magnesium</tspan></text><rect x="40" y="376" width="34" height="34" rx="6" fill="#c9a43a" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="start" ><tspan x="90.0" y="402.0">Low potassium</tspan></text><rect x="40" y="426" width="34" height="34" rx="6" fill="#8a6bb8" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="start" ><tspan x="90.0" y="452.0">A QT drug</tspan></text><text font-size="28" font-weight="400" fill="#7a6a52" text-anchor="start" ><tspan x="40.0" y="506.0">Each adds length; the sizes are a sketch.</tspan></text><rect x="30" y="546" width="672" height="347.6" rx="14" fill="#241c15"/><rect x="24" y="540" width="672" height="347.6" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="400" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="586.0">Low calcium, low magnesium and low</tspan><tspan x="48.0" y="618.2">potassium all lengthen the QT.</tspan></text><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="660.4">Ondansetron lengthens it, more with</tspan><tspan x="48.0" y="692.6">higher doses. Correct low potassium and</tspan><tspan x="48.0" y="724.8">magnesium before giving it.</tspan></text><text font-size="28" font-weight="400" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="767.0">In the case, ondansetron lengthened Dean’s</tspan><tspan x="48.0" y="799.2">QTc by 15 ms and brought single early beats.</tspan></text><text font-size="28" font-weight="800" fill="#3f6a32" text-anchor="start" ><tspan x="48.0" y="841.4">Cyclizine: the BNF lists no QT caution.</tspan></text>
</svg>
