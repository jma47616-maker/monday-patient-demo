<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- Capillary glucose: a meter in a gloved hand, strip in, a drop of blood on its tip, reading 6.2. -->
  <defs>
    <linearGradient id="fbm-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f1ea"/>
      <stop offset="1" stop-color="#d9d4c8"/>
    </linearGradient>
    <linearGradient id="fbm-lcd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfeadf"/>
      <stop offset="1" stop-color="#c6d6c5"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" fill="#f3e5c8"/>
  <circle cx="150" cy="150" r="140" fill="#faf0da" stroke="#241c15" stroke-width="3"/>

  <!-- the meter, tilted a touch -->
  <g transform="rotate(-8 150 150)">
    <!-- test strip out of the top, with the drop on its tip -->
    <rect x="138" y="30" width="24" height="52" rx="2" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/>
    <rect x="144" y="54" width="12" height="20" fill="#e0a521" opacity=".7"/>
    <path d="M144 40 h12" stroke="#b8552e" stroke-width="2"/>
    <path d="M150 12 C142 24 140 30 142 34 C144 40 156 40 158 34 C160 30 158 24 150 12 Z" fill="#a3161e" stroke="#241c15" stroke-width="2.5" stroke-linejoin="round">
      <animateTransform attributeName="transform" type="scale" values="1 1;1.05 .97;1 1" dur="2.4s" repeatCount="indefinite" additive="sum"/>
    </path>
    <ellipse cx="147" cy="26" rx="2" ry="3.5" fill="#fff" opacity=".7"/>
    <!-- body -->
    <rect x="92" y="74" width="116" height="176" rx="26" fill="url(#fbm-body)" stroke="#241c15" stroke-width="4"/>
    <path d="M104 88 Q150 78 196 88" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".8"/>
    <!-- screen -->
    <rect x="106" y="96" width="88" height="70" rx="8" fill="#3a3646" stroke="#241c15" stroke-width="3"/>
    <rect x="112" y="102" width="76" height="58" rx="4" fill="url(#fbm-lcd)"/>
    <text x="150" y="137" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="28" font-weight="700" fill="#1e2a1e">6.2</text>
    <text x="150" y="153" text-anchor="middle" font-family="Geist, Arial, sans-serif" font-size="11" font-weight="700" fill="#1e2a1e">mmol/L</text>
    <path d="M118 110 h8 M118 110 v6" stroke="#1e2a1e" stroke-width="1.6" fill="none">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <!-- buttons -->
    <circle cx="150" cy="196" r="14" fill="#b8552e" stroke="#241c15" stroke-width="3"/>
    <circle cx="150" cy="196" r="6" fill="none" stroke="#fdf8ee" stroke-width="2" opacity=".6"/>
    <rect x="112" y="190" width="18" height="10" rx="4" fill="#8f9aa6" stroke="#241c15" stroke-width="2"/>
    <rect x="170" y="190" width="18" height="10" rx="4" fill="#8f9aa6" stroke="#241c15" stroke-width="2"/>
  </g>

  <!-- gloved hand: fingers wrapping from the left, thumb over the front -->
  <g>
    <!-- wrist and cuff -->
    <path d="M40 300 L70 214 Q96 206 118 222 L110 300 Z" fill="#7d93d9" stroke="#241c15" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M58 250 Q86 242 114 256" fill="none" stroke="#5f75bd" stroke-width="3"/>
    <!-- palm behind the meter base -->
    <path d="M70 214 Q80 186 100 180 L112 236 Z" fill="#7d93d9" stroke="#241c15" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- fingers curling round the right edge -->
    <g fill="#7d93d9" stroke="#241c15" stroke-width="3.2">
      <rect x="196" y="150" width="30" height="20" rx="10" transform="rotate(-8 150 150)"/>
      <rect x="198" y="174" width="30" height="20" rx="10" transform="rotate(-8 150 150)"/>
      <rect x="196" y="198" width="28" height="20" rx="10" transform="rotate(-8 150 150)"/>
      <rect x="190" y="222" width="24" height="18" rx="9" transform="rotate(-8 150 150)"/>
    </g>
    <!-- thumb resting across the lower-left face -->
    <g transform="rotate(-38 98 224)">
      <rect x="84" y="212" width="62" height="24" rx="12" fill="#8ea2e2" stroke="#241c15" stroke-width="3.2"/>
      <path d="M128 216 q8 2 12 10" fill="none" stroke="#5f75bd" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- glove sheen -->
    <path d="M78 232 Q84 222 92 220" fill="none" stroke="#c3cff4" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
