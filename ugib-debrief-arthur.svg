<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Arthur">
  <rect width="200" height="200" fill="#efe7da"/>
  <!-- shoulders / gown -->
  <path d="M28 200 C34 156 62 138 100 138 C138 138 166 156 172 200 Z" fill="#9db4c0" stroke="#2b241d" stroke-width="4"/>
  <path d="M84 148 L100 170 L116 148" fill="none" stroke="#2b241d" stroke-width="3" opacity=".6"/>
  <!-- neck -->
  <path d="M86 118 h28 v28 c0 8 -28 8 -28 0 Z" fill="#d9cabb" stroke="#2b241d" stroke-width="3.5"/>
  <!-- head: pale, greyish -->
  <ellipse cx="100" cy="82" rx="46" ry="50" fill="#e2d6c9" stroke="#2b241d" stroke-width="4"/>
  <!-- pallor tint on cheeks -->
  <ellipse cx="76" cy="102" rx="12" ry="7" fill="#b9c2c6" opacity=".5"/>
  <ellipse cx="124" cy="102" rx="12" ry="7" fill="#b9c2c6" opacity=".5"/>
  <!-- grey side hair, bald crown -->
  <path d="M54 74 C52 56 62 40 78 34 C70 48 68 60 68 72 Z" fill="#b9b3a8" stroke="#2b241d" stroke-width="3.5"/>
  <path d="M146 74 C148 56 138 40 122 34 C130 48 132 60 132 72 Z" fill="#b9b3a8" stroke="#2b241d" stroke-width="3.5"/>
  <!-- worried brows -->
  <path d="M66 66 q14 -8 26 -1" fill="none" stroke="#2b241d" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M134 66 q-14 -8 -26 -1" fill="none" stroke="#2b241d" stroke-width="4.5" stroke-linecap="round"/>
  <!-- tired eyes -->
  <path d="M72 82 q10 8 20 0" fill="none" stroke="#2b241d" stroke-width="4" stroke-linecap="round"/>
  <path d="M108 82 q10 8 20 0" fill="none" stroke="#2b241d" stroke-width="4" stroke-linecap="round"/>
  <path d="M72 92 q10 4 18 0" fill="none" stroke="#7a6f60" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
  <path d="M110 92 q10 4 18 0" fill="none" stroke="#7a6f60" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
  <!-- nose + open worried mouth -->
  <path d="M100 88 q4 10 -2 16" fill="none" stroke="#2b241d" stroke-width="3.5" stroke-linecap="round"/>
  <ellipse cx="100" cy="116" rx="9" ry="6" fill="#8c6a5a" stroke="#2b241d" stroke-width="3"/>
  <!-- animated sweat drops -->
  <g fill="#8fb6d9" stroke="#2b241d" stroke-width="2.5">
    <path d="M146 58 c6 8 6 14 0 17 c-6 -3 -6 -9 0 -17 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 10" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <path d="M54 92 c5 7 5 12 0 15 c-5 -3 -5 -8 0 -15 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 9" dur="1.7s" begin=".5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="1.7s" begin=".5s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
