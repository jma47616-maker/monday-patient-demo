<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Sophie">
  <rect width="200" height="200" fill="#efe7da"/>
  <!-- shoulders / cardigan -->
  <path d="M28 200 C34 156 62 138 100 138 C138 138 166 156 172 200 Z" fill="#b8552e" stroke="#2b241d" stroke-width="4"/>
  <path d="M100 142 L100 200" fill="none" stroke="#2b241d" stroke-width="3" opacity=".45"/>
  <!-- neck -->
  <path d="M87 118 h26 v26 c0 8 -26 8 -26 0 Z" fill="#e8cdb2" stroke="#2b241d" stroke-width="3.5"/>
  <!-- head -->
  <ellipse cx="100" cy="82" rx="44" ry="48" fill="#f0dcc4" stroke="#2b241d" stroke-width="4"/>
  <!-- auburn hair, tied back -->
  <path d="M56 82 C52 46 72 26 100 26 C128 26 148 46 144 82 C142 60 130 42 100 42 C70 42 58 60 56 82 Z" fill="#8a4b32" stroke="#2b241d" stroke-width="3.5"/>
  <path d="M144 70 C156 74 158 90 150 98 C152 88 148 78 144 76 Z" fill="#8a4b32" stroke="#2b241d" stroke-width="3"/>
  <!-- concerned brows -->
  <path d="M66 64 q14 -7 26 -1" fill="none" stroke="#2b241d" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M134 64 q-14 -7 -26 -1" fill="none" stroke="#2b241d" stroke-width="4.5" stroke-linecap="round"/>
  <!-- alert wide eyes -->
  <ellipse cx="81" cy="82" rx="7.5" ry="9" fill="#fff" stroke="#2b241d" stroke-width="3"/>
  <ellipse cx="119" cy="82" rx="7.5" ry="9" fill="#fff" stroke="#2b241d" stroke-width="3"/>
  <circle cx="81" cy="84" r="3.4" fill="#2b241d"/>
  <circle cx="119" cy="84" r="3.4" fill="#2b241d"/>
  <!-- nose + worried small mouth -->
  <path d="M100 88 q3 9 -2 14" fill="none" stroke="#2b241d" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M92 116 q8 5 16 0" fill="none" stroke="#2b241d" stroke-width="3.5" stroke-linecap="round"/>
  <!-- cheek warmth -->
  <ellipse cx="76" cy="100" rx="10" ry="6" fill="#d98e6b" opacity=".35"/>
  <ellipse cx="124" cy="100" rx="10" ry="6" fill="#d98e6b" opacity=".35"/>
</svg>
