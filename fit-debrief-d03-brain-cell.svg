<svg xmlns="http://www.w3.org/2000/svg" id="fitd03" viewBox="0 0 720 1004" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>One brain cell inside a skull, in three states: normal, swollen, adapted</title><desc>Panel one: a brain cell at normal size, full of solutes, with a gap between brain and skull. Normal. Panel two: the cell is larger, water is moving in and the brain fills the skull. Sodium falls: water moves in, pressure rises. Panel three: the cell is back to normal size with fewer solutes inside and some leaving. About 48 hours: solutes shed, size regained. A warning mark and an upward arrow: now a fast rise is the danger.</desc>
