<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- The specimen pot from the ambulance. It looks like urine. That is the point: the blood is not visible. -->
  <rect width="400" height="300" fill="#f3e5c8"/>
  <rect x="0" y="230" width="400" height="70" fill="#b8c2cc" stroke="#241c15" stroke-width="3"/>
  <path d="M0 236 H400" stroke="#8f9aa6" stroke-width="2"/>
  <g transform="translate(145 60)">
    <rect x="0" y="0" width="110" height="180" rx="10" fill="#f6f1e4" stroke="#241c15" stroke-width="3.5"/>
    <rect x="10" y="128" width="90" height="44" rx="6" fill="#e6b84a" opacity=".9"/>
    <rect x="10" y="128" width="90" height="5" fill="#fff" opacity=".6"/>
    <path d="M100 136 q6 14 0 28" stroke="#fff" stroke-width="4" opacity=".5" stroke-linecap="round"/>
    <rect x="-6" y="-14" width="122" height="24" rx="6" fill="#c8531b" stroke="#241c15" stroke-width="3.5"/>
    <rect x="18" y="26" width="74" height="40" rx="3" fill="#fdf8ee" stroke="#241c15" stroke-width="2"/>
    <text x="55" y="42" text-anchor="middle" font-family="Geist, sans-serif" font-size="10" fill="#241c15">BRIGG, W</text>
    <text x="55" y="58" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#a08c6e">02:15 · ambulance</text>
    <!-- an unused dipstick beside it -->
    <g transform="translate(122 100) rotate(10)">
      <rect x="0" y="0" width="10" height="110" rx="2" fill="#fdf8ee" stroke="#241c15" stroke-width="2.5"/>
      <rect x="1.5" y="8" width="7" height="7" fill="#d9c9a6"/><rect x="1.5" y="20" width="7" height="7" fill="#d9c9a6"/><rect x="1.5" y="32" width="7" height="7" fill="#d9c9a6"/><rect x="1.5" y="44" width="7" height="7" fill="#d9c9a6"/><rect x="1.5" y="56" width="7" height="7" fill="#d9c9a6"/><rect x="1.5" y="68" width="7" height="7" fill="#d9c9a6"/><rect x="1.5" y="80" width="7" height="7" fill="#d9c9a6"/>
    </g>
  </g>
  <text x="20" y="282" font-family="Geist, sans-serif" font-size="12" fill="#463a2c">Small volume. Amber, clear, no clots. It looks like urine. Nobody has dipped it.</text>
</svg>
