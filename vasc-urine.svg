<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Two specimen pots on the trolley: a normal one for comparison, and his. -->
  <rect width="400" height="300" fill="#f3e5c8"/>
  <rect x="0" y="230" width="400" height="70" fill="#b8c2cc" stroke="#241c15" stroke-width="3"/>
  <path d="M0 236 H400" stroke="#8f9aa6" stroke-width="2"/>
  <!-- pot 1: normal straw -->
  <g transform="translate(70 60)">
    <rect x="0" y="0" width="110" height="180" rx="10" fill="#f6f1e4" stroke="#241c15" stroke-width="3.5"/>
    <rect x="10" y="90" width="90" height="82" rx="6" fill="#f2d98a" opacity=".85"/>
    <rect x="10" y="90" width="90" height="6" fill="#fff" opacity=".6"/>
    <rect x="-6" y="-14" width="122" height="24" rx="6" fill="#c8531b" stroke="#241c15" stroke-width="3.5"/>
    <rect x="18" y="26" width="74" height="40" rx="3" fill="#fdf8ee" stroke="#241c15" stroke-width="2"/>
    <text x="55" y="42" text-anchor="middle" font-family="Geist, sans-serif" font-size="10" fill="#7a6a52">NORMAL</text>
    <text x="55" y="58" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#a08c6e">for comparison</text>
    <path d="M100 100 q6 30 0 60" stroke="#fff" stroke-width="4" opacity=".5" stroke-linecap="round"/>
  </g>
  <!-- pot 2: his -->
  <g transform="translate(220 60)">
    <rect x="0" y="0" width="110" height="180" rx="10" fill="#f6f1e4" stroke="#241c15" stroke-width="3.5"/>
    <rect x="10" y="132" width="90" height="40" rx="6" fill="#4a1f10"/>
    <rect x="10" y="132" width="90" height="5" fill="#8a4a2a" opacity=".8"/>
    <path d="M14 140 q40 6 82 0 v28 q-42 6 -82 0 Z" fill="#3a140a"/>
    <path d="M100 140 q6 14 0 28" stroke="#c98a5a" stroke-width="3" opacity=".5" stroke-linecap="round"/>
    <rect x="-6" y="-14" width="122" height="24" rx="6" fill="#c8531b" stroke="#241c15" stroke-width="3.5"/>
    <rect x="18" y="26" width="74" height="40" rx="3" fill="#fdf8ee" stroke="#241c15" stroke-width="2"/>
    <text x="55" y="42" text-anchor="middle" font-family="Geist, sans-serif" font-size="10" fill="#241c15">BRIGG, W</text>
    <text x="55" y="58" text-anchor="middle" font-family="Geist Mono, monospace" font-size="9" fill="#a08c6e">02:15 · ambulance</text>
    <!-- a dipstick leaning on it -->
    <g transform="translate(118 90) rotate(12)">
      <rect x="0" y="0" width="10" height="120" rx="2" fill="#fdf8ee" stroke="#241c15" stroke-width="2.5"/>
      <rect x="1.5" y="8" width="7" height="7" fill="#2e7d4f"/>
      <rect x="1.5" y="20" width="7" height="7" fill="#c9a227"/>
      <rect x="1.5" y="32" width="7" height="7" fill="#1f5f3a"/>
      <rect x="1.5" y="44" width="7" height="7" fill="#d5cf9b"/>
      <rect x="1.5" y="56" width="7" height="7" fill="#e2c27a"/>
      <rect x="1.5" y="68" width="7" height="7" fill="#5a9c6b"/>
      <rect x="1.5" y="80" width="7" height="7" fill="#ead7b8"/>
    </g>
  </g>
  <text x="20" y="282" font-family="Geist, sans-serif" font-size="12" fill="#463a2c">Small volume. Cola-coloured, clear rather than cloudy, no clots.</text>
</svg>
