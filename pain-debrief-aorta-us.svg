<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" width="600" height="470">
  <title>Ultrasound of her abdomen</title>
  <!-- Drawn bedside ultrasound frame, transverse, upper abdomen: grey sector, gas arcs either side, vertebral body with its shadow, a flattened oval to the viewer's left, a round black vessel in front of the spine with callipers across it and the machine's own reading. Depth scale. No structure labels. -->
