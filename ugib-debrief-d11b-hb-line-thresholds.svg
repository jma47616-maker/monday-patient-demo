<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 624" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Transfusion thresholds on the haemoglobin line</title><desc>The same number line with the thresholds. BSG: below 70, aim 70 to 100. With cardiovascular disease, ESGE: 80 or below, aim at least 100. Arthur is at 72.</desc>
<rect width="720" height="624" fill="#fdf8ee"/>
<text font-size="28" font-weight="800" fill="#7a6a52" text-anchor="start" ><tspan x="50.0" y="50.0">Haemoglobin, g/L</tspan></text><path d="M50.0 262 H670.0" stroke="#241c15" stroke-width="6" stroke-linecap="round"/><path d="M50.0 250 V274" stroke="#241c15" stroke-width="4" stroke-linecap="round"/><path d="M127.5 250 V274" stroke="#241c15" stroke-width="4" stroke-linecap="round"/><path d="M205.0 250 V274" stroke="#241c15" stroke-width="4" stroke-linecap="round"/><path d="M282.5 255 V269" stroke="#241c15" stroke-width="3" stroke-linecap="round"/><path d="M360.0 250 V274" stroke="#241c15" stroke-width="4" stroke-linecap="round"/><path d="M437.5 255 V269" stroke="#241c15" stroke-width="3" stroke-linecap="round"/><path d="M515.0 250 V274" stroke="#241c15" stroke-width="4" stroke-linecap="round"/><path d="M592.5 255 V269" stroke="#241c15" stroke-width="3" stroke-linecap="round"/><path d="M670.0 250 V274" stroke="#241c15" stroke-width="4" stroke-linecap="round"/><text font-size="27" font-weight="500" fill="#241c15" text-anchor="middle" ><tspan x="50.0" y="310.0">60</tspan></text><text font-size="27" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="127.5" y="310.0">70</tspan></text><text font-size="27" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="205.0" y="310.0">80</tspan></text><text font-size="27" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="360.0" y="310.0">100</tspan></text><text font-size="27" font-weight="500" fill="#241c15" text-anchor="middle" ><tspan x="515.0" y="310.0">120</tspan></text><text font-size="27" font-weight="500" fill="#241c15" text-anchor="middle" ><tspan x="670.0" y="310.0">140</tspan></text><path d="M623.5 172 V258" stroke="#a08c6e" stroke-width="4" stroke-dasharray="7 7"/><circle cx="623.5" cy="262" r="10" fill="#fdf8ee" stroke="#a08c6e" stroke-width="4"/><text font-size="30" font-weight="800" fill="#7a6a52" text-anchor="end" ><tspan x="685.5" y="100.0">134</tspan></text><text font-size="26" font-weight="600" fill="#7a6a52" text-anchor="end" ><tspan x="685.5" y="134.0">three months</tspan><tspan x="685.5" y="163.9">ago</tspan></text><path d="M143.0 150 V258" stroke="#241c15" stroke-width="5"/><circle cx="143.0" cy="262" r="13" fill="#c8531b" stroke="#241c15" stroke-width="4"/><rect x="40" y="92" width="212" height="58" rx="29" fill="#c8531b" stroke="#241c15" stroke-width="3"/><text font-size="30" font-weight="800" fill="#fdf8ee" text-anchor="middle" ><tspan x="146.0" y="132.0">Arthur: 72</tspan></text><path d="M127.5 322 V344" stroke="#3f7d52" stroke-width="4" stroke-dasharray="6 6"/><rect x="127.5" y="344" width="232.5" height="40" rx="8" fill="#9cc7a6" stroke="#241c15" stroke-width="3"/><path d="M127.5 336 V392" stroke="#241c15" stroke-width="6" stroke-linecap="round"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="50.0" y="428.0">BSG: below 70, aim 70 to 100</tspan></text><circle cx="205.0" cy="490" r="12" fill="#e0a521" stroke="#241c15" stroke-width="4"/><path d="M219.0 490.0 L340.0 490.0" stroke="#241c15" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M360.0 490.0 L340.0 505.0 L340.0 475.0 Z" fill="#241c15" stroke="#241c15" stroke-width="2" stroke-linejoin="round"/><path d="M360.0 466 V514" stroke="#241c15" stroke-width="6" stroke-linecap="round"/><path d="M372.0 490 H510.0" stroke="#241c15" stroke-width="5" stroke-dasharray="4 12" stroke-linecap="round"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="50.0" y="554.0">With cardiovascular disease,</tspan><tspan x="50.0" y="589.0">ESGE: 80 or below, aim at least 100</tspan></text>
</svg>
