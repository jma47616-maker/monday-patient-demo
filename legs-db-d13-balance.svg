<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <title>A level balance: an infusion bag on one pan, an exchange machine on the other</title>
  <!-- A balance with its beam level. Tags hang under each pan: one under the bag, three under the machine. Labels: rows 13.14 to 13.19. -->
  <rect width="600" height="360" fill="#faf0da"/>
  <text x="150" y="30" text-anchor="middle" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#241c15">Immunoglobulin</text><text x="450" y="30" text-anchor="middle" font-family="Geist, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#241c15">Plasma exchange</text>
