<svg xmlns="http://www.w3.org/2000/svg" id="thd17" viewBox="0 0 720 1285" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Four explanations: what each fits, and what it leaves over</title><desc>Sepsis from the chest fits the temperature of 40.1, breathing at 30, crackles and a CRP of 88; it leaves over the weight loss with a big appetite, the goitre, the eyes and the atrial fibrillation. The heart first fits the raised neck veins, crackles, ankle swelling and atrial fibrillation at 170; it leaves over the temperature of 40.1, the diarrhoea and the tremor. Phaeochromocytoma fits the palpitations, sweating, weight loss, fever, tremor and agitation; it leaves over the goitre and the eyes. Thyroid storm fits all of it.</desc>
<rect width="720" height="1285" fill="#fdf8ee"/>
<g id="thd-fit-1" data-card="sepsis"><rect x="36" y="26" width="660" height="346.15999999999997" rx="16" fill="#241c15"/><rect x="30" y="20" width="660" height="346.15999999999997" rx="16" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><path d="M30 86 V36 a16 16 0 0 1 16 -16 H674 a16 16 0 0 1 16 16 V86 Z" fill="#f3e5c8" stroke="#241c15" stroke-width="3"/><text font-size="32" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="52.0" y="66.0">Sepsis from the chest</tspan></text><g data-part="fits"><text font-size="27" font-weight="800" fill="#a53f12" text-anchor="start" ><tspan x="52.0" y="126.0">Fits</tspan></text><text font-size="29" font-weight="500" fill="#241c15" text-anchor="start" ><tspan x="52.0" y="166.0">Temperature 40.1, breathing 30, crackles,</tspan><tspan x="52.0" y="202.5">CRP 88</tspan></text></g><path d="M48 231 H672" stroke="#d9c9a6" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/><g data-part="leaves-over"><text font-size="27" font-weight="800" fill="#7a6a52" text-anchor="start" ><tspan x="52.0" y="265.1">Leaves over</tspan></text><text font-size="29" font-weight="500" fill="#463a2c" text-anchor="start" ><tspan x="52.0" y="305.1">The weight loss with a big appetite, the</tspan><tspan x="52.0" y="341.6">goitre, the eyes, the atrial fibrillation</tspan></text></g></g><g id="thd-fit-2" data-card="heart"><rect x="36" y="398.15999999999997" width="660" height="309.62" rx="16" fill="#241c15"/><rect x="30" y="392.15999999999997" width="660" height="309.62" rx="16" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><path d="M30 458.15999999999997 V408.15999999999997 a16 16 0 0 1 16 -16 H674 a16 16 0 0 1 16 16 V458.15999999999997 Z" fill="#f3e5c8" stroke="#241c15" stroke-width="3"/><text font-size="32" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="52.0" y="438.2">The heart first</tspan></text><g data-part="fits"><text font-size="27" font-weight="800" fill="#a53f12" text-anchor="start" ><tspan x="52.0" y="498.2">Fits</tspan></text><text font-size="29" font-weight="500" fill="#241c15" text-anchor="start" ><tspan x="52.0" y="538.2">Raised neck veins, crackles, ankle swelling,</tspan><tspan x="52.0" y="574.7">atrial fibrillation at 170</tspan></text></g><path d="M48 603 H672" stroke="#d9c9a6" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/><g data-part="leaves-over"><text font-size="27" font-weight="800" fill="#7a6a52" text-anchor="start" ><tspan x="52.0" y="637.2">Leaves over</tspan></text><text font-size="29" font-weight="500" fill="#463a2c" text-anchor="start" ><tspan x="52.0" y="677.2">Temperature 40.1, the diarrhoea, the tremor</tspan></text></g></g><g id="thd-fit-3" data-card="phaeo"><rect x="36" y="733.78" width="660" height="309.62" rx="16" fill="#241c15"/><rect x="30" y="727.78" width="660" height="309.62" rx="16" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><path d="M30 793.78 V743.78 a16 16 0 0 1 16 -16 H674 a16 16 0 0 1 16 16 V793.78 Z" fill="#f3e5c8" stroke="#241c15" stroke-width="3"/><text font-size="32" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="52.0" y="773.8">Phaeochromocytoma</tspan></text><g data-part="fits"><text font-size="27" font-weight="800" fill="#a53f12" text-anchor="start" ><tspan x="52.0" y="833.8">Fits</tspan></text><text font-size="29" font-weight="500" fill="#241c15" text-anchor="start" ><tspan x="52.0" y="873.8">Palpitations, sweating, weight loss, fever,</tspan><tspan x="52.0" y="910.3">tremor, agitation</tspan></text></g><path d="M48 939 H672" stroke="#d9c9a6" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/><g data-part="leaves-over"><text font-size="27" font-weight="800" fill="#7a6a52" text-anchor="start" ><tspan x="52.0" y="972.9">Leaves over</tspan></text><text font-size="29" font-weight="500" fill="#463a2c" text-anchor="start" ><tspan x="52.0" y="1012.9">The goitre, the eyes</tspan></text></g></g><g id="thd-fit-4" data-card="storm"><rect x="36" y="1069.4" width="660" height="192" rx="16" fill="#241c15"/><rect x="30" y="1063.4" width="660" height="192" rx="16" fill="#c8531b" stroke="#241c15" stroke-width="3"/><text font-size="32" font-weight="800" fill="#fdf8ee" text-anchor="start" ><tspan x="52.0" y="1109.4">Thyroid storm</tspan></text><g data-part="fits"><text font-size="27" font-weight="800" fill="#fbeec6" text-anchor="start" ><tspan x="52.0" y="1169.4">Fits</tspan></text><text font-size="44" font-weight="800" fill="#fdf8ee" text-anchor="start" ><tspan x="52.0" y="1223.4">All of it</tspan></text></g></g>
</svg>
