<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 880" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>A vulnerable brain needs only a small push</title><desc>Two see-saws. On a sturdy pivot, young and fit, it takes a large weight, major surgery, to tip it. On a thin pivot, older with dementia, a small weight tips it: pain, constipation, a new tablet.</desc>
