<svg xmlns="http://www.w3.org/2000/svg" id="panc-db-d05-causes" viewBox="0 0 720 736" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>One bar split by cause</title><desc>One bar split into four. Gallstones, about 50%. Alcohol, about 25%. Together, about three-quarters. Then other causes, and no cause found (idiopathic), about 10%. Underneath: gallstones are commoner in women over 60; alcohol in men, younger, and it is the commonest cause worldwide.</desc>
<rect width="720" height="736" fill="#fdf8ee"/>
<rect x="24.0" y="150" width="336.0" height="110" fill="#c9b48a" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="192.0" y="200.0">Gallstones</tspan></text><text font-size="28" font-weight="400" fill="#241c15" text-anchor="middle" ><tspan x="192.0" y="236.0">about 50%</tspan></text><rect x="360.0" y="150" width="168.0" height="110" fill="#e0a521" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="444.0" y="200.0">Alcohol</tspan></text><text font-size="28" font-weight="400" fill="#241c15" text-anchor="middle" ><tspan x="444.0" y="236.0">about 25%</tspan></text><rect x="528.0" y="150" width="100.8" height="110" fill="#f3e5c8" stroke="#241c15" stroke-width="3"/><rect x="628.8" y="150" width="67.2" height="110" fill="#e8dcc2" stroke="#241c15" stroke-width="3"/><rect x="24" y="150" width="672" height="110" rx="4" fill="none" stroke="#241c15" stroke-width="5"/><path d="M28 136 V116 H524.0 V136" fill="none" stroke="#241c15" stroke-width="4" stroke-linejoin="round"/><rect x="34.4" y="56.2" width="483.1" height="47.6" rx="23.8" fill="#e0a521" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="276.0" y="89.8">Together: about three-quarters</tspan></text><path d="M578.4 246 L518.4 310" stroke="#241c15" stroke-width="3" stroke-linecap="round"/><circle cx="578.4" cy="246" r="6" fill="#c8531b" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="518.4" y="342.0">Other causes</tspan></text><path d="M662.4 246 L632.4 390" stroke="#241c15" stroke-width="3" stroke-linecap="round"/><circle cx="662.4" cy="246" r="6" fill="#c8531b" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="end" ><tspan x="696.0" y="422.0">No cause found (idiopathic): about 10%</tspan></text><rect x="28" y="454" width="672" height="259.19999999999993" rx="14" fill="#241c15"/><rect x="24" y="450" width="672" height="259.19999999999993" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="400" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="494.0">Gallstone attacks: commoner in women over</tspan><tspan x="48.0" y="526.2">60.</tspan></text><text font-size="28" font-weight="400" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="564.4">Alcohol attacks: commoner in men, at a</tspan><tspan x="48.0" y="596.6">younger age.</tspan></text><text font-size="28" font-weight="700" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="634.8">Worldwide, alcohol is the commonest</tspan><tspan x="48.0" y="667.0">cause.</tspan></text>
</svg>
