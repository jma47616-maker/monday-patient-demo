<svg xmlns="http://www.w3.org/2000/svg" id="panc-db-d14-pancreas-score" viewBox="0 0 720 866" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>The Glasgow score as a scorecard, filled in for Dean</title><desc>The Glasgow score (PANCREAS), one point each. P, PaO2 below 7.9 kPa: Dean 10.9, 0. A, age over 55: 48, 0. N, white count over 15: 14.2, 0. C, calcium below 2.0: 1.62, 1 point. R, urea over 16: 9.6, 0. E, LDH over 600: 412, 0. A, albumin below 32: 33, 0. S, sugar over 10: 9.8, 0. Dean at 07:40: 1. 3 or more predicts a severe attack. It can only be completed at 48 hours.</desc>
<rect width="720" height="866" fill="#fdf8ee"/>
