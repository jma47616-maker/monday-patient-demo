<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 382" width="360" height="382">
  <title>Six things not to do</title>
  <!-- Card 21. A chart with six lines written in and each struck through in red: waiting for lactate or D-dimer, a portal-venous CT with no question, holding morphine, tranexamic acid, reversal agents, vasopressors before fluid. Strike ids paind-d19-strike1 to strike6. -->
  
  <rect width="360" height="382" rx="16" fill="#f3e5c8"/>
  <rect x="12" y="12" width="336" height="358" rx="12" fill="#ffffff" stroke="#241c15" stroke-width="3"/><rect x="12" y="12" width="336" height="40" rx="12" fill="#2f6b70"/><text x="28" y="38" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="start">Drug and plan chart</text><path d="M24 92 H336" stroke="#d9d4ca" stroke-width="2"/><text x="30" y="80" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#241c15" text-anchor="start">Wait for the lactate or D-dimer</text><path id="paind-d19-strike1" d="M26 75 H260" stroke="#b8432f" stroke-width="4" stroke-linecap="round"/><path d="M24 144 H336" stroke="#d9d4ca" stroke-width="2"/><text x="30" y="132" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#241c15" text-anchor="start">Portal-venous CT, no question</text><path id="paind-d19-strike2" d="M26 127 H246" stroke="#b8432f" stroke-width="4" stroke-linecap="round"/><path d="M24 196 H336" stroke="#d9d4ca" stroke-width="2"/><text x="30" y="184" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#241c15" text-anchor="start">Hold morphine for the signs</text><path id="paind-d19-strike3" d="M26 179 H231" stroke="#b8432f" stroke-width="4" stroke-linecap="round"/><path d="M24 248 H336" stroke="#d9d4ca" stroke-width="2"/><text x="30" y="236" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#241c15" text-anchor="start">Tranexamic acid</text><path id="paind-d19-strike4" d="M26 231 H144" stroke="#b8432f" stroke-width="4" stroke-linecap="round"/><path d="M24 300 H336" stroke="#d9d4ca" stroke-width="2"/><text x="30" y="288" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#241c15" text-anchor="start">Reversal, vitamin K or FFP</text><path id="paind-d19-strike5" d="M26 283 H224" stroke="#b8432f" stroke-width="4" stroke-linecap="round"/><path d="M24 352 H336" stroke="#d9d4ca" stroke-width="2"/><text x="30" y="340" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#241c15" text-anchor="start">Vasopressors before fluid</text><path id="paind-d19-strike6" d="M26 335 H216" stroke="#b8432f" stroke-width="4" stroke-linecap="round"/>
</svg>
