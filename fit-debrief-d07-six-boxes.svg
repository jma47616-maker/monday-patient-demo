idth="4" stroke-linejoin="round"/><rect x="-46" y="-6" width="68" height="10" rx="5" fill="#f3e5c8" stroke="#241c15" stroke-width="4"/></g></g><text font-size="27" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="529.0" y="248.0">Urine sodium 30 or</tspan><tspan x="529.0" y="280.4">below · dry</tspan></text></g><g id="fitd-box-3" data-box="3"><rect x="36" y="346" width="322" height="300" rx="16" fill="#241c15"/><rect x="30" y="340" width="322" height="300" rx="16" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><rect x="42" y="352" width="298" height="176" rx="10" fill="#faf0da" stroke="#241c15" stroke-width="3"/><g transform="translate(87.8 354.0) scale(0.86)" ><g transform="translate(112.0 104.0) scale(1.55)" ><path d="M-20 -56 C-20 -30 -34 -10 -34 12 C-34 34 -24 44 -8 44 H42 C60 44 60 24 44 22 L24 18 C12 6 14 -26 16 -56 Z" fill="#e8b796" stroke="#241c15" stroke-width="4" stroke-linejoin="round"/><path d="M-20 -30 H15" stroke="#241c15" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 5"/><ellipse cx="-10" cy="12" rx="9" ry="7" fill="#cf9872"/><path d="M38 26 v8 M48 27 v7" stroke="#241c15" stroke-width="2.5" stroke-linecap="round"/></g></g><text font-size="27" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="191.0" y="568.0">Urine sodium 30 or</tspan><tspan x="191.0" y="600.4">below · overloaded</tspan></text></g><g id="fitd-box-4" data-box="4"><rect x="374" y="346" width="322" height="300" rx="16" fill="#241c15"/><rect x="368" y="340" width="322" height="300" rx="16" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><rect x="380" y="352" width="298" height="176" rx="10" fill="#faf0da" stroke="#241c15" stroke-width="3"/><g transform="translate(425.8 354.0) scale(0.86)" ><g transform="translate(112.0 100.0) scale(1.3)" ><g transform="translate(-34.0 0.0) scale(1.25)" ><path d="M-8,-44 C-36,-46 -48,-18 -46,6 C-44,32 -28,48 -6,46 C10,44 16,32 10,20 C4,10 4,-6 10,-18 C16,-30 8,-42 -8,-44 Z" fill="#c9705a" stroke="#241c15" st