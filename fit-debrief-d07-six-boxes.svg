<svg xmlns="http://www.w3.org/2000/svg" id="fitd07" viewBox="0 0 720 986" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Six boxes, each with a small drawing</title><desc>Six tiles. Urine osmolality 100 or below: a water jug. Urine sodium 30 or below, dry: a toilet. Urine sodium 30 or below, overloaded: a swollen ankle. Urine sodium above 30, dry: a kidney with salt crystals leaving. Urine sodium above 30, normal volume: a kidney with a closed tap. A diuretic, or kidney disease: a tablet with a question mark.</desc>
