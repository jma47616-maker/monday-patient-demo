<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320" role="img" aria-label="Examination of the back from behind: a man seated leaning forward, with focal tenderness marked over one low lumbar interspace at the level of the iliac crests, and raised paraspinal muscle ridges either side of the midline">
  <defs>
    <linearGradient id="skinBack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3cdb4"/>
      <stop offset=".5" stop-color="#f0deca"/>
      <stop offset="1" stop-color="#dcc5ab"/>
    </linearGradient>
    <pattern id="dotsBack" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#b8552e" opacity=".14"/>
    </pattern>
    <clipPath id="bodyBack">
      <path d="M196 86 C178 90 156 100 141 122 C128 140 120 158 124 176 C127 188 133 192 141 190 C150 187 154 182 160 180 C160 212 156 246 160 274 C162 296 160 310 159 320 L281 320 C280 310 278 296 280 274 C284 246 280 212 280 180 C286 182 290 187 299 190 C307 192 313 188 316 176 C320 158 312 140 299 122 C284 100 262 90 244 86 Z"/>
    </clipPath>
  </defs>

  <rect width="440" height="320" fill="#faf6f0"/>
  <rect width="440" height="320" fill="url(#dotsBack)"/>

  <!-- the whole figure breathes, gently -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -2.4; 0 0" dur="4.4s" repeatCount="indefinite"/>

    <!-- nape, then the bowed head seen from behind -->
    <path d="M196 44 L196 100 C208 108 232 108 244 100 L244 44 Z" fill="#e3cdb4" stroke="#2b241d" stroke-width="4"/>
    <path d="M220 4 C260 4 272 26 268 52 C264 70 248 80 220 80 C192 80 176 70 172 52 C168 26 180 4 220 4 Z" fill="#6b543f" stroke="#2b241d" stroke-width="4"/>
    <path d="M188 20 C202 10 238 10 252 20" fill="none" stroke="#836a52" stroke-width="5" stroke-linecap="round" opacity=".85"/>
    <path d="M192 72 C204 78 236 78 248 72" fill="none" stroke="#2b241d" stroke-width="3" stroke-linecap="round" opacity=".4"/>

    <!-- the back, shoulders rounded forward as he leans over -->
    <path d="M196 86 C178 90 156 100 141 122 C128 140 120 158 124 176 C127 188 133 192 141 190 C150 187 154 182 160 180 C160 212 156 246 160 274 C162 296 160 310 159 320 L281 320 C280 310 278 296 280 274 C284 246 280 212 280 180 C286 182 290 187 299 190 C307 192 313 188 316 176 C320 158 312 140 299 122 C284 100 262 90 244 86 Z"
          fill="url(#skinBack)" stroke="#2b241d" stroke-width="4"/>

    <!-- cel shading, kept inside the body -->
    <g clip-path="url(#bodyBack)">
      <path d="M112 150 C132 200 130 260 138 330 L176 330 C162 260 160 200 162 150 Z" fill="#dcc5ab" opacity=".5"/>
      <path d="M328 150 C308 200 310 260 302 330 L264 330 C278 260 280 200 278 150 Z" fill="#dcc5ab" opacity=".5"/>
      <path d="M136 116 C172 96 268 96 304 116 C288 138 258 146 220 146 C182 146 152 138 136 116 Z" fill="#e8d3ba" opacity=".5"/>
      <!-- vertebral furrow -->
      <path d="M215 106 C213 166 213 236 215 300 L225 300 C227 236 227 166 225 106 Z" fill="#d9bfa4" opacity=".4"/>
    </g>

    <!-- scapulae, for orientation only -->
    <g clip-path="url(#bodyBack)">
      <path d="M162 128 C180 122 192 126 197 136 C199 156 190 182 177 202 C165 184 158 154 162 128 Z" fill="#d9bfa4" opacity=".45"/>
      <path d="M278 128 C260 122 248 126 243 136 C241 156 250 182 263 202 C275 184 282 154 278 128 Z" fill="#d9bfa4" opacity=".45"/>
    </g>
    <g fill="none" stroke="#2b241d" stroke-width="2.4" opacity=".28" stroke-linecap="round">
      <path d="M163 128 C180 122 192 126 197 136 C199 156 190 182 177 202"/>
      <path d="M277 128 C260 122 248 126 243 136 C241 156 250 182 263 202"/>
    </g>

    <!-- paraspinal muscles held in spasm: raised ridges either side of the midline -->
    <g stroke="#c9a48c" stroke-width="7" fill="none" opacity=".5" stroke-linecap="round">
      <path d="M198 180 C193 212 194 252 203 290"/>
      <path d="M242 180 C247 212 246 252 237 290"/>
    </g>
    <g fill="#f0deca" stroke="#2b241d" stroke-width="2.2" opacity=".5">
      <path d="M214 148 C204 178 199 210 200 244 C201 266 203 282 206 292 L216 292 C214 276 214 258 214 240 C213 206 214 176 216 152 Z"/>
      <path d="M226 148 C236 178 241 210 240 244 C239 266 237 282 234 292 L224 292 C226 276 226 258 226 240 C227 206 226 176 224 152 Z"/>
    </g>

    <!-- the line of spinous processes down the midline -->
    <g fill="#e8d3ba" stroke="#2b241d" stroke-width="2" opacity=".5">
      <ellipse cx="220" cy="104" rx="6" ry="3.2"/>
      <ellipse cx="220" cy="117" rx="6" ry="3.2"/>
      <ellipse cx="220" cy="130" rx="6.2" ry="3.2"/>
      <ellipse cx="220" cy="143" rx="6.2" ry="3.4"/>
      <ellipse cx="220" cy="156" rx="6.4" ry="3.4"/>
      <ellipse cx="220" cy="169" rx="6.6" ry="3.4"/>
      <ellipse cx="220" cy="182" rx="6.8" ry="3.6"/>
      <ellipse cx="220" cy="195" rx="7" ry="3.6"/>
      <ellipse cx="220" cy="208" rx="7.2" ry="3.8"/>
      <ellipse cx="220" cy="221" rx="7.4" ry="3.8"/>
      <ellipse cx="220" cy="233" rx="7.8" ry="4"/>
      <ellipse cx="220" cy="245" rx="8.2" ry="4.2"/>
      <ellipse cx="220" cy="257" rx="8.6" ry="4.4"/>
      <ellipse cx="220" cy="269" rx="8.6" ry="4.4"/>
    </g>

    <!-- iliac crests and the dimples over the sacrum, for level -->
    <g fill="none" stroke="#2b241d" stroke-width="3" opacity=".35" stroke-linecap="round">
      <path d="M156 234 C176 252 190 259 199 261"/>
      <path d="M284 234 C264 252 250 259 241 261"/>
    </g>
    <g fill="#d9bfa4" stroke="#2b241d" stroke-width="2" opacity=".3">
      <ellipse cx="200" cy="292" rx="5" ry="4"/>
      <ellipse cx="240" cy="292" rx="5" ry="4"/>
    </g>

    <!-- the tender interspace, low in the lumbar spine -->
    <circle cx="220" cy="263" r="21" fill="#b23b2e" opacity=".1"/>
    <circle cx="220" cy="263" r="9" fill="none" stroke="#b23b2e" stroke-width="3">
      <animate attributeName="r" values="7;20" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".9;0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="263" r="9" fill="none" stroke="#b23b2e" stroke-width="3">
      <animate attributeName="r" values="7;20" dur="1.8s" begin=".9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".9;0" dur="1.8s" begin=".9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="263" r="4.5" fill="#b23b2e"/>
  </g>
</svg>
