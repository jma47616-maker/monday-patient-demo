<svg xmlns="http://www.w3.org/2000/svg" id="panc-calcium-d08-ladder" viewBox="0 0 720 1143" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>A ladder of symptoms, from tingling up to the heart</title><desc>A ladder, mild at the bottom and more dangerous at the top. 1, tingling round the mouth and in the fingers (perioral and digital paraesthesiae). 2, cramps. 3, hands and feet cramp into claws (carpopedal spasm, tetany). 4, the voice box clamps shut (laryngospasm); the airways tighten (bronchospasm). 5, fits (seizures); confusion. 6, low blood pressure and abnormal heart rhythms. It usually starts with the tingling before the muscles join in. Symptoms usually appear below an adjusted calcium of about 1.9 mmol/L. But speed matters: a fast fall causes symptoms at levels a slow fall does not.</desc>
<rect width="720" height="1143" fill="#fdf8ee"/>
<rect x="163.8" y="22.2" width="272.4" height="47.6" rx="23.8" fill="#c8531b" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="800" fill="#fdf8ee" text-anchor="middle" ><tspan x="300.0" y="55.8">More dangerous</tspan></text><path d="M44 60 V817.6000000000001 M92 60 V817.6000000000001 M44 90 H92 M44 136 H92 M44 182 H92 M44 228 H92 M44 274 H92 M44 320 H92 M44 366 H92 M44 412 H92 M44 458 H92 M44 504 H92 M44 550 H92 M44 596 H92 M44 642 H92 M44 688 H92 M44 734 H92 M44 780 H92" stroke="#241c15" stroke-width="11" stroke-linecap="round"/><path d="M44 60 V817.6000000000001 M92 60 V817.6000000000001 M44 90 H92 M44 136 H92 M44 182 H92 M44 228 H92 M44 274 H92 M44 320 H92 M44 366 H92 M44 412 H92 M44 458 H92 M44 504 H92 M44 550 H92 M44 596 H92 M44 642 H92 M44 688 H92 M44 734 H92 M44 780 H92" stroke="#c9a46e" stroke-width="5" stroke-linecap="round"/><path d="M68.0 66.0 L87.5 92.0 L48.5 92.0 Z" fill="#c8531b" stroke="#c8531b" stroke-width="2" stroke-linejoin="round"/><g id="panc-calcium-d08-heart"><rect x="114" y="100" width="586" height="98.72" rx="12" fill="#241c15"/><rect x="110" y="96" width="586" height="98.72" rx="12" fill="#f2b49b" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="150.0" y="142.0">Low blood pressure and abnormal</tspan><tspan x="150.0" y="173.4">heart rhythms</tspan></text><circle cx="68" cy="145.36" r="22" fill="#c8531b" stroke="#241c15" stroke-width="3.5"/><text font-size="28" font-weight="800" fill="#fdf8ee" text-anchor="middle" ><tspan x="68.0" y="154.7">6</tspan></text></g><g id="panc-calcium-d08-fits"><rect x="114" y="212.72" width="586" height="92" rx="12" fill="#241c15"/><rect x="110" y="208.72" width="586" height="92" rx="12" fill="#f6c9b4" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="150.0" y="267.0">Fits (seizures); confusion</tspan></text><circle cx="68" cy="254.72" r="22" fill="#c8531b" stroke="#241c15" stroke-width="3.5"/><text font-size="28" font-weight="800" fill="#fdf8ee" text-anchor="middle" ><tspan x="68.0" y="264.1">5</tspan></text></g><g id="panc-calcium-d08-throat"><rect x="114" y="318.72" width="586" height="130.08" rx="12" fill="#241c15"/><rect x="110" y="314.72" width="586" height="130.08" rx="12" fill="#fbe4d3" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="150.0" y="360.7">The voice box clamps shut</tspan><tspan x="150.0" y="392.1">(laryngospasm); the airways</tspan><tspan x="150.0" y="423.4">tighten (bronchospasm)</tspan></text><circle cx="68" cy="379.76000000000005" r="22" fill="#c8531b" stroke="#241c15" stroke-width="3.5"/><text font-size="28" font-weight="800" fill="#fdf8ee" text-anchor="middle" ><tspan x="68.0" y="389.1">4</tspan></text></g><g id="panc-calcium-d08-claw"><rect x="114" y="462.80000000000007" width="586" height="98.72" rx="12" fill="#241c15"/><rect x="110" y="458.80000000000007" width="586" height="98.72" rx="12" fill="#fbe9dc" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="150.0" y="504.8">Hands and feet cramp into claws</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="150.0" y="540.2">(carpopedal spasm, tetany)</tspan></text><circle cx="68" cy="508.1600000000001" r="22" fill="#c8531b" stroke="#241c15" stroke-width="3.5"/><text font-size="28" font-weight="800" fill="#fdf8ee" text-anchor="middle" ><tspan x="68.0" y="517.5">3</tspan></text></g><g id="panc-calcium-d08-cramps"><rect x="114" y="575.5200000000001" width="586" height="92" rx="12" fill="#241c15"/><rect x="110" y="571.5200000000001" width="586" height="92" rx="12" fill="#faf0da" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="150.0" y="629.8">Cramps</tspan></text><circle cx="68" cy="617.5200000000001" r="22" fill="#c8531b" stroke="#241c15" stroke-width="3.5"/><text font-size="28" font-weight="800" fill="#fdf8ee" text-anchor="middle" ><tspan x="68.0" y="626.9">2</tspan></text></g><g id="panc-calcium-d08-mouth"><rect x="114" y="681.5200000000001" width="586" height="130.08" rx="12" fill="#241c15"/><rect x="110" y="677.5200000000001" width="586" height="130.08" rx="12" fill="#faf0da" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="150.0" y="723.5">Tingling round the mouth and in the</tspan><tspan x="150.0" y="754.9">fingers</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="150.0" y="790.2">(perioral and digital paraesthesiae)</tspan></text><circle cx="68" cy="742.5600000000001" r="22" fill="#c8531b" stroke="#241c15" stroke-width="3.5"/><text font-size="28" font-weight="800" fill="#fdf8ee" text-anchor="middle" ><tspan x="68.0" y="751.9">1</tspan></text></g><rect x="30" y="843.6000000000001" width="672" height="275.20000000000005" rx="14" fill="#241c15"/><rect x="24" y="837.6000000000001" width="672" height="275.20000000000005" rx="14" fill="#fdf8ee" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="400" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="883.6">It usually starts with the tingling before the</tspan><tspan x="48.0" y="915.8">muscles join in.</tspan></text><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="958.0">Symptoms usually appear below an</tspan><tspan x="48.0" y="990.2">adjusted calcium of about 1.9 mmol/L.</tspan></text><text font-size="28" font-weight="400" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="1032.4">But speed matters: a fast fall causes</tspan><tspan x="48.0" y="1064.6">symptoms at levels a slow fall does not.</tspan></text>
</svg>
