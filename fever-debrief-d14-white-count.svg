<svg xmlns="http://www.w3.org/2000/svg" id="fever-debrief-d14-white-count" viewBox="0 0 720 1050" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Two white counts</title><desc>Two half-circle gauges stacked, each with a needle and a value under it.</desc>
