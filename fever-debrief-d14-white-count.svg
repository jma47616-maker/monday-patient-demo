<text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="360.0" y="120.0">Still's disease (Yamaguchi)</tspan></text>
<path d="M190.0 400.0 A170 170 0 0 1 360.0 230.0" fill="none" stroke="#e8dcc2" stroke-width="34"/><path d="M360.0 230.0 A170 170 0 0 1 530.0 400.0" fill="none" stroke="#f0a27c" stroke-width="34"/><path d="M173 400 A187 187 0 0 1 547 400 M207 400 A153 153 0 0 1 513 400" fill="none" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="600" fill="#463a2c" text-anchor="middle" ><tspan x="144.0" y="410.0">0</tspan></text><text font-size="28" font-weight="600" fill="#463a2c" text-anchor="middle" ><tspan x="360.0" y="194.0">10</tspan></text><text font-size="28" font-weight="600" fill="#463a2c" text-anchor="middle" ><tspan x="576.0" y="410.0">20</tspan></text><path d="M360 400 L442.3 286.7" stroke="#a53f12" stroke-width="9" stroke-linecap="round"/><circle cx="360" cy="400" r="14" fill="#241c15"/><text font-size="32" font-weight="800" fill="#a53f12" text-anchor="middle" ><tspan x="360.0" y="460.0">10 or more</tspan></text>
<text font-size="28" font-weight="400" fill="#463a2c" text-anchor="middle" ><tspan x="360.0" y="506.0">with 80% or more neutrophils</tspan></text>
<text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="360.0" y="590.0">Simone</tspan></text>
<path d="M190.0 870.0 A170 170 0 0 1 360.0 700.0" fill="none" stroke="#e8dcc2" stroke-width="34"/><path d="M360.0 700.0 A170 170 0 0 1 530.0 870.0" fill="none" stroke="#f0a27c" stroke-width="34"/><path d="M173 870 A187 187 0 0 1 547 870 M207 870 A153 153 0 0 1 513 870" fill="none" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="600" fill="#463a2c" text-anchor="middle" ><tspan x="144.0" y="880.0">0</tspan></text><text font-size="28" font-weight="600" fill="#463a2c" text-anchor="middle" ><tspan x="360.0" y="664.0">10</tspan></text><text font-size="28" font-weight="600" fill="#463a2c" text-anchor="middle" ><tspan x="576.0" y="880.0">20</tspan></text><path d="M360 870 L227.5 824.7" stroke="#7f93b8" stroke-width="9" stroke-linecap="round"/><circle cx="360" cy="870" r="14" fill="#241c15"/><text font-size="32" font-weight="800" fill="#7f93b8" text-anchor="middle" ><tspan x="360.0" y="930.0">2.1</tspan></text>
<text font-size="28" font-weight="400" fill="#463a2c" text-anchor="middle" ><tspan x="360.0" y="976.0">lymphocytes 0.4; already low</tspan></text>
