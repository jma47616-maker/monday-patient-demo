<svg xmlns="http://www.w3.org/2000/svg" id="panc-db-d12-enzyme-curves" viewBox="0 0 720 896" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Two enzyme curves over the first four days</title><desc>A sketch of two curves over 0 to 96 hours from the start of the pain, against a dashed line at 3 times normal. Lipase rises within 4 to 8 hours, peaks at 24 and stays up longer. Amylase rises within 6 to 24 hours, peaks at 48 and falls sooner; it can be normal when alcohol is the cause. A vertical line marks Dean at 16 hours. The height says nothing about how severe it is.</desc>
