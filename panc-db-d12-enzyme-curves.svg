/><rect x="227.0" y="90.2" width="138.2" height="47.6" rx="23.8" fill="#c8531b" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="800" fill="#fdf8ee" text-anchor="middle" ><tspan x="296.0" y="123.8">Lipase</tspan></text><rect x="366.0" y="142.2" width="165.1" height="47.6" rx="23.8" fill="#e0a521" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="448.5" y="175.8">Amylase</tspan></text><path d="M181.7 90 V450" stroke="#241c15" stroke-width="4"/><circle cx="181.7" cy="191.6" r="9" fill="#fdf8ee" stroke="#241c15" stroke-width="4"/><rect x="49.0" y="34.2" width="257.3" height="47.6" rx="23.8" fill="#241c15" stroke="#241c15" stroke-width="3"/><text font-size="28" font-weight="800" fill="#fdf8ee" text-anchor="middle" ><tspan x="177.7" y="67.8">Dean: 16 hours</tspan></text><path d="M80 90 V450 H690" fill="none" stroke="#241c15" stroke-width="4" stroke-linejoin="round"/><path d="M80.0 450 v12" stroke="#241c15" stroke-width="4"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="80.0" y="492.0">0</tspan></text><path d="M232.5 450 v12" stroke="#241c15" stroke-width="4"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="232.5" y="492.0">24</tspan></text><path d="M385.0 450 v12" stroke="#241c15" stroke-width="4"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="385.0" y="492.0">48</tspan></text><path d="M537.5 450 v12" stroke="#241c15" stroke-width="4"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="537.5" y="492.0">72</tspan></text><path d="M690.0 450 v12" stroke="#241c15" stroke-width="4"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="middle" ><tspan x="690.0" y="492.0">96</tspan></text><text font-size="28" font-weight="700" fill="#463a2c" text-anchor="middle" ><tspan x="385.0" y="530.0">Hours from the start of the pain</tspan></text><text font-size="28" font-weight="700" fill="#463a2c" text-anchor="middle" transform="rotate(-90 40 280.0)"><tspan x="40.0" y="280.0">How raised</tspan></text><rect x="30" y="572" width="672" height="299.4" rx="14" fill="#241c15"/><rect x="24" y="566" width="672" height="299.4" rx="14" fill="#faf0da" stroke="#241c15" stroke-width="3" /><rect x="44" y="592" width="28" height="12" rx="6" fill="#c8531b" stroke="#241c15" stroke-width="2"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="start" ><tspan x="86.0" y="610.0">Lipase: up in 4 to 8 hours, peaks at 24,</tspan><tspan x="86.0" y="642.2">stays up longer</tspan></text><rect x="44" y="668.4" width="28" height="12" rx="6" fill="#e0a521" stroke="#241c15" stroke-width="2"/><text font-size="28" font-weight="700" fill="#241c15" text-anchor="start" ><tspan x="86.0" y="686.4">Amylase: up in 6 to 24 hours, peaks at</tspan><tspan x="86.0" y="718.6">48</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="86.0" y="750.8">It can be normal when alcohol is the cause.</tspan></text><text font-size="28" font-weight="800" fill="#a53f12" text-anchor="start" ><tspan x="48.0" y="799.0">The height says nothing about how</tspan><tspan x="48.0" y="831.2">severe it is.</tspan></text>
