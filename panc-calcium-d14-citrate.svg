<svg xmlns="http://www.w3.org/2000/svg" id="panc-calcium-d14-citrate" viewBox="0 0 720 725" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>A blood bag whose citrate grabs calcium</title><desc>A bag of red cells with small citrate shapes inside, most holding a calcium. Stored blood contains citrate: a unit of red cells can carry up to 3 g. Citrate binds calcium, so large transfusions can drop the calcium fast. The liver clears citrate, about 3 g in five minutes in an adult without cirrhosis; poor liver function slows it. A low calcium in a major bleed worsens low blood pressure and clotting. Massive transfusion is one of the reasons to give IV calcium.</desc>
<rect width="720" height="725" fill="#fdf8ee"/>
<g transform="translate(160.0 230.0)" ><path d="M-90 -150 H90 Q110 -150 110 -126 V110 Q110 150 70 150 H-70 Q-110 150 -110 110 V-126 Q-110 -150 -90 -150 Z" fill="#c8453c" stroke="#241c15" stroke-width="5"/><rect x="-60" y="-120" width="120" height="70" rx="6" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><path d="M-40 -96 H40 M-40 -76 H20" stroke="#463a2c" stroke-width="4" stroke-linecap="round"/><rect x="-14" y="150" width="28" height="28" fill="#f3e5c8" stroke="#241c15" stroke-width="4"/><path d="M0 178 V230" stroke="#241c15" stroke-width="6"/><circle cx="0" cy="-164" r="12" fill="none" stroke="#241c15" stroke-width="5"/><g transform="translate(-60.0 0.0)" ><path d="M0 0 L0 -16 M0 0 L14 9 M0 0 L-14 9" stroke="#6a4a94" stroke-width="5" stroke-linecap="round"/><circle r="6" fill="#6a4a94" stroke="#241c15" stroke-width="2"/></g><circle cx="-60.0" cy="-24.0" r="8" fill="#5b8fc9" stroke="#241c15" stroke-width="2.5"/><g transform="translate(10.0 -10.0)" ><path d="M0 0 L0 -16 M0 0 L14 9 M0 0 L-14 9" stroke="#6a4a94" stroke-width="5" stroke-linecap="round"/><circle r="6" fill="#6a4a94" stroke="#241c15" stroke-width="2"/></g><circle cx="10.0" cy="-34.0" r="8" fill="#5b8fc9" stroke="#241c15" stroke-width="2.5"/><g transform="translate(60.0 30.0)" ><path d="M0 0 L0 -16 M0 0 L14 9 M0 0 L-14 9" stroke="#6a4a94" stroke-width="5" stroke-linecap="round"/><circle r="6" fill="#6a4a94" stroke="#241c15" stroke-width="2"/></g><g transform="translate(-30.0 70.0)" ><path d="M0 0 L0 -16 M0 0 L14 9 M0 0 L-14 9" stroke="#6a4a94" stroke-width="5" stroke-linecap="round"/><circle r="6" fill="#6a4a94" stroke="#241c15" stroke-width="2"/></g><circle cx="-30.0" cy="46.0" r="8" fill="#5b8fc9" stroke="#241c15" stroke-width="2.5"/><g transform="translate(40.0 100.0)" ><path d="M0 0 L0 -16 M0 0 L14 9 M0 0 L-14 9" stroke="#6a4a94" stroke-width="5" stroke-linecap="round"/><circle r="6" fill="#6a4a94" stroke="#241c15" stroke-width="2"/></g><circle cx="40.0" cy="76.0" r="8" fill="#5b8fc9" stroke="#241c15" stroke-width="2.5"/><g transform="translate(-70.0 110.0)" ><path d="M0 0 L0 -16 M0 0 L14 9 M0 0 L-14 9" stroke="#6a4a94" stroke-width="5" stroke-linecap="round"/><circle r="6" fill="#6a4a94" stroke="#241c15" stroke-width="2"/></g></g><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="310.0" y="60.0">Stored blood contains</tspan><tspan x="310.0" y="91.4">citrate</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="310.0" y="126.7">a unit of red cells can carry</tspan><tspan x="310.0" y="158.1">up to 3 g</tspan></text><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="310.0" y="211.4">Citrate binds calcium</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="310.0" y="246.8">so large transfusions can</tspan><tspan x="310.0" y="278.2">drop the calcium fast</tspan></text><text font-size="28" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="310.0" y="331.5">The liver clears citrate</tspan></text><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="310.0" y="366.9">about 3 g in five minutes in</tspan><tspan x="310.0" y="398.2">an adult without cirrhosis;</tspan><tspan x="310.0" y="429.6">poor liver function slows it</tspan></text><circle cx="60" cy="490" r="10" fill="#5b8fc9" stroke="#241c15" stroke-width="2.5"/><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="80.0" y="500.0">calcium</tspan></text><g transform="translate(230.0 496.0)" ><path d="M0 0 L0 -16 M0 0 L14 9 M0 0 L-14 9" stroke="#6a4a94" stroke-width="5" stroke-linecap="round"/><circle r="6" fill="#6a4a94" stroke="#241c15" stroke-width="2"/></g><text font-size="28" font-weight="400" fill="#463a2c" text-anchor="start" ><tspan x="252.0" y="500.0">citrate</tspan></text><rect x="28" y="538" width="672" height="164.79999999999998" rx="14" fill="#241c15"/><rect x="24" y="534" width="672" height="164.79999999999998" rx="14" fill="#fbe4d3" stroke="#241c15" stroke-width="3" /><text font-size="28" font-weight="400" fill="#241c15" text-anchor="start" ><tspan x="48.0" y="580.0">A low calcium in a major bleed worsens low</tspan><tspan x="48.0" y="612.2">blood pressure and clotting. Massive</tspan><tspan x="48.0" y="644.4">transfusion is one of the reasons to give IV</tspan><tspan x="48.0" y="676.6">calcium.</tspan></text>
</svg>
