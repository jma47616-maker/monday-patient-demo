<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1624" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Four explanations each fitted part of him. One fitted all of him</title><desc>Five cards. A urine infection, a chest infection, he is dry, and it is his dementia each fit part of the picture and leave something over. Influenza, a blocked bladder, and his medicines fit all of it.</desc>
<rect width="720" height="1624" fill="#fdf8ee"/>
<rect x="26" y="26" width="680" height="348" rx="18" fill="#241c15"/><rect x="20" y="20" width="680" height="348" rx="18" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><text font-size="31" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="46.0" y="74.0">A urine infection</tspan></text><rect x="46" y="102" width="92" height="40" rx="20" fill="#e0a521" stroke="#241c15" stroke-width="3"/><text font-size="27" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="92.0" y="131.0">Fits</tspan></text><text font-size="28" font-weight="400" fill="#241c15" text-anchor="start" ><tspan x="46.0" y="176.0">New confusion, a temperature, CRP 84, a</tspan><tspan x="46.0" y="210.0">positive dipstick</tspan></text><rect x="46" y="232" width="186" height="40" rx="20" fill="#fdf8ee" stroke="#c8531b" stroke-width="4"/><text font-size="27" font-weight="800" fill="#a53f12" text-anchor="middle" ><tspan x="139.0" y="261.0">Leaves over</tspan></text><text font-size="28" font-weight="400" fill="#241c15" text-anchor="start" ><tspan x="46.0" y="310.0">A normal white cell count, influenza on the</tspan><tspan x="46.0" y="344.0">swab, a litre in the bladder</tspan></text><rect x="26" y="400" width="680" height="314" rx="18" fill="#241c15"/><rect x="20" y="394" width="680" height="314" rx="18" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><text font-size="31" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="46.0" y="448.0">A chest infection</tspan></text><rect x="46" y="476" width="92" height="40" rx="20" fill="#e0a521" stroke="#241c15" stroke-width="3"/><text font-size="27" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="92.0" y="505.0">Fits</tspan></text><text font-size="28" font-weight="400" fill="#241c15" text-anchor="start" ><tspan x="46.0" y="550.0">Cough, temperature, CRP 84</tspan></text><rect x="46" y="572" width="186" height="40" rx="20" fill="#fdf8ee" stroke="#c8531b" stroke-width="4"/><text font-size="27" font-weight="800" fill="#a53f12" text-anchor="middle" ><tspan x="139.0" y="601.0">Leaves over</tspan></text><text font-size="28" font-weight="400" fill="#241c15" text-anchor="start" ><tspan x="46.0" y="650.0">A clear chest, normal oxygen, a clear X-ray, the</tspan><tspan x="46.0" y="684.0">kidneys</tspan></text><rect x="26" y="740" width="680" height="314" rx="18" fill="#241c15"/><rect x="20" y="734" width="680" height="314" rx="18" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><text font-size="31" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="46.0" y="788.0">He is dry</tspan></text><rect x="46" y="816" width="92" height="40" rx="20" fill="#e0a521" stroke="#241c15" stroke-width="3"/><text font-size="27" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="92.0" y="845.0">Fits</tspan></text><text font-size="28" font-weight="400" fill="#241c15" text-anchor="start" ><tspan x="46.0" y="890.0">Days of sips, a water tablet, urea 24.6</tspan></text><rect x="46" y="912" width="186" height="40" rx="20" fill="#fdf8ee" stroke="#c8531b" stroke-width="4"/><text font-size="27" font-weight="800" fill="#a53f12" text-anchor="middle" ><tspan x="139.0" y="941.0">Leaves over</tspan></text><text font-size="28" font-weight="400" fill="#241c15" text-anchor="start" ><tspan x="46.0" y="990.0">Normal blood pressure, not dry on examination,</tspan><tspan x="46.0" y="1024.0">a litre in the bladder</tspan></text><rect x="26" y="1080" width="680" height="280" rx="18" fill="#241c15"/><rect x="20" y="1074" width="680" height="280" rx="18" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><text font-size="31" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="46.0" y="1128.0">It is his dementia</tspan></text><rect x="46" y="1156" width="92" height="40" rx="20" fill="#e0a521" stroke="#241c15" stroke-width="3"/><text font-size="27" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="92.0" y="1185.0">Fits</tspan></text><text font-size="28" font-weight="400" fill="#241c15" text-anchor="start" ><tspan x="46.0" y="1230.0">Nothing</tspan></text><rect x="46" y="1252" width="186" height="40" rx="20" fill="#fdf8ee" stroke="#c8531b" stroke-width="4"/><text font-size="27" font-weight="800" fill="#a53f12" text-anchor="middle" ><tspan x="139.0" y="1281.0">Leaves over</tspan></text><text font-size="28" font-weight="400" fill="#241c15" text-anchor="start" ><tspan x="46.0" y="1330.0">A change over four days</tspan></text><rect x="26" y="1386" width="680" height="214" rx="18" fill="#241c15"/><rect x="20" y="1380" width="680" height="214" rx="18" fill="#c8531b" stroke="#241c15" stroke-width="3"/><text font-size="31" font-weight="800" fill="#fdf8ee" text-anchor="start" ><tspan x="46.0" y="1434.0">Influenza, a blocked bladder, and his</tspan><tspan x="46.0" y="1472.0">medicines</tspan></text><rect x="46" y="1500" width="92" height="40" rx="20" fill="#e0a521" stroke="#241c15" stroke-width="3"/><text font-size="27" font-weight="800" fill="#241c15" text-anchor="middle" ><tspan x="92.0" y="1529.0">Fits</tspan></text><text font-size="28" font-weight="600" fill="#fdf8ee" text-anchor="start" ><tspan x="46.0" y="1574.0">All of it</tspan></text>
</svg>
