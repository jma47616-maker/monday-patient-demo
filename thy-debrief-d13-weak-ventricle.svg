ke-width="3.5" stroke-linecap="round"/><path d="M206 236 C204 280 216 318 240 342" fill="none" stroke="#f8d3c8" stroke-width="7" stroke-linecap="round"/></g></g><g id="thd13-ef"><path d="M420 150 L319 342" stroke="#241c15" stroke-width="4" stroke-linecap="round"/><circle cx="319" cy="342" r="8" fill="#241c15"/><rect x="406" y="42" width="290" height="122" rx="14" fill="#241c15"/><rect x="400" y="36" width="290" height="122" rx="14" fill="#fdf8ee" stroke="#241c15" stroke-width="3"/><text font-size="29" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="420.0" y="82.0">Ejection fraction</tspan></text><text font-size="36" font-weight="800" fill="#a53f12" text-anchor="start" ><tspan x="420.0" y="130.0">30 to 35%</tspan></text></g><g id="thd13-pump"><g transform="translate(556.0 296.0) scale(1.75)" ><rect x="-40" y="-18" width="86" height="56" rx="9" fill="#241c15"/><rect x="-44" y="-22" width="86" height="56" rx="9" fill="#f3e5c8" stroke="#241c15" stroke-width="4"/><rect x="-34" y="-42" width="52" height="16" rx="3" fill="#e9f1ee" stroke="#241c15" stroke-width="3.5"/><rect x="-34" y="-42" width="24" height="16" rx="3" fill="#b9c6dc" stroke="#241c15" stroke-width="3.5"/><path d="M18 -34 H34 M34 -42 V-26" stroke="#241c15" stroke-width="4" stroke-linecap="round"/><path d="M-34 -34 H-48" stroke="#241c15" stroke-width="3.5" stroke-linecap="round"/><circle cx="-18" cy="6" r="17" fill="#fdf8ee" stroke="#241c15" stroke-width="3.5"/><path d="M-18 6 L-8 -4" stroke="#c8531b" stroke-width="5" stroke-linecap="round"/><circle cx="-18" cy="6" r="3.5" fill="#241c15"/><rect x="10" y="-6" width="24" height="26" rx="5" fill="#c8531b" stroke="#241c15" stroke-width="3.5"/><path d="M22 0 V8" stroke="#fdf8ee" stroke-width="4" stroke-linecap="round"/><path d="M16.5 4 a7.5 7.5 0 1 0 11 0" fill="none" stroke="#fdf8ee" stroke-width="3" stroke-linecap="round"/></g><path d="M470.0 316.0 L412.0 316.0" stroke="#c8531b" stroke-width="11" stroke-linecap="round" fill="none"/><path d="M388.0 316.0 L412.0 298.0 L412.0 334.0 Z" fill="#c8531b" stroke="#c8531b" stroke-width="2" stroke-linejoin="round"/><text font-size="30" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="404.0" y="420.0">Esmolol by vein:</tspan></text><text font-size="29" font-weight="500" fill="#463a2c" text-anchor="start" ><tspan x="404.0" y="462.0">short-acting, can be</tspan><tspan x="404.0" y="498.0">stopped quickly</tspan></text></g><g id="thd13-tablet"><path d="M176 716 C330 742 566 742 608 660 C650 572 430 606 340 574 C292 556 284 520 284 484" fill="none" stroke="#241c15" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 17"/><path d="M284.0 466.0 L300.5 488.0 L267.5 488.0 Z" fill="#241c15" stroke="#241c15" stroke-width="2" stroke-linejoin="round"/><g transform="translate(110.0 706.0)" ><ellipse cx="3" cy="6" rx="46" ry="35.9" fill="#241c15"/><ellipse rx="46" ry="35.9" fill="#fdf8ee" stroke="#241c15" stroke-width="4"/><path d="M-28.5 -13.8 q13.8 -13.8 32.2 -14.7" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".9"/><path d="M-32.2 10.1 L32.2 -10.1" stroke="#241c15" stroke-width="3.5" stroke-linecap="round"/></g><text font-size="30" font-weight="800" fill="#241c15" text-anchor="start" ><tspan x="40.0" y="806.0">Propranolol by mouth</tspan></text></g>
