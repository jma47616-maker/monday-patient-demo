<svg xmlns="http://www.w3.org/2000/svg" id="thd13" viewBox="0 0 720 840" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>A heart with a dilated, thin-walled left ventricle, and two ways to give a beta blocker</title><desc>A heart in section with a baggy left ventricle: ejection fraction 30 to 35%. A tablet reaches it by a long route: propranolol by mouth. An infusion pump with a dial and an off switch reaches it by a short one: esmolol by vein, short-acting, can be stopped quickly.</desc>
<rect width="720" height="840" fill="#fdf8ee"/>
