<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Martin">
  <rect width="200" height="200" fill="#efe7da"/>
  <!-- shoulders: thin, in a soaked t-shirt -->
  <path d="M30 200 C36 158 64 140 100 140 C136 140 164 158 170 200 Z" fill="#7f8f96" stroke="#2b241d" stroke-width="4"/>
  <!-- sweat patches, darker and spreading -->
  <path d="M52 200 C54 176 62 162 74 156 C70 176 68 188 68 200 Z" fill="#5f6f77" opacity=".7"/>
  <path d="M148 200 C146 176 138 162 126 156 C130 176 132 188 132 200 Z" fill="#5f6f77" opacity=".7"/>
  <!-- neck: long, thin, with the goitre sitting low and full -->
  <path d="M86 112 h28 v34 c0 8 -28 8 -28 0 Z" fill="#dcbfa4" stroke="#2b241d" stroke-width="3.5"/>
  <path d="M76 140 C76 126 86 120 100 120 C114 120 124 126 124 140 C124 150 114 154 100 154 C86 154 76 150 76 140 Z"
        fill="#d2b092" stroke="#2b241d" stroke-width="3.5"/>
  <path d="M100 122 v30" fill="none" stroke="#2b241d" stroke-width="2" opacity=".4"/>
  <!-- short greying hair, receding -->
  <path d="M56 74 C54 36 76 20 100 20 C124 20 146 36 144 74 C138 56 126 46 100 46 C74 46 62 56 56 74 Z"
        fill="#584c44" stroke="#2b241d" stroke-width="4" stroke-linejoin="round"/>
  <path d="M62 60 q10 -12 24 -14" fill="none" stroke="#a09488" stroke-width="3" stroke-linecap="round" opacity=".8"/>
  <path d="M118 46 q14 4 22 16" fill="none" stroke="#a09488" stroke-width="3" stroke-linecap="round" opacity=".8"/>
  <!-- head: gaunt, flushed -->
  <path d="M58 78 C58 44 76 30 100 30 C124 30 142 44 142 78 C142 108 124 128 100 128 C76 128 58 108 58 78 Z"
        fill="#e8c8a8" stroke="#2b241d" stroke-width="4"/>
  <!-- hollow temples and cheeks: the weight loss -->
  <path d="M64 72 q6 10 4 20" fill="none" stroke="#b8916e" stroke-width="4" stroke-linecap="round" opacity=".55"/>
  <path d="M136 72 q-6 10 -4 20" fill="none" stroke="#b8916e" stroke-width="4" stroke-linecap="round" opacity=".55"/>
  <!-- flush over the cheekbones -->
  <ellipse cx="74" cy="94" rx="11" ry="7" fill="#c9705a" opacity=".45"/>
  <ellipse cx="126" cy="94" rx="11" ry="7" fill="#c9705a" opacity=".45"/>
  <!-- brows, high and drawn up -->
  <path d="M66 58 q13 -7 25 -1" fill="none" stroke="#2b241d" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M134 58 q-13 -7 -25 -1" fill="none" stroke="#2b241d" stroke-width="4.5" stroke-linecap="round"/>
  <!-- the eyes: lid retraction, sclera showing all the way round -->
  <ellipse cx="81" cy="78" rx="13" ry="12.5" fill="#faf6f0" stroke="#2b241d" stroke-width="3.5"/>
  <ellipse cx="119" cy="78" rx="13" ry="12.5" fill="#faf6f0" stroke="#2b241d" stroke-width="3.5"/>
  <g fill="#6b4a2f">
    <circle cx="81" cy="78" r="6"><animate attributeName="cx" values="81;77;81;85;81" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="119" cy="78" r="6"><animate attributeName="cx" values="119;115;119;123;119" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#2b241d">
    <circle cx="81" cy="78" r="2.6"><animate attributeName="cx" values="81;77;81;85;81" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="119" cy="78" r="2.6"><animate attributeName="cx" values="119;115;119;123;119" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>
  <!-- injected conjunctivae -->
  <path d="M70 82 q6 3 11 2" fill="none" stroke="#b7473a" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>
  <path d="M130 82 q-6 3 -11 2" fill="none" stroke="#b7473a" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>
  <!-- periorbital fullness -->
  <path d="M69 92 q12 6 24 0" fill="none" stroke="#c09a78" stroke-width="3" stroke-linecap="round" opacity=".8"/>
  <path d="M107 92 q12 6 24 0" fill="none" stroke="#c09a78" stroke-width="3" stroke-linecap="round" opacity=".8"/>
  <!-- nose -->
  <path d="M100 82 q5 12 -2 17" fill="none" stroke="#2b241d" stroke-width="3.2" stroke-linecap="round"/>
  <!-- mouth open, breathing fast -->
  <ellipse cx="100" cy="113" rx="9" ry="6" fill="#8f5a55" stroke="#2b241d" stroke-width="3">
    <animate attributeName="ry" values="6;7.5;6" dur="1.4s" repeatCount="indefinite"/>
  </ellipse>
  <!-- beads of sweat at the temple and jaw -->
  <g fill="#8fb6c4" opacity=".9">
    <circle cx="62" cy="84" r="2.6"><animate attributeName="cy" values="84;104" dur="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="90" r="2.3"><animate attributeName="cy" values="90;112" dur="3.4s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0" dur="3.4s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="66" cy="104" r="2"><animate attributeName="cy" values="104;124" dur="3s" begin="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0" dur="3s" begin="1.8s" repeatCount="indefinite"/></circle>
  </g>
</svg>
